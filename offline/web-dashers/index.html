    <!-- One-time migration for cached assets from earlier mirror builds.
         No save files, completed levels, custom levels, or accounts are touched. -->
    <script>
      try {
        if (localStorage.getItem('webdash_mirror_cache_refresh_v3') !== '1') {
          Object.keys(localStorage).forEach(function (key) {
            if (key.indexOf('webdash_cache_') === 0) localStorage.removeItem(key);
          });
          localStorage.removeItem('webdash_assets_loaded');
          localStorage.removeItem('webdash_last_load_time');
          localStorage.setItem('webdash_mirror_cache_refresh_v3', '1');
        }
      } catch (e) { console.warn('Web Dashers cache refresh skipped:', e); }
    </script>

    <!-- Undo the Low Detail Mode setting forced by the older mirror build.
         LDM skips pulse triggers and sprite animation. Only change it when
         our old opt-in marker exists; leave every other player setting alone. -->
    <script>
      try {
        if (localStorage.getItem('webdash_hosted_ldm_v1') === '1' &&
            localStorage.getItem('webdash_hosted_ldm_restored_v1') !== '1') {
          const saved = localStorage.getItem('gd_settings');
          if (saved) {
            const settings = JSON.parse(saved);
            if (settings && settings.enableLDM === true) {
              settings.enableLDM = false;
              localStorage.setItem('gd_settings', JSON.stringify(settings));
            }
          }
          localStorage.setItem('webdash_hosted_ldm_restored_v1', '1');
        }
      } catch (e) { console.warn('Web Dashers LDM migration skipped:', e); }
    </script>

            var nativeFetch = window.fetch.bind(window);
            function matchingHost(url) {
                for (var i = 0; i < GD_PROXY_HOSTS.length; i++) {
                    var host = GD_PROXY_HOSTS[i].replace(/\/$/, "");
                    if (url === host || url.indexOf(host + "/") === 0) return host;
                }
                return null;
            }
            // Online searches must try the other GD proxies when a worker returns
            // an error page, a failed request, or an invalid API response.
            window.fetch = function (input, init) {
                var requestObject = typeof Request !== "undefined" && input instanceof Request;
                var url = requestObject ? input.url : input;
                if (typeof url !== "string") return nativeFetch(input, init);
                var originHost = matchingHost(url);
                if (!originHost) return nativeFetch(input, init);
                var path = url.slice(originHost.length);
                if (path.charAt(0) !== "/") path = "/" + path;
                var isGdApi = /\/(?:getGJLevels21|downloadGJLevel22|getGJSongInfo|.*GJ.*)\.php(?:\?|$)/i.test(path);
                var lastResponse = null;
                var lastError = null;
                var first = activeIndex;
                var originalSignal = (init && init.signal) || (requestObject && input.signal);
                async function attempt(index) {
                    var controller = new AbortController();
                    var abort = function () { controller.abort(); };
                    if (originalSignal) {
                        if (originalSignal.aborted) throw new DOMException("Aborted", "AbortError");
                        originalSignal.addEventListener("abort", abort, { once: true });
                    }
                    var timer = setTimeout(abort, 10000);
                    try {
                        var host = GD_PROXY_HOSTS[index];
                        var target = host.replace(/\/$/, "") + path;
                        var options = Object.assign({}, init || {}, { signal: controller.signal });
                        var req = requestObject ? new Request(target, input) : target;
                        var response = await nativeFetch(req, options);
                        lastResponse = response;
                        if (!response.ok) return false;
                        if (isGdApi) {
                            var body = (await response.clone().text()).trim();
                            if (!body || body === "-1" || /^<!doctype html|^<html\b/i.test(body) ||
                                /^\s*(?:error|rate limit|too many requests|forbidden|bad gateway)/i.test(body)) {
                                return false;
                            }
                        }
                        activeIndex = index;
                        window._gdProxyUrl = host;
                        return response;
                    } catch (error) {
                        if (originalSignal && originalSignal.aborted) throw error;
                        lastError = error;
                        return false;
                    } finally {
                        clearTimeout(timer);
                        if (originalSignal) originalSignal.removeEventListener("abort", abort);
                    }
                }
                return (async function () {
                    for (var offset = 0; offset < GD_PROXY_HOSTS.length; offset++) {
                        var response = await attempt((first + offset) % GD_PROXY_HOSTS.length);

                    if (lastResponse) return lastResponse;
