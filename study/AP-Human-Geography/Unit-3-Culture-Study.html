const conflict = (a, b) => CONFLICTS.some(g => g.includes(a) && g.includes(b));
const ROUND = 6;
const nRounds = n => Math.ceil(n / ROUND);

function instance(q) {
  const order = shuffle(q.o.map((_, i) => i));
  return {id: q.id, t: "mc", topic: q.topic, q: q.q, stim: q.stim || null, fig: q.fig || null, opts: order.map(i => q.o[i]), ans: order.indexOf(q.a), x: q.x, d: q.d, pts: 1};
}
function matchItems(terms) {
  const list = shuffle(terms), n = Math.max(1, nRounds(list.length)), rounds = Array.from({length: n}, () => []);
  const cap = Math.ceil(list.length / n);
  for (const term of list) {
    const ok = rounds.filter(rd => rd.length < cap && !rd.some(x => conflict(x, term)));
    const pool = ok.length ? ok : rounds.filter(rd => rd.length < cap);
    (pool.length ? pool : rounds).reduce((m, rd) => rd.length < m.length ? rd : m).push(term);
  }
  return rounds.filter(r => r.length).map(r => ({id: "match", t: "match", topic: "vocab", q: "Match each term to its definition.", terms: shuffle(r), defs: shuffle(r), pts: r.length}));
}
function vocabRounds(terms) {
  terms = [...new Set(terms)].filter(t => VBY[t]);
  if (!terms.length) return [];
  if (terms.length < 4) terms = terms.concat(shuffle(VOCAB.map(v => v[0]).filter(t => !terms.includes(t))).slice(0, 4 - terms.length));
  return matchItems(terms);
}
function spread(n) {
  const byTopic = {};
  for (const q of shuffle(B)) (byTopic[q.topic] = byTopic[q.topic] || []).push(q);
  const keys = shuffle(Object.keys(byTopic)), out = [];
  while (out.length < n && keys.some(k => byTopic[k].length)) for (const k of keys) if (byTopic[k].length && out.length < n) out.push(byTopic[k].pop());
  return shuffle(out);
}

function buildRun(mode, opts = {}) {
  let items = [], label = "";
  if (mode === "full") {
    label = "Full test";
    items = shuffle(B).map(instance).concat(vocabRounds(VOCAB.map(v => v[0])));
  } else if (MODES[mode]) {
    const m = MODES[mode]; label = m.label;
    items = spread(m.mc).map(instance).concat(vocabRounds(shuffle(VOCAB).slice(0, m.terms).map(v => v[0])));
  } else if (mode === "vocab") {
    label = "Vocab match";
    items = vocabRounds(VOCAB.map(v => v[0]));
  } else if (mode === "topics") {
    const ts = opts.topics;
    label = ts.length === 1 ? TOPICS[ts[0]] : `Topics (${ts.length})`;
    items = shuffle(B.filter(q => ts.includes(q.topic))).map(instance).concat(vocabRounds(VOCAB.filter(v => ts.includes(v[2])).map(v => v[0])));
  } else if (mode === "missed") {
    label = "Missed questions";
    const ids = opts.missed || [];
    items = shuffle(ids.filter(id => BYID[id])).map(id => instance(BYID[id])).concat(vocabRounds(ids.filter(id => id.startsWith("v:")).map(id => id.slice(2))));
  }
  return {id: uid(), mode, label, study: S.study, items, resp: [], res: [], i: 0, started: Date.now(), elapsed: 0};
}

function grade(it, r) {
  if (it.t === "mc") { const ok = r === it.ans; return {earned: ok ? 1 : 0, possible: 1, ok, given: r == null ? "" : `${LET[r]}. ${it.opts[r]}`, correct: `${LET[it.ans]}. ${it.opts[it.ans]}`}; }

}

  const bars = Object.entries(agg).filter(([k, v]) => v[1] > 0 && (TOPICS[k] || k === "vocab")).map(([k, v]) => [k, Math.round(100 * v[0] / v[1])]).sort((a, b) => a[1] - b[1]);
  const best = Math.max(...H.map(h => h.pct));
  const rows = [...H].reverse().slice(0, 25).map(h => `<tr><td>${new Date(h.at).toLocaleDateString(undefined, {month: "short", day: "numeric"})} <span style="color:var(--muted)">${new Date(h.at).toLocaleTimeString(undefined, {hour: "numeric", minute: "2-digit"})}</span></td><td>${esc(h.mode)}${h.study ? "" : ` <span class="pill mid" title="Answers hidden until the end">test mode</span>`}</td><td class="n">${h.earned}/${h.possible}</td><td class="n"><span class="pill ${pctCls(h.pct)}">${h.pct}%</span></td><td class="n">${Math.max(1, Math.round(h.secs / 60))} min</td></tr>`).join("");
  return `<div class="hist">
    <div class="hist-head"><h3>${H.length} attempt${H.length === 1 ? "" : "s"} · best ${best}% · latest ${lastP.pct}%</h3><span class="eyebrow">dashed line = 70%</span></div>
    ${chart}
    ${bars.length ? `<div><h3 style="font-size:18px;margin-bottom:10px">By topic, all attempts (weakest first)</h3><div class="bars">${bars.map(([k, p]) => barRow(k, p)).join("")}</div></div>` : ""}
    <div class="tbl"><table><thead><tr><th>When</th><th>Test</th><th>Points</th><th>Score</th><th>Time</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div>${S.confirmClear ? `<div class="confirm"><span>Delete all ${H.length} saved scores? This can't be undone.</span><button class="btn small acc" data-act="clear-yes">Delete scores</button><button class="btn small ghost" data-act="clear-no">Keep them</button></div>` : `<button class="linkbtn" data-act="clear">Clear score history</button>`}</div>
    ${note}
  </div>`;
}

function stimHtml(s) {
  if (!s) return "";
  if (s.k === "table") return `<figure class="stim"><figcaption class="cap">${esc(s.cap)}</figcaption><div class="tbl"><table><thead><tr>${s.head.map(h => `<th scope="col">${esc(h)}</th>`).join("")}</tr></thead><tbody>${s.rows.map(r => `<tr>${r.map((c, j) => j ? `<td>${esc(c)}</td>` : `<th scope="row">${esc(c)}</th>`).join("")}</tr>`).join("")}</tbody></table></div></figure>`;
  return `<figure class="stim"><figcaption class="cap">${esc(s.cap)}</figcaption><p>${esc(s.body)}</p></figure>`;
}

function renderTest() {
  S.view = "test";
  const run = S.run, it = run.items[run.i];
  const done = run.res.filter(Boolean);
  const earned = done.reduce((a, r) => a + r.earned, 0), possible = done.reduce((a, r) => a + r.possible, 0);
  const revealed = !!run.res[run.i];
  if (!revealed) { cur = it.t === "mc" ? null : {sel: null, map: it.defs.map(() => null)}; qStart = Date.now(); } else cur = run.resp[run.i];
  const pct = Math.round(100 * run.i / run.items.length);
  app.innerHTML = `
  <div class="bar-top">
    <div class="bar-row"><span class="count">${esc(run.label)} · ${run.i + 1} / ${run.items.length}</span>
      <span class="count">${run.study && possible ? `${earned}/${possible} pts · ${Math.round(100 * earned / possible)}%` : run.study ? "" : "Test mode"}</span>
      ${S.confirmQuit ? `<span class="quitbox">Leave? Your spot is saved.<button class="btn small" data-act="quit-yes">Save & exit</button><button class="btn small ghost" data-act="quit-no">Stay</button></span>` : `<button class="btn small ghost" data-act="quit">Exit</button>`}</div>
    <div class="prog" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="${run.items.length}" aria-valuenow="${run.i}"><div style="width:${pct}%"></div></div>
  </div>
  <article class="card" id="card">
    <div class="qmeta"><span class="tag">${esc(topicName(it.topic))}</span>${it.stim || it.fig ? `<span class="tag src">Stimulus</span>` : ""}</div>
    ${stimHtml(it.stim)}
    ${it.fig && FIG[it.fig] ? `<figure><div class="fig">${FIG[it.fig]()}</div><figcaption class="figcap">${esc(FIGCAP[it.fig])}</figcaption></figure>` : ""}
    <p class="qtext">${esc(it.q)}</p>
    ${it.t === "match" ? `<p class="qhint">Tap a term, then tap its definition. Tap a filled definition to clear it.</p>` : ""}
    <div id="ans">${it.t === "mc" ? `<div class="opts">${it.opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${LET[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>` : `<div class="mterms" id="mterms"></div><div class="mdefs" id="mdefs"></div>`}</div>
    <div id="fb"></div>
    <div class="actions" id="actions"></div>
  </article>`;
  paint();
}
const complete = it => it.t === "mc" ? cur !== null : cur.map.every(v => v !== null);
function paint() {
  const run = S.run, it = run.items[run.i], res = run.res[run.i];
  const card = document.getElementById("card"); if (!card) return;
  if (it.t === "mc") card.querySelectorAll(".opt").forEach(b => {
    const k = +b.dataset.k; let c = "opt";
    if (res && run.study) { if (k === it.ans) c += " right"; else if (k === cur) c += " wrong"; }
    else if (k === cur) c += " sel";
    b.className = c; b.disabled = !!res; b.setAttribute("aria-pressed", String(k === cur));
  });
  if (it.t === "match") {
    const used = new Set(cur.map.filter(Boolean));
    document.getElementById("mterms").innerHTML = res ? "" : it.terms.map(t => `<button class="mterm${cur.sel === t ? " sel" : ""}${used.has(t) ? " used" : ""}" data-mt="${esc(t)}">${esc(t)}</button>`).join("");
    document.getElementById("mdefs").innerHTML = it.defs.map((d, k) => `<button class="mdef${res && run.study ? (res.parts[k] ? " right" : " wrong") : ""}" data-md="${k}" ${res ? "disabled" : ""}><span>${esc(VBY[d][1])}</span><span class="slot${cur.map[k] ? " filled" : ""}">${cur.map[k] ? esc(cur.map[k]) : "tap to place a term"}</span>${res && run.study && !res.parts[k] ? `<span class="fix">Answer: ${esc(d)}</span>` : ""}${res && run.study ? `<span class="ex">${esc(d)}, for example: ${esc(VBY[d][3])}</span>` : ""}</button>`).join("");
  }
  const fb = document.getElementById("fb");
  if (res && run.study) {
    if (it.t === "mc") fb.innerHTML = `<div class="fb ${res.ok ? "ok" : "no"}" role="status"><h4>${res.ok ? pick(["Correct", "Yes", "Right", "Got it"]) : "Not quite"}</h4>${res.ok ? "" : `<p>Answer: <span class="ans">${esc(res.correct)}</span></p>`}<p><strong>Why:</strong> ${esc(it.x)}</p><p class="trap"><strong>Best distractor:</strong> ${esc(it.d)}</p></div>`;
    else fb.innerHTML = `<div class="fb ${res.ok ? "ok" : res.earned ? "part" : "no"}" role="status"><h4>${res.ok ? "All matched" : `${res.earned} of ${res.possible} matched`}</h4><p>Each card now shows an example of its term.</p></div>`;
  } else fb.innerHTML = "";
  const actions = document.getElementById("actions");
  const last = run.i === run.items.length - 1;
  if (res) actions.innerHTML = `<span class="spacer"></span><button class="btn" data-act="next" id="nextBtn">${last ? "See my score" : "Next"}</button>`;
  else actions.innerHTML = `<span class="keyhint">${it.t === "mc" ? "Keys: A–E or 1–5 to choose, Enter to check" : ""}</span><button class="btn" data-act="submit" ${complete(it) ? "" : "disabled"}>${run.study ? "Check answer" : last ? "Finish" : "Next"}</button>`;
}
function submit() {
  const run = S.run, it = run.items[run.i];
  if (run.res[run.i] || !complete(it)) return;
  run.elapsed += Math.min(Date.now() - qStart, 300000);
  run.resp[run.i] = it.t === "match" ? {sel: null, map: cur.map.slice()} : cur;
  run.res[run.i] = grade(it, it.t === "match" ? cur.map : cur);
  saveRun();
  if (!run.study) { next(); return; }
  paint();
  const nb = document.getElementById("nextBtn"); if (nb) nb.focus({preventScroll: true});
}
function next() {
  const run = S.run;
  if (run.i < run.items.length - 1) { run.i++; saveRun(); renderTest(); window.scrollTo(0, 0); }
  else finish();
}

function finish() {
  const run = S.run;
  const earned = run.res.reduce((a, r) => a + (r ? r.earned : 0), 0), possible = run.items.reduce((a, it) => a + it.pts, 0);
  const topics = {}, missed = [];
  run.items.forEach((it, k) => {
    const r = run.res[k], tp = it.topic;
    topics[tp] = topics[tp] || [0, 0]; topics[tp][0] += r ? r.earned : 0; topics[tp][1] += it.pts;
    if (!r || !r.ok) { if (it.t === "match") (r ? r.missedTerms : it.defs).forEach(t => missed.push("v:" + t)); else missed.push(it.id); }
  });
  const entry = {id: run.id, at: Date.now(), mode: run.label, study: run.study, earned, possible, pct: possible ? Math.round(100 * earned / possible) : 0, secs: Math.round(run.elapsed / 1000), topics, missed: [...new Set(missed)]};
  if (!S.history.some(h => h.id === entry.id)) S.history.push(entry);
  S.history = S.history.slice().sort((a, b) => a.at - b.at).slice(-200).map((h, i, H) => i < H.length - 10 ? Object.assign({}, h, {missed: []}) : h);
  store.set(KEY.hist, S.history);
  S.run = null; saveRun();
  renderResults(run, entry);
}
function renderResults(run, entry) {
  S.view = "results";
  const tb = Object.entries(entry.topics).map(([k, v]) => [k, Math.round(100 * v[0] / v[1])]).sort((a, b) => a[1] - b[1]);
  const misses = run.items.map((it, k) => [it, run.res[k]]).filter(([it, r]) => r && !r.ok);
  const missHtml = misses.map(([it, r]) => it.t === "match"
    ? `<div class="miss"><span class="q">Vocab matching round</span><span class="yours">You: ${esc(r.given)}</span><span class="corr">Fix: ${esc(r.correct)}</span></div>`
    : `<div class="miss"><span class="tag" style="justify-self:start">${esc(topicName(it.topic))}</span><span class="q">${esc(it.q)}</span><span class="yours">You: ${esc(r.given || "(blank)")}</span><span class="corr">Answer: ${esc(r.correct)}</span><span class="why">${esc(it.x)}</span></div>`).join("");
  const prev = S.history.filter(h => h.id !== entry.id && h.mode === entry.mode).pop();
  app.innerHTML = `
  <section class="score">
    <div class="big num">${entry.pct}%</div>
    <div><p class="eyebrow">${esc(entry.mode)}</p><h1>${entry.pct >= 90 ? "You're ready for this unit." : entry.pct >= 80 ? "Strong. Clean up the misses below." : entry.pct >= 70 ? "Solid base. Review your weakest topics." : "Keep going. Start with your weakest topic."}</h1>
    <p class="num">${entry.earned} of ${entry.possible} points · ${Math.max(1, Math.round(entry.secs / 60))} min${prev ? ` · last time ${prev.pct}% (${entry.pct - prev.pct >= 0 ? "+" : ""}${entry.pct - prev.pct})` : ""}</p></div>
  </section>
  <section class="section"><h2>By topic</h2><div class="hist"><div class="bars">${tb.map(([k, p]) => barRow(k, p)).join("")}</div></div></section>
  <div class="rowbtns" style="margin-top:20px">${entry.missed.length ? `<button class="btn acc" data-act="redo">Redo what I missed</button>` : ""}<button class="btn" data-act="home">Back to start</button></div>
  <section class="section"><h2>${misses.length ? `What you missed (${misses.length})` : "You missed nothing."}</h2><div class="missed">${missHtml}</div></section>`;
  window.scrollTo(0, 0);
}

function frqState(id) { return S.frqData[id] || (S.frqData[id] = {}); }
function saveFrq() { store.set(KEY.frq, S.frqData); }
function renderFrq() {
  S.view = "frq";
  const f = FRQS[S.frq], st = frqState(f.id);
  const got = f.parts.filter(p => st[p.k] && st[p.k].got).length, shown = f.parts.filter(p => st[p.k] && st[p.k].shown).length;
  app.innerHTML = `
  <div class="bar-top"><div class="bar-row"><span class="count">FRQ ${S.frq + 1} · ${shown}/7 answers open</span><span class="count">Self-check: ${got}/7</span><button class="btn small ghost" data-act="home">Back</button></div></div>
  <article class="card frq">
    <p class="eyebrow">Free-response practice · ${esc(f.tag)}</p>
    <h2 class="frq-title">${esc(f.title)}</h2>
    <p>${esc(f.intro)}</p>
    ${stimHtml(f.stim)}
    <p class="qhint" style="margin:0">Write your answer to each part first, then open the model answer and decide honestly whether yours earns the point. ${canStore ? "Your drafts are saved in this browser." : "Drafts last until you close this page."}</p>
  </article>
  ${f.parts.map(p => { const s = st[p.k] || {}; return `<section class="card frq">
    <div class="qmeta"><span class="tag">Part ${p.k}</span><span class="tag src">1 point</span></div>
    <p class="qtext">${esc(p.q)}</p>
    <textarea data-frq="${p.k}" rows="4" aria-label="Your answer to part ${p.k}" placeholder="Your answer">${esc(s.text || "")}</textarea>
    ${s.shown ? `<div class="model"><p class="eyebrow">Model answer</p><p>${esc(p.model)}</p></div><div class="rubric"><p class="eyebrow">What earns the point</p><p>${esc(p.pts)}</p></div>
    <div class="selfrow"><button class="check" data-frqgot="${p.k}" aria-pressed="${!!s.got}"><span class="box">${s.got ? "✓" : ""}</span>My answer earns this point</button><button class="linkbtn" data-frqshow="${p.k}">Hide model answer</button></div>` : `<div><button class="btn ghost small" data-frqshow="${p.k}">Show model answer</button></div>`}
  </section>`; }).join("")}
  <div class="rowbtns" style="margin-top:18px"><button class="btn" data-act="frq-all">Show all model answers</button>${S.confirmFrq ? `<span class="confirm">Erase your answers and self-checks for this FRQ?<button class="btn small acc" data-act="frq-reset-yes">Erase</button><button class="btn small ghost" data-act="frq-reset-no">Keep</button></span>` : `<button class="btn ghost" data-act="frq-reset">Start over</button>`}<button class="btn ghost" data-act="home">Back to start</button></div>`;
}
function rerender(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }
function startRun(mode, opts) {
  const run = buildRun(mode, opts);
  if (!run.items.length) return;
  S.run = run; S.confirmQuit = false; saveRun(); renderTest(); window.scrollTo(0, 0);
}

app.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t || t.disabled) return;
  if (t.dataset.start) {
    const mode = t.dataset.start, opts = {};
    if (mode === "missed") { const lm = [...S.history].reverse().find(h => h.missed && h.missed.length); if (!lm) return; opts.missed = lm.missed; }
    if (mode === "topics") opts.topics = S.topics.slice();
    startRun(mode, opts); return;
  }
  if (t.dataset.topic) { const k = t.dataset.topic; S.topics = S.topics.includes(k) ? S.topics.filter(x => x !== k) : [...S.topics, k]; store.set(KEY.topics, S.topics); rerender(renderHome); const c = app.querySelector(`[data-topic="${k}"]`); if (c) c.focus({preventScroll: true}); return; }
  if (t.id === "studySwitch") { S.study = !S.study; store.set(KEY.study, S.study); rerender(renderHome); document.getElementById("studySwitch").focus({preventScroll: true}); return; }
  if (t.dataset.openfrq !== undefined) { S.frq = +t.dataset.openfrq; S.confirmFrq = false; renderFrq(); window.scrollTo(0, 0); return; }
  if (t.dataset.frqshow) { const st = frqState(FRQS[S.frq].id), k = t.dataset.frqshow; st[k] = st[k] || {}; st[k].shown = !st[k].shown; saveFrq(); rerender(renderFrq); return; }
  if (t.dataset.frqgot) { const st = frqState(FRQS[S.frq].id), k = t.dataset.frqgot; st[k] = st[k] || {}; st[k].got = !st[k].got; saveFrq(); rerender(renderFrq); const b = app.querySelector(`[data-frqgot="${k}"]`); if (b) b.focus({preventScroll: true}); return; }
  const act = t.dataset.act;
  if (act === "frq-all") { const st = frqState(FRQS[S.frq].id); for (const p of FRQS[S.frq].parts) { st[p.k] = st[p.k] || {}; st[p.k].shown = true; } saveFrq(); rerender(renderFrq); return; }
  if (act === "frq-reset") { S.confirmFrq = true; rerender(renderFrq); return; }
  if (act === "frq-reset-no") { S.confirmFrq = false; rerender(renderFrq); return; }
  if (act === "frq-reset-yes") { S.confirmFrq = false; S.frqData[FRQS[S.frq].id] = {}; saveFrq(); renderFrq(); window.scrollTo(0, 0); return; }
  if (act === "resume") { const r = store.get(KEY.run, null); if (r && r.items && r.i < r.items.length) { S.run = r; S.confirmQuit = false; renderTest(); window.scrollTo(0, 0); } return; }
  if (act === "discard") { S.run = null; saveRun(); rerender(renderHome); return; }
  if (act === "clear") { S.confirmClear = true; rerender(renderHome); return; }
  if (act === "clear-no") { S.confirmClear = false; rerender(renderHome); return; }
  if (act === "clear-yes") { S.confirmClear = false; S.history = []; store.set(KEY.hist, []); rerender(renderHome); return; }
  if (act === "home") { S.confirmQuit = false; renderHome(); window.scrollTo(0, 0); return; }
  if (act === "redo") { const lm = S.history[S.history.length - 1]; if (lm && lm.missed.length) startRun("missed", {missed: lm.missed}); return; }
  if (act === "quit") { S.confirmQuit = true; keepRender(); return; }
  if (act === "quit-no") { S.confirmQuit = false; keepRender(); return; }
  if (act === "quit-yes") { S.confirmQuit = false; saveRun(); S.run = null; renderHome(); window.scrollTo(0, 0); return; }
  if (act === "submit") { submit(); return; }
  if (act === "next") { next(); return; }
  if (!S.run || S.view !== "test" || S.run.res[S.run.i]) return;
  if (t.classList.contains("opt")) { cur = +t.dataset.k; paint(); return; }
  if (t.dataset.mt !== undefined) {
    const term = t.dataset.mt, at = cur.map.indexOf(term);
    if (at >= 0) { cur.map[at] = null; cur.sel = term; } else cur.sel = cur.sel === term ? null : term;
    paint(); return;
  }
  if (t.dataset.md !== undefined) {
    const k = +t.dataset.md;
    if (cur.sel) { const prevAt = cur.map.indexOf(cur.sel); if (prevAt >= 0) cur.map[prevAt] = null; cur.map[k] = cur.sel; cur.sel = null; }
    else if (cur.map[k]) cur.map[k] = null;
    paint();
  }
});
function keepRender() { const keep = cur, was = !!S.run.res[S.run.i], y = window.scrollY; renderTest(); if (!was) { cur = keep; paint(); } window.scrollTo(0, y); }
app.addEventListener("input", e => {
  if (S.view !== "frq" || !e.target.dataset.frq) return;
  const st = frqState(FRQS[S.frq].id), k = e.target.dataset.frq;
  st[k] = st[k] || {}; st[k].text = e.target.value; saveFrq();
});
app.addEventListener("toggle", e => {
  const d = e.target; if (!d.dataset || !d.dataset.g) return;
  if (d.open) S.gloss.add(d.dataset.g); else S.gloss.delete(d.dataset.g);
}, true);
document.addEventListener("keydown", e => {
  if (S.view !== "test" || !S.run || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = e.target.tagName; if (tag === "TEXTAREA" || tag === "INPUT") return;
  const it = S.run.items[S.run.i], res = S.run.res[S.run.i];
  if (e.key === "Enter") {
    if (tag === "BUTTON" && !e.target.matches('[data-act="next"],[data-act="submit"],.opt')) return;
    e.preventDefault(); if (res) next(); else submit(); return;
  }
  if (!res && it.t === "mc") {
    const key = e.key.toLowerCase();
    let k = "12345".indexOf(key); if (k < 0) k = "abcde".indexOf(key);
    if (k >= 0 && k < it.opts.length) { cur = k; paint(); }
  }
});

renderHome();
})();
</script>
</body>
</html>
