<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Systems of Linear Equations and Inequalities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@500&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" media="print" onload="this.media='all'">
<style>
:root {
  --bg: #f7f6fa; --card: #ffffff; --ink: #19161f; --mu: #625b70; --mu2: #8b8499; --ln: #e7e3ee; --soft: #f1eef6;
  --ac: #6a46d6; --acs: #efeafd; --pk: #c23b7a; --ok: #157a4a; --oks: #e6f5ed; --bad: #b8304f; --bads: #fcebef;
  --sans: Geist, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --math: "STIX Two Text", "Cambria Math", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d0b12; --card: #16131d; --ink: #f1eef5; --mu: #a39cb2; --mu2: #7b748a; --ln: #2a2533; --soft: #1e1a27;
    --ac: #a78bfa; --acs: #241d38; --pk: #f07ab3; --ok: #5fd39b; --oks: #12291e; --bad: #ff8aa5; --bads: #2e1620; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { font: 16px/1.6 var(--sans); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 80px; }
.kick { font: 500 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ac); }
h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.08; letter-spacing: -.035em; font-weight: 650; margin: 10px 0 12px; }
.lede { color: var(--mu); font-size: 17px; max-width: 640px; }
.src { margin-top: 10px; font-size: 13px; color: var(--mu2); }
.tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; margin: 24px -20px 22px; padding: 10px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--ln); overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: none; border: 0; background: transparent; padding: 8px 14px; border-radius: 999px; font-weight: 550; font-size: 14.5px; color: var(--mu); cursor: pointer; }
.tabs button:hover { color: var(--ink); background: var(--soft); }
.tabs button.on { background: var(--ink); color: var(--bg); }
.tabs b { font-weight: 600; opacity: .6; margin-left: 4px; }
.pane[hidden] { display: none; }

/* study guide */
.toc { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.toc a { font-size: 13.5px; text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--ln); padding: 5px 12px; border-radius: 999px; }
.toc a:hover { border-color: var(--ac); }
.sec { background: var(--card); border: 1px solid var(--ln); border-radius: 18px; padding: 22px 24px; margin-bottom: 14px; scroll-margin-top: 70px; }
.sec h2 { font-size: 21px; letter-spacing: -.02em; font-weight: 650; margin-bottom: 10px; display: flex; gap: 10px; align-items: baseline; }
.sec h2 .n { font: 500 12px var(--mono); color: var(--ac); letter-spacing: .08em; }
.sec p { margin: 8px 0; }
.sec ul { margin: 8px 0 8px 20px; }
.sec li { margin: 5px 0; }
.sec li::marker { color: var(--ac); }
.box { margin: 12px 0; padding: 12px 14px; border-radius: 12px; background: var(--soft); }
.box.key { background: var(--acs); border-left: 3px solid var(--ac); }
.box.warn { background: var(--bads); border-left: 3px solid var(--bad); }
.box b:first-child { display: block; font-size: 12px; font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mu); margin-bottom: 4px; font-weight: 500; }
table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 14.5px; }
th, td { border: 1px solid var(--ln); padding: 7px 10px; text-align: left; vertical-align: top; }
th { background: var(--soft); font-weight: 600; }
details.ex { margin: 10px 0; border: 1px solid var(--ln); border-radius: 12px; overflow: hidden; }
details.ex summary { cursor: pointer; padding: 11px 14px; font-weight: 550; list-style: none; display: flex; gap: 10px; align-items: baseline; }
details.ex summary::-webkit-details-marker { display: none; }
details.ex summary::before { content: "Example"; font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--pk); flex: none; }
details.ex summary::after { content: "Show steps"; margin-left: auto; font-size: 12.5px; color: var(--ac); flex: none; }
details.ex[open] summary::after { content: "Hide"; }
details.ex ol { margin: 0; padding: 4px 16px 12px 36px; }
details.ex li { margin: 6px 0; }
details.ex .ans { padding: 10px 16px 14px; border-top: 1px dashed var(--ln); font-weight: 600; }
.m { font-family: var(--math); font-size: 1.1em; white-space: nowrap; }
.fig { display: block; width: 100%; max-width: 460px; margin: 14px auto 6px; color: var(--mu); }
.fig text { font: 12.5px var(--sans); fill: var(--ink); }
.fig .ac { stroke: var(--ac); }
.fig .acf { fill: var(--ac); }
.figcap { text-align: center; font-size: 13px; color: var(--mu); margin-bottom: 8px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.m i { font-style: italic; }

/* quiz */
.qstart, .qcard, .qend { background: var(--card); border: 1px solid var(--ln); border-radius: 20px; padding: 24px; }
.qstart h2, .qend h2 { font-size: 24px; letter-spacing: -.025em; font-weight: 650; margin-bottom: 6px; }
.sub { color: var(--mu); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.chips button { border: 1px solid var(--ln); background: var(--card); padding: 6px 12px; border-radius: 999px; font-size: 13.5px; cursor: pointer; }
.chips button.on { background: var(--acs); border-color: var(--ac); color: var(--ac); font-weight: 600; }
.btn { border: 0; cursor: pointer; padding: 11px 20px; border-radius: 999px; font-weight: 600; font-size: 15px; background: var(--soft); }
.btn.pri { background: var(--ink); color: var(--bg); }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
.qtop { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 13.5px; color: var(--mu); }
.qtop .t { font: 500 11.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ac); background: var(--acs); padding: 3px 9px; border-radius: 999px; }
.bar { height: 4px; border-radius: 4px; background: var(--soft); overflow: hidden; margin-bottom: 18px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--ac), var(--pk)); transition: width .4s; }
.qq { font-size: 18.5px; line-height: 1.5; font-weight: 500; margin-bottom: 16px; }
.opts { display: grid; gap: 9px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; border: 1.5px solid var(--ln); background: var(--card); padding: 12px 14px; border-radius: 14px; cursor: pointer; font-size: 15.5px; line-height: 1.45; transition: border-color .15s, background-color .15s; }
.opt:hover:not(:disabled) { border-color: var(--ac); }
.opt .l { flex: none; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font: 600 12px var(--mono); background: var(--soft); color: var(--mu); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--oks); }
.opt.right .l { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bads); }
.opt.wrong .l { background: var(--bad); color: #fff; }
.why { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--soft); font-size: 15px; }
.why b { color: var(--ok); }
.why.no b { color: var(--bad); }
.big { font-size: 54px; font-weight: 650; letter-spacing: -.04em; line-height: 1; margin: 6px 0 4px; background: linear-gradient(100deg, var(--ac), var(--pk)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tbars { display: grid; gap: 10px; margin: 18px 0; }
.tb { display: grid; grid-template-columns: minmax(120px, 1fr) 2fr 48px; gap: 12px; align-items: center; font-size: 14px; }
.tb .tr { height: 8px; border-radius: 8px; background: var(--soft); overflow: hidden; }
.tb .tr i { display: block; height: 100%; background: var(--ac); }
.tb .p { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.miss { margin-top: 18px; display: grid; gap: 10px; }
.miss > div { border: 1px solid var(--ln); border-radius: 14px; padding: 12px 14px; font-size: 14.5px; }
.miss .a { color: var(--ok); font-weight: 600; margin-top: 4px; }
.miss .w { color: var(--mu); margin-top: 4px; }
.best { font-size: 13.5px; color: var(--mu2); margin-top: 8px; }

/* vocab */
.vtools { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.vtools input { flex: 1; min-width: 180px; font: inherit; font-size: 15px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--ln); background: var(--card); color: var(--ink); outline: none; }
.vtools input:focus { border-color: var(--ac); }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.vc { perspective: 900px; height: 150px; cursor: pointer; }
.vc > div { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.2,.7,.2,1); }
.vc.flip > div { transform: rotateY(180deg); }
.vc .f, .vc .b { position: absolute; inset: 0; border-radius: 16px; padding: 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; text-align: center; border: 1px solid var(--ln); background: var(--card); overflow: auto; }
.vc .f { font-weight: 650; font-size: 18px; letter-spacing: -.01em; }
.vc .b { transform: rotateY(180deg); font-size: 14px; color: var(--mu); background: var(--acs); }
.foot { margin-top: 34px; font-size: 13px; color: var(--mu2); text-align: center; }
@media (max-width: 560px) { .sec { padding: 18px; } .qstart, .qcard, .qend { padding: 18px; } .qq { font-size: 17px; } .tb { grid-template-columns: 1fr 1fr 44px; } }
@media print { .tabs, .row, .chips { display: none !important; } .pane[hidden] { display: block !important; } .sec, .qcard { break-inside: avoid; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="kick" id="kick"></div>
  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>
  <p class="src" id="src"></p>
  <nav class="tabs" id="tabs"></nav>
  <section class="pane" id="p-guide"></section>
  <section class="pane" id="p-quiz" hidden></section>
  <section class="pane" id="p-vocab" hidden></section>
  <p class="foot">Made for Classboard. Check anything you're unsure about with your teacher or your class notes.</p>
</div>
<script>
const DATA = {"id":"alg1-t4","cls":"Algebra 1","kick":"Algebra 1 · Topic 4 · Lessons 4-1 to 4-5","title":"Systems of Linear Equations and Inequalities","lede":"Everything for Topic 4: solving systems by graphing (4-1), substitution (4-2) and elimination (4-3), then graphing linear inequalities (4-4) and systems of inequalities (4-5). What to know, worked examples, a practice quiz and the vocab.","src":"Matches Topic 4 of enVision Algebra 1, the Savvas book Issaquah School District lists for Algebra 1. All problems here are original practice.","guide":[{"title":"What a system is","body":"\n      <p>A <b>system of linear equations</b> is two (or more) linear equations that use the same variables, like <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\"><i>y</i> = 2<i>x</i> − 1</span><span class=\"m\"><i>x</i> + <i>y</i> = 5</span></span></p>\n      <p>A <b>solution of the system</b> is an ordered pair <span class=\"m\">(<i>x</i>, <i>y</i>)</span> that makes <b>every</b> equation true at the same time. On a graph, it is the point where the lines cross.</p>\n      <div class=\"box key\"><b>Always check</b>Plug your answer into <i>both</i> original equations. If either one comes out false, it is not a solution.</div>","examples":[{"q":"Is <span class=\"m\">(2, 3)</span> a solution of <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\"><i>y</i> = 2<i>x</i> − 1</span><span class=\"m\"><i>x</i> + <i>y</i> = 5</span></span>","steps":["First equation: <span class=\"m\">2(2) − 1 = 3</span>, and <span class=\"m\"><i>y</i> = 3</span>. True.","Second equation: <span class=\"m\">2 + 3 = 5</span>. True."],"a":"Yes. <span class=\"m\">(2, 3)</span> works in both equations, so it is a solution."},{"q":"Is <span class=\"m\">(1, 4)</span> a solution of the same system?","steps":["Second equation: <span class=\"m\">1 + 4 = 5</span>. True.","First equation: <span class=\"m\">2(1) − 1 = 1</span>, but <span class=\"m\"><i>y</i> = 4</span>. False."],"a":"No. It only works in one equation, so it is not a solution of the system."}]},{"title":"4-1 Solving by graphing","body":"\n      <ol><li>Get both equations into slope-intercept form, <span class=\"m\"><i>y</i> = <i>mx</i> + <i>b</i></span>.</li>\n      <li>Graph both lines on the same grid.</li>\n      <li>The point where they cross is the solution. Check it in both equations.</li></ol>\n      <svg class=\"fig\" viewBox=\"0 0 268 268\" style=\"width:260px;\" role=\"img\" aria-label=\"The lines y = x + 1 and y = −2x + 4 cross at (1, 2)\"><line x1=\"14\" y1=\"14\" x2=\"14\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"254\" x2=\"254\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"34\" y1=\"14\" x2=\"34\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"234\" x2=\"254\" y2=\"234\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"54\" y1=\"14\" x2=\"54\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"214\" x2=\"254\" y2=\"214\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"74\" y1=\"14\" x2=\"74\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"194\" x2=\"254\" y2=\"194\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"94\" y1=\"14\" x2=\"94\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"174\" x2=\"254\" y2=\"174\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"114\" y1=\"14\" x2=\"114\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"154\" x2=\"254\" y2=\"154\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"134\" y1=\"14\" x2=\"134\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".7\" stroke-width=\"1.4\"/><line x1=\"14\" y1=\"134\" x2=\"254\" y2=\"134\" stroke=\"currentColor\" stroke-opacity=\".7\" stroke-width=\"1.4\"/><line x1=\"154\" y1=\"14\" x2=\"154\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"114\" x2=\"254\" y2=\"114\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"174\" y1=\"14\" x2=\"174\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"94\" x2=\"254\" y2=\"94\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"194\" y1=\"14\" x2=\"194\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"74\" x2=\"254\" y2=\"74\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"214\" y1=\"14\" x2=\"214\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"54\" x2=\"254\" y2=\"54\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"234\" y1=\"14\" x2=\"234\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"34\" x2=\"254\" y2=\"34\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"254\" y1=\"14\" x2=\"254\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"14\" x2=\"254\" y2=\"14\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><text x=\"14\" y=\"145\" text-anchor=\"middle\" style=\"font-size:8.5px;fill:currentColor\">−6</text><text x=\"131\" y=\"257\" text-anchor=\"end\" style=\"font-size:8.5px;fill:currentColor\">−6</text><text x=\"54\" y=\"145\" text-anchor=\"middle\" style=\"font-size:8.5px;fill:currentColor\">−4</text><text x=\"131\" y=\"217\" text-anchor=\"end\" style=\"font-size:8.5px;fill:currentColor\">−4</text><text x=\"94\" y=\"145\" text-anchor=\"middle\" style=\"font-size:8.5px;fill:currentColor\">−2</text><text x=\"131\" y=\"177\" text-anchor=\"end\" style=\"font-size:8.5px;fill:currentColor\">−2</text><text x=\"174\" y=\"145\" text-anchor=\"middle\" style=\"font-size:8.5px;fill:currentColor\">2</text><text x=\"131\" y=\"97\" text-anchor=\"end\" style=\"font-size:8.5px;fill:currentColor\">2</text><text x=\"214\" y=\"145\" text-anchor=\"middle\" style=\"font-size:8.5px;fill:currentColor\">4</text><text x=\"131\" y=\"57\" text-anchor=\"end\" style=\"font-size:8.5px;fill:currentColor\">4</text><text x=\"254\" y=\"145\" text-anchor=\"middle\" style=\"font-size:8.5px;fill:currentColor\">6</text><text x=\"131\" y=\"17\" text-anchor=\"end\" style=\"font-size:8.5px;fill:currentColor\">6</text><text x=\"257\" y=\"137\" style=\"font-size:10px;font-style:italic;fill:currentColor\">x</text><text x=\"138\" y=\"11\" style=\"font-size:10px;font-style:italic;fill:currentColor\">y</text><svg x=\"14\" y=\"14\" width=\"240\" height=\"240\" viewBox=\"14 14 240 240\"><line x1=\"-1066\" y1=\"1314\" x2=\"1334\" y2=\"-1086\" style=\"stroke:var(--ac,#6a46d6)\" stroke-width=\"2.3\"/><line x1=\"-1066\" y1=\"-2346\" x2=\"1334\" y2=\"2454\" style=\"stroke:var(--pk,#c23b7a)\" stroke-width=\"2.3\"/></svg><text x=\"200\" y=\"26\" style=\"font-size:10.5px;font-style:italic;font-weight:600;fill:var(--ac,#6a46d6)\">y = x + 1</text><text x=\"186\" y=\"198\" style=\"font-size:10.5px;font-style:italic;font-weight:600;fill:var(--pk,#c23b7a)\">y = −2x + 4</text><circle cx=\"154\" cy=\"94\" r=\"4\" style=\"fill:var(--ink,#17141f);stroke:var(--ink,#17141f)\" stroke-width=\"1.6\"/><text x=\"161\" y=\"88\" style=\"font-size:10.5px;font-weight:600;fill:var(--ink,#17141f)\">(1, 2)</text></svg>\n      <p class=\"figcap\">The lines <span class=\"m\"><i>y</i> = <i>x</i> + 1</span> and <span class=\"m\"><i>y</i> = −2<i>x</i> + 4</span> cross at <span class=\"m\">(1, 2)</span>, so that is the solution.</p>\n      <p>Graphing is great for seeing the answer, but if the lines cross between grid lines you can only <b>estimate</b> (for example \"about <span class=\"m\">(1.4, 2.7)</span>\"). Use substitution or elimination when you need the exact value, or the intersect tool on a graphing calculator.</p>","examples":[{"q":"Solve by graphing: <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\"><i>y</i> = <i>x</i> + 1</span><span class=\"m\">2<i>x</i> + <i>y</i> = 4</span></span>","steps":["The first equation is ready: slope 1, y-intercept 1.","Solve the second for <span class=\"m\"><i>y</i></span>: <span class=\"m\"><i>y</i> = −2<i>x</i> + 4</span> (slope −2, y-intercept 4).","Graph both. They cross at <span class=\"m\">(1, 2)</span>.","Check: <span class=\"m\">2 = 1 + 1</span> and <span class=\"m\">2(1) + 2 = 4</span>. Both true."],"a":"<span class=\"m\">(1, 2)</span>"}]},{"title":"One, none, or infinitely many solutions","body":"\n      <p>Two lines can meet once, never, or everywhere. Compare the <b>slopes</b> and <b>y-intercepts</b> (in <span class=\"m\"><i>y</i> = <i>mx</i> + <i>b</i></span> form) and you can tell without solving.</p>\n      <div style=\"text-align:center\"><div style=\"display:inline-block;vertical-align:top;text-align:center\"><svg class=\"fig\" viewBox=\"0 0 268 268\" style=\"width:150px;display:inline-block;margin:4px 6px;vertical-align:top\" role=\"img\" aria-label=\"Lines with different slopes cross once\"><line x1=\"14\" y1=\"14\" x2=\"14\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"254\" x2=\"254\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"34\" y1=\"14\" x2=\"34\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"234\" x2=\"254\" y2=\"234\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"54\" y1=\"14\" x2=\"54\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"214\" x2=\"254\" y2=\"214\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"74\" y1=\"14\" x2=\"74\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"194\" x2=\"254\" y2=\"194\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"94\" y1=\"14\" x2=\"94\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"174\" x2=\"254\" y2=\"174\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"114\" y1=\"14\" x2=\"114\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"154\" x2=\"254\" y2=\"154\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"134\" y1=\"14\" x2=\"134\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".7\" stroke-width=\"1.4\"/><line x1=\"14\" y1=\"134\" x2=\"254\" y2=\"134\" stroke=\"currentColor\" stroke-opacity=\".7\" stroke-width=\"1.4\"/><line x1=\"154\" y1=\"14\" x2=\"154\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"114\" x2=\"254\" y2=\"114\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"174\" y1=\"14\" x2=\"174\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"94\" x2=\"254\" y2=\"94\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"194\" y1=\"14\" x2=\"194\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"74\" x2=\"254\" y2=\"74\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"214\" y1=\"14\" x2=\"214\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"54\" x2=\"254\" y2=\"54\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"234\" y1=\"14\" x2=\"234\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"34\" x2=\"254\" y2=\"34\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"254\" y1=\"14\" x2=\"254\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"14\" x2=\"254\" y2=\"14\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><text x=\"257\" y=\"137\" style=\"font-size:10px;font-style:italic;fill:currentColor\">x</text><text x=\"138\" y=\"11\" style=\"font-size:10px;font-style:italic;fill:currentColor\">y</text><svg x=\"14\" y=\"14\" width=\"240\" height=\"240\" viewBox=\"14 14 240 240\"><line x1=\"-1066\" y1=\"1334\" x2=\"1334\" y2=\"-1066\" style=\"stroke:var(--ac,#6a46d6)\" stroke-width=\"2.3\"/><line x1=\"-1066\" y1=\"-506\" x2=\"1334\" y2=\"694\" style=\"stroke:var(--pk,#c23b7a)\" stroke-width=\"2.3\"/></svg><circle cx=\"160.6\" cy=\"107.4\" r=\"4\" style=\"fill:var(--ink,#17141f);stroke:var(--ink,#17141f)\" stroke-width=\"1.6\"/></svg><div class=\"figcap\" style=\"margin-top:-2px\">Cross once: one solution</div></div><div style=\"display:inline-block;vertical-align:top;text-align:center\"><svg class=\"fig\" viewBox=\"0 0 268 268\" style=\"width:150px;display:inline-block;margin:4px 6px;vertical-align:top\" role=\"img\" aria-label=\"Parallel lines never cross\"><line x1=\"14\" y1=\"14\" x2=\"14\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"254\" x2=\"254\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"34\" y1=\"14\" x2=\"34\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"234\" x2=\"254\" y2=\"234\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"54\" y1=\"14\" x2=\"54\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"214\" x2=\"254\" y2=\"214\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"74\" y1=\"14\" x2=\"74\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"194\" x2=\"254\" y2=\"194\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"94\" y1=\"14\" x2=\"94\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"174\" x2=\"254\" y2=\"174\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"114\" y1=\"14\" x2=\"114\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"154\" x2=\"254\" y2=\"154\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"134\" y1=\"14\" x2=\"134\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".7\" stroke-width=\"1.4\"/><line x1=\"14\" y1=\"134\" x2=\"254\" y2=\"134\" stroke=\"currentColor\" stroke-opacity=\".7\" stroke-width=\"1.4\"/><line x1=\"154\" y1=\"14\" x2=\"154\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"114\" x2=\"254\" y2=\"114\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"174\" y1=\"14\" x2=\"174\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"94\" x2=\"254\" y2=\"94\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"194\" y1=\"14\" x2=\"194\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"74\" x2=\"254\" y2=\"74\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"214\" y1=\"14\" x2=\"214\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"54\" x2=\"254\" y2=\"54\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"234\" y1=\"14\" x2=\"234\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"34\" x2=\"254\" y2=\"34\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"254\" y1=\"14\" x2=\"254\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"14\" x2=\"254\" y2=\"14\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><text x=\"257\" y=\"137\" style=\"font-size:10px;font-style:italic;fill:currentColor\">x</text><text x=\"138\" y=\"11\" style=\"font-size:10px;font-style:italic;fill:currentColor\">y</text><svg x=\"14\" y=\"14\" width=\"240\" height=\"240\" viewBox=\"14 14 240 240\"><line x1=\"-1066\" y1=\"694\" x2=\"1334\" y2=\"-506\" style=\"stroke:var(--ac,#6a46d6)\" stroke-width=\"2.3\"/><line x1=\"-1066\" y1=\"774\" x2=\"1334\" y2=\"-426\" style=\"stroke:var(--pk,#c23b7a)\" stroke-width=\"2.3\"/></svg></svg><div class=\"figcap\" style=\"margin-top:-2px\">Parallel: no solution</div></div><div style=\"display:inline-block;vertical-align:top;text-align:center\"><svg class=\"fig\" viewBox=\"0 0 268 268\" style=\"width:150px;display:inline-block;margin:4px 6px;vertical-align:top\" role=\"img\" aria-label=\"The same line drawn twice\"><line x1=\"14\" y1=\"14\" x2=\"14\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"254\" x2=\"254\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"34\" y1=\"14\" x2=\"34\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"234\" x2=\"254\" y2=\"234\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"54\" y1=\"14\" x2=\"54\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"214\" x2=\"254\" y2=\"214\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"74\" y1=\"14\" x2=\"74\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"194\" x2=\"254\" y2=\"194\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"94\" y1=\"14\" x2=\"94\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"174\" x2=\"254\" y2=\"174\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"114\" y1=\"14\" x2=\"114\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"154\" x2=\"254\" y2=\"154\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"134\" y1=\"14\" x2=\"134\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".7\" stroke-width=\"1.4\"/><line x1=\"14\" y1=\"134\" x2=\"254\" y2=\"134\" stroke=\"currentColor\" stroke-opacity=\".7\" stroke-width=\"1.4\"/><line x1=\"154\" y1=\"14\" x2=\"154\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"114\" x2=\"254\" y2=\"114\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"174\" y1=\"14\" x2=\"174\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"94\" x2=\"254\" y2=\"94\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"194\" y1=\"14\" x2=\"194\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"74\" x2=\"254\" y2=\"74\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"214\" y1=\"14\" x2=\"214\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"54\" x2=\"254\" y2=\"54\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"234\" y1=\"14\" x2=\"234\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"34\" x2=\"254\" y2=\"34\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"254\" y1=\"14\" x2=\"254\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"14\" x2=\"254\" y2=\"14\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><text x=\"257\" y=\"137\" style=\"font-size:10px;font-style:italic;fill:currentColor\">x</text><text x=\"138\" y=\"11\" style=\"font-size:10px;font-style:italic;fill:currentColor\">y</text><svg x=\"14\" y=\"14\" width=\"240\" height=\"240\" viewBox=\"14 14 240 240\"><line x1=\"-1066\" y1=\"-1086\" x2=\"1334\" y2=\"1314\" style=\"stroke:var(--ac,#6a46d6)\" stroke-width=\"2.3\"/><line x1=\"-1066\" y1=\"-1086\" x2=\"1334\" y2=\"1314\" style=\"stroke:var(--pk,#c23b7a)\" stroke-width=\"2.3\" stroke-dasharray=\"7 5\"/></svg></svg><div class=\"figcap\" style=\"margin-top:-2px\">Same line: infinitely many</div></div></div>\n      <table><tr><th>What you see</th><th>Slopes and intercepts</th><th>Solutions</th><th>Name</th></tr>\n      <tr><td>Lines cross once</td><td>Different slopes</td><td>Exactly one</td><td>Consistent, independent</td></tr>\n      <tr><td>Parallel lines</td><td>Same slope, different y-intercepts</td><td>None</td><td>Inconsistent</td></tr>\n      <tr><td>Same line</td><td>Same slope, same y-intercept</td><td>Infinitely many</td><td>Consistent, dependent</td></tr></table>","examples":[{"q":"How many solutions does <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\"><i>y</i> = 3<i>x</i> − 2</span><span class=\"m\">6<i>x</i> − 2<i>y</i> = 4</span></span> have?","steps":["Solve the second for <span class=\"m\"><i>y</i></span>: <span class=\"m\">−2<i>y</i> = −6<i>x</i> + 4</span>, so <span class=\"m\"><i>y</i> = 3<i>x</i> − 2</span>.","That is the exact same equation as the first: same slope (3) and same y-intercept (−2)."],"a":"Infinitely many. Every point on the line <span class=\"m\"><i>y</i> = 3<i>x</i> − 2</span> is a solution."},{"q":"How many solutions does <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\"><i>y</i> = -½<i>x</i> + 3</span><span class=\"m\"><i>x</i> + 2<i>y</i> = −4</span></span> have?","steps":["Solve the second for <span class=\"m\"><i>y</i></span>: <span class=\"m\">2<i>y</i> = −<i>x</i> − 4</span>, so <span class=\"m\"><i>y</i> = -½<i>x</i> − 2</span>.","Same slope (−½), different y-intercepts (3 and −2), so the lines are parallel."],"a":"No solution."}]},{"title":"4-2 Solving by substitution","body":"\n      <ol><li><b>Isolate</b> one variable in one equation. Pick a variable with a coefficient of 1 or −1 so you don't get fractions.</li>\n      <li><b>Substitute</b> that expression into the <i>other</i> equation. Now it has only one variable.</li>\n      <li><b>Solve</b> for that variable.</li>\n      <li><b>Back-substitute</b> to find the other variable, then write the ordered pair and check it.</li></ol>\n      <div class=\"box key\"><b>When the variables disappear</b>If both variables cancel and you get a <b>true</b> statement like <span class=\"m\">4 = 4</span>, there are infinitely many solutions. A <b>false</b> statement like <span class=\"m\">−6 = 6</span> means there is no solution.</div>","examples":[{"q":"Solve: <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\"><i>y</i> = 3<i>x</i> − 5</span><span class=\"m\">2<i>x</i> + <i>y</i> = 10</span></span>","steps":["The first equation already says what <span class=\"m\"><i>y</i></span> equals. Substitute it into the second: <span class=\"m\">2<i>x</i> + (3<i>x</i> − 5) = 10</span>.","Combine: <span class=\"m\">5<i>x</i> − 5 = 10</span>, so <span class=\"m\">5<i>x</i> = 15</span> and <span class=\"m\"><i>x</i> = 3</span>.","Back-substitute: <span class=\"m\"><i>y</i> = 3(3) − 5 = 4</span>.","Check in the second equation: <span class=\"m\">2(3) + 4 = 10</span>. True."],"a":"<span class=\"m\">(3, 4)</span>"},{"q":"Solve: <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\"><i>x</i> − 2<i>y</i> = 1</span><span class=\"m\">3<i>x</i> + 4<i>y</i> = 23</span></span>","steps":["Isolate <span class=\"m\"><i>x</i></span> in the first equation (its coefficient is 1): <span class=\"m\"><i>x</i> = 2<i>y</i> + 1</span>.","Substitute: <span class=\"m\">3(2<i>y</i> + 1) + 4<i>y</i> = 23</span>, so <span class=\"m\">6<i>y</i> + 3 + 4<i>y</i> = 23</span>.","<span class=\"m\">10<i>y</i> = 20</span>, so <span class=\"m\"><i>y</i> = 2</span>. Then <span class=\"m\"><i>x</i> = 2(2) + 1 = 5</span>.","Check: <span class=\"m\">3(5) + 4(2) = 23</span>. True."],"a":"<span class=\"m\">(5, 2)</span>"},{"q":"Solve: <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\"><i>y</i> = 2<i>x</i> + 3</span><span class=\"m\">4<i>x</i> − 2<i>y</i> = 6</span></span>","steps":["Substitute: <span class=\"m\">4<i>x</i> − 2(2<i>x</i> + 3) = 6</span>.","Distribute: <span class=\"m\">4<i>x</i> − 4<i>x</i> − 6 = 6</span>, which leaves <span class=\"m\">−6 = 6</span>.","That is false no matter what <span class=\"m\"><i>x</i></span> is."],"a":"No solution (the lines are parallel: both have slope 2)."}]},{"title":"4-3 Solving by elimination","body":"\n      <p>Line the equations up (<span class=\"m\"><i>x</i></span> over <span class=\"m\"><i>x</i></span>, <span class=\"m\"><i>y</i></span> over <span class=\"m\"><i>y</i></span>, numbers on the right) and add or subtract them so one variable cancels.</p>\n      <ul><li><b>Opposite coefficients</b> (like <span class=\"m\">2<i>y</i></span> and <span class=\"m\">−2<i>y</i></span>): <b>add</b> the equations.</li>\n      <li><b>Same coefficients</b> (like <span class=\"m\">3<i>x</i></span> and <span class=\"m\">3<i>x</i></span>): <b>subtract</b> them, or multiply one equation by −1 and add.</li>\n      <li><b>Neither</b>: multiply one or both equations by a number first so a variable has opposite coefficients.</li></ul>\n      <div class=\"box key\"><b>Why multiplying is allowed</b>Multiplying both sides of an equation by the same nonzero number gives an <b>equivalent</b> equation with the same solutions. The new system is an <b>equivalent system</b>.</div>\n      <div class=\"box warn\"><b>Multiply everything</b>When you scale an equation, multiply <i>every</i> term, including the number on the right side.</div>","examples":[{"q":"Solve: <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\">3<i>x</i> + 2<i>y</i> = 16</span><span class=\"m\">5<i>x</i> − 2<i>y</i> = 0</span></span>","steps":["The <span class=\"m\"><i>y</i></span>-terms are opposites (<span class=\"m\">2<i>y</i></span> and <span class=\"m\">−2<i>y</i></span>), so add the equations: <span class=\"m\">8<i>x</i> = 16</span>.","<span class=\"m\"><i>x</i> = 2</span>. Substitute into the first: <span class=\"m\">3(2) + 2<i>y</i> = 16</span>, so <span class=\"m\">2<i>y</i> = 10</span> and <span class=\"m\"><i>y</i> = 5</span>.","Check in the second: <span class=\"m\">5(2) − 2(5) = 0</span>. True."],"a":"<span class=\"m\">(2, 5)</span>"},{"q":"Solve: <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\">2<i>x</i> + 3<i>y</i> = 12</span><span class=\"m\"><i>x</i> − <i>y</i> = 1</span></span>","steps":["Multiply the second equation by 3: <span class=\"m\">3<i>x</i> − 3<i>y</i> = 3</span>.","Add it to the first: <span class=\"m\">5<i>x</i> = 15</span>, so <span class=\"m\"><i>x</i> = 3</span>.","Then <span class=\"m\">3 − <i>y</i> = 1</span>, so <span class=\"m\"><i>y</i> = 2</span>.","Check: <span class=\"m\">2(3) + 3(2) = 12</span>. True."],"a":"<span class=\"m\">(3, 2)</span>"},{"q":"Solve: <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\">3<i>x</i> + 4<i>y</i> = 24</span><span class=\"m\">2<i>x</i> − 3<i>y</i> = −1</span></span>","steps":["To cancel <span class=\"m\"><i>y</i></span>: multiply the first by 3 and the second by 4.","<span class=\"m\">9<i>x</i> + 12<i>y</i> = 72</span> and <span class=\"m\">8<i>x</i> − 12<i>y</i> = −4</span>.","Add: <span class=\"m\">17<i>x</i> = 68</span>, so <span class=\"m\"><i>x</i> = 4</span>.","Then <span class=\"m\">3(4) + 4<i>y</i> = 24</span>, so <span class=\"m\">4<i>y</i> = 12</span> and <span class=\"m\"><i>y</i> = 3</span>.","Check: <span class=\"m\">2(4) − 3(3) = −1</span>. True."],"a":"<span class=\"m\">(4, 3)</span>"}]},{"title":"Which method should I use?","body":"\n      <table><tr><th>Method</th><th>Best when</th></tr>\n      <tr><td>Graphing</td><td>Both equations are easy to graph and you want to see the answer, or you only need an estimate.</td></tr>\n      <tr><td>Substitution</td><td>One equation is already solved for a variable (<span class=\"m\"><i>y</i> = …</span> or <span class=\"m\"><i>x</i> = …</span>), or a variable has a coefficient of 1 or −1.</td></tr>\n      <tr><td>Elimination</td><td>Both equations are in standard form <span class=\"m\"><i>Ax</i> + <i>By</i> = <i>C</i></span>, especially if a variable already has equal or opposite coefficients.</td></tr></table>\n      <p>All three methods give the same answer. Pick the one that means the least work.</p>\n      <p><b>Word problems:</b> name your two variables, write one equation for each fact (usually a \"how many\" equation and a \"how much\" equation), solve, then answer the question in words with units.</p>","examples":[{"q":"A school play sold 30 tickets for $195. Adult tickets cost $8 and student tickets cost $5. How many of each were sold?","steps":["Let <span class=\"m\"><i>a</i></span> = adult tickets and <span class=\"m\"><i>s</i></span> = student tickets.","How many: <span class=\"m\"><i>a</i> + <i>s</i> = 30</span>. How much: <span class=\"m\">8<i>a</i> + 5<i>s</i> = 195</span>.","Substitute <span class=\"m\"><i>a</i> = 30 − <i>s</i></span>: <span class=\"m\">8(30 − <i>s</i>) + 5<i>s</i> = 195</span>, so <span class=\"m\">240 − 3<i>s</i> = 195</span>.","<span class=\"m\">−3<i>s</i> = −45</span>, so <span class=\"m\"><i>s</i> = 15</span> and <span class=\"m\"><i>a</i> = 15</span>.","Check: <span class=\"m\">8(15) + 5(15) = 120 + 75 = 195</span>."],"a":"15 adult tickets and 15 student tickets."},{"q":"Gym A costs $30 to join plus $15 a month. Gym B costs $10 to join plus $20 a month. When do they cost the same?","steps":["Let <span class=\"m\"><i>x</i></span> = months and <span class=\"m\"><i>y</i></span> = total cost: <span class=\"m\"><i>y</i> = 15<i>x</i> + 30</span> and <span class=\"m\"><i>y</i> = 20<i>x</i> + 10</span>.","Set them equal: <span class=\"m\">15<i>x</i> + 30 = 20<i>x</i> + 10</span>, so <span class=\"m\">20 = 5<i>x</i></span> and <span class=\"m\"><i>x</i> = 4</span>.","<span class=\"m\"><i>y</i> = 15(4) + 30 = 90</span>."],"a":"After 4 months, when both cost $90. After that, Gym A is cheaper."}]},{"title":"4-4 Linear inequalities in two variables","body":"\n      <p>A <b>linear inequality in two variables</b> looks like <span class=\"m\"><i>y</i> &lt; 2<i>x</i> − 3</span> or <span class=\"m\">3<i>x</i> − 2<i>y</i> ≥ 6</span>. Its solutions are all the points that make it true, so the graph is a whole shaded region (a <b>half-plane</b>), not just a line.</p>\n      <ol><li>Graph the <b>boundary line</b> (pretend the symbol is <span class=\"m\">=</span>).\n        <ul><li><span class=\"m\">&lt;</span> or <span class=\"m\">&gt;</span>: <b>dashed</b> line (points on the line are not solutions).</li>\n        <li><span class=\"m\">≤</span> or <span class=\"m\">≥</span>: <b>solid</b> line (points on the line are solutions).</li></ul></li>\n      <li>Shade one side. Solved for <span class=\"m\"><i>y</i></span>: <span class=\"m\"><i>y</i> &gt;</span> or <span class=\"m\"><i>y</i> ≥</span> shades <b>above</b>, <span class=\"m\"><i>y</i> &lt;</span> or <span class=\"m\"><i>y</i> ≤</span> shades <b>below</b>.</li>\n      <li>Check with a <b>test point</b> not on the line, usually <span class=\"m\">(0, 0)</span>. If it makes the inequality true, shade its side; if false, shade the other side.</li></ol>\n      <svg class=\"fig\" viewBox=\"0 0 268 268\" style=\"width:260px;\" role=\"img\" aria-label=\"Dashed line y = 2x − 3 with the region below it shaded; (0, 0) is not shaded\"><line x1=\"14\" y1=\"14\" x2=\"14\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"254\" x2=\"254\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"34\" y1=\"14\" x2=\"34\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"234\" x2=\"254\" y2=\"234\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"54\" y1=\"14\" x2=\"54\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"214\" x2=\"254\" y2=\"214\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"74\" y1=\"14\" x2=\"74\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"194\" x2=\"254\" y2=\"194\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"94\" y1=\"14\" x2=\"94\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"174\" x2=\"254\" y2=\"174\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"114\" y1=\"14\" x2=\"114\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"154\" x2=\"254\" y2=\"154\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"134\" y1=\"14\" x2=\"134\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".7\" stroke-width=\"1.4\"/><line x1=\"14\" y1=\"134\" x2=\"254\" y2=\"134\" stroke=\"currentColor\" stroke-opacity=\".7\" stroke-width=\"1.4\"/><line x1=\"154\" y1=\"14\" x2=\"154\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"114\" x2=\"254\" y2=\"114\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"174\" y1=\"14\" x2=\"174\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"94\" x2=\"254\" y2=\"94\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"194\" y1=\"14\" x2=\"194\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"74\" x2=\"254\" y2=\"74\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"214\" y1=\"14\" x2=\"214\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"54\" x2=\"254\" y2=\"54\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"234\" y1=\"14\" x2=\"234\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"34\" x2=\"254\" y2=\"34\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"254\" y1=\"14\" x2=\"254\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"14\" x2=\"254\" y2=\"14\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><text x=\"14\" y=\"145\" text-anchor=\"middle\" style=\"font-size:8.5px;fill:currentColor\">−6</text><text x=\"131\" y=\"257\" text-anchor=\"end\" style=\"font-size:8.5px;fill:currentColor\">−6</text><text x=\"54\" y=\"145\" text-anchor=\"middle\" style=\"font-size:8.5px;fill:currentColor\">−4</text><text x=\"131\" y=\"217\" text-anchor=\"end\" style=\"font-size:8.5px;fill:currentColor\">−4</text><text x=\"94\" y=\"145\" text-anchor=\"middle\" style=\"font-size:8.5px;fill:currentColor\">−2</text><text x=\"131\" y=\"177\" text-anchor=\"end\" style=\"font-size:8.5px;fill:currentColor\">−2</text><text x=\"174\" y=\"145\" text-anchor=\"middle\" style=\"font-size:8.5px;fill:currentColor\">2</text><text x=\"131\" y=\"97\" text-anchor=\"end\" style=\"font-size:8.5px;fill:currentColor\">2</text><text x=\"214\" y=\"145\" text-anchor=\"middle\" style=\"font-size:8.5px;fill:currentColor\">4</text><text x=\"131\" y=\"57\" text-anchor=\"end\" style=\"font-size:8.5px;fill:currentColor\">4</text><text x=\"254\" y=\"145\" text-anchor=\"middle\" style=\"font-size:8.5px;fill:currentColor\">6</text><text x=\"131\" y=\"17\" text-anchor=\"end\" style=\"font-size:8.5px;fill:currentColor\">6</text><text x=\"257\" y=\"137\" style=\"font-size:10px;font-style:italic;fill:currentColor\">x</text><text x=\"138\" y=\"11\" style=\"font-size:10px;font-style:italic;fill:currentColor\">y</text><svg x=\"14\" y=\"14\" width=\"240\" height=\"240\" viewBox=\"14 14 240 240\"><polygon points=\"-1066,2594 1334,-2206 1334,10934 -1066,10934\" style=\"fill:var(--ac,#6a46d6);fill-opacity:.16\"/><line x1=\"-1066\" y1=\"2594\" x2=\"1334\" y2=\"-2206\" style=\"stroke:var(--ac,#6a46d6)\" stroke-width=\"2.3\" stroke-dasharray=\"7 5\"/></svg><text x=\"198\" y=\"94\" style=\"font-size:10.5px;font-style:italic;font-weight:600;fill:var(--ac,#6a46d6)\">y &lt; 2x − 3</text><circle cx=\"134\" cy=\"134\" r=\"4\" style=\"fill:var(--card,#fff);stroke:var(--ink,#17141f)\" stroke-width=\"1.6\"/><text x=\"141\" y=\"128\" style=\"font-size:10.5px;font-weight:600;fill:var(--ink,#17141f)\">(0, 0)</text></svg>\n      <p class=\"figcap\"><span class=\"m\"><i>y</i> &lt; 2<i>x</i> − 3</span>: dashed line, shaded below. The test point <span class=\"m\">(0, 0)</span> gives <span class=\"m\">0 &lt; −3</span>, which is false, so <span class=\"m\">(0, 0)</span> is on the unshaded side.</p>\n      <div class=\"box warn\"><b>Flip the sign</b>If you multiply or divide both sides by a <b>negative</b> number while solving for <span class=\"m\"><i>y</i></span>, flip the inequality symbol.</div>\n      <p>A vertical boundary like <span class=\"m\"><i>x</i> &gt; 2</span> is a dashed vertical line shaded to the right. A horizontal one like <span class=\"m\"><i>y</i> ≤ −1</span> is a solid horizontal line shaded below.</p>","examples":[{"q":"Graph <span class=\"m\">3<i>x</i> − 2<i>y</i> ≥ 6</span>.","steps":["Solve for <span class=\"m\"><i>y</i></span>: <span class=\"m\">−2<i>y</i> ≥ −3<i>x</i> + 6</span>.","Divide by −2 and flip the symbol: <span class=\"m\"><i>y</i> ≤ (3/2)<i>x</i> − 3</span>.","Solid line (because of <span class=\"m\">≤</span>), y-intercept −3, slope 3/2. Shade below.","Test <span class=\"m\">(0, 0)</span> in the original: <span class=\"m\">0 ≥ 6</span> is false, so the origin is not shaded. It sits above the line, which agrees with shading below."],"a":"Solid line <span class=\"m\"><i>y</i> = (3/2)<i>x</i> − 3</span>, shaded below it."},{"q":"Chips cost $2 and drinks cost $3. You have at most $24. Write an inequality and decide if 6 chips and 4 drinks fits.","steps":["Let <span class=\"m\"><i>x</i></span> = chips and <span class=\"m\"><i>y</i></span> = drinks: <span class=\"m\">2<i>x</i> + 3<i>y</i> ≤ 24</span>, with <span class=\"m\"><i>x</i> ≥ 0</span> and <span class=\"m\"><i>y</i> ≥ 0</span>.","Test <span class=\"m\">(6, 4)</span>: <span class=\"m\">2(6) + 3(4) = 24</span>, and <span class=\"m\">24 ≤ 24</span> is true."],"a":"Yes, it fits exactly: the point is on the solid boundary line."}]},{"title":"4-5 Systems of linear inequalities","body":"\n      <p>A <b>system of linear inequalities</b> is two or more inequalities graphed together. Its <b>solution</b> is the region where <b>all</b> the shadings overlap. Every point in that overlap works in every inequality.</p>\n      <svg class=\"fig\" viewBox=\"0 0 268 268\" style=\"width:260px;\" role=\"img\" aria-label=\"The overlap of y ≥ x − 2 and y < −x + 4 is the darker region on the left\"><line x1=\"14\" y1=\"14\" x2=\"14\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"254\" x2=\"254\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"34\" y1=\"14\" x2=\"34\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"234\" x2=\"254\" y2=\"234\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"54\" y1=\"14\" x2=\"54\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"214\" x2=\"254\" y2=\"214\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"74\" y1=\"14\" x2=\"74\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"194\" x2=\"254\" y2=\"194\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"94\" y1=\"14\" x2=\"94\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"174\" x2=\"254\" y2=\"174\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"114\" y1=\"14\" x2=\"114\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"154\" x2=\"254\" y2=\"154\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"134\" y1=\"14\" x2=\"134\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".7\" stroke-width=\"1.4\"/><line x1=\"14\" y1=\"134\" x2=\"254\" y2=\"134\" stroke=\"currentColor\" stroke-opacity=\".7\" stroke-width=\"1.4\"/><line x1=\"154\" y1=\"14\" x2=\"154\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"114\" x2=\"254\" y2=\"114\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"174\" y1=\"14\" x2=\"174\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"94\" x2=\"254\" y2=\"94\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"194\" y1=\"14\" x2=\"194\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"74\" x2=\"254\" y2=\"74\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"214\" y1=\"14\" x2=\"214\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"54\" x2=\"254\" y2=\"54\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"234\" y1=\"14\" x2=\"234\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"34\" x2=\"254\" y2=\"34\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"254\" y1=\"14\" x2=\"254\" y2=\"254\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><line x1=\"14\" y1=\"14\" x2=\"254\" y2=\"14\" stroke=\"currentColor\" stroke-opacity=\".17\" stroke-width=\"1\"/><text x=\"14\" y=\"145\" text-anchor=\"middle\" style=\"font-size:8.5px;fill:currentColor\">−6</text><text x=\"131\" y=\"257\" text-anchor=\"end\" style=\"font-size:8.5px;fill:currentColor\">−6</text><text x=\"54\" y=\"145\" text-anchor=\"middle\" style=\"font-size:8.5px;fill:currentColor\">−4</text><text x=\"131\" y=\"217\" text-anchor=\"end\" style=\"font-size:8.5px;fill:currentColor\">−4</text><text x=\"94\" y=\"145\" text-anchor=\"middle\" style=\"font-size:8.5px;fill:currentColor\">−2</text><text x=\"131\" y=\"177\" text-anchor=\"end\" style=\"font-size:8.5px;fill:currentColor\">−2</text><text x=\"174\" y=\"145\" text-anchor=\"middle\" style=\"font-size:8.5px;fill:currentColor\">2</text><text x=\"131\" y=\"97\" text-anchor=\"end\" style=\"font-size:8.5px;fill:currentColor\">2</text><text x=\"214\" y=\"145\" text-anchor=\"middle\" style=\"font-size:8.5px;fill:currentColor\">4</text><text x=\"131\" y=\"57\" text-anchor=\"end\" style=\"font-size:8.5px;fill:currentColor\">4</text><text x=\"254\" y=\"145\" text-anchor=\"middle\" style=\"font-size:8.5px;fill:currentColor\">6</text><text x=\"131\" y=\"17\" text-anchor=\"end\" style=\"font-size:8.5px;fill:currentColor\">6</text><text x=\"257\" y=\"137\" style=\"font-size:10px;font-style:italic;fill:currentColor\">x</text><text x=\"138\" y=\"11\" style=\"font-size:10px;font-style:italic;fill:currentColor\">y</text><svg x=\"14\" y=\"14\" width=\"240\" height=\"240\" viewBox=\"14 14 240 240\"><polygon points=\"-1066,1374 1334,-1026 1334,-10666 -1066,-10666\" style=\"fill:var(--ac,#6a46d6);fill-opacity:.16\"/><polygon points=\"-1066,-1146 1334,1254 1334,10934 -1066,10934\" style=\"fill:var(--pk,#c23b7a);fill-opacity:.16\"/><line x1=\"-1066\" y1=\"1374\" x2=\"1334\" y2=\"-1026\" style=\"stroke:var(--ac,#6a46d6)\" stroke-width=\"2.3\"/><line x1=\"-1066\" y1=\"-1146\" x2=\"1334\" y2=\"1254\" style=\"stroke:var(--pk,#c23b7a)\" stroke-width=\"2.3\" stroke-dasharray=\"7 5\"/></svg><text x=\"82\" y=\"246\" style=\"font-size:10.5px;font-style:italic;font-weight:600;fill:var(--ac,#6a46d6)\">y ≥ x − 2</text><text x=\"138\" y=\"36\" style=\"font-size:10.5px;font-style:italic;font-weight:600;fill:var(--pk,#c23b7a)\">y &lt; −x + 4</text><circle cx=\"134\" cy=\"134\" r=\"4\" style=\"fill:var(--ink,#17141f);stroke:var(--ink,#17141f)\" stroke-width=\"1.6\"/><text x=\"141\" y=\"128\" style=\"font-size:10.5px;font-weight:600;fill:var(--ink,#17141f)\">(0, 0)</text><circle cx=\"194\" cy=\"114\" r=\"4\" style=\"fill:var(--card,#fff);stroke:var(--ink,#17141f)\" stroke-width=\"1.6\"/><text x=\"201\" y=\"108\" style=\"font-size:10.5px;font-weight:600;fill:var(--ink,#17141f)\">(3, 1)</text></svg>\n      <p class=\"figcap\">The darker region is where both shadings overlap. <span class=\"m\">(0, 0)</span> is a solution; the corner <span class=\"m\">(3, 1)</span> is <b>not</b>, because it sits on the dashed line.</p>\n      <ul><li>Graph each inequality with its own boundary line and shading. Using two colors helps.</li>\n      <li>Check one point from the overlap in every inequality.</li>\n      <li>Points on a <b>solid</b> boundary of the overlap count; points on a <b>dashed</b> boundary don't.</li>\n      <li>If the shadings never overlap (for example parallel lines shaded away from each other), the system has <b>no solution</b>.</li></ul>","examples":[{"q":"Is <span class=\"m\">(0, 0)</span> a solution of <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\"><i>y</i> ≥ <i>x</i> − 2</span><span class=\"m\"><i>y</i> &lt; −<i>x</i> + 4</span></span>? What about <span class=\"m\">(3, 1)</span>?","steps":["<span class=\"m\">(0, 0)</span>: <span class=\"m\">0 ≥ −2</span> true, <span class=\"m\">0 &lt; 4</span> true. Yes.","<span class=\"m\">(3, 1)</span>: <span class=\"m\">1 ≥ 1</span> true, but <span class=\"m\">1 &lt; 1</span> false. No."],"a":"<span class=\"m\">(0, 0)</span> is a solution; <span class=\"m\">(3, 1)</span> is not."},{"q":"Maya earns $15 an hour at a café (x hours) and $20 an hour tutoring (y hours). She wants at least $300 a week and can work at most 20 hours. Write the system, then check 8 café hours and 10 tutoring hours.","steps":["Money: <span class=\"m\">15<i>x</i> + 20<i>y</i> ≥ 300</span>. Time: <span class=\"m\"><i>x</i> + <i>y</i> ≤ 20</span>. Hours can't be negative: <span class=\"m\"><i>x</i> ≥ 0</span>, <span class=\"m\"><i>y</i> ≥ 0</span>.","Test <span class=\"m\">(8, 10)</span>: <span class=\"m\">15(8) + 20(10) = 320</span> and <span class=\"m\">320 ≥ 300</span>; <span class=\"m\">8 + 10 = 18 ≤ 20</span>."],"a":"Yes, <span class=\"m\">(8, 10)</span> works: $320 in 18 hours."}]},{"title":"Mistakes to avoid","body":"\n      <ul><li>Stopping after finding <span class=\"m\"><i>x</i></span>. A solution of a system is an ordered pair <span class=\"m\">(<i>x</i>, <i>y</i>)</span>.</li>\n      <li>Checking in only one equation. It has to work in both.</li>\n      <li>Reading <span class=\"m\">0 = 0</span> as \"<span class=\"m\"><i>x</i> = 0</span>\". It means infinitely many solutions.</li>\n      <li>In substitution, plugging the expression back into the same equation you got it from. Use the <i>other</i> equation.</li>\n      <li>In elimination, subtracting only the first term. Subtract (or multiply) every term, including the constant.</li>\n      <li>Forgetting to flip <span class=\"m\">&lt;</span> or <span class=\"m\">&gt;</span> after dividing by a negative.</li>\n      <li>Using a solid line for <span class=\"m\">&lt;</span> or <span class=\"m\">&gt;</span> (it should be dashed), or shading the wrong side. A test point catches this.</li>\n      <li>Answering a word problem with just numbers. Say what they mean, with units.</li></ul>"}],"quiz":[{"t":"Solutions","q":"Which ordered pair is a solution of <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\"><i>y</i> = <i>x</i> + 2</span><span class=\"m\"><i>y</i> = 3<i>x</i> − 4</span></span>?","c":["<span class=\"m\">(3, 5)</span>","<span class=\"m\">(2, 4)</span>","<span class=\"m\">(1, 3)</span>","<span class=\"m\">(5, 3)</span>"],"a":0,"why":"It has to make both equations true: <span class=\"m\">5 = 3 + 2</span> and <span class=\"m\">5 = 3(3) − 4</span>. The others only work in one equation, or none."},{"t":"Graphing","q":"The two lines in a system cross at <span class=\"m\">(−2, 1)</span>. What is the solution?","c":["<span class=\"m\">(−2, 1)</span>","<span class=\"m\">(1, −2)</span>","<span class=\"m\"><i>x</i> = −2</span> only","There is no solution"],"a":0,"why":"The point of intersection is on both lines, so it is the solution. Keep the order (x, y)."},{"t":"Graphing","q":"How many solutions does <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\"><i>y</i> = 4<i>x</i> + 1</span><span class=\"m\"><i>y</i> = 4<i>x</i> − 3</span></span> have?","c":["None","Exactly one","Infinitely many","Exactly two"],"a":0,"why":"Same slope (4) with different y-intercepts means parallel lines, which never meet."},{"t":"Graphing","q":"How many solutions does <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\"><i>y</i> = −2<i>x</i> + 5</span><span class=\"m\">4<i>x</i> + 2<i>y</i> = 10</span></span> have?","c":["Infinitely many","None","Exactly one","Exactly two"],"a":0,"why":"Solving the second for <span class=\"m\"><i>y</i></span> gives <span class=\"m\"><i>y</i> = −2<i>x</i> + 5</span>, the same line. Every point on it is a solution."},{"t":"Graphing","q":"How many solutions does <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\"><i>y</i> = ½<i>x</i> + 3</span><span class=\"m\"><i>y</i> = −<i>x</i> + 3</span></span> have?","c":["Exactly one","None","Infinitely many","You can't tell without graphing"],"a":0,"why":"The slopes are different (½ and −1), so the lines cross exactly once (here at <span class=\"m\">(0, 3)</span>)."},{"t":"Graphing","q":"When does solving by graphing usually give only an estimate?","c":["When the lines cross between grid lines","When the lines are parallel","When both equations are in slope-intercept form","When the solution is <span class=\"m\">(0, 0)</span>"],"a":0,"why":"If the solution has fractions or decimals, you can only read it approximately off a graph. Substitution or elimination gives the exact value."},{"t":"Graphing","q":"A system is called <b>inconsistent</b> when it has…","c":["no solution","exactly one solution","infinitely many solutions","a solution at the origin"],"a":0,"why":"Inconsistent means no solution (parallel lines). Consistent systems have at least one solution."},{"t":"Substitution","q":"Solve <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\"><i>y</i> = 2<i>x</i></span><span class=\"m\"><i>x</i> + <i>y</i> = 12</span></span>.","c":["<span class=\"m\">(4, 8)</span>","<span class=\"m\">(8, 4)</span>","<span class=\"m\">(6, 6)</span>","<span class=\"m\">(3, 9)</span>"],"a":0,"why":"Substitute: <span class=\"m\"><i>x</i> + 2<i>x</i> = 12</span>, so <span class=\"m\"><i>x</i> = 4</span> and <span class=\"m\"><i>y</i> = 2(4) = 8</span>."},{"t":"Substitution","q":"Solve <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\"><i>x</i> = <i>y</i> − 3</span><span class=\"m\">2<i>x</i> + 3<i>y</i> = 14</span></span>.","c":["<span class=\"m\">(1, 4)</span>","<span class=\"m\">(4, 1)</span>","<span class=\"m\">(−1, 4)</span>","<span class=\"m\">(2, 5)</span>"],"a":0,"why":"<span class=\"m\">2(<i>y</i> − 3) + 3<i>y</i> = 14</span> gives <span class=\"m\">5<i>y</i> − 6 = 14</span>, so <span class=\"m\"><i>y</i> = 4</span> and <span class=\"m\"><i>x</i> = 4 − 3 = 1</span>."},{"t":"Substitution","q":"For <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\">3<i>x</i> + <i>y</i> = 7</span><span class=\"m\">5<i>x</i> − 2<i>y</i> = 8</span></span>, which variable is easiest to isolate first?","c":["<span class=\"m\"><i>y</i></span> in the first equation","<span class=\"m\"><i>x</i></span> in the second equation","<span class=\"m\"><i>y</i></span> in the second equation","<span class=\"m\"><i>x</i></span> in the first equation"],"a":0,"why":"<span class=\"m\"><i>y</i></span> has a coefficient of 1 there, so <span class=\"m\"><i>y</i> = 7 − 3<i>x</i></span> has no fractions."},{"t":"Substitution","q":"While solving a system by substitution, you end up with <span class=\"m\">−6 = 6</span>. What does that mean?","c":["There is no solution","There are infinitely many solutions","The solution is <span class=\"m\">(−6, 6)</span>","You made a mistake, because every system has a solution"],"a":0,"why":"A false statement means no pair of values can make both equations true. The lines are parallel."},{"t":"Substitution","q":"While solving a system, both variables cancel and you get <span class=\"m\">5 = 5</span>. What does that mean?","c":["Infinitely many solutions","No solution","<span class=\"m\"><i>x</i> = 5</span>","One solution at <span class=\"m\">(5, 5)</span>"],"a":0,"why":"A statement that is always true means the two equations describe the same line."},{"t":"Elimination","q":"Solve <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\"><i>x</i> + <i>y</i> = 9</span><span class=\"m\"><i>x</i> − <i>y</i> = 3</span></span>.","c":["<span class=\"m\">(6, 3)</span>","<span class=\"m\">(3, 6)</span>","<span class=\"m\">(12, −3)</span>","<span class=\"m\">(5, 4)</span>"],"a":0,"why":"Add the equations: <span class=\"m\">2<i>x</i> = 12</span>, so <span class=\"m\"><i>x</i> = 6</span>, then <span class=\"m\">6 + <i>y</i> = 9</span> gives <span class=\"m\"><i>y</i> = 3</span>."},{"t":"Elimination","q":"Solve <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\">4<i>x</i> + 3<i>y</i> = 11</span><span class=\"m\">4<i>x</i> − <i>y</i> = 7</span></span>.","c":["<span class=\"m\">(2, 1)</span>","<span class=\"m\">(1, 2)</span>","<span class=\"m\">(2, −1)</span>","<span class=\"m\">(3, −1)</span>"],"a":0,"why":"Subtract the second from the first: <span class=\"m\">4<i>y</i> = 4</span>, so <span class=\"m\"><i>y</i> = 1</span>. Then <span class=\"m\">4<i>x</i> − 1 = 7</span> gives <span class=\"m\"><i>x</i> = 2</span>."},{"t":"Elimination","q":"To eliminate <span class=\"m\"><i>y</i></span> by adding, what should you multiply the second equation by? <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\">2<i>x</i> + 3<i>y</i> = 5</span><span class=\"m\">5<i>x</i> − <i>y</i> = 4</span></span>","c":["3","−3","2","5"],"a":0,"why":"Times 3 gives <span class=\"m\">15<i>x</i> − 3<i>y</i> = 12</span>. Now <span class=\"m\">3<i>y</i></span> and <span class=\"m\">−3<i>y</i></span> cancel when you add."},{"t":"Elimination","q":"Which multipliers let you <b>add</b> the equations so <span class=\"m\"><i>x</i></span> cancels? <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\">3<i>x</i> + 2<i>y</i> = 7</span><span class=\"m\">2<i>x</i> − 5<i>y</i> = 8</span></span>","c":["First by 2, second by −3","First by 2, second by 3","First by 5, second by 2","First by 3, second by 2"],"a":0,"why":"You get <span class=\"m\">6<i>x</i></span> and <span class=\"m\">−6<i>x</i></span>, which add to 0. Multiplying by 2 and 3 gives <span class=\"m\">6<i>x</i></span> twice, which only cancels if you subtract."},{"t":"Elimination","q":"Why are you allowed to multiply an equation by a number in elimination?","c":["It makes an equivalent equation with the same solutions","It changes the solution, but you undo it at the end","It only works with positive numbers","It turns both equations into the same line"],"a":0,"why":"Multiplying both sides by the same nonzero number keeps the equation balanced, so the system keeps the same solution."},{"t":"Inequalities","q":"Which point is a solution of <span class=\"m\"><i>y</i> &gt; 2<i>x</i> − 1</span>?","c":["<span class=\"m\">(0, 0)</span>","<span class=\"m\">(1, 1)</span>","<span class=\"m\">(2, 2)</span>","<span class=\"m\">(3, 4)</span>"],"a":0,"why":"<span class=\"m\">0 &gt; −1</span> is true. <span class=\"m\">(1, 1)</span> gives <span class=\"m\">1 &gt; 1</span>, which is false: it is on the dashed line."},{"t":"Inequalities","q":"How do you graph <span class=\"m\"><i>y</i> ≤ −<i>x</i> + 4</span>?","c":["Solid line, shade below","Dashed line, shade below","Solid line, shade above","Dashed line, shade above"],"a":0,"why":"<span class=\"m\">≤</span> includes the line, so it is solid, and \"<span class=\"m\"><i>y</i></span> is less than\" means shade below."},{"t":"Inequalities","q":"Which inequality has a dashed boundary and is shaded above the line?","c":["<span class=\"m\"><i>y</i> &gt; 3<i>x</i> + 1</span>","<span class=\"m\"><i>y</i> ≥ 3<i>x</i> + 1</span>","<span class=\"m\"><i>y</i> &lt; 3<i>x</i> + 1</span>","<span class=\"m\"><i>y</i> ≤ 3<i>x</i> + 1</span>"],"a":0,"why":"Strict symbols (<span class=\"m\">&lt;</span>, <span class=\"m\">&gt;</span>) use a dashed line, and <span class=\"m\"><i>y</i> &gt;</span> shades above."},{"t":"Inequalities","q":"Solve <span class=\"m\">−2<i>y</i> &lt; 4<i>x</i> − 6</span> for <span class=\"m\"><i>y</i></span>.","c":["<span class=\"m\"><i>y</i> &gt; −2<i>x</i> + 3</span>","<span class=\"m\"><i>y</i> &lt; −2<i>x</i> + 3</span>","<span class=\"m\"><i>y</i> &gt; 2<i>x</i> − 3</span>","<span class=\"m\"><i>y</i> &lt; −2<i>x</i> − 3</span>"],"a":0,"why":"Divide every term by −2 and flip the symbol: <span class=\"m\"><i>y</i> &gt; −2<i>x</i> + 3</span>."},{"t":"Inequalities","q":"What does the graph of <span class=\"m\"><i>x</i> ≥ −2</span> look like?","c":["A solid vertical line at <span class=\"m\"><i>x</i> = −2</span>, shaded right","A solid horizontal line at <span class=\"m\"><i>y</i> = −2</span>, shaded above","A dashed vertical line at <span class=\"m\"><i>x</i> = −2</span>, shaded right","A solid vertical line at <span class=\"m\"><i>x</i> = −2</span>, shaded left"],"a":0,"why":"<span class=\"m\"><i>x</i> = −2</span> is a vertical line. <span class=\"m\">≥</span> makes it solid, and bigger x-values are to the right."},{"t":"Systems of inequalities","q":"Which point is a solution of <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\"><i>y</i> ≥ <i>x</i></span><span class=\"m\"><i>y</i> &lt; 4</span></span>?","c":["<span class=\"m\">(2, 3)</span>","<span class=\"m\">(5, 3)</span>","<span class=\"m\">(1, 4)</span>","<span class=\"m\">(3, 2)</span>"],"a":0,"why":"<span class=\"m\">3 ≥ 2</span> and <span class=\"m\">3 &lt; 4</span> are both true. <span class=\"m\">(1, 4)</span> fails because <span class=\"m\">4 &lt; 4</span> is false."},{"t":"Systems of inequalities","q":"What is the solution of a system of linear inequalities?","c":["The region where all the shadings overlap","Every point shaded by at least one inequality","Only the point where the boundary lines cross","The boundary lines themselves"],"a":0,"why":"A solution has to make every inequality true, so it must be in every shaded region at once."},{"t":"Systems of inequalities","q":"How many solutions does <span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\"><i>y</i> &gt; <i>x</i> + 2</span><span class=\"m\"><i>y</i> &lt; <i>x</i> − 1</span></span> have?","c":["None","Infinitely many, in a strip between the lines","Only the point where the lines cross","Every point on the plane"],"a":0,"why":"The lines are parallel (both slope 1). One inequality shades above the higher line and the other below the lower line, so the shadings never overlap."},{"t":"Word problems","q":"Adult movie tickets cost $12 and child tickets cost $7. A family spends $45 on 5 tickets. How many adult tickets did they buy?","c":["2","3","4","1"],"a":0,"why":"<span class=\"m\"><i>a</i> + <i>c</i> = 5</span> and <span class=\"m\">12<i>a</i> + 7<i>c</i> = 45</span>. Substituting <span class=\"m\"><i>c</i> = 5 − <i>a</i></span> gives <span class=\"m\">5<i>a</i> + 35 = 45</span>, so <span class=\"m\"><i>a</i> = 2</span> (and 3 child tickets)."},{"t":"Word problems","q":"A jar has 20 nickels and dimes worth $1.40. How many dimes are there?","c":["8","12","14","6"],"a":0,"why":"<span class=\"m\"><i>n</i> + <i>d</i> = 20</span> and <span class=\"m\">5<i>n</i> + 10<i>d</i> = 140</span> (in cents). That gives <span class=\"m\"><i>n</i> = 12</span> and <span class=\"m\"><i>d</i> = 8</span>: 60¢ + 80¢ = $1.40."},{"t":"Word problems","q":"Plan A costs $25 plus $15 a month. Plan B costs $5 plus $20 a month. After how many months do they cost the same?","c":["4","2","5","6"],"a":0,"why":"<span class=\"m\">25 + 15<i>x</i> = 5 + 20<i>x</i></span> gives <span class=\"m\">20 = 5<i>x</i></span>, so <span class=\"m\"><i>x</i> = 4</span> months ($85 each)."},{"t":"Word problems","q":"You have at most $40 to buy shirts ($8 each, <span class=\"m\"><i>x</i></span>) and hats ($5 each, <span class=\"m\"><i>y</i></span>), and you want at least 6 items. Which system fits?","c":["<span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\">8<i>x</i> + 5<i>y</i> ≤ 40</span><span class=\"m\"><i>x</i> + <i>y</i> ≥ 6</span></span>","<span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\">8<i>x</i> + 5<i>y</i> ≥ 40</span><span class=\"m\"><i>x</i> + <i>y</i> ≤ 6</span></span>","<span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\">8<i>x</i> + 5<i>y</i> &lt; 40</span><span class=\"m\"><i>x</i> + <i>y</i> &gt; 6</span></span>","<span style=\"display:inline-flex;flex-direction:column;border-left:2px solid currentColor;padding:1px 0 1px 9px;margin:3px 4px;vertical-align:middle;line-height:1.55\"><span class=\"m\">5<i>x</i> + 8<i>y</i> ≤ 40</span><span class=\"m\"><i>x</i> + <i>y</i> ≥ 6</span></span>"],"a":0,"why":"\"At most\" means <span class=\"m\">≤</span> and \"at least\" means <span class=\"m\">≥</span>. Shirts are $8, so the 8 goes with <span class=\"m\"><i>x</i></span>."}],"vocab":[["System of linear equations","Two or more linear equations that use the same variables."],["Solution of a system","An ordered pair that makes every equation in the system true; where the lines cross."],["Consistent system","A system with at least one solution."],["Inconsistent system","A system with no solution: the lines are parallel."],["Independent system","A consistent system with exactly one solution: the lines cross once."],["Dependent system","A consistent system with infinitely many solutions: both equations are the same line."],["Substitution method","Solve one equation for a variable, then put that expression into the other equation."],["Elimination method","Add or subtract the equations (after multiplying if needed) so one variable cancels."],["Equivalent systems","Systems that have the same solutions, like the ones you get by multiplying an equation by a nonzero number."],["Linear inequality in two variables","An inequality like <span class=\"m\"><i>y</i> &lt; <i>mx</i> + <i>b</i></span> or <span class=\"m\"><i>Ax</i> + <i>By</i> ≥ <i>C</i></span>."],["Solution of an inequality in two variables","An ordered pair that makes the inequality true."],["Boundary line","The line you get by replacing the inequality symbol with <span class=\"m\">=</span>. Dashed for <span class=\"m\">&lt;</span> and <span class=\"m\">&gt;</span>, solid for <span class=\"m\">≤</span> and <span class=\"m\">≥</span>."],["Half-plane","The region on one side of a boundary line; the shaded part of an inequality graph."],["Test point","A point not on the boundary (often <span class=\"m\">(0, 0)</span>) used to decide which side to shade."],["System of linear inequalities","Two or more linear inequalities that use the same variables."],["Solution of a system of inequalities","Every point in the region where all the shaded half-planes overlap."]]};
(function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = { get(k, d) { try { const v = localStorage.getItem('cbstudy:' + DATA.id + ':' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                  set(k, v) { try { localStorage.setItem('cbstudy:' + DATA.id + ':' + k, JSON.stringify(v)); } catch (e) {} } };
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  $('kick').textContent = DATA.kick; $('title').textContent = DATA.title; $('lede').innerHTML = DATA.lede; $('src').innerHTML = DATA.src || '';
  document.title = DATA.title + ' · ' + DATA.cls;

  // tabs
  const TABS = [['guide', 'Study guide', ''], ['quiz', 'Practice quiz', DATA.quiz.length], ['vocab', 'Vocab', DATA.vocab.length]];
  $('tabs').innerHTML = TABS.map(([k, l, n]) => `<button data-tab="${k}">${l}${n ? `<b>${n}</b>` : ''}</button>`).join('');
  function show(k) {
    TABS.forEach(([t]) => { $('p-' + t).hidden = t !== k; });
    document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === k));
  }
  $('tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) { show(b.dataset.tab); window.scrollTo({ top: 0, behavior: 'smooth' }); } };
  show('guide');

  // study guide
