<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rational Functions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@500&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" media="print" onload="this.media='all'">
<style>
:root {
  --bg: #f7f6fa; --card: #ffffff; --ink: #19161f; --mu: #625b70; --mu2: #8b8499; --ln: #e7e3ee; --soft: #f1eef6;
  --ac: #6a46d6; --acs: #efeafd; --pk: #c23b7a; --ok: #157a4a; --oks: #e6f5ed; --bad: #b8304f; --bads: #fcebef;
  --sans: Geist, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --math: "STIX Two Text", "Cambria Math", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d0b12; --card: #16131d; --ink: #f1eef5; --mu: #a39cb2; --mu2: #7b748a; --ln: #2a2533; --soft: #1e1a27;
    --ac: #a78bfa; --acs: #241d38; --pk: #f07ab3; --ok: #5fd39b; --oks: #12291e; --bad: #ff8aa5; --bads: #2e1620; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { font: 16px/1.6 var(--sans); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 80px; }
.kick { font: 500 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ac); }
h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.08; letter-spacing: -.035em; font-weight: 650; margin: 10px 0 12px; }
.lede { color: var(--mu); font-size: 17px; max-width: 640px; }
.src { margin-top: 10px; font-size: 13px; color: var(--mu2); }
.tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; margin: 24px -20px 22px; padding: 10px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--ln); overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: none; border: 0; background: transparent; padding: 8px 14px; border-radius: 999px; font-weight: 550; font-size: 14.5px; color: var(--mu); cursor: pointer; }
.tabs button:hover { color: var(--ink); background: var(--soft); }
.tabs button.on { background: var(--ink); color: var(--bg); }
.tabs b { font-weight: 600; opacity: .6; margin-left: 4px; }
.pane[hidden] { display: none; }

/* study guide */
.toc { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.toc a { font-size: 13.5px; text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--ln); padding: 5px 12px; border-radius: 999px; }
.toc a:hover { border-color: var(--ac); }
.sec { background: var(--card); border: 1px solid var(--ln); border-radius: 18px; padding: 22px 24px; margin-bottom: 14px; scroll-margin-top: 70px; }
.sec h2 { font-size: 21px; letter-spacing: -.02em; font-weight: 650; margin-bottom: 10px; display: flex; gap: 10px; align-items: baseline; }
.sec h2 .n { font: 500 12px var(--mono); color: var(--ac); letter-spacing: .08em; }
.sec p { margin: 8px 0; }
.sec ul { margin: 8px 0 8px 20px; }
.sec li { margin: 5px 0; }
.sec li::marker { color: var(--ac); }
.box { margin: 12px 0; padding: 12px 14px; border-radius: 12px; background: var(--soft); }
.box.key { background: var(--acs); border-left: 3px solid var(--ac); }
.box.warn { background: var(--bads); border-left: 3px solid var(--bad); }
.box b:first-child { display: block; font-size: 12px; font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mu); margin-bottom: 4px; font-weight: 500; }
table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 14.5px; }
th, td { border: 1px solid var(--ln); padding: 7px 10px; text-align: left; vertical-align: top; }
th { background: var(--soft); font-weight: 600; }
details.ex { margin: 10px 0; border: 1px solid var(--ln); border-radius: 12px; overflow: hidden; }
details.ex summary { cursor: pointer; padding: 11px 14px; font-weight: 550; list-style: none; display: flex; gap: 10px; align-items: baseline; }
details.ex summary::-webkit-details-marker { display: none; }
details.ex summary::before { content: "Example"; font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--pk); flex: none; }
details.ex summary::after { content: "Show steps"; margin-left: auto; font-size: 12.5px; color: var(--ac); flex: none; }
details.ex[open] summary::after { content: "Hide"; }
details.ex ol { margin: 0; padding: 4px 16px 12px 36px; }
details.ex li { margin: 6px 0; }
details.ex .ans { padding: 10px 16px 14px; border-top: 1px dashed var(--ln); font-weight: 600; }
.m { font-family: var(--math); font-size: 1.1em; white-space: nowrap; }
.fig { display: block; width: 100%; max-width: 460px; margin: 14px auto 6px; color: var(--mu); }
.fig text { font: 12.5px var(--sans); fill: var(--ink); }
.fig .ac { stroke: var(--ac); }
.fig .acf { fill: var(--ac); }
.figcap { text-align: center; font-size: 13px; color: var(--mu); margin-bottom: 8px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.m i { font-style: italic; }

/* quiz */
.qstart, .qcard, .qend { background: var(--card); border: 1px solid var(--ln); border-radius: 20px; padding: 24px; }
.qstart h2, .qend h2 { font-size: 24px; letter-spacing: -.025em; font-weight: 650; margin-bottom: 6px; }
.sub { color: var(--mu); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.chips button { border: 1px solid var(--ln); background: var(--card); padding: 6px 12px; border-radius: 999px; font-size: 13.5px; cursor: pointer; }
.chips button.on { background: var(--acs); border-color: var(--ac); color: var(--ac); font-weight: 600; }
.btn { border: 0; cursor: pointer; padding: 11px 20px; border-radius: 999px; font-weight: 600; font-size: 15px; background: var(--soft); }
.btn.pri { background: var(--ink); color: var(--bg); }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
.qtop { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 13.5px; color: var(--mu); }
.qtop .t { font: 500 11.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ac); background: var(--acs); padding: 3px 9px; border-radius: 999px; }
.bar { height: 4px; border-radius: 4px; background: var(--soft); overflow: hidden; margin-bottom: 18px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--ac), var(--pk)); transition: width .4s; }
.qq { font-size: 18.5px; line-height: 1.5; font-weight: 500; margin-bottom: 16px; }
.opts { display: grid; gap: 9px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; border: 1.5px solid var(--ln); background: var(--card); padding: 12px 14px; border-radius: 14px; cursor: pointer; font-size: 15.5px; line-height: 1.45; transition: border-color .15s, background-color .15s; }
.opt:hover:not(:disabled) { border-color: var(--ac); }
.opt .l { flex: none; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font: 600 12px var(--mono); background: var(--soft); color: var(--mu); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--oks); }
.opt.right .l { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bads); }
.opt.wrong .l { background: var(--bad); color: #fff; }
.why { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--soft); font-size: 15px; }
.why b { color: var(--ok); }
.why.no b { color: var(--bad); }
.big { font-size: 54px; font-weight: 650; letter-spacing: -.04em; line-height: 1; margin: 6px 0 4px; background: linear-gradient(100deg, var(--ac), var(--pk)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tbars { display: grid; gap: 10px; margin: 18px 0; }
.tb { display: grid; grid-template-columns: minmax(120px, 1fr) 2fr 48px; gap: 12px; align-items: center; font-size: 14px; }
.tb .tr { height: 8px; border-radius: 8px; background: var(--soft); overflow: hidden; }
.tb .tr i { display: block; height: 100%; background: var(--ac); }
.tb .p { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.miss { margin-top: 18px; display: grid; gap: 10px; }
.miss > div { border: 1px solid var(--ln); border-radius: 14px; padding: 12px 14px; font-size: 14.5px; }
.miss .a { color: var(--ok); font-weight: 600; margin-top: 4px; }
.miss .w { color: var(--mu); margin-top: 4px; }
.best { font-size: 13.5px; color: var(--mu2); margin-top: 8px; }

/* vocab */
.vtools { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.vtools input { flex: 1; min-width: 180px; font: inherit; font-size: 15px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--ln); background: var(--card); color: var(--ink); outline: none; }
.vtools input:focus { border-color: var(--ac); }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.vc { perspective: 900px; height: 150px; cursor: pointer; }
.vc > div { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.2,.7,.2,1); }
.vc.flip > div { transform: rotateY(180deg); }
.vc .f, .vc .b { position: absolute; inset: 0; border-radius: 16px; padding: 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; text-align: center; border: 1px solid var(--ln); background: var(--card); overflow: auto; }
.vc .f { font-weight: 650; font-size: 18px; letter-spacing: -.01em; }
.vc .b { transform: rotateY(180deg); font-size: 14px; color: var(--mu); background: var(--acs); }
.foot { margin-top: 34px; font-size: 13px; color: var(--mu2); text-align: center; }
@media (max-width: 560px) { .sec { padding: 18px; } .qstart, .qcard, .qend { padding: 18px; } .qq { font-size: 17px; } .tb { grid-template-columns: 1fr 1fr 44px; } }
@media print { .tabs, .row, .chips { display: none !important; } .pane[hidden] { display: block !important; } .sec, .qcard { break-inside: avoid; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="kick" id="kick"></div>
  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>
  <p class="src" id="src"></p>
  <nav class="tabs" id="tabs"></nav>
  <section class="pane" id="p-guide"></section>
  <section class="pane" id="p-quiz" hidden></section>
  <section class="pane" id="p-vocab" hidden></section>
  <p class="foot">Made for Classboard. Check anything you're unsure about with your teacher or your class notes.</p>
</div>
<script>
const DATA = {"id":"alg2-t4","cls":"Algebra 2","kick":"Algebra 2 · Topic 4 · Lessons 4-1 to 4-5","title":"Rational Functions","lede":"Everything for Topic 4: inverse variation and the reciprocal function, graphing rational functions, multiplying, dividing, adding and subtracting rational expressions, and solving rational equations. Study guide with worked examples, a practice quiz and the vocab.","src":"Matches Topic 4 of enVision Algebra 2 (2018), the book Issaquah School District uses for Algebra 2. All problems here are original practice.","guide":[{"title":"Inverse variation (4-1)","body":"\n      <p>Two quantities <b>vary inversely</b> when their <b>product</b> stays the same: <span class=\"m\">xy = <i>k</i></span>, or <span class=\"m\"><i>y</i> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>k</i></span><span style=\"padding:0 3px\"><i>x</i></span></span></span>, with <span class=\"m\"><i>k</i> ≠ 0</span>. As one doubles, the other is cut in half.</p>\n      <table><tr><th></th><th>Direct variation</th><th>Inverse variation</th></tr>\n      <tr><th>Equation</th><td><span class=\"m\"><i>y</i> = kx</span></td><td><span class=\"m\"><i>y</i> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>k</i></span><span style=\"padding:0 3px\"><i>x</i></span></span></span></td></tr>\n      <tr><th>What stays constant</th><td>the quotient <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>y</i></span><span style=\"padding:0 3px\"><i>x</i></span></span></span></td><td>the product <span class=\"m\">xy</span></td></tr>\n      <tr><th>As x gets bigger</th><td>y gets bigger (if k is positive)</td><td>y gets smaller (if k is positive)</td></tr></table>\n      <div class=\"box key\"><b>Find k first</b>Plug one known pair into <span class=\"m\"><i>k</i> = xy</span>, write the equation, then use it.</div>","examples":[{"q":"y varies inversely with x, and <span class=\"m\"><i>y</i> = 6</span> when <span class=\"m\"><i>x</i> = 4</span>. Find y when <span class=\"m\"><i>x</i> = 3</span>.","steps":["Find the constant: <span class=\"m\"><i>k</i> = xy = 4 · 6 = 24</span>.","Write the equation: <span class=\"m\"><i>y</i> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">24</span><span style=\"padding:0 3px\"><i>x</i></span></span></span>.","Substitute <span class=\"m\"><i>x</i> = 3</span>: <span class=\"m\"><i>y</i> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">24</span><span style=\"padding:0 3px\">3</span></span> = 8</span>."],"a":"<span class=\"m\"><i>y</i> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">24</span><span style=\"padding:0 3px\"><i>x</i></span></span></span>, so <span class=\"m\"><i>y</i> = 8</span> when <span class=\"m\"><i>x</i> = 3</span>."},{"q":"Does the table show direct variation, inverse variation, or neither? x: 2, 3, 6 · y: 12, 8, 4","steps":["Check products: <span class=\"m\">2 · 12 = 24</span>, <span class=\"m\">3 · 8 = 24</span>, <span class=\"m\">6 · 4 = 24</span>.","The product is always 24, so it is inverse variation. (The quotients 6, 2.67, 0.67 are not constant, so it is not direct.)"],"a":"Inverse variation: <span class=\"m\"><i>y</i> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">24</span><span style=\"padding:0 3px\"><i>x</i></span></span></span>."}]},{"title":"The reciprocal function and its translations (4-1)","body":"\n      <p>The parent function <span class=\"m\"><i>f</i>(<i>x</i>) = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\"><i>x</i></span></span></span> has two branches that never touch the lines <span class=\"m\"><i>x</i> = 0</span> and <span class=\"m\"><i>y</i> = 0</span>. Those lines are its <b>asymptotes</b>.</p>\n      <ul><li>Domain: all real numbers except 0. Range: all real numbers except 0.</li>\n      <li>Branches in quadrants I and III.</li></ul>\n      <div class=\"box key\"><b>Translated form</b><span class=\"m\"><i>g</i>(<i>x</i>) = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>a</i></span><span style=\"padding:0 3px\"><i>x</i> − <i>h</i></span></span> + <i>k</i></span>: vertical asymptote <span class=\"m\"><i>x</i> = <i>h</i></span>, horizontal asymptote <span class=\"m\"><i>y</i> = <i>k</i></span>. Domain <span class=\"m\"><i>x</i> ≠ <i>h</i></span>, range <span class=\"m\"><i>y</i> ≠ <i>k</i></span>.</div>\n      <ul><li><span class=\"m\">|<i>a</i>| &gt; 1</span> stretches the branches away from the asymptotes; <span class=\"m\">0 &lt; |<i>a</i>| &lt; 1</span> pulls them closer.</li>\n      <li><span class=\"m\"><i>a</i> &lt; 0</span> reflects the graph, so the branches are top-left and bottom-right of where the asymptotes cross.</li>\n      <li>Watch the sign: <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\"><i>x</i> + 4</span></span></span> has its asymptote at <span class=\"m\"><i>x</i> = −4</span>.</li></ul>","examples":[{"q":"Graph <span class=\"m\"><i>g</i>(<i>x</i>) = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">2</span><span style=\"padding:0 3px\"><i>x</i> − 3</span></span> + 1</span>.","steps":["Asymptotes: <span class=\"m\"><i>x</i> = 3</span> (from <span class=\"m\"><i>x</i> − 3</span>) and <span class=\"m\"><i>y</i> = 1</span> (the added 1).","Pick x-values on both sides of 3: <span class=\"m\"><i>g</i>(4) = 2/1 + 1 = 3</span>, <span class=\"m\"><i>g</i>(5) = 2/2 + 1 = 2</span>, <span class=\"m\"><i>g</i>(2) = 2/(−1) + 1 = −1</span>, <span class=\"m\"><i>g</i>(1) = 2/(−2) + 1 = 0</span>.","a = 2 is positive, so the branches sit top-right and bottom-left of the asymptotes.","<div style=\"display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap\"><div style=\"flex:1;min-width:220px\">Domain <span class=\"m\"><i>x</i> ≠ 3</span>, range <span class=\"m\"><i>y</i> ≠ 1</span>.</div><svg class=\"fig\" viewBox=\"0 0 272 272\" style=\"width:260px;\" role=\"img\" aria-label=\"Graph of g of x equals 2 over x minus 3, plus 1, with asymptotes x = 3 and y = 1\"><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"256\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"36\" y1=\"16\" x2=\"36\" y2=\"256\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"56\" y1=\"16\" x2=\"56\" y2=\"256\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"76\" y1=\"16\" x2=\"76\" y2=\"256\" stroke=\"currentColor\" stroke-opacity=\"0.7\" stroke-width=\"1.4\"/><line x1=\"96\" y1=\"16\" x2=\"96\" y2=\"256\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"116\" y1=\"16\" x2=\"116\" y2=\"256\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"136\" y1=\"16\" x2=\"136\" y2=\"256\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"156\" y1=\"16\" x2=\"156\" y2=\"256\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"176\" y1=\"16\" x2=\"176\" y2=\"256\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"196\" y1=\"16\" x2=\"196\" y2=\"256\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"216\" y1=\"16\" x2=\"216\" y2=\"256\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"236\" y1=\"16\" x2=\"236\" y2=\"256\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"256\" y1=\"16\" x2=\"256\" y2=\"256\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"16\" y1=\"256\" x2=\"256\" y2=\"256\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"16\" y1=\"236\" x2=\"256\" y2=\"236\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"16\" y1=\"216\" x2=\"256\" y2=\"216\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"16\" y1=\"196\" x2=\"256\" y2=\"196\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"16\" y1=\"176\" x2=\"256\" y2=\"176\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"16\" y1=\"156\" x2=\"256\" y2=\"156\" stroke=\"currentColor\" stroke-opacity=\"0.7\" stroke-width=\"1.4\"/><line x1=\"16\" y1=\"136\" x2=\"256\" y2=\"136\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"16\" y1=\"116\" x2=\"256\" y2=\"116\" stroke=\"currentColor\" stroke-opacity=\"0.16\" strok ll:var(--ink,#17141f)\">(1, 0)</text></svg></div>"],"a":"Vertical asymptote <span class=\"m\"><i>x</i> = 3</span>, horizontal asymptote <span class=\"m\"><i>y</i> = 1</span>, branches through (4, 3) and (2, −1)."}]},{"title":"Graphing rational functions (4-2)","body":"\n      <p>A <b>rational function</b> is a fraction of two polynomials, <span class=\"m\"><i>f</i>(<i>x</i>) = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>p</i>(<i>x</i>)</span><span style=\"padding:0 3px\"><i>q</i>(<i>x</i>)</span></span></span>. Always <b>factor first</b>.</p>\n      <ol style=\"margin:8px 0 8px 22px\"><li><b>Holes</b>: a factor that cancels from the top and bottom makes a hole (a single missing point). Find its y-value by plugging into the simplified function.</li>\n      <li><b>Vertical asymptotes</b>: zeros of the denominator that are left after canceling.</li>\n      <li><b>Horizontal asymptote</b>: compare degrees (below).</li>\n      <li><b>Intercepts</b>: x-intercepts are zeros of the simplified numerator; the y-intercept is <span class=\"m\"><i>f</i>(0)</span>.</li></ol>\n      <table><tr><th>Degree of top vs. bottom</th><th>Horizontal asymptote</th><th>Example</th></tr>\n      <tr><td>Top smaller</td><td><span class=\"m\"><i>y</i> = 0</span></td><td><span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">3<i>x</i></span><span style=\"padding:0 3px\"><i>x</i><sup>2</sup> + 1</span></span></span> → <span class=\"m\"><i>y</i> = 0</span></td></tr>\n      <tr><td>Same degree</td><td><span class=\"m\"><i>y</i> =</span> (leading coefficient ÷ leading coefficient)</td><td><span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">6<i>x</i><sup>2</sup></span><span style=\"padding:0 3px\">2<i>x</i><sup>2</sup> − 5</span></span></span> → <span class=\"m\"><i>y</i> = 3</span></td></tr>\n      <tr><td>Top bigger</td><td>none (if it's bigger by exactly 1, the graph follows a slanted line instead)</td><td><span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i><sup>2</sup></span><span style=\"padding:0 3px\"><i>x</i> − 1</span></span></span></td></tr></table>\n      <div class=\"box warn\"><b>Graphs can cross a horizontal asymptote</b>The horizontal asymptote only describes the ends of the graph. Vertical asymptotes are never crossed.</div>","examples":[{"q":"Find the asymptotes and intercepts of <span class=\"m\"><i>f</i>(<i>x</i>) = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">2<i>x</i> − 4</span><span style=\"padding:0 3px\"><i>x</i> + 1</span></span></span>, then sketch it.","steps":["Nothing cancels. Vertical asymptote: <span class=\"m\"><i>x</i> + 1 = 0</span>, so <span class=\"m\"><i>x</i> = −1</span>.","Same degree on top and bottom, so <span class=\"m\"><i>y</i> = 2/1 = 2</span> is the horizontal asymptote.","x-intercept: <span class=\"m\">2<i>x</i> − 4 = 0</span> gives <span class=\"m\"><i>x</i> = 2</span>. y-intercept: <span class=\"m\"><i>f</i>(0) = −4/1 = −4</span>.","<div style=\"display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap\"><div style=\"flex:1;min-width:220px\">Plot the intercepts and a point on the other side of <span class=\"m\"><i>x</i> = −1</span> (like <span class=\"m\"><i>f</i>(−2) = −8/(−1) = 8</span>).</div><svg class=\"fig\" viewBox=\"0 0 272 352 at's left.</li>\n      <li><b>Divide</b>: multiply by the reciprocal of the second fraction, then do the same thing.</li>\n      <li>State the <b>excluded values</b>: every x that made any original denominator 0. When dividing, also exclude zeros of the numerator of the fraction you flipped.</li></ul>\n      <div class=\"box warn\"><b>You can only cancel factors</b><span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i> + 3</span><span style=\"padding:0 3px\"><i>x</i></span></span></span> is not <span class=\"m\">3</span>. The x is part of a sum on top, not a factor.</div>","examples":[{"q":"Multiply <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i><sup>2</sup> + 3<i>x</i></span><span style=\"padding:0 3px\"><i>x</i><sup>2</sup> − 4</span></span> · <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i> − 2</span><span style=\"padding:0 3px\"><i>x</i> + 3</span></span></span>.","steps":["Factor: <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i>(<i>x</i> + 3)</span><span style=\"padding:0 3px\">(<i>x</i> − 2)(<i>x</i> + 2)</span></span> · <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i> − 2</span><span style=\"padding:0 3px\"><i>x</i> + 3</span></span></span>.","Cancel <span class=\"m\">(<i>x</i> + 3)</span> and <span class=\"m\">(<i>x</i> − 2)</span>.","Excluded values come from the original bottoms: <span class=\"m\"><i>x</i> ≠ 2, −2, −3</span>."],"a":"<span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i></span><span style=\"padding:0 3px\"><i>x</i> + 2</span></span></span>, with <span class=\"m\"><i>x</i> ≠ 2, −2, −3</span>."},{"q":"Divide <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i><sup>2</sup> − 1</span><span style=\"padding:0 3px\">2<i>x</i></span></span> ÷ <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i> + 1</span><span style=\"padding:0 3px\">4<i>x</i><sup>2</sup></span></span></span>.","steps":["Flip the second fraction and multiply: <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">(<i>x</i> − 1)(<i>x</i> + 1)</span><span style=\"padding:0 3px\">2<i>x</i></span></span> · <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">4<i>x</i><sup>2</sup></span><span style=\"padding:0 3px\"><i>x</i> + 1</span></span></span>.","Cancel <span class=\"m\">(<i>x</i> + 1)</span>, and <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">4<i>x</i><sup>2</sup></span><span style=\"padding:0 3px\">2<i>x</i></span></span> = 2<i>x</i></span>.","Excluded: <span class=\"m\"><i>x</i> ≠ 0</span> (bottoms) and <span class=\"m\"><i>x</i> ≠ −1</span> (the top of the flipped fraction)."],"a":"<span class=\"m\">2<i>x</i>(<i>x</i> − 1) = 2<i>x</i><sup>2</sup> − 2<i>x</i></span>, with <span class=\"m\"><i>x</i> ≠ 0, −1</span>."}]},{"title":"Adding and subtracting rational expressions (4-4)","body":"\n      <ul><li>Factor each denominator and find the <b>least common denominator (LCD)</b>: every factor, used the most times it appears in any one denominator.</li>\n      <li>Rewrite each fraction over the LCD, combine the numerators, then simplify.</li>\n      <li>A <b>complex fraction</b> has fractions inside its numerator or denominator. Combine the top and the bottom into single fractions, then divide (or multiply everything by the LCD of all the little fractions).</li></ul>\n      <div class=\"box warn\"><b>Subtracting</b>Put the second numerator in parentheses so the minus sign hits every term: <span class=\"m\"><i>x</i> − (<i>x</i> + 3) = −3</span>, not <span class=\"m\"><i>x</i> − <i>x</i> + 3</span>.</div>","examples":[{"q":"Add <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">3</span><span style=\"padding:0 3px\"><i>x</i> − 2</span></span> + <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">2</span><span style=\"padding:0 3px\"><i>x</i> + 1</span></span></span>.","steps":["LCD: <span class=\"m\">(<i>x</i> − 2)(<i>x</i> + 1)</span>.","Rewrite: <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">3(<i>x</i> + 1)</span><span style=\"padding:0 3px\">(<i>x</i> − 2)(<i>x</i> + 1)</span></span> + <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">2(<i>x</i> − 2)</span><span style=\"padding:0 3px\">(<i>x</i> − 2)(<i>x</i> + 1)</span></span></span>.","Combine the tops: <span class=\"m\">3<i>x</i> + 3 + 2<i>x</i> − 4 = 5<i>x</i> − 1</span>."],"a":"<span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">5<i>x</i> − 1</span><span style=\"padding:0 3px\">(<i>x</i> − 2)(<i>x</i> + 1)</span></span></span>"},{"q":"Subtract <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i></span><span style=\"padding:0 3px\"><i>x</i><sup>2</sup> − 9</span></span> − <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\"><i>x</i> − 3</span></span></span>.","steps":["Factor: <span class=\"m\"><i>x</i><sup>2</sup> − 9 = (<i>x</i> − 3)(<i>x</i> + 3)</span>, so the LCD is <span class=\"m\">(<i>x</i> − 3)(<i>x</i> + 3)</span>.","Rewrite the second fraction: <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i> + 3</span><span style=\"padding:0 3px\">(<i>x</i> − 3)(<i>x</i> + 3)</span></span></span>.","Subtract the tops with parentheses: <span class=\"m\"><i>x</i> − (<i>x</i> + 3) = −3</span>."],"a":"<span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">−3</span><span style=\"padding:0 3px\">(<i>x</i> − 3)(<i>x</i> + 3)</span></span></span>"},{"q":"Simplify the complex fraction <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1 + 1/x</span><span style=\"padding:0 3px\">1 − 1/x<sup>2</sup></span></span></span>.","steps":["Top: <span class=\"m\">1 + <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\"><i>x</i></span></span> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i> + 1</span><span style=\"padding:0 3px\"><i>x</i></span></span></span>. Bottom: <span class=\"m\">1 − <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\"><i>x</i><sup>2</sup></span></span> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i><sup>2</sup> − 1</span><span style=\"padding:0 3px\"><i>x</i><sup>2</sup></span></span></span>.","Divide by multiplying by the reciprocal: <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i> + 1</span><span style=\"padding:0 3px\"><i>x</i></span></span> · <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i><sup>2</sup></span><span style=\"padding:0 3px\">(<i>x</i> − 1)(<i>x</i> + 1)</span></span></span>.","Cancel <span class=\"m\">(<i>x</i> + 1)</span> and one <span class=\"m\"><i>x</i></span>."],"a":"<span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i></span><span style=\"padding:0 3px\"><i>x</i> − 1</span></span></span>, with <span class=\"m\"><i>x</i> ≠ 0, 1, −1</span>."}]},{"title":"Solving rational equations (4-5)","body":"\n      <ol style=\"margin:8px 0 8px 22px\"><li>Factor the denominators and note the values x can't be.</li>\n      <li>Multiply <b>every term</b> on both sides by the LCD. The fractions disappear.</li>\n      <li>Solve the equation that's left.</li>\n      <li><b>Check</b> each answer in the original equation. An answer that makes a denominator 0 is an <b>extraneous solution</b> and gets thrown out.</li></ol>\n      <div class=\"box key\"><b>Work problems</b>If a job takes <span class=\"m\"><i>a</i></span> hours, the work rate is <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\"><i>a</i></span></span></span> of the job per hour. Rates add: <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\"><i>a</i></span></span> + <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\"><i>b</i></span></span> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\"><i>t</i></span></span></span>, where <span class=\"m\"><i>t</i></span> is the time working together.</div>","examples":[{"q":"Solve <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i></span><span style=\"padding:0 3px\"><i>x</i> + 1</span></span> + <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">2</span><span style=\"padding:0 3px\"><i>x</i></span></span> = 1</span>.","steps":["LCD <span class=\"m\"><i>x</i>(<i>x</i> + 1)</span>; x can't be 0 or −1.","Multiply every term: <span class=\"m\"><i>x</i><sup>2</sup> + 2(<i>x</i> + 1) = <i>x</i>(<i>x</i> + 1)</span>.","Simplify: <span class=\"m\"><i>x</i><sup>2</sup> + 2<i>x</i> + 2 = <i>x</i><sup>2</sup> + <i>x</i></span>, so <span class=\"m\"><i>x</i> = −2</span>.","Check: <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">−2</span><span style=\"padding:0 3px\">−1</span></span> + <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">2</span><span style=\"padding:0 3px\">−2</span></span> = 2 − 1 = 1</span>. It works."],"a":"<span class=\"m\"><i>x</i> = −2</span>"},{"q":"Solve <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i></span><span style=\"padding:0 3px\"><i>x</i> − 2</span></span> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">2</span><span style=\"padding:0 3px\"><i>x</i> − 2</span></span> + 3</span>.","steps":["x can't be 2.","Multiply by <span class=\"m\">(<i>x</i> − 2)</span>: <span class=\"m\"><i>x</i> = 2 + 3(<i>x</i> − 2)</span>.","Solve: <span class=\"m\"><i>x</i> = 3<i>x</i> − 4</span>, so <span class=\"m\"><i>x</i> = 2</span>.","But <span class=\"m\"><i>x</i> = 2</span> makes the denominators 0, so it is extraneous."],"a":"No solution (x = 2 is extraneous)."},{"q":"Pipe A fills a tank in 6 hours and pipe B fills it in 3 hours. How long do they take together?","steps":["Rates: <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">6</span></span></span> and <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">3</span></span></span> of the tank per hour.","<span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">6</span></span> + <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">3</span></span> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\"><i>t</i></span></span></span>. Multiply by <span class=\"m\">6<i>t</i></span>: <span class=\"m\"><i>t</i> + 2<i>t</i> = 6</span>.","<span class=\"m\">3<i>t</i> = 6</span>, so <span class=\"m\"><i>t</i> = 2</span>."],"a":"2 hours"}]},{"title":"Mistakes to avoid","body":"\n      <ul><li>Mixing up the signs of asymptotes: <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\"><i>x</i> − 5</span></span></span> has <span class=\"m\"><i>x</i> = 5</span>, not <span class=\"m\"><i>x</i> = −5</span>.</li>\n      <li>Calling every zero of the denominator a vertical asymptote. If the factor cancels, it is a hole.</li>\n      <li>Canceling terms instead of factors.</li>\n      <li>Forgetting excluded values, especially the extra one when you divide.</li>\n      <li>Not distributing the minus sign when subtracting fractions.</li>\n      <li>Skipping the check in a rational equation and keeping an extraneous solution.</li></ul>"}],"quiz":[{"t":"Inverse variation","q":"y varies inversely with x, and <span class=\"m\"><i>y</i> = 10</span> when <span class=\"m\"><i>x</i> = 3</span>. What is y when <span class=\"m\"><i>x</i> = 6</span>?","c":["5","20","15","2"],"a":0,"why":"<span class=\"m\"><i>k</i> = 3 · 10 = 30</span>, so <span class=\"m\"><i>y</i> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">30</span><span style=\"padding:0 3px\">6</span></span> = 5</span>. Doubling x cuts y in half."},{"t":"Inverse variation","q":"Which table shows inverse variation?","c":["x: 1, 2, 4 · y: 8, 4, 2","x: 1, 2, 4 · y: 3, 6, 12","x: 1, 2, 4 · y: 8, 6, 2","x: 1, 2, 4 · y: 5, 4, 2"],"a":0,"why":"The product <span class=\"m\">xy</span> is 8 every time. The second table is direct variation (y ÷ x is always 3)."},{"t":"Inverse variation","q":"What are the asymptotes of <span class=\"m\"><i>g</i>(<i>x</i>) = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">3</span><span style=\"padding:0 3px\"><i>x</i> + 4</span></span> − 2</span>?","c":["<span class=\"m\"><i>x</i> = −4</span> and <span class=\"m\"><i>y</i> = −2</span>","<span class=\"m\"><i>x</i> = 4</span> and <span class=\"m\"><i>y</i> = −2</span>","<span class=\"m\"><i>x</i> = −4</span> and <span class=\"m\"><i>y</i> = 2</span>","<span class=\"m\"><i>x</i> = 3</span> and <span class=\"m\"><i>y</i> = −2</span>"],"a":0,"why":"<span class=\"m\"><i>x</i> + 4 = 0</span> gives <span class=\"m\"><i>x</i> = −4</span>; the <span class=\"m\">−2</span> shifts the horizontal asymptote down to <span class=\"m\"><i>y</i> = −2</span>."},{"t":"Inverse variation","q":"What are the domain and range of <span class=\"m\"><i>f</i>(<i>x</i>) = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\"><i>x</i> − 5</span></span> + 1</span>?","c":["Domain <span class=\"m\"><i>x</i> ≠ 5</span>, range <span class=\"m\"><i>y</i> ≠ 1</span>","Domain <span class=\"m\"><i>x</i> ≠ −5</span>, range <span class=\"m\"><i>y</i> ≠ 1</span>","Domain <span class=\"m\"><i>x</i> ≠ 1</span>, range <span class=\"m\"><i>y</i> ≠ 5</span>","All real numbers for both"],"a":0,"why":"The graph never reaches its asymptotes <span class=\"m\"><i>x</i> = 5</span> and <span class=\"m\"><i>y</i> = 1</span>."},{"t":"Inverse variation","q":"How is the graph of <span class=\"m\"><i>g</i>(<i>x</i>) = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">−2</span><span style=\"padding:0 3px\"><i>x</i></span></span></span> different from <span class=\"m\"><i>f</i>(<i>x</i>) = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\"><i>x</i></span></span></span>?","c":["Stretched by a factor of 2 and reflected, so its branches are in quadrants II and IV","Shifted 2 units down","Shifted 2 units left","Compressed by a factor of 2, still in quadrants I and III"],"a":0,"why":"The 2 stretches it and the negative sign reflects it across an axis."},{"t":"Inverse variation","q":"The time t (hours) to drive 120 miles varies inversely with the speed r (mph). What is the constant of variation?","c":["120","<span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">120</span></span></span>","60","2"],"a":0,"why":"Distance = rate × time, so <span class=\"m\">rt = 120</span> and <span class=\"m\"><i>t</i> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">120</span><span style=\"padding:0 3px\"><i>r</i></span></span></span>."},{"t":"Graphing","q":"What are the vertical asymptotes of <span class=\"m\"><i>f</i>(<i>x</i>) = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i> + 1</span><span style=\"padding:0 3px\"><i>x</i><sup>2</sup> − 9</span></span></span>?","c":["<span class=\"m\"><i>x</i> = 3</span> and <span class=\"m\"><i>x</i> = −3</span>","<span class=\"m\"><i>x</i> = 9</span>","<span class=\"m\"><i>x</i> = −1</span>","<span class=\"m\"><i>x</i> = 3</span> only"],"a":0,"why":"<span class=\"m\"><i>x</i><sup>2</sup> − 9 = (<i>x</i> − 3)(<i>x</i> + 3)</span>, and neither factor cancels with the top."},{"t":"Graphing","q":"What is the horizontal asymptote of <span class=\"m\"><i>f</i>(<i>x</i>) = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">6<i>x</i><sup>2</sup> − 1</span><span style=\"padding:0 3px\">2<i>x</i><sup>2</sup> + <i>x</i></span></span></span>?","c":["<span class=\"m\"><i>y</i> = 3</span>","<span class=\"m\"><i>y</i> = 0</span>","<span class=\"m\"><i>y</i> = 6</span>","None"],"a":0,"why":"Same degree on top and bottom, so divide the leading coefficients: <span class=\"m\">6 ÷ 2 = 3</span>."},{"t":"Graphing","q":"What is the horizontal asymptote of <span class=\"m\"><i>f</i>(<i>x</i>) = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">4<i>x</i> + 1</span><span style=\"padding:0 3px\"><i>x</i><sup>2</sup> + 1</span></span></span>?","c":["<span class=\"m\"><i>y</i> = 0</span>","<span class=\"m\"><i>y</i> = 4</span>","<span class=\"m\"><i>y</i> = 1</span>","None"],"a":0,"why":"The bottom has the bigger degree, so the fraction shrinks toward 0 at the ends."},{"t":"Graphing","q":"Where does <span class=\"m\"><i>f</i>(<i>x</i>) = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i><sup>2</sup> − 4</span><span style=\"padding:0 3px\"><i>x</i> − 2</span></span></span> have a hole?","c":["(2, 4)","(2, 0)","(−2, 0)","It has a vertical asymptote at x = 2 instead"],"a":0,"why":"<span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">(<i>x</i> − 2)(<i>x</i> + 2)</span><span style=\"padding:0 3px\"><i>x</i> − 2</span></span> = <i>x</i> + 2</span> when <span class=\"m\"><i>x</i> ≠ 2</span>. Plug 2 into <span class=\"m\"><i>x</i> + 2</span> to get 4."},{"t":"Graphing","q":"What is the x-intercept of <span class=\"m\"><i>f</i>(<i>x</i>) = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i> − 5</span><span style=\"padding:0 3px\"><i>x</i> + 2</span></span></span>?","c":["<span class=\"m\"><i>x</i> = 5</span>","<span class=\"m\"><i>x</i> = −2</span>","<span class=\"m\"><i>x</i> = −<span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">5</span><span style=\"padding:0 3px\">2</span></span></span>","There isn't one"],"a":0,"why":"The fraction is 0 when the top is 0: <span border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\"><i>x</i></span></span></span>."],["Rational function","A function that is a fraction of two polynomials."],["Rational expression","A fraction whose top and bottom are polynomials."],["Asymptote","A line a graph gets closer and closer to at its ends or near a break."],["Vertical asymptote","A vertical line <span class=\"m\"><i>x</i> = <i>a</i></span> where the bottom is 0 after canceling; the graph shoots up or down beside it."],["Horizontal asymptote","A horizontal line <span class=\"m\"><i>y</i> = <i>b</i></span> the graph approaches as <span class=\"m\"><i>x</i></span> goes to <span class=\"m\">±∞</span>."],["Hole (removable discontinuity)","A single missing point where a factor cancels from the top and bottom."],["Excluded value","An x-value that makes a denominator 0, so it can't be used."],["Simplified form","A rational expression with no common factors left on top and bottom."],["Least common denominator (LCD)","The smallest expression every denominator divides into."],["Complex fraction","A fraction with a fraction in its numerator, denominator, or both."],["Rational equation","An equation with one or more rational expressions."],["Extraneous solution","An answer that comes out of the steps but does not work in the original equation."]]};
(function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = { get(k, d) { try { const v = localStorage.getItem('cbstudy:' + DATA.id + ':' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                  set(k, v) { try { localStorage.setItem('cbstudy:' + DATA.id + ':' + k, JSON.stringify(v)); } catch (e) {} } };
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  $('kick').textContent = DATA.kick; $('title').textContent = DATA.title; $('lede').innerHTML = DATA.lede; $('src').innerHTML = DATA.src || '';
  document.title = DATA.title + ' · ' + DATA.cls;

  // tabs
  const TABS = [['guide', 'Study guide', ''], ['quiz', 'Practice quiz', DATA.quiz.length], ['vocab', 'Vocab', DATA.vocab.length]];
  $('tabs').innerHTML = TABS.map(([k, l, n]) => `<button data-tab="${k}">${l}${n ? `<b>${n}</b>` : ''}</button>`).join('');
  function show(k) {
    TABS.forEach(([t]) => { $('p-' + t).hidden = t !== k; });
    document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === k));
  }
  $('tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) { show(b.dataset.tab); window.scrollTo({ top: 0, behavior: 'smooth' }); } };
  show('guide');

  // study guide
  $('p-guide').innerHTML = `<div class="toc">${DATA.guide.map((s, i) => `<a href="#s${i}">${esc(s.title)}</a>`).join('')}</div>` +
    DATA.guide.map((s, i) => `<article class="sec" id="s${i}"><h2><span class="n">${String(i + 1).padStart(2, '0')}</span>${esc(s.title)}</h2>${s.body || ''}
      ${(s.examples || []).map(x => `<details class="ex"><summary>${x.q}</summary><ol>${x.steps.map(st => `<li>${st}</li>`).join('')}</ol><div class="ans">${x.a}</div></details>`).join('')}</article>`).join('');
  $('p-guide').addEventListener('click', e => { const a = e.target.closest('.toc a'); if (!a) return; e.preventDefault(); const el = document.querySelector(a.getAttribute('href')); if (el) el.scrollIntoView({ behavior: 'smooth' }); });

  // practice quiz
  const topics = [...new Set(DATA.quiz.map(q => q.t))];
  let pick = new Set(topics), run = null;
  function qStart() {
    const best = store.get('best', null);
    $('p-quiz').innerHTML = `<div class="qstart"><h2>Practice quiz</h2><p class="sub">${DATA.quiz.length} questions. You'll see why each answer is right as you go, and a breakdown by topic at the end.</p>
      ${topics.length > 1 ? `<div class="chips">${topics.map(t => `<button data-topic="${esc(t)}" class="${pick.has(t) ? 'on' : ''}">${esc(t)}</button>`).join('')}</div>` : ''}
      <div class="row"><button class="btn pri" id="go">Start (${DATA.quiz.filter(q => pick.has(q.t)).length} questions)</button></div>
      ${best ? `<p class="best">Your best: ${best.pct}% on ${new Date(best.at).toLocaleDateString()}</p>` : ''}</div>`;
    $('p-quiz').querySelectorAll('[data-topic]').forEach(b => b.onclick = () => { const t = b.dataset.topic; if (pick.has(t) && pick.size > 1) pick.delete(t); else pick.add(t); qStart(); });
    $('go').onclick = () => begin(DATA.quiz.filter(q => pick.has(q.t)));
  }
  function begin(list) { run = { qs: shuffle(list).map(q => Object.assign({}, q, { order: shuffle(q.c.map((_, i) => i)) })), i: 0, res: [] }; qShow(); }
  function qShow() {
    const q = run.qs[run.i], n = run.qs.length;
    $('p-quiz').innerHTML = `<div class="qcard"><div class="qtop"><span class="t">${esc(q.t)}</span><span>${run.i + 1} of ${n}</span></div>
      <div class="bar"><i style="width:${(run.i / n) * 100}%"></i></div><div class="qq">${q.q}</div>
      <div class="opts">${q.order.map((ci, k) => `<button class="opt" data-ci="${ci}"><span class="l">${'ABCDE'[k]}</span><span>${q.c[ci]}</span></button>`).join('')}</div>
      <div id="why"></div><div class="row"><button class="btn pri" id="next" hidden>${run.i + 1 < n ? 'Next question' : 'See my results'}</button></div></div>`;
    $('p-quiz').querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.ci));
  }
  function answer(ci) {
    const q = run.qs[run.i], ok = ci === q.a;
    if (run.res.length > run.i) return;
    run.res.push({ q, ok, ci });
    $('p-quiz').querySelectorAll('.opt').forEach(b => { b.disabled = true; const c = +b.dataset.ci; if (c === q.a) b.classList.add('right'); else if (c === ci) b.classList.add('wrong'); });
    $('why').innerHTML = `<div class="why${ok ? '' : ' no'}"><b>${ok ? 'Correct.' : 'Not quite.'}</b> ${q.why}</div>`;
    const nx = $('next'); nx.hidden = false; nx.focus(); nx.onclick = () => { run.i++; if (run.i < run.qs.length) qShow(); else qEnd(); };
  }
  function qEnd() {
    const n = run.res.length, right = run.res.filter(r => r.ok).length, pct = Math.round(right / n * 100);
    const best = store.get('best', null);
    if (n === DATA.quiz.length && (!best || pct >= best.pct)) store.set('best', { pct, at: Date.now() });
    const by = topics.map(t => { const l = run.res.filter(r => r.q.t === t); return { t, n: l.length, ok: l.filter(r => r.ok).length }; }).filter(x => x.n);
    const misses = run.res.filter(r => !r.ok);
    $('p-quiz').innerHTML = `<div class="qend"><div class="sub">${right} of ${n} right</div><div class="big">${pct}%</div>
      <h2>${pct >= 90 ? "You're ready for this." : pct >= 75 ? 'Close. Clean up the misses below.' : pct >= 50 ? 'Good start. Review your weakest topic, then try again.' : 'Go back through the study guide, then try again.'}</h2>
      <div class="tbars">${by.map(x => `<div class="tb"><span>${esc(x.t)}</span><span class="tr"><i style="width:${x.ok / x.n * 100}%"></i></span><span class="p">${x.ok}/${x.n}</span></div>`).join('')}</div>
      <div class="row">${misses.length ? '<button class="btn pri" id="redo">Retry the ones I missed</button>' : ''}<button class="btn" id="again">Start over</button></div>
      ${misses.length ? `<div class="miss">${misses.map(r => `<div>${r.q.q}<div class="w">You picked: ${r.q.c[r.ci]}</div><div class="a">Answer: ${r.q.c[r.q.a]}</div><div class="w">${r.q.why}</div></div>`).join('')}</div>` : ''}</div>`;
    if (misses.length) $('redo').onclick = () => begin(misses.map(r => DATA.quiz.find(q => q.q === r.q.q)));
    $('again').onclick = qStart;
  }
  document.addEventListener('keydown', e => {
    if ($('p-quiz').hidden || !run || e.target.matches('input')) return;
    const k = e.key.toUpperCase(), i = 'ABCDE'.indexOf(k) >= 0 ? 'ABCDE'.indexOf(k) : '12345'.indexOf(k);
    const opts = $('p-quiz').querySelectorAll('.opt');
    if (i >= 0 && opts[i] && !opts[i].disabled) opts[i].click();
    else if (e.key === 'Enter' && $('next') && !$('next').hidden) $('next').click();
  });
  qStart();

  // vocab
  let vorder = DATA.vocab.slice();
  function vShow(filter) {
    const q = (filter || '').toLowerCase();
    $('vg').innerHTML = vorder.filter(([t, d]) => !q || (t + ' ' + d).toLowerCase().includes(q)).map(([t, d]) => `<div class="vc" tabindex="0"><div><div class="f">${esc(t)}</div><div class="b">${d}</div></div></div>`).join('');
  }
  $('p-vocab').innerHTML = `<div class="vtools"><input id="vq" placeholder="Search terms…" autocomplete="off"><button class="btn" id="vs">Shuffle</button><button class="btn" id="vf">Flip all</button></div><div class="vgrid" id="vg"></div>`;
  vShow('');
  $('vq').oninput = e => vShow(e.target.value);
  $('vs').onclick = () => { vorder = shuffle(vorder); vShow($('vq').value); };
  $('vf').onclick = () => { const cards = [...document.querySelectorAll('.vc')], all = cards.every(c => c.classList.contains('flip')); cards.forEach(c => c.classList.toggle('flip', !all)); };
  $('vg').addEventListener('click', e => { const c = e.target.closest('.vc'); if (c) c.classList.toggle('flip'); });
  $('vg').addEventListener('keydown', e => { const c = e.target.closest('.vc'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); c.classList.toggle('flip'); } });
})();
</script>
</body>
</html>
