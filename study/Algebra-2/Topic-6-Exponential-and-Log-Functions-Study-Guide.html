<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exponential and Logarithmic Functions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@500&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" media="print" onload="this.media='all'">
<style>
:root {
  --bg: #f7f6fa; --card: #ffffff; --ink: #19161f; --mu: #625b70; --mu2: #8b8499; --ln: #e7e3ee; --soft: #f1eef6;
  --ac: #6a46d6; --acs: #efeafd; --pk: #c23b7a; --ok: #157a4a; --oks: #e6f5ed; --bad: #b8304f; --bads: #fcebef;
  --sans: Geist, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --math: "STIX Two Text", "Cambria Math", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d0b12; --card: #16131d; --ink: #f1eef5; --mu: #a39cb2; --mu2: #7b748a; --ln: #2a2533; --soft: #1e1a27;
    --ac: #a78bfa; --acs: #241d38; --pk: #f07ab3; --ok: #5fd39b; --oks: #12291e; --bad: #ff8aa5; --bads: #2e1620; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { font: 16px/1.6 var(--sans); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 80px; }
.kick { font: 500 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ac); }
h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.08; letter-spacing: -.035em; font-weight: 650; margin: 10px 0 12px; }
.lede { color: var(--mu); font-size: 17px; max-width: 640px; }
.src { margin-top: 10px; font-size: 13px; color: var(--mu2); }
.tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; margin: 24px -20px 22px; padding: 10px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--ln); overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: none; border: 0; background: transparent; padding: 8px 14px; border-radius: 999px; font-weight: 550; font-size: 14.5px; color: var(--mu); cursor: pointer; }
.tabs button:hover { color: var(--ink); background: var(--soft); }
.tabs button.on { background: var(--ink); color: var(--bg); }
.tabs b { font-weight: 600; opacity: .6; margin-left: 4px; }
.pane[hidden] { display: none; }

/* study guide */
.toc { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.toc a { font-size: 13.5px; text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--ln); padding: 5px 12px; border-radius: 999px; }
.toc a:hover { border-color: var(--ac); }
.sec { background: var(--card); border: 1px solid var(--ln); border-radius: 18px; padding: 22px 24px; margin-bottom: 14px; scroll-margin-top: 70px; }
.sec h2 { font-size: 21px; letter-spacing: -.02em; font-weight: 650; margin-bottom: 10px; display: flex; gap: 10px; align-items: baseline; }
.sec h2 .n { font: 500 12px var(--mono); color: var(--ac); letter-spacing: .08em; }
.sec p { margin: 8px 0; }
.sec ul { margin: 8px 0 8px 20px; }
.sec li { margin: 5px 0; }
.sec li::marker { color: var(--ac); }
.box { margin: 12px 0; padding: 12px 14px; border-radius: 12px; background: var(--soft); }
.box.key { background: var(--acs); border-left: 3px solid var(--ac); }
.box.warn { background: var(--bads); border-left: 3px solid var(--bad); }
.box b:first-child { display: block; font-size: 12px; font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mu); margin-bottom: 4px; font-weight: 500; }
table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 14.5px; }
th, td { border: 1px solid var(--ln); padding: 7px 10px; text-align: left; vertical-align: top; }
th { background: var(--soft); font-weight: 600; }
details.ex { margin: 10px 0; border: 1px solid var(--ln); border-radius: 12px; overflow: hidden; }
details.ex summary { cursor: pointer; padding: 11px 14px; font-weight: 550; list-style: none; display: flex; gap: 10px; align-items: baseline; }
details.ex summary::-webkit-details-marker { display: none; }
details.ex summary::before { content: "Example"; font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--pk); flex: none; }
details.ex summary::after { content: "Show steps"; margin-left: auto; font-size: 12.5px; color: var(--ac); flex: none; }
details.ex[open] summary::after { content: "Hide"; }
details.ex ol { margin: 0; padding: 4px 16px 12px 36px; }
details.ex li { margin: 6px 0; }
details.ex .ans { padding: 10px 16px 14px; border-top: 1px dashed var(--ln); font-weight: 600; }
.m { font-family: var(--math); font-size: 1.1em; white-space: nowrap; }
.fig { display: block; width: 100%; max-width: 460px; margin: 14px auto 6px; color: var(--mu); }
.fig text { font: 12.5px var(--sans); fill: var(--ink); }
.fig .ac { stroke: var(--ac); }
.fig .acf { fill: var(--ac); }
.figcap { text-align: center; font-size: 13px; color: var(--mu); margin-bottom: 8px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.m i { font-style: italic; }

/* quiz */
.qstart, .qcard, .qend { background: var(--card); border: 1px solid var(--ln); border-radius: 20px; padding: 24px; }
.qstart h2, .qend h2 { font-size: 24px; letter-spacing: -.025em; font-weight: 650; margin-bottom: 6px; }
.sub { color: var(--mu); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.chips button { border: 1px solid var(--ln); background: var(--card); padding: 6px 12px; border-radius: 999px; font-size: 13.5px; cursor: pointer; }
.chips button.on { background: var(--acs); border-color: var(--ac); color: var(--ac); font-weight: 600; }
.btn { border: 0; cursor: pointer; padding: 11px 20px; border-radius: 999px; font-weight: 600; font-size: 15px; background: var(--soft); }
.btn.pri { background: var(--ink); color: var(--bg); }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
.qtop { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 13.5px; color: var(--mu); }
.qtop .t { font: 500 11.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ac); background: var(--acs); padding: 3px 9px; border-radius: 999px; }
.bar { height: 4px; border-radius: 4px; background: var(--soft); overflow: hidden; margin-bottom: 18px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--ac), var(--pk)); transition: width .4s; }
.qq { font-size: 18.5px; line-height: 1.5; font-weight: 500; margin-bottom: 16px; }
.opts { display: grid; gap: 9px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; border: 1.5px solid var(--ln); background: var(--card); padding: 12px 14px; border-radius: 14px; cursor: pointer; font-size: 15.5px; line-height: 1.45; transition: border-color .15s, background-color .15s; }
.opt:hover:not(:disabled) { border-color: var(--ac); }
.opt .l { flex: none; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font: 600 12px var(--mono); background: var(--soft); color: var(--mu); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--oks); }
.opt.right .l { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bads); }
.opt.wrong .l { background: var(--bad); color: #fff; }
.why { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--soft); font-size: 15px; }
.why b { color: var(--ok); }
.why.no b { color: var(--bad); }
.big { font-size: 54px; font-weight: 650; letter-spacing: -.04em; line-height: 1; margin: 6px 0 4px; background: linear-gradient(100deg, var(--ac), var(--pk)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tbars { display: grid; gap: 10px; margin: 18px 0; }
.tb { display: grid; grid-template-columns: minmax(120px, 1fr) 2fr 48px; gap: 12px; align-items: center; font-size: 14px; }
.tb .tr { height: 8px; border-radius: 8px; background: var(--soft); overflow: hidden; }
.tb .tr i { display: block; height: 100%; background: var(--ac); }
.tb .p { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.miss { margin-top: 18px; display: grid; gap: 10px; }
.miss > div { border: 1px solid var(--ln); border-radius: 14px; padding: 12px 14px; font-size: 14.5px; }
.miss .a { color: var(--ok); font-weight: 600; margin-top: 4px; }
.miss .w { color: var(--mu); margin-top: 4px; }
.best { font-size: 13.5px; color: var(--mu2); margin-top: 8px; }

/* vocab */
.vtools { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.vtools input { flex: 1; min-width: 180px; font: inherit; font-size: 15px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--ln); background: var(--card); color: var(--ink); outline: none; }
.vtools input:focus { border-color: var(--ac); }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.vc { perspective: 900px; height: 150px; cursor: pointer; }
.vc > div { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.2,.7,.2,1); }
.vc.flip > div { transform: rotateY(180deg); }
.vc .f, .vc .b { position: absolute; inset: 0; border-radius: 16px; padding: 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; text-align: center; border: 1px solid var(--ln); background: var(--card); overflow: auto; }
.vc .f { font-weight: 650; font-size: 18px; letter-spacing: -.01em; }
.vc .b { transform: rotateY(180deg); font-size: 14px; color: var(--mu); background: var(--acs); }
.foot { margin-top: 34px; font-size: 13px; color: var(--mu2); text-align: center; }
@media (max-width: 560px) { .sec { padding: 18px; } .qstart, .qcard, .qend { padding: 18px; } .qq { font-size: 17px; } .tb { grid-template-columns: 1fr 1fr 44px; } }
@media print { .tabs, .row, .chips { display: none !important; } .pane[hidden] { display: block !important; } .sec, .qcard { break-inside: avoid; } }
</style>
</head>

7141f)\">(3, 8)</text></svg><p class=\"figcap\">Growth rises to the right; decay falls toward its asymptote.</p>","examples":[{"q":"Describe <span class=\"m\"><i>f</i>(<i>x</i>) = 2<sup><i>x</i> − 1</sup> + 3</span>.","steps":["Base 2 > 1, so it is growth.","The + 3 moves the asymptote up: <span class=\"m\"><i>y</i> = 3</span>. Range <span class=\"m\"><i>y</i> &gt; 3</span>.","y-intercept: <span class=\"m\"><i>f</i>(0) = 2<sup>−1</sup> + 3 = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">2</span></span> + 3 = 3.5</span>."],"a":"Growth, asymptote <span class=\"m\"><i>y</i> = 3</span>, y-intercept (0, 3.5), domain all reals, range <span class=\"m\"><i>y</i> &gt; 3</span>."}]},{"title":"Exponential models (6-2)","body":"\n      <table><tr><th>Situation</th><th>Model</th></tr>\n      <tr><td>Grows by rate r each period</td><td><span class=\"m\"><i>y</i> = <i>a</i>(1 + <i>r</i>)<sup><i>t</i></sup></span></td></tr>\n      <tr><td>Decays by rate r each period</td><td><span class=\"m\"><i>y</i> = <i>a</i>(1 − <i>r</i>)<sup><i>t</i></sup></span></td></tr>\n      <tr><td>Interest compounded n times a year</td><td><span class=\"m\">A = P(1 + <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>r</i></span><span style=\"padding:0 3px\"><i>n</i></span></span>)<sup>nt</sup></span></td></tr>\n      <tr><td>Interest compounded continuously</td><td><span class=\"m\">A = Pe<sup>rt</sup></span></td></tr></table>\n      <div class=\"box key\"><b>Growth factor vs. rate</b>A 6% increase means multiply by 1.06; a 6% decrease means multiply by 0.94.</div>\n      <p>To write a model from two points, use <span class=\"m\">(0, <i>a</i>)</span> to get <span class=\"m\"><i>a</i></span>, then solve for <span class=\"m\"><i>b</i></span>.</p>","examples":[{"q":"$2,000 is invested at 4% interest for 5 years. Find the balance if it is compounded quarterly, and if it is compounded continuously.","steps":["Quarterly: <span class=\"m\">2000(1 + <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">0.04</span><span style=\"padding:0 3px\">4</span></span>)<sup>4 · 5</sup> = 2000(1.01)<sup>20</sup> ≈ 2000(1.22019)</span>.","Continuously: <span class=\"m\">2000<i>e</i><sup>0.04 · 5</sup> = 2000<i>e</i><sup>0.2</sup> ≈ 2000(1.22140)</span>."],"a":"About $2,440.38 quarterly and $2,442.81 continuously."},{"q":"A car worth $24,000 loses 15% of its value each year. What is it worth after 3 years?","steps":["Decay factor: <span class=\"m\">1 − 0.15 = 0.85</span>.","<span class=\"m\">24000(0.85)<sup>3</sup> = 24000(0.614125)</span>."],"a":"About $14,739"},{"q":"Write an exponential function through (0, 50) and (2, 72).","steps":["(0, 50) gives <span class=\"m\"><i>a</i> = 50</span>.","<span class=\"m\">72 = 50<i>b</i><sup>2</sup></span>, so <span class=\"m\"><i>b</i><sup>2</sup> = 1.44</span> and <span class=\"m\"><i>b</i> = 1.2</span>."],"a":"<span class=\"m\"><i>y</i> = 50(1.2)<sup><i>x</i></sup></span> (20% growth)"}]},{"title":"Logarithms (6-3)","body":"\n      <div class=\"box key\"><b>Definition</b><span class=\"m\">log<sub style=\"font-size:.7em\">b</sub> <i>a</i> = <i>c</i></span> means <span class=\"m\"><i>b</i><sup><i>c</i></sup> = <i>a</i></span>. A log answers: \"what power of b gives a?\"</div>\n      <ul><li><b>Common log</b>: <span class=\"m\">log <i>x</i></span> means base 10. <b>Natural log</b>: <span class=\"m\">ln <i>x</i></span> means base <span class=\"m\"><i>e</i></span>.</li>\n      <li><span class=\"m\">log<sub style=\"font-size:.7em\">b</sub> 1 = 0</span>, <span class=\"m\">log<sub style=\"font-size:.7em\">b</sub> <i>b</i> = 1</span>, <span class=\"m\">log<sub style=\"font-size:.7em\">b</sub> <i>b</i><sup><i>x</i></sup> = <i>x</i></span>.</li>\n      <li>You can only take the log of a positive number.</li></ul>","examples":[{"q":"Evaluate <span class=\"m\">log<sub style=\"font-size:.7em\">2</sub> 32</span>, <span class=\"m\">log<sub style=\"font-size:.7em\">3</sub> (1/9)</span>, <span class=\"m\">log 1000</span> and <span class=\"m\">ln <i>e</i><sup>4</sup></span>.","steps":["<span class=\"m\">2<sup>5</sup> = 32</span>, so 5.","<span class=\"m\">3<sup>−2</sup> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">9</span></span></span>, so −2.","<span class=\"m\">10<sup>3</sup> = 1000</span>, so 3.","ln undoes e: 4."],"a":"5, −2, 3, 4"},{"q":"Rewrite <span class=\"m\">5<sup>3</sup> = 125</span> in log form and <span class=\"m\">log 0.01 = −2</span> in exponential form.","steps":["Base 5, exponent 3, result 125: <span class=\"m\">log<sub style=\"font-size:.7em\">5</sub> 125 = 3</span>.","Base 10: <span class=\"m\">10<sup>−2</sup> = 0.01</span>."],"a":"<span class=\"m\">log<sub style=\"font-size:.7em\">5</sub> 125 = 3</span>; <span class=\"m\">10<sup>−2</sup> = 0.01</span>"}]},{"title":"Logarithmic functions (6-4)","body":"\n      <ul><li><span class=\"m\"><i>f</i>(<i>x</i>) = log<sub style=\"font-size:.7em\">b</sub> <i>x</i></span> is the <b>inverse</b> of <span class=\"m\"><i>g</i>(<i>x</i>) = <i>b</i><sup><i>x</i></sup></span>. Their graphs reflect over <span class=\"m\"><i>y</i> = <i>x</i></span>.</li>\n      <li>Domain <span class=\"m\"><i>x</i> &gt; 0</span>; range all real numbers; vertical asymptote <span class=\"m\"><i>x</i> = 0</span>.</li>\n      <li>Every graph <span class=\"m\"><i>y</i> = log<sub style=\"font-size:.7em\">b</sub> <i>x</i></span> passes through <span class=\"m\">(1, 0)</span> and <span class=\"m\">(<i>b</i>, 1)</span>.</li>\n      <li>Translated: <span class=\"m\">log<sub style=\"font-size:.7em\">b</sub> (<i>x</i> − <i>h</i>) + <i>k</i></span> has vertical asymptote <span class=\"m\"><i>x</i> = <i>h</i></span> and domain <span class=\"m\"><i>x</i> &gt; <i>h</i></span>.</li></ul>","examples":[{"q":"Graph <span class=\"m\"><i>g</i>(<i>x</i>) = log<sub style=\"font-size:.7em\">2</sub> (<i>x</i> + 3) − 1</span>.","steps":["Asymptote: <span class=\"m\"><i>x</i> + 3 = 0</span>, so <span class=\"m\"><i>x</i> = −3</span>. Domain <span class=\"m\"><i>x</i> &gt; −3</span>.","Make the inside a power of 2: <span class=\"m\"><i>x</i> + 3 = 1, 2, 4, 8</span> gives <span class=\"m\"><i>x</i> = −2, −1, 1, 5</span>.","<div style=\"display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap\"><div style=\"flex:1;min-width:220px\">Outputs: <span class=\"m\">0 − 1 = −1</span>, <span class=\"m\">1 − 1 = 0</span>, <span class=\"m\">2 − 1 = 1</span>, <span class=\"m\">3 − 1 = 2</span>.</div><svg class=\"fig\" viewBox=\"0 0 272 192\" style=\"width:260px;\" role=\"img\" aria-label=\"Graph of g of x equals log base 2 of x plus 3, minus 1, with a vertical asymptote at x equals negative 3\"><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"176\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"36\" y1=\"16\" x2=\"36\" y2=\"176\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"56\" y1=\"16\" x2=\"56\" y2=\"176\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"76\" y1=\"16\" x2=\"76\" y2=\"176\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"96\" y1=\"16\" x2=\"96\" y2=\"176\" stroke=\"currentColor\" stroke-opacity=\"0.7\" stroke-width=\"1.4\"/><line x1=\"116\" y1=\"16\" x2=\"116\" y2=\"176\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"136\" y1=\"16\" x2=\"136\" y2=\"176\" stroke=\"curre </tr>\n      <tr><td>Product</td><td><span class=\"m\">log<sub style=\"font-size:.7em\">b</sub> (mn) = log<sub style=\"font-size:.7em\">b</sub> <i>m</i> + log<sub style=\"font-size:.7em\">b</sub> <i>n</i></span></td></tr>\n      <tr><td>Quotient</td><td><span class=\"m\">log<sub style=\"font-size:.7em\">b</sub> (<i>m</i>/n) = log<sub style=\"font-size:.7em\">b</sub> <i>m</i> − log<sub style=\"font-size:.7em\">b</sub> <i>n</i></span></td></tr>\n      <tr><td>Power</td><td><span class=\"m\">log<sub style=\"font-size:.7em\">b</sub> <i>m</i><sup><i>p</i></sup> = <i>p</i> log<sub style=\"font-size:.7em\">b</sub> <i>m</i></span></td></tr>\n      <tr><td>Change of base</td><td><span class=\"m\">log<sub style=\"font-size:.7em\">b</sub> <i>a</i> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">log <i>a</i></span><span style=\"padding:0 3px\">log <i>b</i></span></span> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">ln <i>a</i></span><span style=\"padding:0 3px\">ln <i>b</i></span></span></span></td></tr></table>\n      <div class=\"box warn\"><b>Not a rule</b><span class=\"m\">log(<i>m</i> + <i>n</i>)</span> is not <span class=\"m\">log <i>m</i> + log <i>n</i></span>.</div>","examples":[{"q":"Expand <span class=\"m\">log<sub style=\"font-size:.7em\">3</sub> (9<i>x</i><sup>2</sup>/y)</span>.","steps":["Quotient: <span class=\"m\">log<sub style=\"font-size:.7em\">3</sub> 9<i>x</i><sup>2</sup> − log<sub style=\"font-size:.7em\">3</sub> <i>y</i></span>.","Product: <span class=\"m\">log<sub style=\"font-size:.7em\">3</sub> 9 + log<sub style=\"font-size:.7em\">3</sub> <i>x</i><sup>2</sup> − log<sub style=\"font-size:.7em\">3</sub> <i>y</i></span>.","Power, and <span class=\"m\">log<sub style=\"font-size:.7em\">3</sub> 9 = 2</span>."],"a":"<span class=\"m\">2 + 2log<sub style=\"font-size:.7em\">3</sub> <i>x</i> − log<sub style=\"font-size:.7em\">3</sub> <i>y</i></span>"},{"q":"Condense <span class=\"m\">2 log <i>x</i> + log 5 − log 2</span>.","steps":["Power first: <span class=\"m\">log <i>x</i><sup>2</sup> + log 5 − log 2</span>.","Then product and quotient: <span class=\"m\">log <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">5<i>x</i><sup>2</sup></span><span style=\"padding:0 3px\">2</span></span></span>."],"a":"<span class=\"m\">log <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">5<i>x</i><sup>2</sup></span><span style=\"padding:0 3px\">2</span></span></span>"},{"q":"Use change of base to approximate <span class=\"m\">log<sub style=\"font-size:.7em\">4</sub> 20</span>.","steps":["<span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">log 20</span><span style=\"padding:0 3px\">log 4</span></span> ≈ <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1.30103</span><span style=\"padding:0 3px\">0.60206</span></span></span>.","Reasonable: <span class=\"m\">4<sup>2</sup> = 16</span> and <span class=\"m\">4<sup>3</sup> = 64</span>, so the answer is a little more than 2."],"a":"≈ 2.161"}]},{"title":"Exponential and logarithmic equations (6-6)","body":"\n      <ul><li><b>Same base</b>: rewrite both sides with one base, then set the exponents equal.</li>\n      <li><b>Different bases</b>: take the log (or ln) of both sides and use the power property to bring the exponent down.</li>\n      <li><b>Log equations</b>: condense into one log, then rewrite in exponential form. <b>Check</b>: you can't take the log of 0 or a negative, so some answers are extraneous.</li></ul>","examples":[{"q":"Solve <span class=\"m\">2<sup><i>x</i> + 1</sup> = 8<sup><i>x</i></sup></span>.","steps":["Rewrite 8 as <span class=\"m\">2<sup>3</sup></span>: <span class=\"m\">2<sup><i>x</i> + 1</sup> = 2<sup>3<i>x</i></sup></span>.","Set exponents equal: <span class=\"m\"><i>x</i> + 1 = 3<i>x</i></span>."],"a":"<span class=\"m\"><i>x</i> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">2</span></span></span>"},{"q":"Solve <span class=\"m\">5<sup><i>x</i></sup> = 40</span>.","steps":["Take the log of both sides: <span class=\"m\"><i>x</i> log 5 = log 40</span>.","<span class=\"m\"><i>x</i> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">log 40</span><span style=\"padding:0 3px\">log 5</span></span> ≈ <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1.60206</span><span style=\"padding:0 3px\">0.69897</span></span></span>."],"a":"<span class=\"m\"><i>x</i> ≈ 2.292</span>"},{"q":"Solve <span class=\"m\">log <i>x</i> + log(<i>x</i> − 3) = 1</span>.","steps":["Condense: <span class=\"m\">log(<i>x</i>(<i>x</i> − 3)) = 1</span>, so <span class=\"m\"><i>x</i><sup>2</sup> − 3<i>x</i> = 10</span>.","<span class=\"m\"><i>x</i><sup>2</sup> − 3<i>x</i> − 10 = 0</span>, so <span class=\"m\">(<i>x</i> − 5)(<i>x</i> + 2) = 0</span>.","<span class=\"m\"><i>x</i> = −2</span> would need <span class=\"m\">log(−2)</span>, which isn't defined, so it is extraneous."],"a":"<span class=\"m\"><i>x</i> = 5</span> (check: <span class=\"m\">log 5 + log 2 = log 10 = 1</span>)"},{"q":"How long until money invested at 4% compounded continuously doubles?","steps":["<span class=\"m\">2P = Pe<sup>0.04<i>t</i></sup></span>, so <span class=\"m\">2 = <i>e</i><sup>0.04<i>t</i></sup></span>.","Take ln: <span class=\"m\">ln 2 = 0.04<i>t</i></span>, so <span class=\"m\"><i>t</i> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">ln 2</span><span style=\"padding:0 3px\">0.04</span></span></span>."],"a":"About 17.3 years"}]},{"title":"Geometric sequences and series (6-7)","body":"\n      <ul><li>A <b>geometric sequence</b> multiplies by the same <b>common ratio</b> <span class=\"m\"><i>r</i></span> each time: 3, 6, 12, 24, … has <span class=\"m\"><i>r</i> = 2</span>.</li>\n      <li>Explicit formula: <span class=\"m\"><i>a</i><sub><i>n</i></sub></span> = <span class=\"m\"><i>a</i><sub>1</sub> · <i>r</i><sup><i>n</i> − 1</sup></span>. Recursive: <span class=\"m\"><i>a</i><sub><i>n</i></sub></span> = <span class=\"m\"><i>r</i> · <i>a</i><sub><i>n</i> − 1</sub></span>, with <span class=\"m\"><i>a</i><sub>1</sub></span> given.</li>\n      <li>A <b>geometric series</b> is the sum of the terms. Sum of the first n terms: <span class=\"m\">S<sub><i>n</i></sub> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>a</i><sub>1</sub>(1 − <i>r</i><sup><i>n</i></sup>)</span><span style=\"padding:0 3px\">1 − <i>r</i></span></span></span> (for <span class=\"m\"><i>r</i> ≠ 1</span>).</li>\n      <li>Sigma notation: <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 2px\"><span style=\"font-size:.62em\">5</span><span style=\"font-size:1.45em\">Σ</span><span style=\"font-size:.62em\"><i>k</i> = 1</span></span> 2(3)<sup><i>k</i> − 1</sup></span> means add the terms for <span class=\"m\"><i>k</i> = 1</span> to 5.</li></ul>\n      <div class=\"box key\"><b>It's exponential</b>A geometric sequence is an exponential function whose inputs are the term numbers 1, 2, 3, …</div>","examples":[{"q":"For 3, 6, 12, 24, …, find <span class=\"m\"><i>a</i><sub>8</sub></span> and the sum of the first 8 terms.","steps":["<span class=\"m\"><i>r</i> = 2</span>, so <span class=\"m\"><i>a</i><sub>8</sub> = 3 · 2<sup>7</sup> = 384</span>.","<span class=\"m\">S<sub>8</sub> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">3(1 − 2<sup>8</sup>)</span><span style=\"padding:0 3px\">1 − 2</span></span> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">3(−255)</span><span style=\"padding:0 3px\">−1</span></span> = 765</span>."],"a":"<span class=\"m\"><i>a</i><sub>8</sub> = 384</span>; <span class=\"m\">S<sub>8</sub> = 765</span>"},{"q":"Find the 6th term of 81, 27, 9, …","steps":["<span class=\"m\"><i>r</i> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">27</span><span style=\"padding:0 3px\">81</span></span> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">3</span></span></span>.","<span class=\"m\"><i>a</i><sub>6</sub> = 81(<span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">3</span></span>)<sup>5</sup> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">81</span><span style=\"padding:0 3px\">243</span></span></span>."],"a":"<span class=\"m\"><i>a</i><sub>6</sub> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">3</span></span></span>"},{"q":"Evaluate <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 2px\"><span style=\"font-size:.62em\">5</span><span style=\"font-size:1.45em\">Σ</span><span style=\"font-size:.62em\"><i>k</i> = 1</span></span> 2(3)<sup><i>k</i> − 1</sup></span>.","steps":["The terms are 2, 6, 18, 54, 162: <span class=\"m\"><i>a</i><sub>1</sub> = 2</span>, <span class=\"m\"><i>r</i> = 3</span>, <span class=\"m\"><i>n</i> = 5</span>.","<span class=\"m\">S<sub>5</sub> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">2(1 − 3<sup>5</sup>)</span><span style=\"padding:0 3px\">1 − 3</span></span> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">2(−242)</span><span style=\"padding:0 3px\">−2</span></span></span>."],"a":"242"}]},{"title":"Mistakes to avoid","body":"\n      <ul><li>Using <span class=\"m\"><i>r</i></span> instead of the factor: 5% growth is <span class=\"m\">1.05</span>, not <span class=\"m\">0.05</span>; 5% decay is <span class=\"m\">0.95</span>.</li>\n      <li>Forgetting that <span class=\"m\"><i>n</i></span> in compound interest is times per year (12 for monthly, 4 for quarterly).</li>\n      <li>Mixing up the parts of <span class=\"m\">log<sub style=\"font-size:.7em\">b</sub> <i>a</i> = <i>c</i></span>: the base stays the base, and the log is the exponent.</li>\n      <li>Writing <span class=\"m\">log(<i>x</i> + 3) = log <i>x</i> + log 3</span>.</li>\n      <li>Keeping a log-equation answer that makes the inside of a log 0 or negative.</li>\n      <li>Using <span class=\"m\"><i>r</i><sup><i>n</i></sup></span> instead of <span class=\"m\"><i>r</i><sup><i>n</i> − 1</sup></span> in the explicit formula.</li></ul>"}],"quiz":[{"t":"Exponential functions","q":"Which function shows exponential decay?","c":["<span class=\"m\"><i>f</i>(<i>x</i>) = 5(0.8)<sup><i>x</i></sup></span>","<span class=\"m\"><i>f</i>(<i>x</i>) = 0.8(5)<sup><i>x</i></sup></span>","<span class=\"m\"><i>f</i>(<i>x</i>) = 2(1.05)<sup><i>x</i></sup></span>","<span class=\"m\"><i>f</i>(<i>x</i>) = (<span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">3</span><span style=\"padding:0 3px\">2</span></span>)<sup><i>x</i></sup></span>"],"a":0,"why":"Decay means the base is between 0 and 1. The <span class=\"m\"><i>a</i></span> value in front doesn't decide growth or decay."},{"t":"Exponential functions","q":"What are the y-intercept and asymptote of <span class=\"m\"><i>f</i>(<i>x</i>) = 4 · 3<sup><i>x</i></sup> − 2</span>?","c":["(0, 2) and <span class=\"m\"><i>y</i> = −2</span>","(0, 4) and <span class=\"m\"><i>y</i> = −2</span>","(0, 2) and <span class=\"m\"><i>y</i> = 0</span>","(0, 4) and <span class=\"m\"><i>y</i> = 0</span>"],"a":0,"why":"<span class=\"m\"><i>f</i>(0) = 4 · 1 − 2 = 2</span>, and the − 2 shifts the asymptote down to <span class=\"m\"><i>y</i> = −2</span>."},{"t":"Exponential functions","q":"What is the range of <span class=\"m\"><i>f</i>(<i>x</i>) = −2(<span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">3</span></span>)<sup><i>x</i></sup></span>?","c":["<span class=\"m\"><i>y</i> &lt; 0</span>","<span class=\"m\"><i>y</i> &gt; 0</span>","All real numbers","<span class=\"m\"><i>y</i> &gt; −2</span>"],"a":0,"why":"The powers are always positive; multiplying by −2 makes every output negative."},{"t":"Exponential functions","q":"Which value is closest to <span class=\"m\"><i>e</i></span>?","c":["2.718","3.142","1.618","2.000"],"a":0,"why":"<span class=\"m\"><i>e</i> ≈ 2.71828</span>. (3.142 is π.)"},{"t":"Exponential functions","q":"Which function matches this graph?<svg class=\"fig\" viewBox=\"0 0 272 272\" style=\"width:260px;\" role=\"img\" aria-label=\"An exponential graph through 0 comma 2, 1 comma 3 and 2 comma 5, with a horizontal asymptote at y equals 1\"><line x1=\"16\" y1=\"16\" x2=\"16\" y2=\"256\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"46\" y1=\"16\" x2=\"46\" y2=\"256\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"76\" y1=\"16\" x2=\"76\" y2=\"256\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"106\" y1=\"16\" x2=\"106\" y2=\"256\" stroke=\"currentColor\" stroke-opacity=\"0.16\" stroke-width=\"1\"/><line x1=\"136\" y1=\"16\" x2=\"136\" y2=\"256\" stroke=\"currentColor\" stroke-opacity=\"0.7\" stroke-width=\"1.4\"/><line x1=\"166\" y1=\"16\" x2=\"166\" y2=\"256\" stroke=\"currentColor\" class=\"m\"><i>x</i> = −4</span>."},{"t":"Log functions","q":"<span class=\"m\"><i>f</i>(<i>x</i>) = log<sub style=\"font-size:.7em\">3</sub> <i>x</i></span> is the inverse of which function?","c":["<span class=\"m\"><i>y</i> = 3<sup><i>x</i></sup></span>","<span class=\"m\"><i>y</i> = <i>x</i><sup>3</sup></span>","<span class=\"m\"><i>y</i> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i></span><span style=\"padding:0 3px\">3</span></span></span>","<span class=\"m\"><i>y</i> = 3<i>x</i></span>"],"a":0,"why":"Logs and exponentials with the same base undo each other."},{"t":"Log functions","q":"Which point is on the graph of <span class=\"m\"><i>y</i> = log<sub style=\"font-size:.7em\">b</sub> <i>x</i></span> for every base b?","c":["(1, 0)","(0, 1)","(0, 0)","(b, 0)"],"a":0,"why":"<span class=\"m\"><i>b</i><sup>0</sup> = 1</span>, so <span class=\"m\">log<sub style=\"font-size:.7em\">b</sub> 1 = 0</span>."},{"t":"Log properties","q":"Expand <span class=\"m\">log(<i>x</i><sup>3</sup> <i>y</i>)</span>.","c":["<span class=\"m\">3 log <i>x</i> + log <i>y</i></span>","<span class=\"m\">log 3<i>x</i> + log <i>y</i></span>","<span class=\"m\">3 log <i>x</i> · log <i>y</i></span>","<span class=\"m\">3(log <i>x</i> + log <i>y</i>)</span>"],"a":0,"why":"Product property, then power property on <span class=\"m\"><i>x</i><sup>3</sup></span> only."},{"t":"Log properties","q":"Condense <span class=\"m\">log<sub style=\"font-size:.7em\">2</sub> 5 + 3log<sub style=\"font-size:.7em\">2</sub> <i>x</i> − log<sub style=\"font-size:.7em\">2</sub> <i>y</i></span>.","c":["<span class=\"m\">log<sub style=\"font-size:.7em\">2</sub>  <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">5<i>x</i><sup>3</sup></span><span style=\"padding:0 3px\"><i>y</i></span></span></span>","<span class=\"m\">log<sub style=\"font-size:.7em\">2</sub>  <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">15<i>x</i></span><span style=\"padding:0 3px\"><i>y</i></span></span></span>","<span class=\"m\">log<sub style=\"font-size:.7em\">2</sub> (5<i>x</i><sup>3</sup> − <i>y</i>)</span>","<span class=\"m\">log<sub style=\"font-size:.7em\">2</sub>  <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">5<i>x</i><sup>3</sup></span><span style=\"padding:0 3px\">3<i>y</i></span></span></span>"],"a":0,"why":"Power first (<span class=\"m\"><i>x</i><sup>3</sup></span>), then add means multiply and subtract means divide."},{"t":"Log properties","q":"Simplify <span class=\"m\">log<sub style=\"font-size:.7em\">6</sub> 4 + log<sub style=\"font-size:.7em\">6</sub> 9</span>.","c":["2","<span class=\"m\">log<sub style=\"font-size:.7em\">6</sub> 13</span>","13","1"],"a":0,"why":"<span class=\"m\">log<sub style=\"font-size:.7em\">6</sub> 36 = 2</span>, since <span class=\"m\">6<sup>2</sup> = 36</span>."},{"t":"Log properties","q":"Use change of base: <span class=\"m\">log<sub style=\"font-size:.7em\">5</sub> 30</span> ≈ ?","c":["2.113","0.473","6","1.477"],"a":0,"why":"<span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">log 30</span><span style=\"padding:0 3px\">log 5</span></span> ≈ <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1.47712</span><span style=\"padding:0 3px\">0.69897</span></span> ≈ 2.113</span>. Check: <span class=\"m\">5<sup>2</sup> = 25</span>, a bit less than 30."},{"t":"Log properties","q":"Which statement is NOT true?","c":["<span class=\"m\">log(<i>x</i> + <i>y</i>) = log <i>x</i> + log <i>y</i></span>","<span class=\"m\">log(xy) = log <i>x</i> + log <i>y</i></span>","<span class=\"m\">log(<i>x</i><sup><i>n</i></sup>) = <i>n</i> log <i>x</i></span>","<span class=\"m\">log <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i></span><span style=\"padding:0 3px\"><i>y</i></span></span> = log <i>x</i> − log <i>y</i></span>"],"a":0,"why":"There is no rule for the log of a sum."},{"t":"Equations","q":"Solve <span class=\"m\">3<sup><i>x</i> + 2</sup> = 27</span>.","c":["<span class=\"m\"><i>x</i> = 1</span>","<span class=\"m\"><i>x</i> = 25</span>","<span class=\"m\"><i>x</i> = 3</span>","<span class=\"m\"><i>x</i> = 7</span>"],"a":0,"why":"<span class=\"m\">27 = 3<sup>3</sup></span>, so <span class=\"m\"><i>x</i> + 2 = 3</span>."},{"t":"Equations","q":"Solve <span class=\"m\">4<sup><i>x</i></sup> = 50</span>.","c":["<span class=\"m\"><i>x</i> ≈ 2.822</span>","<span class=\"m\"><i>x</i> = 12.5</span>","<span class=\"m\"><i>x</i> ≈ 1.699</span>","<span class=\"m\"><i>x</i> ≈ 0.354</span>"],"a":0,"why":"<span class=\"m\"><i>x</i> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">log 50</span><span style=\"padding:0 3px\">log 4</span></span> ≈ <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1.69897</span><span style=\"padding:0 3px\">0.60206</span></span> ≈ 2.822</span>. Check: <span class=\"m\">4<sup>3</sup> = 64</span>, a bit more than 50."},{"t":"Equations","q":"Solve <span class=\"m\">log<sub style=\"font-size:.7em\">3</sub> (2<i>x</i> − 1) = 2</span>.","c":["<span class=\"m\"><i>x</i> = 5</span>","<span class=\"m\"><i>x</i> = 4</span>","<span class=\"m\"><i>x</i> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">7</span><span style=\"padding:0 3px\">2</span></span></span>","<span class=\"m\"><i>x</i> = 3.5</span>"],"a":0,"why":"Exponential form: <span class=\"m\">2<i>x</i> − 1 = 3<sup>2</sup> = 9</span>, so <span class=\"m\"><i>x</i> = 5</span>."},{"t":"Equations","q":"Solve <span class=\"m\">log <i>x</i> + log(<i>x</i> + 9) = 1</span>.","c":["<span class=\"m\"><i>x</i> = 1</span> only","<span class=\"m\"><i>x</i> = 1</span> and <span class=\"m\"><i>x</i> = −10</span>","<span class=\"m\"><i>x</i> = −10</span> only","No solution"],"a":0,"why":"<span class=\"m\"><i>x</i><sup>2</sup> + 9<i>x</i> = 10</span>, so <span class=\"m\">(<i>x</i> + 10)(<i>x</i> − 1) = 0</span>. <span class=\"m\"><i>x</i> = −10</span> would mean the log of a negative, so it is extraneous."},{"t":"Equations","q":"Solve <span class=\"m\"><i>e</i><sup><i>x</i></sup> = 5</span>.","c":["<span class=\"m\"><i>x</i> = ln 5 ≈ 1.609</span>","<span class=\"m\"><i>x</i> = log 5 ≈ 0.699</span>","<span class=\"m\"><i>x</i> = 5<i>e</i></span>","<span class=\"m\"><i>x</i> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">5</span><span style=\"padding:0 3px\"><i>e</i></span></span></span>"],"a":0,"why":"Take ln of both sides; ln undoes <span class=\"m\"><i>e</i><sup><i>x</i></sup></span>."},{"t":"Geometric sequences","q":"What is the next term of 2, −6, 18, −54, …?","c":["162","−162","−108","108"],"a":0,"why":"The common ratio is −3: <span class=\"m\">−54 · (−3) = 162</span>."},{"t":"Geometric sequences","q":"A geometric sequence has <span class=\"m\"><i>a</i><sub>1</sub> = 5</span> and <span class=\"m\"><i>r</i> = 2</span>. What is <span class=\"m\"><i>a</i><sub>7</sub></span>?","c":["320","640","70","35"],"a":0,"why":"<span class=\"m\"><i>a</i><sub>7</sub> = 5 · 2<sup>6</sup> = 320</span>. Use <span class=\"m\"><i>n</i> − 1 = 6</span>, not 7."},{"t":"Geometric sequences","q":"What is the sum of the first 6 terms of 1, 3, 9, 27, …?","c":["364","243","728","1093"],"a":0,"why":"<span class=\"m\">S<sub>6</sub> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1(1 − 3<sup>6</sup>)</span><span style=\"padding:0 3px\">1 − 3</span></span> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">−728</span><span style=\"padding:0 3px\">−2</span></span> = 364</span>. (243 is just the 6th term.)"},{"t":"Geometric sequences","q":"Which is an explicit formula for 40, 20, 10, 5, …?","c":["<span class=\"m\"><i>a</i><sub><i>n</i></sub> = 40(<span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">2</span></span>)<sup><i>n</i> − 1</sup></span>","<span class=\"m\"><i>a</i><sub><i>n</i></sub> = 40(<span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">2</span></span>)<sup><i>n</i></sup></span>","<span class=\"m\"><i>a</i><sub><i>n</i></sub> = 40 − 20(<i>n</i> − 1)</span>","<span class=\"m\"><i>a</i><sub><i>n</i></sub> = 20(<span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">2</span></span>)<sup><i>n</i> − 1</sup></span>"],"a":0,"why":"First term 40, ratio <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">2</span></span></span>, exponent <span class=\"m\"><i>n</i> − 1</span> so that <span class=\"m\"><i>a</i><sub>1</sub> = 40</span>."}],"vocab":[["Exponential function","<span class=\"m\"><i>f</i>(<i>x</i>) = <i>a</i> · <i>b</i><sup><i>x</i></sup></span> with <span class=\"m\"><i>b</i> &gt; 0</span>, <span class=\"m\"><i>b</i> ≠ 1</span>: the variable is in the exponent."],["Exponential growth","When <span class=\"m\"><i>b</i> &gt; 1</span>: the output multiplies by the same amount each step and increases."],["Exponential decay","When <span class=\"m\">0 &lt; <i>b</i> &lt; 1</span>: the output shrinks by the same factor each step."],["Growth / decay factor","The base b: <span class=\"m\">1 + <i>r</i></span> for growth, <span class=\"m\">1 − <i>r</i></span> for decay."],["Asymptote","A line the graph gets closer and closer to; <span class=\"m\"><i>y</i> = 0</span> for <span class=\"m\"><i>y</i> = <i>b</i><sup><i>x</i></sup></span>."],["Natural base e","The number <span class=\"m\"><i>e</i> ≈ 2.718</span>, used for continuous growth."],["Compound interest","<span class=\"m\">A = P(1 + <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>r</i></span><span style=\"padding:0 3px\"><i>n</i></span></span>)<sup>nt</sup></span>: interest added n times a year."],["Continuously compounded interest","<span class=\"m\">A = Pe<sup>rt</sup></span>."],["Logarithm","<span class=\"m\">log<sub style=\"font-size:.7em\">b</sub> <i>a</i> = <i>c</i></span> means <span class=\"m\"><i>b</i><sup><i>c</i></sup> = <i>a</i></span>."],["Common logarithm","<span class=\"m\">log <i>x</i></span>, base 10."],["Natural logarithm","<span class=\"m\">ln <i>x</i></span>, base <span class=\"m\"><i>e</i></span>."],["Logarithmic function","<span class=\"m\"><i>f</i>(<i>x</i>) = log<sub style=\"font-size:.7em\">b</sub> <i>x</i></span>, the inverse of <span class=\"m\"><i>b</i><sup><i>x</i></sup></span>."],["Product / quotient / power properties","Logs turn multiplying into adding, dividing into subtracting, and powers into multipliers."],["Change of base formula","<span class=\"m\">log<sub style=\"font-size:.7em\">b</sub> <i>a</i> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">log <i>a</i></span><span style=\"padding:0 3px\">log <i>b</i></span></span></span>."],["Exponential equation","An equation with the variable in an exponent, like <span class=\"m\">5<sup><i>x</i></sup> = 40</span>."],["Logarithmic equation","An equation with the variable inside a log."],["Geometric sequence","A sequence that multiplies by the same number each time."],["Common ratio","The number <span class=\"m\"><i>r</i></span> each term is multiplied by."],["Geometric series","The sum of the terms of a geometric sequence."]]};
(function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = { get(k, d) { try { const v = localStorage.getItem('cbstudy:' + DATA.id + ':' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                  set(k, v) { try { localStorage.setItem('cbstudy:' + DATA.id + ':' + k, JSON.stringify(v)); } catch (e) {} } };
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  $('kick').textContent = DATA.kick; $('title').textContent = DATA.title; $('lede').innerHTML = DATA.lede; $('src').innerHTML = DATA.src || '';
  document.title = DATA.title + ' · ' + DATA.cls;

  // tabs
  const TABS = [['guide', 'Study guide', ''], ['quiz', 'Practice quiz', DATA.quiz.length], ['vocab', 'Vocab', DATA.vocab.length]];
  $('tabs').innerHTML = TABS.map(([k, l, n]) => `<button data-tab="${k}">${l}${n ? `<b>${n}</b>` : ''}</button>`).join('');
  function show(k) {
    TABS.forEach(([t]) => { $('p-' + t).hidden = t !== k; });
    document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === k));
  }
  $('tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) { show(b.dataset.tab); window.scrollTo({ top: 0, behavior: 'smooth' }); } };
  show('guide');

  // study guide
  $('p-guide').innerHTML = `<div class="toc">${DATA.guide.map((s, i) => `<a href="#s${i}">${esc(s.title)}</a>`).join('')}</div>` +
    DATA.guide.map((s, i) => `<article class="sec" id="s${i}"><h2><span class="n">${String(i + 1).padStart(2, '0')}</span>${esc(s.title)}</h2>${s.body || ''}
      ${(s.examples || []).map(x => `<details class="ex"><summary>${x.q}</summary><ol>${x.steps.map(st => `<li>${st}</li>`).join('')}</ol><div class="ans">${x.a}</div></details>`).join('')}</article>`).join('');
  $('p-guide').addEventListener('click', e => { const a = e.target.closest('.toc a'); if (!a) return; e.preventDefault(); const el = document.querySelector(a.getAttribute('href')); if (el) el.scrollIntoView({ behavior: 'smooth' }); });

  // practice quiz
  const topics = [...new Set(DATA.quiz.map(q => q.t))];
  let pick = new Set(topics), run = null;
  function qStart() {
    const best = store.get('best', null);
    $('p-quiz').innerHTML = `<div class="qstart"><h2>Practice quiz</h2><p class="sub">${DATA.quiz.length} questions. You'll see why each answer is right as you go, and a breakdown by topic at the end.</p>
      ${topics.length > 1 ? `<div class="chips">${topics.map(t => `<button data-topic="${esc(t)}" class="${pick.has(t) ? 'on' : ''}">${esc(t)}</button>`).join('')}</div>` : ''}
      <div class="row"><button class="btn pri" id="go">Start (${DATA.quiz.filter(q => pick.has(q.t)).length} questions)</button></div>
      ${best ? `<p class="best">Your best: ${best.pct}% on ${new Date(best.at).toLocaleDateString()}</p>` : ''}</div>`;
    $('p-quiz').querySelectorAll('[data-topic]').forEach(b => b.onclick = () => { const t = b.dataset.topic; if (pick.has(t) && pick.size > 1) pick.delete(t); else pick.add(t); qStart(); });
    $('go').onclick = () => begin(DATA.quiz.filter(q => pick.has(q.t)));
  }
  function begin(list) { run = { qs: shuffle(list).map(q => Object.assign({}, q, { order: shuffle(q.c.map((_, i) => i)) })), i: 0, res: [] }; qShow(); }
  function qShow() {
    const q = run.qs[run.i], n = run.qs.length;
    $('p-quiz').innerHTML = `<div class="qcard"><div class="qtop"><span class="t">${esc(q.t)}</span><span>${run.i + 1} of ${n}</span></div>
      <div class="bar"><i style="width:${(run.i / n) * 100}%"></i></div><div class="qq">${q.q}</div>
      <div class="opts">${q.order.map((ci, k) => `<button class="opt" data-ci="${ci}"><span class="l">${'ABCDE'[k]}</span><span>${q.c[ci]}</span></button>`).join('')}</div>
      <div id="why"></div><div class="row"><button class="btn pri" id="next" hidden>${run.i + 1 < n ? 'Next question' : 'See my results'}</button></div></div>`;
    $('p-quiz').querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.ci));
  }
  function answer(ci) {
    const q = run.qs[run.i], ok = ci === q.a;
    if (run.res.length > run.i) return;
    run.res.push({ q, ok, ci });
    $('p-quiz').querySelectorAll('.opt').forEach(b => { b.disabled = true; const c = +b.dataset.ci; if (c === q.a) b.classList.add('right'); else if (c === ci) b.classList.add('wrong'); });
    $('why').innerHTML = `<div class="why${ok ? '' : ' no'}"><b>${ok ? 'Correct.' : 'Not quite.'}</b> ${q.why}</div>`;
    const nx = $('next'); nx.hidden = false; nx.focus(); nx.onclick = () => { run.i++; if (run.i < run.qs.length) qShow(); else qEnd(); };
  }
  function qEnd() {
    const n = run.res.length, right = run.res.filter(r => r.ok).length, pct = Math.round(right / n * 100);
    const best = store.get('best', null);
    if (n === DATA.quiz.length && (!best || pct >= best.pct)) store.set('best', { pct, at: Date.now() });
    const by = topics.map(t => { const l = run.res.filter(r => r.q.t === t); return { t, n: l.length, ok: l.filter(r => r.ok).length }; }).filter(x => x.n);
    const misses = run.res.filter(r => !r.ok);
    $('p-quiz').innerHTML = `<div class="qend"><div class="sub">${right} of ${n} right</div><div class="big">${pct}%</div>
      <h2>${pct >= 90 ? "You're ready for this." : pct >= 75 ? 'Close. Clean up the misses below.' : pct >= 50 ? 'Good start. Review your weakest topic, then try again.' : 'Go back through the study guide, then try again.'}</h2>
      <div class="tbars">${by.map(x => `<div class="tb"><span>${esc(x.t)}</span><span class="tr"><i style="width:${x.ok / x.n * 100}%"></i></span><span class="p">${x.ok}/${x.n}</span></div>`).join('')}</div>
      <div class="row">${misses.length ? '<button class="btn pri" id="redo">Retry the ones I missed</button>' : ''}<button class="btn" id="again">Start over</button></div>
      ${misses.length ? `<div class="miss">${misses.map(r => `<div>${r.q.q}<div class="w">You picked: ${r.q.c[r.ci]}</div><div class="a">Answer: ${r.q.c[r.q.a]}</div><div class="w">${r.q.why}</div></div>`).join('')}</div>` : ''}</div>`;
    if (misses.length) $('redo').onclick = () => begin(misses.map(r => DATA.quiz.find(q => q.q === r.q.q)));
    $('again').onclick = qStart;
  }
  document.addEventListener('keydown', e => {
    if ($('p-quiz').hidden || !run || e.target.matches('input')) return;
    const k = e.key.toUpperCase(), i = 'ABCDE'.indexOf(k) >= 0 ? 'ABCDE'.indexOf(k) : '12345'.indexOf(k);
    const opts = $('p-quiz').querySelectorAll('.opt');
    if (i >= 0 && opts[i] && !opts[i].disabled) opts[i].click();
    else if (e.key === 'Enter' && $('next') && !$('next').hidden) $('next').click();
  });
  qStart();

  // vocab
  let vorder = DATA.vocab.slice();
  function vShow(filter) {
    const q = (filter || '').toLowerCase();
    $('vg').innerHTML = vorder.filter(([t, d]) => !q || (t + ' ' + d).toLowerCase().includes(q)).map(([t, d]) => `<div class="vc" tabindex="0"><div><div class="f">${esc(t)}</div><div class="b">${d}</div></div></div>`).join('');
  }
  $('p-vocab').innerHTML = `<div class="vtools"><input id="vq" placeholder="Search terms…" autocomplete="off"><button class="btn" id="vs">Shuffle</button><button class="btn" id="vf">Flip all</button></div><div class="vgrid" id="vg"></div>`;
  vShow('');
  $('vq').oninput = e => vShow(e.target.value);
  $('vs').onclick = () => { vorder = shuffle(vorder); vShow($('vq').value); };
  $('vf').onclick = () => { const cards = [...document.querySelectorAll('.vc')], all = cards.every(c => c.classList.contains('flip')); cards.forEach(c => c.classList.toggle('flip', !all)); };
  $('vg').addEventListener('click', e => { const c = e.target.closest('.vc'); if (c) c.classList.toggle('flip'); });
  $('vg').addEventListener('keydown', e => { const c = e.target.closest('.vc'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); c.classList.toggle('flip'); } });
})();
</script>
</body>
</html>
