<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rational Exponents and Radical Functions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@500&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" media="print" onload="this.media='all'">
<style>
:root {
  --bg: #f7f6fa; --card: #ffffff; --ink: #19161f; --mu: #625b70; --mu2: #8b8499; --ln: #e7e3ee; --soft: #f1eef6;
  --ac: #6a46d6; --acs: #efeafd; --pk: #c23b7a; --ok: #157a4a; --oks: #e6f5ed; --bad: #b8304f; --bads: #fcebef;
  --sans: Geist, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --math: "STIX Two Text", "Cambria Math", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d0b12; --card: #16131d; --ink: #f1eef5; --mu: #a39cb2; --mu2: #7b748a; --ln: #2a2533; --soft: #1e1a27;
    --ac: #a78bfa; --acs: #241d38; --pk: #f07ab3; --ok: #5fd39b; --oks: #12291e; --bad: #ff8aa5; --bads: #2e1620; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body { font: 16px/1.6 var(--sans); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.wrap { max-width: 860px; margin: 0 auto; padding: 28px 20px 80px; }
.kick { font: 500 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ac); }
h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.08; letter-spacing: -.035em; font-weight: 650; margin: 10px 0 12px; }
.lede { color: var(--mu); font-size: 17px; max-width: 640px; }
.src { margin-top: 10px; font-size: 13px; color: var(--mu2); }
.tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; margin: 24px -20px 22px; padding: 10px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--ln); overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: none; border: 0; background: transparent; padding: 8px 14px; border-radius: 999px; font-weight: 550; font-size: 14.5px; color: var(--mu); cursor: pointer; }
.tabs button:hover { color: var(--ink); background: var(--soft); }
.tabs button.on { background: var(--ink); color: var(--bg); }
.tabs b { font-weight: 600; opacity: .6; margin-left: 4px; }
.pane[hidden] { display: none; }

/* study guide */
.toc { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.toc a { font-size: 13.5px; text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--ln); padding: 5px 12px; border-radius: 999px; }
.toc a:hover { border-color: var(--ac); }
.sec { background: var(--card); border: 1px solid var(--ln); border-radius: 18px; padding: 22px 24px; margin-bottom: 14px; scroll-margin-top: 70px; }
.sec h2 { font-size: 21px; letter-spacing: -.02em; font-weight: 650; margin-bottom: 10px; display: flex; gap: 10px; align-items: baseline; }
.sec h2 .n { font: 500 12px var(--mono); color: var(--ac); letter-spacing: .08em; }
.sec p { margin: 8px 0; }
.sec ul { margin: 8px 0 8px 20px; }
.sec li { margin: 5px 0; }
.sec li::marker { color: var(--ac); }
.box { margin: 12px 0; padding: 12px 14px; border-radius: 12px; background: var(--soft); }
.box.key { background: var(--acs); border-left: 3px solid var(--ac); }
.box.warn { background: var(--bads); border-left: 3px solid var(--bad); }
.box b:first-child { display: block; font-size: 12px; font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mu); margin-bottom: 4px; font-weight: 500; }
table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 14.5px; }
th, td { border: 1px solid var(--ln); padding: 7px 10px; text-align: left; vertical-align: top; }
th { background: var(--soft); font-weight: 600; }
details.ex { margin: 10px 0; border: 1px solid var(--ln); border-radius: 12px; overflow: hidden; }
details.ex summary { cursor: pointer; padding: 11px 14px; font-weight: 550; list-style: none; display: flex; gap: 10px; align-items: baseline; }
details.ex summary::-webkit-details-marker { display: none; }
details.ex summary::before { content: "Example"; font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--pk); flex: none; }
details.ex summary::after { content: "Show steps"; margin-left: auto; font-size: 12.5px; color: var(--ac); flex: none; }
details.ex[open] summary::after { content: "Hide"; }
details.ex ol { margin: 0; padding: 4px 16px 12px 36px; }
details.ex li { margin: 6px 0; }
details.ex .ans { padding: 10px 16px 14px; border-top: 1px dashed var(--ln); font-weight: 600; }
.m { font-family: var(--math); font-size: 1.1em; white-space: nowrap; }
.fig { display: block; width: 100%; max-width: 460px; margin: 14px auto 6px; color: var(--mu); }
.fig text { font: 12.5px var(--sans); fill: var(--ink); }
.fig .ac { stroke: var(--ac); }
.fig .acf { fill: var(--ac); }
.figcap { text-align: center; font-size: 13px; color: var(--mu); margin-bottom: 8px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.m i { font-style: italic; }

/* quiz */
.qstart, .qcard, .qend { background: var(--card); border: 1px solid var(--ln); border-radius: 20px; padding: 24px; }
.qstart h2, .qend h2 { font-size: 24px; letter-spacing: -.025em; font-weight: 650; margin-bottom: 6px; }
.sub { color: var(--mu); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.chips button { border: 1px solid var(--ln); background: var(--card); padding: 6px 12px; border-radius: 999px; font-size: 13.5px; cursor: pointer; }
.chips button.on { background: var(--acs); border-color: var(--ac); color: var(--ac); font-weight: 600; }
.btn { border: 0; cursor: pointer; padding: 11px 20px; border-radius: 999px; font-weight: 600; font-size: 15px; background: var(--soft); }
.btn.pri { background: var(--ink); color: var(--bg); }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
.qtop { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 13.5px; color: var(--mu); }
.qtop .t { font: 500 11.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ac); background: var(--acs); padding: 3px 9px; border-radius: 999px; }
.bar { height: 4px; border-radius: 4px; background: var(--soft); overflow: hidden; margin-bottom: 18px; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--ac), var(--pk)); transition: width .4s; }
.qq { font-size: 18.5px; line-height: 1.5; font-weight: 500; margin-bottom: 16px; }
.opts { display: grid; gap: 9px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; border: 1.5px solid var(--ln); background: var(--card); padding: 12px 14px; border-radius: 14px; cursor: pointer; font-size: 15.5px; line-height: 1.45; transition: border-color .15s, background-color .15s; }
.opt:hover:not(:disabled) { border-color: var(--ac); }
.opt .l { flex: none; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font: 600 12px var(--mono); background: var(--soft); color: var(--mu); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--oks); }
.opt.right .l { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bads); }
.opt.wrong .l { background: var(--bad); color: #fff; }
.why { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--soft); font-size: 15px; }
.why b { color: var(--ok); }
.why.no b { color: var(--bad); }
.big { font-size: 54px; font-weight: 650; letter-spacing: -.04em; line-height: 1; margin: 6px 0 4px; background: linear-gradient(100deg, var(--ac), var(--pk)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.tbars { display: grid; gap: 10px; margin: 18px 0; }
.tb { display: grid; grid-template-columns: minmax(120px, 1fr) 2fr 48px; gap: 12px; align-items: center; font-size: 14px; }
.tb .tr { height: 8px; border-radius: 8px; background: var(--soft); overflow: hidden; }
.tb .tr i { display: block; height: 100%; background: var(--ac); }
.tb .p { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.miss { margin-top: 18px; display: grid; gap: 10px; }
.miss > div { border: 1px solid var(--ln); border-radius: 14px; padding: 12px 14px; font-size: 14.5px; }
.miss .a { color: var(--ok); font-weight: 600; margin-top: 4px; }
.miss .w { color: var(--mu); margin-top: 4px; }
.best { font-size: 13.5px; color: var(--mu2); margin-top: 8px; }

/* vocab */
.vtools { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.vtools input { flex: 1; min-width: 180px; font: inherit; font-size: 15px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--ln); background: var(--card); color: var(--ink); outline: none; }
.vtools input:focus { border-color: var(--ac); }
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.vc { perspective: 900px; height: 150px; cursor: pointer; }
.vc > div { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.2,.7,.2,1); }
.vc.flip > div { transform: rotateY(180deg); }
.vc .f, .vc .b { position: absolute; inset: 0; border-radius: 16px; padding: 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; text-align: center; border: 1px solid var(--ln); background: var(--card); overflow: auto; }
.vc .f { font-weight: 650; font-size: 18px; letter-spacing: -.01em; }
.vc .b { transform: rotateY(180deg); font-size: 14px; color: var(--mu); background: var(--acs); }
.foot { margin-top: 34px; font-size: 13px; color: var(--mu2); text-align: center; }
@media (max-width: 560px) { .sec { padding: 18px; } .qstart, .qcard, .qend { padding: 18px; } .qq { font-size: 17px; } .tb { grid-template-columns: 1fr 1fr 44px; } }
@media print { .tabs, .row, .chips { display: none !important; } .pane[hidden] { display: block !important; } .sec, .qcard { break-inside: avoid; } }
</style>
</head>

<div class="wrap">
  <div class="kick" id="kick"></div>
  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>
  <p class="src" id="src"></p>
  <nav class="tabs" id="tabs"></nav>
  <section class="pane" id="p-guide"></section>
  <section class="pane" id="p-quiz" hidden></section>
  <section class="pane" id="p-vocab" hidden></section>
  <p class="foot">Made for Classboard. Check anything you're unsure about with your teacher or your class notes.</p>
</div>
<script>
const DATA = {"id":"alg2-t5","cls":"Algebra 2","kick":"Algebra 2 · Topic 5 · Lessons 5-1 to 5-6","title":"Rational Exponents and Radical Functions","lede":"Everything for Topic 5: nth roots and rational exponents, properties of exponents and radicals, graphing radical functions, solving radical equations, function operations and composition, and inverse functions. Study guide with worked examples, a practice quiz and the vocab.","src":"Matches Topic 5 of enVision Algebra 2 (2018), the book Issaquah School District uses for Algebra 2. All problems here are original practice.","guide":[{"title":"nth roots (5-1)","body":"\n      <p>An <b>nth root</b> of <span class=\"m\"><i>a</i></span> is a number that gives <span class=\"m\"><i>a</i></span> when raised to the nth power. In <span class=\"m\"><sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">n</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>a</i></span></span>, <span class=\"m\"><i>n</i></span> is the <b>index</b> and <span class=\"m\"><i>a</i></span> is the <b>radical</b> (radicand).</p>\n      <table><tr><th></th><th>a positive</th><th>a = 0</th><th>a negative</th></tr>\n      <tr><th>n even</th><td>two real roots, <span class=\"m\">±</span></td><td>one (0)</td><td>no real roots</td></tr>\n      <tr><th>n odd</th><td>one real root (positive)</td><td>one (0)</td><td>one real root (negative)</td></tr></table>\n      <p>The radical sign by itself means the <b>principal root</b>: the positive one when there are two. So <span class=\"m\"><sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">4</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\">81</span> = 3</span>, but the real fourth roots of 81 are 3 and −3.</p>","examples":[{"q":"Find all real roots: the fourth roots of 81, the cube roots of −64, and the square roots of −25.","steps":["<span class=\"m\">3<sup>4</sup> = 81</span> and <span class=\"m\">(−3)<sup>4</sup> = 81</span>, so the fourth roots of 81 are ±3.","<span class=\"m\">(−4)<sup>3</sup> = −64</span>, so the only real cube root of −64 is −4.","No real number squared is negative, so −25 has no real square roots."],"a":"±3; −4; none"}]},{"title":"Rational exponents (5-1)","body":"\n      <div class=\"box key\"><b>The rule</b><span class=\"m\"><i>a</i><sup>1/n</sup> = <sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">n</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>a</i></span></span> and <span class=\"m\"><i>a</i><sup><i>m</i>/n</sup> = (<sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">n</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>a</i></span>)<sup><i>m</i></sup> = <sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">n</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>a</i><sup><i>m</i></sup></span></span>. The bottom of the fraction is the root; the top is the power.</div>\n      <ul><li>Take the root first when you can; the numbers stay small.</li>\n      <li>A negative exponent means reciprocal: <span class=\"m\"><i>a</i><sup>−<i>m</i>/n</sup> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\"><i>a</i><sup><i>m</i>/n</sup></span></span></span>.</li></ul>","examples":[{"q":"Evaluate <span class=\"m\">27<sup>2/3</sup></span> and <span class=\"m\">16<sup>−3/4</sup></span>.","steps":["<span class=\"m\">27<sup>2/3</sup> = (<sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">3</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\">27</span>)<sup>2</sup> = 3<sup>2</sup> = 9</span>.","<span class=\"m\">16<sup>−3/4</sup> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">16<sup>3/4</sup></span></span></span>, and <span class=\"m\">16<sup>3/4</sup> = (<sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">4</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\">16</span>)<sup>3</sup> = 2<sup>3</sup> = 8</span>."],"a":"<span class=\"m\">27<sup>2/3</sup> = 9</span>; <span class=\"m\">16<sup>−3/4</sup> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">8</span></span></span>"},{"q":"Rewrite <span class=\"m\"><i>x</i><sup>3/5</sup></span> with a radical, and <span class=\"m\"><sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">4</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>y</i><sup>2</sup></span></span> with a rational exponent.","steps":["Denominator 5 is the index, numerator 3 is the power: <span class=\"m\"><sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">5</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>x</i><sup>3</sup></span></span> (or <span class=\"m\">(<sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">5</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>x</i></span>)<sup>3</sup></span>).","Index 4, power 2: <span class=\"m\"><i>y</i><sup>2/4</sup> = <i>y</i><sup>1/2</sup></span>."],"a":"<span class=\"m\"><sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">5</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>x</i><sup>3</sup></span></span>; <span class=\"m\"><i>y</i><sup>1/2</sup></span>"}]},{"title":"Properties of exponents and radicals (5-2)","body":"\n      <table><tr><th>Rule</th><th>Example</th></tr>\n      <tr><td><span class=\"m\"><i>a</i><sup><i>m</i></sup> · <i>a</i><sup><i>n</i></sup> = <i>a</i><sup><i>m</i> + <i>n</i></sup></span></td><td><span class=\"m\"><i>x</i><sup>1/2</sup> · <i>x</i><sup>1/3</sup> = <i>x</i><sup>5/6</sup></span></td></tr>\n      <tr><td><span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>a</i><sup><i>m</i></sup></span><span style=\"padding:0 3px\"><i>a</i><sup><i>n</i></sup></span></span> = <i>a</i><sup><i>m</i> − <i>n</i></sup></span></td><td><span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i><sup>3/4</sup></span><span style=\"padding:0 3px\"><i>x</i><sup>1/4</sup></span></span> = <i>x</i><sup>1/2</sup></span></td></tr>\n      <tr><td><span class=\"m\">(<i>a</i><sup><i>m</i></sup>)<sup><i>n</i></sup> = <i>a</i><sup>mn</sup></span>, <span class=\"m\">(ab)<sup><i>n</i></sup> = <i>a</i><sup><i>n</i></sup> <i>b</i><sup><i>n</i></sup></span></td><td><span class=\"m\">(8<i>x</i><sup>6</sup>)<sup>1/3</sup> = 2<i>x</i><sup>2</sup></span></td></tr>\n      <tr><td><span class=\"m\"><sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">n</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\">ab</span> = <sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">n</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>a</i></span> · <sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">n</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>b</i></span></span></td><td><span class=\"m\">√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\">72</span> = √<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\">36</span> · √<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\">2</span> = 6√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\">2</span></span></td></tr>\n      <tr><td><span class=\"m\"><sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">n</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i><i>a</i></i></span><span style=\"padding:0 3px\"><i><i>b</i></i></span></span></span> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\"><i>n</i></sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i><i>a</i></i></span></span><span style=\"padding:0 3px\"><sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\"><i>n</i></sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i><i>b</i></i></span></span></span></span></td><td><span class=\"m\">√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">5</span><span style=\"padding:0 3px\">9</span></span></span> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\">5</span></span><span st div>","examples":[{"q":"Solve <span class=\"m\">√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>x</i> + 7</span> = <i>x</i> − 5</span>.","steps":["Square both sides: <span class=\"m\"><i>x</i> + 7 = <i>x</i><sup>2</sup> − 10<i>x</i> + 25</span>.","Set to 0: <span class=\"m\"><i>x</i><sup>2</sup> − 11<i>x</i> + 18 = 0</span>, so <span class=\"m\">(<i>x</i> − 2)(<i>x</i> − 9) = 0</span>.","Check <span class=\"m\"><i>x</i> = 2</span>: <span class=\"m\">√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\">9</span> = 3</span> but <span class=\"m\">2 − 5 = −3</span>. Extraneous.","Check <span class=\"m\"><i>x</i> = 9</span>: <span class=\"m\">√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\">16</span> = 4</span> and <span class=\"m\">9 − 5 = 4</span>. It works."],"a":"<span class=\"m\"><i>x</i> = 9</span> (x = 2 is extraneous)"},{"q":"Solve <span class=\"m\">(<i>x</i> − 1)<sup>2/3</sup> = 4</span>.","steps":["Cube both sides to undo the 3 in the denominator: <span class=\"m\">(<i>x</i> − 1)<sup>2</sup> = 64</span>.","Take the square root (both signs): <span class=\"m\"><i>x</i> − 1 = ±8</span>.","So <span class=\"m\"><i>x</i> = 9</span> or <span class=\"m\"><i>x</i> = −7</span>. Check: <span class=\"m\">8<sup>2/3</sup> = 4</span> and <span class=\"m\">(−8)<sup>2/3</sup> = (−2)<sup>2</sup> = 4</span>. Both work."],"a":"<span class=\"m\"><i>x</i> = 9</span> or <span class=\"m\"><i>x</i> = −7</span>"}]},{"title":"Function operations and composition (5-5)","body":"\n      <ul><li><span class=\"m\">(<i>f</i> + <i>g</i>)(<i>x</i>) = <i>f</i>(<i>x</i>) + <i>g</i>(<i>x</i>)</span>, <span class=\"m\">(<i>f</i> − <i>g</i>)(<i>x</i>) = <i>f</i>(<i>x</i>) − <i>g</i>(<i>x</i>)</span>, <span class=\"m\">(fg)(<i>x</i>) = <i>f</i>(<i>x</i>) · <i>g</i>(<i>x</i>)</span>.</li>\n      <li><span class=\"m\">(<span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>f</i></span><span style=\"padding:0 3px\"><i>g</i></span></span>)(<i>x</i>) = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>f</i>(<i>x</i>)</span><span style=\"padding:0 3px\"><i>g</i>(<i>x</i>)</span></span></span>, and its domain leaves out every x where <span class=\"m\"><i>g</i>(<i>x</i>) = 0</span>.</li>\n      <li><b>Composition</b>: <span class=\"m\">(<i>f</i> ∘ <i>g</i>)(<i>x</i>) = <i>f</i>(<i>g</i>(<i>x</i>))</span>. Work from the inside out: put x into g, then put that output into f.</li>\n      <li>Order matters: <span class=\"m\"><i>f</i>(<i>g</i>(<i>x</i>))</span> and <span class=\"m\"><i>g</i>(<i>f</i>(<i>x</i>))</span> are usually different.</li></ul>","examples":[{"q":"Let <span class=\"m\"><i>f</i>(<i>x</i>) = <i>x</i><sup>2</sup> − 1</span> and <span class=\"m\"><i>g</i>(<i>x</i>) = <i>x</i> + 3</span>. Find <span class=\"m\">(<i>f</i> + <i>g</i>)(<i>x</i>)</span>, <span class=\"m\">(fg)(<i>x</i>)</span>, <span class=\"m\">(<span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>f</i></span><span style=\"padding:0 3px\"><i>g</i></span></span>)(<i>x</i>)</span>, <span class=\"m\">(<i>f</i> ∘ <i>g</i>)(<i>x</i>)</span> and <span class=\"m\">(<i>g</i> ∘ <i>f</i>)(<i>x</i>)</span>.","steps":["<span class=\"m\">(<i>f</i> + <i>g</i>)(<i>x</i>) = <i>x</i><sup>2</sup> + <i>x</i> + 2</span>.","<span class=\"m\">(fg)(<i>x</i>) = (<i>x</i><sup>2</sup> − 1)(<i>x</i> + 3) = <i>x</i><sup>3</sup> + 3<i>x</i><sup>2</sup> − <i>x</i> − 3</span>.","<span class=\"m\">(<span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>f</i></span><span style=\"padding:0 3px\"><i>g</i></span></span>)(<i>x</i>) = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i><sup>2</sup> − 1</span><span style=\"padding:0 3px\"><i>x</i> + 3</span></span></span>, with <span class=\"m\"><i>x</i> ≠ −3</span>.","<span class=\"m\"><i>f</i>(<i>g</i>(<i>x</i>)) = (<i>x</i> + 3)<sup>2</sup> − 1 = <i>x</i><sup>2</sup> + 6<i>x</i> + 8</span>.","<span class=\"m\"><i>g</i>(<i>f</i>(<i>x</i>)) = (<i>x</i><sup>2</sup> − 1) + 3 = <i>x</i><sup>2</sup> + 2</span>."],"a":"Notice <span class=\"m\"><i>f</i>(<i>g</i>(<i>x</i>)) ≠ <i>g</i>(<i>f</i>(<i>x</i>))</span>. For example <span class=\"m\">(<i>f</i> ∘ <i>g</i>)(1) = <i>f</i>(4) = 15</span> but <span class=\"m\">(<i>g</i> ∘ <i>f</i>)(1) = <i>g</i>(0) = 3</span>."}]},{"title":"Inverse relations and functions (5-6)","body":"\n      <ul><li>The <b>inverse</b> undoes the function. To find it, <b>switch x and y</b> and solve for y. Write it <span class=\"m\"><i>f</i><sup>−1</sup>(<i>x</i>)</span>.</li>\n      <li>The graph of the inverse is the reflection of the original over the line <span class=\"m\"><i>y</i> = <i>x</i></span>; the domain and range trade places.</li>\n      <li>The inverse is a function only if the original is <b>one-to-one</b> (passes the <b>horizontal line test</b>). If not, restrict the domain.</li>\n      <li>Check: <span class=\"m\"><i>f</i>(<i>f</i><sup>−1</sup>(<i>x</i>)) = <i>x</i></span> and <span class=\"m\"><i>f</i><sup>−1</sup>(<i>f</i>(<i>x</i>)) = <i>x</i></span>.</li></ul>","examples":[{"q":"Find the inverse of <span class=\"m\"><i>f</i>(<i>x</i>) = 3<i>x</i> − 6</span>.","steps":["Write <span class=\"m\"><i>y</i> = 3<i>x</i> − 6</span> and switch: <span class=\"m\"><i>x</i> = 3<i>y</i> − 6</span>.","Solve: <span class=\"m\"><i>x</i> + 6 = 3<i>y</i></span>, so <span class=\"m\"><i>y</i> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i> + 6</span><span style=\"padding:0 3px\">3</span></span></span>.","Check: <span class=\"m\"><i>f</i>(<span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i> + 6</span><span style=\"padding:0 3px\">3</span></span>) = (<i>x</i> + 6) − 6 = <i>x</i></span>."],"a":"<span class=\"m\"><i>f</i><sup>−1</sup>(<i>x</i>) = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i></span><span style=\"padding:0 3px\">3</span></span> + 2</span>"},{"q":"Find the inverse of <span class=\"m\"><i>f</i>(<i>x</i>) = √<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>x</i> − 2</span></span> and its domain.","steps":["Range of f is <span class=\"m\"><i>y</i> ≥ 0</span>, so the inverse will have domain <span class=\"m\"><i>x</i> ≥ 0</span>.","Switch: <span class=\"m\"><i>x</i> = √<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>y</i> − 2</span></span>. Square: <span class=\"m\"><i>x</i><sup>2</sup> = <i>y</i> − 2</span>.","<div style=\"display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap\"><div style=\"flex:1;min-width:220px\">So <span class=\"m\"><i>y</i> = <i>x</i><sup>2</sup> + 2</span> for <span class=\"m\"><i>x</i> ≥ 0</span>. The two graphs are mirror images over <span class=\"m\"><i>y</i> = <i>x</i></span>.</div><svg class=\"fig\" viewBox=\"0 0 272 272\" style=\"width:260px;\" role=\"img\" aria-label=\"A function and its inverse reflected across the line y equals x\"><line x1=\"16\" y1=\"16\" </span>. The −1 means inverse, not reciprocal.</li></ul>"}],"quiz":[{"t":"Roots & exponents","q":"Evaluate <span class=\"m\">8<sup>2/3</sup></span>.","c":["4","2","16","12"],"a":0,"why":"<span class=\"m\">(<sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">3</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\">8</span>)<sup>2</sup> = 2<sup>2</sup> = 4</span>."},{"t":"Roots & exponents","q":"Evaluate <span class=\"m\">81<sup>−1/2</sup></span>.","c":["<span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">9</span></span></span>","−9","9","<span class=\"m\">−<span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">9</span></span></span>"],"a":0,"why":"A negative exponent means reciprocal: <span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">81<sup>1/2</sup></span></span> = <span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\">9</span></span></span>. It does not make the answer negative."},{"t":"Roots & exponents","q":"Which is equal to <span class=\"m\"><i>x</i><sup>3/5</sup></span>?","c":["<span class=\"m\"><sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">5</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>x</i><sup>3</sup></span></span>","<span class=\"m\"><sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">3</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>x</i><sup>5</sup></span></span>","<span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\"><i>x</i><sup>3</sup></span><span style=\"padding:0 3px\">5</span></span></span>","<span class=\"m\">5√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>x</i><sup>3</sup></span></span>"],"a":0,"why":"The denominator is the index (5) and the numerator is the power (3)."},{"t":"Roots & exponents","q":"How many real fourth roots does −16 have?","c":["None","One","Two","Four"],"a":0,"why":"An even power can never be negative, so a negative number has no real even roots."},{"t":"Roots & exponents","q":"Simplify <span class=\"m\"><sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">3</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\">−125</span></span>.","c":["−5","5","Not a real number","−25"],"a":0,"why":"<span class=\"m\">(−5)<sup>3</sup> = −125</span>. Odd roots of negative numbers are real and negative."},{"t":"Properties","q":"Simplify completely: <span class=\"m\">√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\">72</span></span>.","c":["<span class=\"m\">6√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\">2</span></span>","<span class=\"m\">3√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\">8</span></span>","<span class=\"m\">2√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\">6</span></span>","<span class=\"m\">36√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\">2</span></span>"],"a":0,"why":"<span class=\"m\">√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\">72</sp <span style=\"padding:0 3px\">4</span></span> + 2</span>."},{"t":"Inverses","q":"What is the inverse of <span class=\"m\"><i>f</i>(<i>x</i>) = <i>x</i><sup>3</sup> + 1</span>?","c":["<span class=\"m\"><sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">3</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>x</i> − 1</span></span>","<span class=\"m\"><sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">3</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>x</i></span> − 1</span>","<span class=\"m\"><sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">3</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>x</i> + 1</span></span>","<span class=\"m\"><span style=\"display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.18;margin:0 2px\"><span style=\"border-bottom:1px solid currentColor;padding:0 3px\">1</span><span style=\"padding:0 3px\"><i>x</i><sup>3</sup> + 1</span></span></span>"],"a":0,"why":"Switch: <span class=\"m\"><i>x</i> = <i>y</i><sup>3</sup> + 1</span>, so <span class=\"m\"><i>y</i><sup>3</sup> = <i>x</i> − 1</span>."},{"t":"Inverses","q":"Which function's inverse is NOT a function unless you restrict the domain?","c":["<span class=\"m\"><i>f</i>(<i>x</i>) = <i>x</i><sup>2</sup> + 1</span>","<span class=\"m\"><i>f</i>(<i>x</i>) = 2<i>x</i> − 5</span>","<span class=\"m\"><i>f</i>(<i>x</i>) = <i>x</i><sup>3</sup></span>","<span class=\"m\"><i>f</i>(<i>x</i>) = √<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>x</i></span></span>"],"a":0,"why":"A parabola fails the horizontal line test: for example <span class=\"m\"><i>f</i>(2) = <i>f</i>(−2) = 5</span>."},{"t":"Inverses","q":"The graphs of a function and its inverse are reflections over which line?","c":["<span class=\"m\"><i>y</i> = <i>x</i></span>","The x-axis","The y-axis","<span class=\"m\"><i>y</i> = −<i>x</i></span>"],"a":0,"why":"Switching x and y swaps every point (a, b) to (b, a), a reflection over <span class=\"m\"><i>y</i> = <i>x</i></span>."},{"t":"Inverses","q":"How can you prove that f and g are inverses?","c":["Show <span class=\"m\"><i>f</i>(<i>g</i>(<i>x</i>)) = <i>x</i></span> and <span class=\"m\"><i>g</i>(<i>f</i>(<i>x</i>)) = <i>x</i></span>","Show <span class=\"m\"><i>f</i>(<i>x</i>) · <i>g</i>(<i>x</i>) = 1</span>","Show <span class=\"m\"><i>f</i>(<i>x</i>) + <i>g</i>(<i>x</i>) = 0</span>","Show they have the same y-intercept"],"a":0,"why":"Each one undoes the other, so composing them in either order gives back x."}],"vocab":[["nth root","A number that gives <span class=\"m\"><i>a</i></span> when raised to the nth power."],["Index","The small n in <span class=\"m\"><sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">n</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>a</i></span></span>; which root you are taking."],["Radicand","The expression under the radical sign."],["Principal root","The nonnegative root a radical sign stands for, like <span class=\"m\">√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\">9</span> = 3</span>."],["Rational exponent","A fraction exponent: <span class=\"m\"><i>a</i><sup><i>m</i>/n</sup> = <sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">n</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>a</i><sup><i>m</i></sup></span></span>."],["Like radicals","Radicals with the same index and radicand, which can be added or subtracted."],["Rationalize the denominator","Rewrite a fraction so no radical is left on the bottom."],["Conjugate","<span class=\"m\"><i>a</i> + √<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>b</i></span></span> and <span class=\"m\"><i>a</i> − √<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>b</i></span></span>; their product has no radical."],["Radical function","A function with the variable under a radical, like <span class=\"m\">√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>x</i> − 2</span></span>."],["Square root function","<span class=\"m\"><i>f</i>(<i>x</i>) = √<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>x</i></span></span>: domain and range <span class=\"m\">≥ 0</span>."],["Cube root function","<span class=\"m\"><i>f</i>(<i>x</i>) = <sup style=\"font-size:.66em;margin-right:-.42em;vertical-align:.95em\">3</sup>√<span style=\"border-top:1px solid currentColor;padding:0 1px 0 1px\"><i>x</i></span></span>: domain and range all real numbers."],["Radical equation","An equation with the variable inside a radical."],["Extraneous solution","An answer from the steps that doesn't work in the original equation."],["Composite function","<span class=\"m\">(<i>f</i> ∘ <i>g</i>)(<i>x</i>) = <i>f</i>(<i>g</i>(<i>x</i>))</span>: the output of g becomes the input of f."],["Inverse relation","The relation you get by switching x and y."],["Inverse function","<span class=\"m\"><i>f</i><sup>−1</sup></span>, which undoes <span class=\"m\"><i>f</i></span>: <span class=\"m\"><i>f</i>(<i>f</i><sup>−1</sup>(<i>x</i>)) = <i>x</i></span>."],["One-to-one function","A function where each output comes from only one input; its inverse is a function."],["Horizontal line test","If any horizontal line hits the graph twice, the inverse is not a function."]]};
(function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = { get(k, d) { try { const v = localStorage.getItem('cbstudy:' + DATA.id + ':' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
                  set(k, v) { try { localStorage.setItem('cbstudy:' + DATA.id + ':' + k, JSON.stringify(v)); } catch (e) {} } };
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  $('kick').textContent = DATA.kick; $('title').textContent = DATA.title; $('lede').innerHTML = DATA.lede; $('src').innerHTML = DATA.src || '';
  document.title = DATA.title + ' · ' + DATA.cls;

  // tabs
  const TABS = [['guide', 'Study guide', ''], ['quiz', 'Practice quiz', DATA.quiz.length], ['vocab', 'Vocab', DATA.vocab.length]];
  $('tabs').innerHTML = TABS.map(([k, l, n]) => `<button data-tab="${k}">${l}${n ? `<b>${n}</b>` : ''}</button>`).join('');
  function show(k) {
    TABS.forEach(([t]) => { $('p-' + t).hidden = t !== k; });
    document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === k));
  }
  $('tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) { show(b.dataset.tab); window.scrollTo({ top: 0, behavior: 'smooth' }); } };
  show('guide');

  // study guide
  $('p-guide').innerHTML = `<div class="toc">${DATA.guide.map((s, i) => `<a href="#s${i}">${esc(s.title)}</a>`).join('')}</div>` +
    DATA.guide.map((s, i) => `<article class="sec" id="s${i}"><h2><span class="n">${String(i + 1).padStart(2, '0')}</span>${esc(s.title)}</h2>${s.body || ''}
      ${(s.examples || []).map(x => `<details class="ex"><summary>${x.q}</summary><ol>${x.steps.map(st => `<li>${st}</li>`).join('')}</ol><div class="ans">${x.a}</div></details>`).join('')}</article>`).join('');
  $('p-guide').addEventListener('click', e => { const a = e.target.closest('.toc a'); if (!a) return; e.preventDefault(); const el = document.querySelector(a.getAttribute('href')); if (el) el.scrollIntoView({ behavior: 'smooth' }); });

  // practice quiz
  const topics = [...new Set(DATA.quiz.map(q => q.t))];
  let pick = new Set(topics), run = null;
  function qStart() {
    const best = store.get('best', null);
    $('p-quiz').innerHTML = `<div class="qstart"><h2>Practice quiz</h2><p class="sub">${DATA.quiz.length} questions. You'll see why each answer is right as you go, and a breakdown by topic at the end.</p>
      ${topics.length > 1 ? `<div class="chips">${topics.map(t => `<button data-topic="${esc(t)}" class="${pick.has(t) ? 'on' : ''}">${esc(t)}</button>`).join('')}</div>` : ''}
      <div class="row"><button class="btn pri" id="go">Start (${DATA.quiz.filter(q => pick.has(q.t)).length} questions)</button></div>
      ${best ? `<p class="best">Your best: ${best.pct}% on ${new Date(best.at).toLocaleDateString()}</p>` : ''}</div>`;
    $('p-quiz').querySelectorAll('[data-topic]').forEach(b => b.onclick = () => { const t = b.dataset.topic; if (pick.has(t) && pick.size > 1) pick.delete(t); else pick.add(t); qStart(); });
    $('go').onclick = () => begin(DATA.quiz.filter(q => pick.has(q.t)));
  }
  function begin(list) { run = { qs: shuffle(list).map(q => Object.assign({}, q, { order: shuffle(q.c.map((_, i) => i)) })), i: 0, res: [] }; qShow(); }
  function qShow() {
    const q = run.qs[run.i], n = run.qs.length;
    $('p-quiz').innerHTML = `<div class="qcard"><div class="qtop"><span class="t">${esc(q.t)}</span><span>${run.i + 1} of ${n}</span></div>
      <div class="bar"><i style="width:${(run.i / n) * 100}%"></i></div><div class="qq">${q.q}</div>
      <div class="opts">${q.order.map((ci, k) => `<button class="opt" data-ci="${ci}"><span class="l">${'ABCDE'[k]}</span><span>${q.c[ci]}</span></button>`).join('')}</div>
      <div id="why"></div><div class="row"><button class="btn pri" id="next" hidden>${run.i + 1 < n ? 'Next question' : 'See my results'}</button></div></div>`;
    $('p-quiz').querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.ci));
  }
  function answer(ci) {
    const q = run.qs[run.i], ok = ci === q.a;
    if (run.res.length > run.i) return;
    run.res.push({ q, ok, ci });
    $('p-quiz').querySelectorAll('.opt').forEach(b => { b.disabled = true; const c = +b.dataset.ci; if (c === q.a) b.classList.add('right'); else if (c === ci) b.classList.add('wrong'); });
    $('why').innerHTML = `<div class="why${ok ? '' : ' no'}"><b>${ok ? 'Correct.' : 'Not quite.'}</b> ${q.why}</div>`;
    const nx = $('next'); nx.hidden = false; nx.focus(); nx.onclick = () => { run.i++; if (run.i < run.qs.length) qShow(); else qEnd(); };
  }
  function qEnd() {
    const n = run.res.length, right = run.res.filter(r => r.ok).length, pct = Math.round(right / n * 100);
    const best = store.get('best', null);
    if (n === DATA.quiz.length && (!best || pct >= best.pct)) store.set('best', { pct, at: Date.now() });
    const by = topics.map(t => { const l = run.res.filter(r => r.q.t === t); return { t, n: l.length, ok: l.filter(r => r.ok).length }; }).filter(x => x.n);
    const misses = run.res.filter(r => !r.ok);
    $('p-quiz').innerHTML = `<div class="qend"><div class="sub">${right} of ${n} right</div><div class="big">${pct}%</div>
      <h2>${pct >= 90 ? "You're ready for this." : pct >= 75 ? 'Close. Clean up the misses below.' : pct >= 50 ? 'Good start. Review your weakest topic, then try again.' : 'Go back through the study guide, then try again.'}</h2>
      <div class="tbars">${by.map(x => `<div class="tb"><span>${esc(x.t)}</span><span class="tr"><i style="width:${x.ok / x.n * 100}%"></i></span><span class="p">${x.ok}/${x.n}</span></div>`).join('')}</div>
      <div class="row">${misses.length ? '<button class="btn pri" id="redo">Retry the ones I missed</button>' : ''}<button class="btn" id="again">Start over</button></div>
      ${misses.length ? `<div class="miss">${misses.map(r => `<div>${r.q.q}<div class="w">You picked: ${r.q.c[r.ci]}</div><div class="a">Answer: ${r.q.c[r.q.a]}</div><div class="w">${r.q.why}</div></div>`).join('')}</div>` : ''}</div>`;
    if (misses.length) $('redo').onclick = () => begin(misses.map(r => DATA.quiz.find(q => q.q === r.q.q)));
    $('again').onclick = qStart;
  }
  document.addEventListener('keydown', e => {
    if ($('p-quiz').hidden || !run || e.target.matches('input')) return;
    const k = e.key.toUpperCase(), i = 'ABCDE'.indexOf(k) >= 0 ? 'ABCDE'.indexOf(k) : '12345'.indexOf(k);
    const opts = $('p-quiz').querySelectorAll('.opt');
    if (i >= 0 && opts[i] && !opts[i].disabled) opts[i].click();
    else if (e.key === 'Enter' && $('next') && !$('next').hidden) $('next').click();
  });
  qStart();

  // vocab
  let vorder = DATA.vocab.slice();
  function vShow(filter) {
    const q = (filter || '').toLowerCase();
    $('vg').innerHTML = vorder.filter(([t, d]) => !q || (t + ' ' + d).toLowerCase().includes(q)).map(([t, d]) => `<div class="vc" tabindex="0"><div><div class="f">${esc(t)}</div><div class="b">${d}</div></div></div>`).join('');
  }
  $('p-vocab').innerHTML = `<div class="vtools"><input id="vq" placeholder="Search terms…" autocomplete="off"><button class="btn" id="vs">Shuffle</button><button class="btn" id="vf">Flip all</button></div><div class="vgrid" id="vg"></div>`;
  vShow('');
  $('vq').oninput = e => vShow(e.target.value);
  $('vs').onclick = () => { vorder = shuffle(vorder); vShow($('vq').value); };
  $('vf').onclick = () => { const cards = [...document.querySelectorAll('.vc')], all = cards.every(c => c.classList.contains('flip')); cards.forEach(c => c.classList.toggle('flip', !all)); };
  $('vg').addEventListener('click', e => { const c = e.target.closest('.vc'); if (c) c.classList.toggle('flip'); });
  $('vg').addEventListener('keydown', e => { const c = e.target.closest('.vc'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); c.classList.toggle('flip'); } });
})();
</script>
</body>
</html>
