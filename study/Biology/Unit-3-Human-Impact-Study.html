/* short answers: graded by the AI as a 9th grade biology teacher, 3 points each */
const SA = [
  {id: "a01", t: "stages", q: "Explain why the death rate falls in Stage 2 of the demographic transition while the birth rate stays high. What happens to the population?", key: ["Death rate falls because of better health care and sanitation, a better food supply, clean water, public health and hygiene", "Infant mortality goes down", "Birth rate stays high (families still have many children; birth control not common yet)", "Births are much greater than deaths, so the population grows rapidly"], model: "In Stage 2, better health care, sanitation, food supply and clean water mean fewer people die, especially babies, so the death rate drops. Families still have lots of children because birth control and family planning aren't common yet, so the birth rate stays high. With births much higher than deaths, the population grows rapidly."},
  {id: "a02", t: "stages", q: "What causes birth rates to fall in Stage 3 of the demographic transition? Give at least two causes.", key: ["More access to birth control / contraception", "Improved education, especially for women; women's status and value beyond motherhood increase", "Children cost more (higher education)", "Increasing urbanization", "Smaller families result"], model: "Birth rates fall in Stage 3 because people get more access to birth control and education. Women's status grows, so they are valued for more than having children, and kids cost more because they need more schooling. These changes, along with more people living in cities, lead to smaller families."},
  {id: "a03", t: "stages", q: "Japan (2023) has a birth rate of 6.0 per 1,000 and a death rate of 13.0 per 1,000. Which stage is Japan in? Use the data to explain, then describe the problems a country faces in Stages 4 and 5.", key: ["Fewer young people and more elderly", "Greater tax burden and a lack of health care", "Stage 5: death rate exceeds birth rate, so population declines", "Labor shortages and higher health care and social security costs", "Japan is Stage 5 because its death rate (13.0) is higher than its birth rate (6.0)"], model: "Japan is in Stage 5 because its death rate (13.0 per 1,000) is higher than its birth rate (6.0 per 1,000), so its population is shrinking. In Stage 4 there are fewer young people and more elderly people, which creates a bigger tax burden and a lack of health care. In Stage 5 deaths outnumber births, which causes labor shortages and higher health care and social security costs."},
  {id: "a04", t: "stages", q: "Describe all five stages of the demographic transition, including what happens to birth rates and death rates in each.", key: ["Stage 1: high birth and death rates, slow growth", "Stage 2: birth rate stays high, death rate falls, rapid growth", "Stage 3: death rate low, birth rate falls, growth slows", "Stage 4: both low, population stable", "Stage 5: death rate higher than birth rate, population declines"], model: "Stage 1: birth and death rates are both high, so growth is slow. Stage 2: the death rate falls but births stay high, so the population grows rapidly. Stage 3: the death rate is low and the birth rate starts falling, so growth slows. Stage 4: both rates are low and the population is stable. Stage 5: the death rate is higher than the birth rate, so the population declines."},
  {id: "a05", t: "pop", fig: "history", ft: "Graph: human population from 10,000 B.C. to 2000 A.D. It stays near 500 million or less for most of history, dips at the bubonic plague, then shoots up to about 6 billion after the Industrial Revolution. Marked events: agriculture begins, plowing and irrigation, bubonic plague, Industrial Revolution begins.", q: "Explain how the human population has changed over time. Mention at least two events that affected it.", key: ["Stayed low (around 500 million or less) for most of human history", "Agriculture, plowing and irrigation, and the Industrial Revolution increased carrying capacity", "The bubonic plague (density-dependent factor) made it drop", "Grew extremely fast after the Industrial Revolution (over 1 billion since about 1800, about 6 billion by 2000)", "Still increasing today but the growth rate is decreasing"], model: "For most of history the human population stayed low, around 500 million or less. Plowing and irrigation and then the Industrial Revolution increased Earth's carrying capacity for humans, while the bubonic plague caused a drop. After the Industrial Revolution the population exploded, passing 1 billion around 1800 and reaching about 6 billion by 2000. It is still increasing today, but the rate of growth is slowing down."},
  {id: "a06", t: "countries", fig: "countries", ft: "Data per 1,000 people: Angola birth rate 33.6, death rate 11.3, immigration -0.1, growth 2.72% per year, median age 18.2, life expectancy 56. Kenya 25.1, 6.8, -0.2, 1.81%, 19.5, 64. Canada 10.3, 8.5, 5.7, 0.74%, 42, 81.9. Denmark 10.4, 10.3, 2.1, 0.22%, 42, 79.4.", q: "Compare the population growth of Angola and Canada using the data. Which stage is each country in, and why?", key: ["Angola: high birth rate (33.6), growth 2.72%, young median age (18.2), short life expectancy (56)", "Angola grows fast; it is an early stage (Stage 1 or 2, developing)", "Canada: low birth rate (10.3) and low death rate (8.5), growth 0.74%, mostly from immigration (5.7), median age 42", "Canada is Stage 4 (developed), population fairly stable", "Differences come from birth rates, death rates and migration"], model: "Angola's birth rate (33.6) is much higher than its death rate (11.3), so it grows fast (2.72% a year). It has a young population (median age 18.2) and a short life expectancy (56), so it is in an early stage (Stage 1, a developing country). Canada has a low birth rate (10.3) and a low death rate (8.5), so it only grows 0.74%, mostly from immigration. Its median age is 42 and life expectancy is 81.9, which puts it in Stage 4 as a developed country."},
  {id: "a07", t: "countries", q: "Explain why different countries have different population growth rates.", key: ["Differences in birth rates and death rates", "Migration (immigration/emigration)", "Fertility and age structure (young vs old populations)", "Level of development: health care, education, birth control", "Developing countries grow faster; developed countries grow slowly or are stable"], model: "Countries grow at different rates because their birth rates, death rates and migration are different. Developing countries like Angola have high birth rates and many young people, so they grow fast. Developed countries like Canada have low birth and death rates because of health care, education and birth control, so they grow slowly and depend more on immigration."},
  {id: "a08", t: "footprint", fig: "footprint", ft: "Chart: average ecological footprint per person in global hectares (gha): France 4.6, Ghana 2.0, Peru 2.1, Russia 6.1, United States 8.1.", q: "Using the chart, compare the ecological footprint of the average American to people in other countries. Explain why it is different.", key: ["U.S. average is about 8.1 gha", "Much larger than countries like Ghana (2.0) or Peru (2.1) (about 4 times)", "Americans use more resources and energy (food, water, shelter, energy)", "Americans produce more waste (trash, sewage, greenhouse gases)"], model: "The average American's ecological footprint is about 8.1 gha, around four times bigger than Ghana (2.0) or Peru (2.1). That's because Americans use more resources and energy per person, like electricity, gas for cars, food and bigger homes, and they produce more waste such as trash and greenhouse gases."},
  {id: "a09", t: "footprint", q: "What is the Anthropocene, and why is it important?", key: ["The “Age of Humans”", "A period when human activity has become the major cause of global change", "Humans change land (anthromes), the atmosphere/climate and ecosystems", "Important because human choices now affect the whole planet, so we need to reduce our impact"], model: "The Anthropocene is the “Age of Humans,” a period when human activity has become the major cause of global change. It's important because humans now change the climate, land and ecosystems all over Earth, like turning wild land into cities and cropland, so our choices affect the whole planet and we need to reduce our impact."},
  {id: "a10", t: "causes", q: "Describe how human activities affect the atmosphere and climate.", key: ["Burning fossil fuels releases CO2 / greenhouse gases", "Greenhouse gases trap more heat, leading to global warming / climate change", "Air pollution causes acid rain and smog", "Nitrogen from burning fossil fuels travels through the air (algal blooms)", "Deforestation removes carbon storage"], model: "Humans burn fossil fuels, which releases carbon dioxide and other greenhouse gases into the atmosphere. These gases trap more heat, causing global warming and climate change. Burning fuels also causes air pollution that leads to smog and acid rain, and cutting down forests removes trees that store carbon."},
  {id: "a11", t: "climate", q: "Explain how changes in the atmosphere can lead to climate change and affect other Earth systems.", key: ["More greenhouse gases (CO2, methane, water vapor) trap more heat", "Balance shifts: more heat stays in than is lost to space, so temperature rises", "Oceans: absorb CO2 (acidification), sea levels rise", "Ice: glaciers, sea ice and snow melt", "Land and ecosystems: droughts, crops, habitats change"], model: "When greenhouse gases like carbon dioxide and methane increase, they trap more heat in the atmosphere, so more heat stays in than is lost to space and Earth warms. This affects other systems: the ocean absorbs CO₂ and becomes more acidic, ice and glaciers melt so sea levels rise, and changing weather affects land, crops and ecosystems."},
  {id: "a12", t: "causes", q: "Describe how human land use affects Earth's systems. Give at least two examples.", key: ["Deforestation harms soil, water, carbon storage and animals", "Monoculture: one crop over large areas", "Habitat fragmentation causes biodiversity loss and weaker ecosystems", "Agriculture/fertilizer causes nitrogen runoff into water", "Construction and cities (anthromes) change habitats, soil and water"], model: "Human land use changes habitats, soil, water and ecosystems. For example, deforestation removes forests, which harms soil, water, carbon storage and animals. Habitat fragmentation from roads and construction breaks habitats into pieces, which causes biodiversity loss. Farming with fertilizer causes nitrogen runoff into streams, lakes and oceans."},
  {id: "a13", t: "causes", q: "Identify two types of pollution and explain how each contributes to global environmental change.", key: ["Air pollution / fossil fuels: greenhouse gases cause climate change; acid rain damages forests and lakes; smog", "Water pollution: nitrogen runoff causes algal blooms", "CO2 absorbed by the ocean causes ocean acidification", "Pollutants biomagnify up food chains", "Land pollution: trash and waste harm organisms"], model: "Air pollution from burning fossil fuels releases greenhouse gases that trap heat and cause climate change, and it mixes with water to make acid rain that damages forests and lakes. Water pollution like nitrogen runoff from fertilizer causes algal blooms, and pollutants in water can build up in food chains through biological magnification."},
  {id: "a14", t: "causes", fig: "biomag", ft: "Food chain with pollutant concentration (water = 1): water 1, producers 1,000, zooplankton 10,000, small fish 100,000, large fish 1,000,000, fish-eating birds 10,000,000.", q: "Explain biological magnification using this food chain.", key: ["A pollutant gets into the water and is taken in by producers", "Each consumer eats many organisms from the level below, so the pollutant builds up", "Concentration increases at each higher trophic level as the number of organisms decreases", "Top predators (fish-eating birds) have the highest concentration (10,000,000 times the water)"], model: "A pollutant in the water gets taken in by producers. Zooplankton eat lots of producers, small fish eat lots of zooplankton, and so on, so the pollutant builds up in their bodies. The concentration increases at each higher trophic level while the number of organisms decreases, so fish-eating birds at the top end up with 10,000,000 times the concentration in the water."},
  {id: "a15", t: "climate", q: "Describe the evidence that shows climate change is happening. Give at least three pieces of evidence.", key: ["Rising global temperatures", "Rising sea levels (about 4 inches in 55 years)", "Decreasing Arctic sea ice, glaciers and snow cover", "Changes in precipitation and more extreme storms", "Increased greenhouse gas emissions"], model: "Global temperatures are rising, and sea levels are rising too, about 4 inches in 55 years. Arctic sea ice, glaciers and snow cover are all decreasing. Precipitation is changing and there are more extreme storms, and greenhouse gas emissions keep increasing."},
  {id: "a16", t: "climate", q: "Explain the effects of climate change on people and the environment.", key: ["Water availability: droughts and less snowpack", "Crop cycles: lower crop yields", "Loss of land from rising sea levels", "More extreme weather (floods, storms, heat waves)", "Habitat loss and problems for wildlife"], model: "Climate change affects people through water availability (more droughts and less snowpack), crop cycles (lower crop yields) and loss of land as sea levels rise. It also brings more extreme weather like floods, storms and heat waves, and it causes habitat loss that hurts wildlife and ecosystems."},
  {id: "a17", t: "climate", q: "Explain how science helps us understand and respond to global environmental changes.", key: ["Scientists collect data (temperature, sea level, ice, greenhouse gases)", "They study Earth's systems to find causes and trends", "Evidence shows what humans are changing", "Science helps develop solutions (renewable energy, sustainable practices) and predict future changes"], model: "Scientists collect data like temperatures, sea levels, ice and greenhouse gas levels and study how Earth's systems work. This shows what is changing and what is causing it, such as humans burning fossil fuels. Then science helps us develop solutions, like renewable energy and more sustainable farming, and predict what might happen next."},
  {id: "a18", t: "climate", fig: "greenhouse", ft: "Diagram: sunlight passes through the atmosphere and warms Earth's surface; the surface gives off heat; greenhouse gases (CO2, methane, water vapor) trap some of the heat and send it back down; some heat escapes to space.", q: "Explain how the greenhouse effect works and how humans are changing it.", key: ["Sunlight enters and warms Earth's surface; some is reflected", "The surface gives off heat", "Greenhouse gases (CO2, methane, water vapor) trap some heat in the atmosphere; some escapes to space", "This keeps Earth warm (natural)", "Humans add more greenhouse gases (burning fossil fuels), so more heat is trapped and Earth warms"], model: "Sunlight passes through the atmosphere and warms Earth's surface, which gives off heat. Greenhouse gases like carbon dioxide, methane and water vapor trap some of that heat in the atmosphere while some escapes to space, which keeps Earth warm. Humans burn fossil fuels and add more greenhouse gases, so more heat gets trapped and Earth's average temperature rises."},
  {id: "a19", t: "sustain", q: "Describe the factors used to evaluate the sustainability of a development.", key: ["Environmental impact (preserves ecosystem services, doesn't deplete resources)", "Social impact (society, human needs)", "Economic impact", "Long-term effects", "Uses renewable instead of nonrenewable resources"], model: "To decide if a development is sustainable, you look at its environmental, social and economic impacts. It should use resources without using them up, preserve ecosystem services, meet people's needs and still make economic sense over the long term, for example by using renewable energy instead of fossil fuels."},
  {id: "a20", t: "sustain", q: "Explain why innovation and resilience are important for solving environmental challenges.", key: ["Innovation creates new solutions and technology (e.g., renewable energy, greener electricity)", "Resilience is the ability to recover after a disturbance", "Resilience helps people and ecosystems adapt to change", "Together they help deal with problems like climate change"], model: "Innovation creates new solutions, like better renewable energy and greener electricity, that reduce our impact. Resilience is the ability to recover after a disturbance, so resilient communities and ecosystems can bounce back and adapt when things like storms or droughts happen. Both are needed to handle problems like climate change."},
  {id: "a21", t: "sustain", q: "Compare renewable and nonrenewable resources. Give two examples of each.", key: ["Renewable: can replace itself / be replaced by healthy ecosystem functions", "Nonrenewable: cannot be replenished within a reasonable amount of time", "Renewable examples: solar, wind, biomass, geothermal, hydropower", "Nonrenewable examples: coal, natural gas, fossil fuels, nuclear"], model: "Renewable resources can replace themselves or keep existing even while we use them, like solar and wind energy. Nonrenewable resources can't be replenished by nature in a reasonable amount of time, so they run out, like coal and natural gas (and nuclear)."}
];

/* glossary terms */
const GLOSS = [
  ["Ecological footprint", "The amount of productive land and water needed to supply a population's resources and absorb its wastes."],
  ["Anthrome", "An ecological region created by long-term interactions between humans and ecosystems."],
  ["Weather", "The day-to-day conditions of the atmosphere, including temperature, precipitation and other factors."],
  ["Greenhouse effect", "The process in which certain gases trap sunlight energy in Earth's atmosphere as heat."],
  ["Climate change", "Measurable long-term changes in averages of temperature, clouds, winds, precipitation and the frequency of extreme weather events like floods, major storms and heat waves."],
  ["Global warming", "An increase in the average temperature on Earth."],
  ["Deforestation", "The destruction of forests."],
  ["Monoculture", "A farming strategy of planting a single, highly productive crop year after year."],
  ["Invasive species", "A non-native species whose introduction causes, or is likely to cause, economic harm, environmental harm or harm to human health."],
  ["Pollutant", "A harmful material that can enter the biosphere through the land, air or water."],
  ["Ozone layer", "An atmospheric layer where ozone gas is concentrated; it protects life on Earth from harmful ultraviolet rays in sunlight."],
  ["Smog", "A gray-brown haze formed by a mixture of chemicals."],
  ["Biological magnification", "The increasing concentration of a harmful substance in organisms at higher trophic levels in a food chain or food web."],
  ["Sustainable development", "A strategy for using natural resources without depleting them and for meeting human needs without causing long-term environmental harm."],
  ["Renewable resource", "A resource that can be produced or replaced by healthy ecosystem functions."],
  ["Nonrenewable resource", "A resource that cannot be replenished by a natural process within a reasonable amount of time."],
  ["Resilience", "The ability to recover after a disturbance."]
];

/* how many of each topic the full test pulls (30 multiple choice) */

/* ---------- figures ---------- */
const AH = id => `<defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>`;
const tagc = (x, y, t) => `<circle class="tagc" cx="${x}" cy="${y}" r="12"/><text class="tagt" x="${x}" y="${y + 4.5}" text-anchor="middle">${t}</text>`;
const box = (x, y, w, h, t, cls = "bx", tcls = "tx b") => `<rect class="${cls}" x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="6"/><text class="${tcls}" x="${x}" y="${y + 4.5}" text-anchor="middle">${t}</text>`;
// smooth curve through key points (Catmull-Rom), returned as sampled [x, y] pairs
function spline(P, steps = 14) {
  const out = [];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    for (let s = 0; s < steps; s++) {
      const t = s / steps, t2 = t * t, t3 = t2 * t;
      const f = k => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3);
      out.push([f(0), f(1)]);
    }
  }
  out.push(P[P.length - 1]);
  return out;
}
const pts = a => a.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
const yAt = (S, x) => { for (let i = 1; i < S.length; i++) if (S[i][0] >= x) { const [x0, y0] = S[i - 1], [x1, y1] = S[i]; return x1 === x0 ? y1 : y0 + (y1 - y0) * (x - x0) / (x1 - x0); } return S[S.length - 1][1]; };
const FIG = {};

  const data = [[-10000, .004], [-8000, .005], [-5000, .01], [-3000, .03], [-1000, .05], [0, .19], [500, .21], [1000, .28], [1200, .4], [1340, .44], [1360, .37], [1500, .46], [1650, .55], [1750, .79], [1800, .98], [1850, 1.26], [1900, 1.65], [1925, 2], [1950, 2.5], [1960, 3], [1975, 4.07], [1987, 5], [2000, 6.1]];
  let g = ""; for (let b = 0; b <= 7; b++) g += `<line class="gr" x1="64" x2="580" y1="${Y(b)}" y2="${Y(b)}" opacity="${b ? .5 : 0}"/><text class="tx m" x="56" y="${Y(b) + 4}" text-anchor="end">${b}</text>`;
  const xt = [[-10000, "10,000 B.C."], [-5000, "5000 B.C."], [0, "0"], [2000, "2000 A.D."]].map(([yr, t]) => `<text class="tx m" x="${X(yr)}" y="246" text-anchor="${yr === -10000 ? "start" : yr === 2000 ? "end" : "middle"}">${t}</text>`).join("");
  const lab = (x, y, lines, tx, ty) => `<text class="tx b" x="${x}" y="${y}" text-anchor="middle">${lines.map((l, i) => `<tspan x="${x}" dy="${i ? 15 : 0}">${l}</tspan>`).join("")}</text><line class="ar" x1="${x}" y1="${y + 15 * (lines.length - 1) + 7}" x2="${tx}" y2="${ty}" marker-end="url(#ahH)"/>`;
  return `<svg viewBox="0 0 600 270" role="img" aria-label="Graph of human population from 10,000 B.C. to 2000 A.D.: nearly flat near zero for thousands of years, then shooting straight up to about 6 billion after the Industrial Revolution.">${AH("ahH")}
    ${g}<line class="ax" x1="64" y1="226" x2="580" y2="226"/><line class="ax" x1="64" y1="36" x2="64" y2="226"/>${xt}
    <text class="tx s" transform="translate(18 132) rotate(-90)" text-anchor="middle">Population (billions)</text><text class="tx s" x="322" y="264" text-anchor="middle">Year</text>

    ${lab(150, 116, ["Agriculture", "begins"], 150, 218)}${lab(365, 150, ["Plowing and", "irrigation"], 365, 219)}${lab(468, 164, ["Bubonic", "plague"], 549, 212)}${lab(470, 60, ["Industrial Revolution", "begins"], 568, 200)}
  </svg>`;
};

FIG.dtm = () => {
  const B = [56, 150, 270, 390, 490, 572];
  const wig = (S, a, f, ph) => S.map(([x, y]) => [x, x < 150 ? y + a * Math.sin(x / f + ph) * Math.min(1, (150 - x) / 25) : y]);
  const birth = wig(spline([[56, 70], [150, 70], [270, 74], [330, 130], [390, 186], [490, 194], [572, 206]], 40), 4, 9, 0);
  const death = wig(spline([[56, 76], [150, 78], [210, 132], [270, 166], [390, 196], [490, 199], [572, 184]], 40), 7, 8, 1.3);
  const total = spline([[56, 228], [150, 226], [230, 206], [330, 130], [430, 82], [490, 76], [572, 88]]);
  const inc = [], dec = [];
  for (let x = 150; x <= 488; x += 4) inc.push([x, yAt(birth, x)]);
  for (let x = 488; x >= 150; x -= 4) inc.push([x, Math.max(yAt(death, x), yAt(birth, x))]);
  for (let x = 512; x <= 572; x += 4) dec.push([x, yAt(death, x)]);
  for (let x = 572; x >= 512; x -= 4) dec.push([x, yAt(birth, x)]);
  const bands = B.slice(0, 5).map((x, i) => `<text class="tx b" x="${(x + B[i + 1]) / 2}" y="30" text-anchor="middle">Stage ${i + 1}</text>`).join("") + B.slice(1, 5).map(x => `<line class="gr" x1="${x}" x2="${x}" y1="38" y2="236"/>`).join("");
  return `<svg viewBox="0 0 600 296" role="img" aria-label="Demographic transition graph with 5 stages. Birth rate and death rate both start high. The death rate falls first in Stage 2, the birth rate falls in Stage 3, both are low in Stage 4, and in Stage 5 the death rate rises above the birth rate. Total population rises through Stages 2 and 3, levels off in Stage 4, and dips in Stage 5.">
    <polygon class="gap" points="${pts(inc)}"/><polygon class="gap2" points="${pts(dec)}"/>
    ${bands}<line class="ax" x1="56" y1="236" x2="572" y2="236"/><line class="ax" x1="56" y1="38" x2="56" y2="236"/>
    <polyline class="l3 dashl" points="${pts(total)}"/><polyline class="l2" points="${pts(birth)}"/><polyline class="l1" points="${pts(death)}"/>
    <text class="tx s" transform="translate(40 137) rotate(-90)" text-anchor="middle">Rate per 1,000 people</text>
    <text class="tx s" x="226" y="100" text-anchor="middle">natural</text><text class="tx s" x="226" y="113" text-anchor="middle">increase</text>
    <g transform="translate(70 262)"><line class="l2" x1="0" x2="26" y1="0" y2="0"/><text class="tx" x="32" y="4.5">Birth rate</text>
    <line class="l1" x1="130" x2="156" y1="0" y2="0"/><text class="tx" x="162" y="4.5">Death rate</text>
    <line class="l3 dashl" x1="268" x2="294" y1="0" y2="0"/><text class="tx" x="300" y="4.5">Total population</text></g>
    <text class="tx s" x="314" y="288" text-anchor="middle">Time →</text>
  </svg>`;
};

FIG.biomag = () => {

const HERO_MINI =`<svg class="mini" viewBox="0 0 140 112" aria-hidden="true"><line x1="14" y1="96" x2="134" y2="96" stroke="var(--ink)" stroke-width="1.5"/><line x1="14" y1="8" x2="14" y2="96" stroke="var(--ink)" stroke-width="1.5"/><polyline points="${pts(spline([[16, 93], [70, 91], [100, 86], [116, 70], [124, 40], [128, 12]], 10))}" fill="none" stroke="var(--moss)" stroke-width="3" stroke-linecap="round"/><circle cx="128" cy="12" r="4.5" fill="var(--sun)"/><text x="14" y="108">10,000 B.C.</text><text x="134" y="108" text-anchor="end">now</text></svg>`;

/* ---------- engine ---------- */
const K = "hu3.";
const SA_PTS = 3;
const app = document.getElementById("app");

const ITEMS = {};
MC.forEach(q => ITEMS[q.id] = Object.assign({kind: "mc"}, q));
SA.forEach(q => ITEMS[q.id] = Object.assign({kind: "sa"}, q));
GLOSS.forEach(([term, def], i) => ITEMS["g" + (i + 1)] = {kind: "vocab", id: "g" + (i + 1), t: "vocab", term, def});
const topicName = t => t === "vocab" ? "Vocabulary" : TOPICS[t];

let run = store.get(K + "run", null);
if (run && !(run.items || []).every(it => ITEMS[it.id])) run = null;
const saveRun = () => run ? store.set(K + "run", run) : store.del(K + "run");

/* ---------- building a test ---------- */
function optsFor(q) {
  if (q.kind === "vocab") {
    const others = shuffle(GLOSS.map(g => g[0]).filter(x => x !== q.term)).slice(0, 3);
    return shuffle([q.term, ...others]);
  }
  if (q.kind !== "mc") return null;
  return q.fix ? q.a.slice().sort((x, y) => x.localeCompare(y, "en", {numeric: true})) : shuffle(q.a);
}
const item = id => ({id, opts: optsFor(ITEMS[id])});
const take = (pool, n) => shuffle(pool).slice(0, n);
const mcOf = t => MC.filter(q => q.t === t).map(q => q.id);
const CONCEPT_OF = {}, CONCEPT_NAME = {};
CONCEPTS.forEach(([t, k, name, ids]) => { CONCEPT_NAME[k] = name; ids.forEach(id => CONCEPT_OF[id] = k); });
const conceptsOf = t => CONCEPTS.filter(c => c[0] === t);
// one random question from each concept, n concepts per topic (all of them when n is left out)
const byConcept = (t, n) => take(conceptsOf(t), n == null ? Infinity : n).map(c => pick(c[3]));

// 2 population short answers, then one from each of the other topics
function pickSA(n) {
  const pop = take(SA.filter(q => POP_TOPICS.includes(q.t)), 2);
  const rest = take(Object.keys(TOPICS).filter(t => !POP_TOPICS.includes(t)), n - 2).map(t => pick(SA.filter(q => q.t === t)));
  return [...pop, ...rest].map(q => q.id);
}

const MODES = {
  full: {title: "Full test: every concept", build() {
    const mc = Object.keys(TOPICS).flatMap(t => shuffle(byConcept(t)));
    return [...mc, ...pickSA(6)];
  }},
  short: {title: "Shorter practice test", build() {
    const mc = shuffle(Object.entries(FULL_MIX).flatMap(([t, n]) => byConcept(t, n)));
    return [...mc, ...pickSA(5)];
  }},
  quick: {title: "Quick quiz", build: () => take(MC.map(q => q.id), 12)},
  stages: {title: "Stages drill", build: () => take([...mcOf("stages"), ...mcOf("countries")], 12)},
  sa: {title: "Short answers", build: () => pickSA(5)},
  vocab: {title: "Vocabulary", build: () => shuffle(Object.keys(ITEMS).filter(id => ITEMS[id].kind === "vocab"))},
  missed: {title: "Redo missed", build: () => take(missedIds(), 20)},
  topic: {title: "Topic practice", build: t => [...shuffle(byConcept(t)), ...take(SA.filter(q => q.t === t).map(q => q.id), 1)]}
};

function start(mode, arg) {
  const ids = MODES[mode].build(arg);
  if (!ids.length) return;
  run = {mode, title: mode === "topic" ? TOPICS[arg] : MODES[mode].title, items: ids.map(item), i: 0, res: {}, t0: Date.now()};
  saveRun(); show();
}

const missedIds = () => store.get(K + "missed", []).filter(id => ITEMS[id] && ITEMS[id].kind !== "sa");

/* ---------- scoring (multiple choice only; short answers go to an AI) ---------- */
function tally(r) {
  let got = 0, max = 0;
  const by = {};
  for (const it of r.items) {
    const q = ITEMS[it.id], a = r.res[it.id];
    if (q.kind === "sa") continue;
    const g = a && a.ok ? 1 : 0;
    got += g; max += 1;
    const b = by[q.t] = by[q.t] || {got: 0, max: 0};
    b.got += g; b.max += 1;
  }
  return {got, max, pct: max ? Math.round(100 * got / max) : 0, by};
}
const answered = id => { const a = run.res[id]; return !!a && (ITEMS[id].kind !== "sa" || !!(a.text || "").trim()); };
const canGoOn = id => ITEMS[id].kind === "sa" || !!run.res[id];

/* ---------- home ---------- */
function home() {
  const hist = store.get(K + "hist", []);
  const missed = missedIds();
  const resume = run ? `<div class="resume"><p><strong>${esc(run.title)}</strong> in progress, question ${run.i + 1} of ${run.items.length}.</p><div class="rowbtns"><button class="btn" data-go="resume">Keep going</button><button class="btn ghost" data-go="discard">Start over</button></div></div>` : "";
  const histHtml = hist.length ? `<div class="tbl"><table><thead><tr><th>When</th><th>Test</th><th>Score</th></tr></thead><tbody>${hist.slice(-8).reverse().map(h => `<tr><td class="n">${esc(new Date(h.d).toLocaleDateString("en-US", {month: "short", day: "numeric"}))}</td><td>${esc(h.title)}</td><td><span class="pill ${h.pct >= 80 ? "hi" : h.pct >= 60 ? "mid" : "lo"}">${h.pct}%</span></td></tr>`).join("")}</tbody></table></div>
    <div class="hist-head"><span></span><button class="linkbtn" data-go="clearhist">Clear history</button></div>` : `<p class="hist-empty">Your scores will show up here.</p>`;
  app.innerHTML = `
    <header class="hero"><div><p class="eyebrow">Biology · Unit 3</p><h1>Human Impact</h1><p class="lede">Practice test, not the real one. At the end you copy a prompt into an AI chat, which scores your short answers like a 9th grade biology teacher. Paste its numbers back in for your final score.</p></div>${HERO_MINI}</header>
    ${resume ? `<section class="section">${resume}</section>` : ""}
    <section class="section"><h2>Start</h2><div class="modes">
      <button class="mode primary" data-start="full"><span class="meta">${CONCEPTS.length} multiple choice + 6 short answers</span><h3>Full test: every concept</h3><p>One question on every idea in the unit, from the demographic transition to sustainability, in unit order. You get new questions each time.</p></button>
      <button class="mode wide" data-start="short"><span class="meta">${Object.values(FULL_MIX).reduce((a, b) => a + b, 0)} multiple choice + 5 short answers</span><h3>Shorter practice test</h3><p>A random half of the concepts, when you don't have time for the full test.</p></button>
      <button class="mode" data-start="quick"><span class="meta">12 multiple choice</span><h3>Quick quiz</h3><p>A short mixed review.</p></button>
      <button class="mode" data-start="sa"><span class="meta">5 short answers</span><h3>Short answers</h3><p>Write your answers, copy one prompt into an AI, then paste its scores back in.</p></button>
      <button class="mode" data-start="stages"><span class="meta">12 multiple choice</span><h3>Stages drill</h3><p>Demographic transition stages and country data.</p></button>
      <button class="mode" data-start="vocab"><span class="meta">${GLOSS.length} terms</span><h3>Vocabulary</h3><p>Match each definition to its glossary term.</p></button>
      ${missed.length ? `<button class="mode wide" data-start="missed"><span class="meta">${Math.min(missed.length, 20)} question${missed.length === 1 ? "" : "s"}</span><h3>Redo missed</h3><p>Multiple-choice questions you got wrong.</p></button>` : ""}
    </div></section>
    <section class="section"><h2>Practice one topic</h2><div class="topicbox"><div class="chips">${Object.entries(TOPICS).map(([t, n]) => `<button class="chip" data-topic="${t}">${esc(n)} <span class="cn">${conceptsOf(t).length}</span></button>`).join("")}</div></div></section>
    <section class="section"><h2>Your scores</h2><div class="hist">${histHtml}</div></section>`;
  scrollTo(0, 0);
}

/* ---------- question ---------- */
function letter(i) { return "ABCD"[i]; }

function question() {
  const it = run.items[run.i], q = ITEMS[it.id], a = run.res[it.id];
  const n = run.items.length, done = run.items.filter(x => answered(x.id)).length;
  const fig = q.fig ? `<div class="fig">${FIG[q.fig]()}</div>` : "";
  let body = "";
  if (q.kind === "sa") body = saBody(q, a);
  else {
    const right = q.kind === "vocab" ? q.term : q.a[0];
    body = `<div class="opts" role="group" aria-label="Answer choices">${it.opts.map((o, i) => {
      const cls = a ? (o === right ? "right" : o === a.pick ? "wrong" : "") : "";
      return `<button class="opt ${cls}" data-pick="${i}" ${a ? "disabled" : ""}><span class="k">${letter(i)}</span><span>${esc(o)}</span></button>`;
    }).join("")}</div>`;
    if (a) body += `<div class="fb ${a.ok ? "ok" : "no"}"><h4>${a.ok ? "Correct" : "Not quite"}</h4>${a.ok ? "" : `<p class="ans">Answer: ${esc(right)}</p>`}<p>${esc(q.kind === "vocab" ? `${q.term}: ${q.def}` : q.why)}</p></div>`;
    else body += `<p class="keyhint">Tip: press A–D or 1–4 to answer.</p>`;
  }
  const qtext = q.kind === "vocab" ? `Which term matches this definition?` : q.q;
  const sub = q.kind === "vocab" ? `<p class="qhint" style="margin:0;font-size:18px;color:var(--ink)">“${esc(q.def)}”</p>` : "";
  const last = run.i === n - 1;
  app.innerHTML = `
    <div class="bar-top"><div class="bar-row"><button class="btn ghost small" data-go="home">← Home</button><span class="count">${esc(run.title)} · ${run.i + 1} / ${n}</span></div><div class="prog"><div style="width:${100 * done / n}%"></div></div></div>
    <article class="card">
      <div class="qmeta"><span class="tag">${esc(topicName(q.t))}</span>${q.kind === "sa" ? `<span class="tag sa">Short answer · ${SA_PTS} pts</span>` : ""}</div>
      <h2 class="qtext">${esc(qtext)}</h2>${sub}
      ${fig}${body}
      <div class="actions"><button class="btn ghost small" data-go="prev" ${run.i ? "" : "disabled"}>Back</button><span class="spacer"></span>
        <button class="btn" data-go="next" ${canGoOn(it.id) ? "" : "disabled"}>${last ? "See results" : "Next"}</button></div>
    </article>`;
  const ta = app.querySelector("textarea");
  if (ta && matchMedia("(hover: hover)").matches) { ta.focus({preventScroll: true}); ta.setSelectionRange(ta.value.length, ta.value.length); }
  scrollTo(0, 0);
}

function saBody(q, a) {
  const text = (a && a.text) || "";
  return `<div class="sa"><textarea id="sa" maxlength="1500" placeholder="Type your answer in full sentences…">${esc(text)}</textarea><span class="wc">${words(text)} words</span></div>
    <p class="qhint">Short answers are graded at the end: the results page gives you a prompt for an AI, and you paste its scores back in.</p>`;
}

const words = s => (String(s).trim().match(/\S+/g) || []).length;

function choose(i) {
  const it = run.items[run.i], q = ITEMS[it.id];
  if (q.kind === "sa" || run.res[it.id]) return;
  const o = it.opts[i];
  if (o == null) return;
  run.res[it.id] = {pick: o, ok: o === (q.kind === "vocab" ? q.term : q.a[0])};
  saveRun(); question();
}

/* ---------- AI grading prompt ---------- */
function aiPrompt(r) {
  const sas = r.items.filter(it => ITEMS[it.id].kind === "sa");
  const head = `You are my 9th grade biology teacher. Grade my short answers from a practice test on Unit 3: Human Impact (human population growth and the demographic transition, ecological footprints and the Anthropocene, human causes of global change, climate change, and sustainable development).

Grade each answer out of ${SA_PTS} points the way a fair 9th grade biology teacher would:
3 = answers every part of the question with correct science and enough explanation or examples
2 = mostly correct, but one part is missing, the explanation is thin, or there is a small mistake
1 = shows some understanding (at least one correct idea), but big parts are missing or wrong
0 = blank, off topic, or wrong

The key points show what a strong answer could include. They are not a checklist, so give credit for correct ideas in my own words. If a question asks for a certain number of examples, I need that many for full credit. Ignore spelling and grammar unless the meaning is unclear. Do not give credit for an answer that only repeats the question.

HOW TO REPLY: reply with ONLY my ${sas.length} score${sas.length === 1 ? "" : "s"}, in question order, separated by spaces, in this format: ${fmtSlots(sas.length)}
Each # is a whole number from 0 to ${SA_PTS}. No words, no labels, no question numbers, no explanations, no total. I will paste your reply into my score calculator, so anything other than the numbers breaks it.`;
  const body = sas.map((it, i) => {
    const q = ITEMS[it.id], a = r.res[it.id] || {};
    return `Question ${i + 1}: ${q.q}${q.ft ? `\n(${q.ft})` : ""}\nKey points: ${q.key.join("; ")}\nMy answer: ${(a.text || "").trim() || "(blank)"}`;
  }).join("\n\n");
  return head + "\n\n" + body + `\n\nRemember: your whole reply is just ${sas.length} number${sas.length === 1 ? "" : "s"} from 0 to ${SA_PTS}, like ${fmtSlots(sas.length)}`;
}
const fmtSlots = n => Array(n).fill("#").join(" ");

/* reads the AI's reply: "3 2 0 1 3", "3, 2, 0", one per line, "1: 3", "3/3" or with a total at the end */
function parseScores(text, n) {
  const s = String(text).replace(/(\d+(?:\.\d+)?)\s*\/\s*\d+/g, "$1");
  const nums = (s.match(/\d+(?:\.\d+)?/g) || []).map(Number);
  const lines = s.split(/\n+/).map(l => l.trim()).filter(l => /\d/.test(l));
  let out = null;
  if (nums.length === n) out = nums;
  else if (nums.length === n + 1 && Math.abs(nums.slice(0, n).reduce((x, y) => x + y, 0) - nums[n]) < 1e-9) out = nums.slice(0, n);
  else if (nums.length === 2 * n && nums.every((v, i) => i % 2 || v === i / 2 + 1)) out = nums.filter((_, i) => i % 2);
  else if (lines.length === n) out = lines.map(l => Number(l.match(/\d+(?:\.\d+)?/g).pop()));
  if (!out) return {err: nums.length ? `Found ${nums.length} number${nums.length === 1 ? "" : "s"}, but this test has ${n} short answer${n === 1 ? "" : "s"}. Paste only the AI's scores, like ${Array.from({length: n}, (_, i) => [3, 2, 1, 3, 0, 2][i % 6]).join(" ")}.` : "Paste the numbers the AI gave you."};
  if (out.some(v => v < 0 || v > SA_PTS)) return {err: `Each score has to be from 0 to ${SA_PTS}.`};
  return {scores: out};
}

/* final score = multiple choice (1 point each) + short answers (3 points each) */
function finalScore(r) {
  const sc = tally(r);
  const nSa = r.items.filter(it => ITEMS[it.id].kind === "sa").length;
  if (!r.sa || r.sa.length !== nSa) return null;
  const saGot = r.sa.reduce((x, y) => x + y, 0), saMax = nSa * SA_PTS;
  const got = sc.got + saGot, max = sc.max + saMax;
  return {mcGot: sc.got, mcMax: sc.max, saGot, saMax, got, max, pct: max ? Math.round(100 * got / max) : 0};
}
const num1 = v => Number.isInteger(v) ? String(v) : v.toFixed(1);

function applyScores() {
  const box = document.getElementById("aiscores"), msg = document.getElementById("aimsg");
  const nSa = run.items.filter(it => ITEMS[it.id].kind === "sa").length;
  const p = parseScores(box.value, nSa);
  if (p.err) { msg.textContent = p.err; msg.className = "aimsg bad"; box.focus(); return; }
  run.sa = p.scores;
  const f = finalScore(run), hist = store.get(K + "hist", []);
  const h = run.hid && hist.find(x => x.d === run.hid);
  if (h) { h.pct = f.pct; h.sa = 1; }
  else { run.hid = Date.now(); hist.push({d: run.hid, title: run.title, pct: f.pct, sa: 1}); }
  store.set(K + "hist", hist.slice(-40));
  saveRun(); results(true);
}

async function copyPrompt(btn) {
  const ta = document.getElementById("aiprompt");
  let ok = false;
  try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) {}
  if (!ok) { ta.focus(); ta.select(); try { ok = document.execCommand("copy"); } catch (e) {} }
  btn.textContent = ok ? "Copied!" : "Press Ctrl+C / ⌘C to copy";
  clearTimeout(copyPrompt.t); copyPrompt.t = setTimeout(() => btn.textContent = "Copy prompt", 2500);
}

/* ---------- results ---------- */
function results(scored) {
  const r = run, sc = tally(r);
  const sas = r.items.filter(it => ITEMS[it.id].kind === "sa"), mcN = sc.max;
  if (!r.saved) {
    if (mcN) {
      const hist = store.get(K + "hist", []);
      r.hid = Date.now();
      hist.push({d: r.hid, title: r.title, pct: sc.pct});
      store.set(K + "hist", hist.slice(-40));
    }
    const missed = new Set(store.get(K + "missed", []));
    for (const it of r.items) {
      if (ITEMS[it.id].kind === "sa") continue;
      const a = r.res[it.id];
      a && a.ok ? missed.delete(it.id) : missed.add(it.id);
    }
    store.set(K + "missed", [...missed]);
    r.saved = true;
    saveRun();
  }
  const written = sas.filter(it => ((r.res[it.id] || {}).text || "").trim()).length;
  const f = finalScore(r), many = n => n === 1 ? "" : "s";
  const head = f
    ? `<div class="big">${f.pct}%</div><div><h1>${esc(r.title)}</h1><p>Final score: ${num1(f.got)} / ${f.max} points${mcN ? ` · ${f.mcGot}/${f.mcMax} multiple choice + ${num1(f.saGot)}/${f.saMax} short answer` : " on short answers"}</p></div>`
    : mcN
    ? `<div class="big">${sc.pct}%</div><div><h1>${esc(r.title)}</h1><p>${sc.got} / ${mcN} multiple choice${sas.length ? `. Not final yet: grade your ${sas.length} short answer${many(sas.length)} below to get your final score.` : ""}</p></div>`
    : `<div class="big">${written}/${sas.length}</div><div><h1>${esc(r.title)}</h1><p>short answers written. Grade them below to get your score.</p></div>`;
  const bars = Object.entries(sc.by).map(([t, b]) => { const p = Math.round(100 * b.got / b.max); return `<div class="bar"><span>${esc(topicName(t))}</span><div class="track"><div class="fill ${p < 60 ? "lo" : p < 80 ? "mid" : ""}" style="width:${p}%"></div></div><span class="v">${b.got}/${b.max}</span></div>`; }).join("");
  const grade = sas.length ? `<section class="section" id="gradebox"><h2>Grade your short answers with AI</h2><div class="hist prompt">
      <ol class="steps"><li>Copy the prompt.</li><li>Paste it into an AI chat like ChatGPT, Claude or Gemini.</li><li>It replies with just your scores, one number (0 to ${SA_PTS}) per short answer.</li><li>Paste those numbers in the box below to get your final score.</li></ol>
      <textarea id="aiprompt" readonly aria-label="Prompt to paste into an AI">${esc(aiPrompt(r))}</textarea>
      <div class="rowbtns"><button class="btn sun" data-go="copy">Copy prompt</button></div>
      <label class="ailabel" for="aiscores">The AI's scores</label>
      <div class="aientry"><textarea id="aiscores" rows="1" spellcheck="false" autocomplete="off" placeholder="${fmtSlots(sas.length).replace(/#/g, "0")}">${r.sa ? esc(r.sa.map(num1).join(" ")) : ""}</textarea><button class="btn" data-go="score">${r.sa ? "Update score" : "Get final score"}</button></div>
      <p class="aimsg${f ? " ok" : ""}" id="aimsg" aria-live="polite">${f ? `Short answers: ${num1(f.saGot)} / ${f.saMax} points, added to your final score above.` : `${sas.length} number${many(sas.length)}, each 0 to ${SA_PTS}.`}</p></div></section>
    <section class="section"><h2>Example full-credit answers</h2><div class="missed">${sas.map((it, i) => { const q = ITEMS[it.id], a = r.res[it.id] || {}, g = r.sa ? r.sa[i] : null; return `<div class="miss half${g == null ? "" : g >= SA_PTS ? " full" : g === 0 ? " zero" : ""}"><span class="q">${esc(q.q)}</span>${g == null ? "" : `<span class="aiscore">AI score: ${num1(g)} / ${SA_PTS}</span>`}<span class="yours">Your answer: ${esc((a.text || "").trim() || "(blank)")}</span><span class="corr">Example: ${esc(q.model)}</span></div>`; }).join("")}</div></section>` : "";
  const miss = r.items.filter(it => ITEMS[it.id].kind !== "sa" && !(r.res[it.id] && r.res[it.id].ok)).map(it => {
    const q = ITEMS[it.id], a = r.res[it.id] || {};
    const right = q.kind === "vocab" ? q.term : q.a[0];
    const ck = CONCEPT_OF[it.id];
    return `<div class="miss">${ck ? `<span class="cpt">${esc(CONCEPT_NAME[ck])}</span>` : ""}<span class="q">${esc(q.kind === "vocab" ? "“" + q.def + "”" : q.q)}</span><span class="yours">You picked: ${esc(a.pick || "(skipped)")}</span><span class="corr">Answer: ${esc(right)}</span>${q.why ? `<span class="why">${esc(q.why)}</span>` : ""}</div>`;
  }).join("");
  const asked = r.items.filter(it => CONCEPT_OF[it.id]);
  const weak = [...new Set(asked.filter(it => !(r.res[it.id] && r.res[it.id].ok)).map(it => CONCEPT_OF[it.id]))];
  const concepts = asked.length > 1 ? `<section class="section"><h2>Concepts</h2><div class="hist"><p class="cpt-sum"><strong>${asked.length - weak.length} of ${asked.length}</strong> concepts right.${weak.length ? " Review these:" : " Nothing to review."}</p>${weak.length ? `<ul class="cpt-list">${weak.map(k => `<li>${esc(CONCEPT_NAME[k])}</li>`).join("")}</ul>` : ""}</div></section>` : "";
  const review = mcN ? `<section class="section"><h2>${miss ? "Multiple choice to review" : "Every multiple-choice answer was right."}</h2>${miss ? `<div class="missed">${miss}</div>` : ""}</section>` : "";
  app.innerHTML = `
    <header class="score">${head}</header>
    ${grade}
    ${Object.keys(sc.by).length > 1 ? `<section class="section"><h2>By topic</h2><div class="hist"><div class="bars">${bars}</div></div></section>` : ""}
    ${concepts}
    ${review}
    <section class="section"><div class="rowbtns">${miss ? `<button class="btn sun" data-start="missed">Redo missed</button>` : ""}<button class="btn" data-start="${r.mode === "topic" ? "quick" : r.mode === "missed" ? "full" : r.mode}">${r.mode === "topic" || r.mode === "missed" ? "Take another test" : "Try again (new questions)"}</button><button class="btn ghost" data-go="done">Home</button></div></section>`;
  if (scored) scrollTo({top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  else scrollTo(0, 0);
}

/* ---------- routing ---------- */
function show() {
  if (!run) return home();
  if (run.i >= run.items.length) return results();
  question();
}

app.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b || b.disabled) return;
  if (b.dataset.start) return start(b.dataset.start);
  if (b.dataset.topic) return start("topic", b.dataset.topic);
  if (b.dataset.pick != null) return choose(+b.dataset.pick);
  const go = b.dataset.go;
  if (go === "home") { stash(); home(); }
  else if (go === "resume") show();
  else if (go === "discard") { run = null; saveRun(); home(); }
  else if (go === "done") { run = null; saveRun(); home(); }
  else if (go === "prev") { stash(); run.i = Math.max(0, run.i - 1); saveRun(); question(); }
  else if (go === "next") { stash(); run.i++; saveRun(); show(); }
  else if (go === "copy") copyPrompt(b);
  else if (go === "score") applyScores();
  else if (go === "clearhist") { if (confirm("Clear your score history?")) { store.del(K + "hist"); home(); } }
});

function stash() {
  const ta = document.getElementById("sa");
  if (!ta || !run || run.i >= run.items.length) return;
  run.res[run.items[run.i].id] = {text: ta.value};
  saveRun();
}

app.addEventListener("input", e => {
  if (e.target.id !== "sa") return;
  const wc = app.querySelector(".wc");
  if (wc) wc.textContent = words(e.target.value) + " words";
  clearTimeout(stash.t); stash.t = setTimeout(stash, 400);
});

document.addEventListener("keydown", e => {
  if (e.target.id === "aiscores" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); applyScores(); return; }
  if (!run || run.i >= run.items.length || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === "TEXTAREA" || (e.key === "Enter" && e.target.tagName === "BUTTON")) return;
  const k = e.key.toLowerCase(), m = "abcd".indexOf(k), n = "1234".indexOf(k);
  if (m >= 0 || n >= 0) { choose(Math.max(m, n)); e.preventDefault(); }
  else if (k === "enter") { const nx = app.querySelector('[data-go="next"]'); if (nx && !nx.disabled) { nx.click(); e.preventDefault(); } }
});

show();
})();
</script>
</body></html>
