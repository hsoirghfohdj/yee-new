<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Unit 3 Human Impact Practice Test</title>

<style>
/* One study column (max 780px). Home = start cards + score history; a test shows one question card at a time under a sticky progress bar. */
:root{
  --paper:#EDF0F3; --surface:#FFFFFF; --sunk:#F5F7F9; --ink:#162029; --muted:#53616E; --line:#D2D9E0; --line-2:#AAB7C4;
  --moss:#1F5C88; --moss-ink:#FFFFFF; --moss-soft:#DAE7F2;
  --sun:#D96A26; --sun-ink:#2A1305; --sun-soft:#FBE5D4;
  --good:#1E7A49; --good-soft:#DCF1E3; --bad:#B53F2E; --bad-soft:#F8E0DA;
  --water:#22827F; --water-soft:#C4E5E2; --land:#D9D3BC; --soil:#A88B6A;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E141A; --surface:#161F28; --sunk:#121A22; --ink:#E2E9F0; --muted:#98A7B5; --line:#26323D; --line-2:#3A4A59;
    --moss:#7DB4E3; --moss-ink:#0A1622; --moss-soft:#1B3146;
    --sun:#F0965A; --sun-ink:#261205; --sun-soft:#3C2716;
    --good:#6CCB94; --good-soft:#16382A; --bad:#F2897A; --bad-soft:#3E211C;
    --water:#5CC3BE; --water-soft:#1A4442; --land:#3A3727; --soil:#5A4A36;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E141A; --surface:#161F28; --sunk:#121A22; --ink:#E2E9F0; --muted:#98A7B5; --line:#26323D; --line-2:#3A4A59;
  --moss:#7DB4E3; --moss-ink:#0A1622; --moss-soft:#1B3146;
  --sun:#F0965A; --sun-ink:#261205; --sun-soft:#3C2716;
  --good:#6CCB94; --good-soft:#16382A; --bad:#F2897A; --bad-soft:#3E211C;
  --water:#5CC3BE; --water-soft:#1A4442; --land:#3A3727; --soil:#5A4A36;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding-block:20px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Home */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding-block:12px 22px;border-bottom:2px solid var(--ink)}
.hero h1{font-size:clamp(40px,8vw,64px);font-weight:800;letter-spacing:-.02em}
.hero .lede{margin:10px 0 0;color:var(--muted);max-width:56ch}
.mini{width:140px;height:auto}
.mini text{font-family:var(--f-mono);font-size:9px;fill:var(--muted)}
@media (max-width:560px){.hero{grid-template-columns:1fr}.mini{display:none}}
.section{margin-top:28px;display:grid;gap:12px}
.section > h2{font-size:24px;font-weight:800}
.resume{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--sun-soft);border:2px solid var(--sun);border-radius:10px;padding:14px 16px}
.resume p{margin:0;min-width:0}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:600px){.modes{grid-template-columns:1fr}}
.mode{display:grid;gap:6px;align-content:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;min-width:0}
.mode:hover{border-color:var(--moss)}
.mode h3{font-size:21px;font-weight:800}
.mode p{margin:0;color:var(--muted);font-size:15px}
.mode .meta{font-family:var(--f-mono);font-size:12px;color:var(--moss);letter-spacing:.04em;text-transform:uppercase}
.mode.primary{grid-column:1/-1;background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}
.mode.primary p,.mode.primary .meta{color:var(--moss-ink);opacity:.9}
.mode.wide{grid-column:1/-1}
.mode[disabled]{opacity:.5;cursor:not-allowed}
.topicbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-2);background:var(--sunk);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}
.setting{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.setting p{margin:0;font-size:15px;color:var(--muted)}
.setting strong{color:var(--ink)}
.switch{flex:none;width:48px;height:28px;border-radius:999px;border:0;background:var(--line-2);position:relative;cursor:pointer;margin-top:2px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--moss)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* History */
.hist{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:16px;min-width:0}
.hist-empty{color:var(--muted);margin:0}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{stroke:var(--moss);stroke-width:2.5;fill:none}
.chart .ar{fill:var(--moss-soft)}
.chart .pt{fill:var(--surface);stroke:var(--moss);stroke-width:2.5}
.chart .pt.last{fill:var(--moss)}
.chart .pass{stroke:var(--sun);stroke-dasharray:4 4;stroke-width:1.5}
.chart .lbl{fill:var(--ink);font-weight:700}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-family:var(--f-mono);font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.hi{background:var(--good-soft);color:var(--good)}
.pill.mid{background:var(--sun-soft);color:var(--ink)}
.pill.lo{background:var(--bad-soft);color:var(--bad)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:10px;align-items:center;font-size:15px}
.bar .track{height:10px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;background:var(--moss)}
.bar .fill.lo{background:var(--bad)}
.bar .fill.mid{background:var(--sun)}
.bar .v{font-family:var(--f-mono);font-size:13px;text-align:right}
@media (max-width:480px){.bar{grid-template-columns:minmax(0,1fr) 80px 44px}}
.hist-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.hist-head h3{font-size:18px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px;padding:0}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}

/* Buttons */
.btn{border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--moss);color:var(--moss-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.small{padding:8px 12px;font-size:14px}

/* Test */
.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.bar-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar-row .count{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.prog{height:8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.prog > div{height:100%;background:var(--moss);transition:width .25s}
.card{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:16px;min-width:0}
@media (max-width:480px){.card{padding:16px}}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--moss-soft);color:var(--ink)}
.tag.src{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.tag.sa{background:var(--sun-soft);color:var(--ink)}
.qtext{font-size:21px;line-height:1.35;font-weight:700;margin:0;text-wrap:pretty}
.qhint{margin:-6px 0 0;color:var(--muted);font-size:15px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--sunk);border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:52px}
.opt:hover:not([disabled]){border-color:var(--moss)}
.opt .k{font-family:var(--f-mono);font-weight:700;font-size:13px;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--surface)}
.opt.sel{border-color:var(--moss);background:var(--moss-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.actions .spacer{flex:1}
.fb{border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.fb.ok{background:var(--good-soft);border:1px solid var(--good)}
.fb.no{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.part{background:var(--sun-soft);border:1px solid var(--sun)}
.fb h4{margin:0;font-family:var(--f-display);font-size:19px}
.fb p{margin:0}
.fb .ans{font-weight:700}
.fig{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto}
.fig svg{display:block;width:100%;min-width:300px;height:auto;margin:0 auto}
.fig .bx{fill:var(--surface);stroke:var(--line-2);stroke-width:1.5}
.fig .bx2{fill:var(--moss-soft);stroke:var(--moss);stroke-width:1.5}
.fig .bx3{fill:var(--sun-soft);stroke:var(--sun);stroke-width:1.5}
.fig .tx{fill:var(--ink);font-family:var(--f-body);font-size:13px}
.fig .tx.b{font-weight:700}
.fig .tx.s{font-size:11px;fill:var(--muted)}
.fig .tx.m{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.fig .ar{stroke:var(--muted);stroke-width:1.6;fill:none}
.fig .ah{fill:var(--muted)}
.fig .ax{stroke:var(--ink);stroke-width:1.5;fill:none}
.fig .gr{stroke:var(--line-2);stroke-width:1;stroke-dasharray:4 4}
.fig .tagc{fill:var(--sun);stroke:var(--sun-ink);stroke-width:1}
.fig .tagt{fill:var(--sun-ink);font-family:var(--f-mono);font-size:13px;font-weight:700}
.fig .l1{stroke:var(--water);stroke-width:3;fill:none}
.fig .l2{stroke:var(--sun);stroke-width:3;fill:none}
.fig .l3{stroke:var(--moss);stroke-width:3;fill:none}
.fig .l4{stroke:var(--muted);stroke-width:2.5;fill:none}
.fig .gap{fill:var(--sun-soft)}
.fig .gap2{fill:var(--bad-soft)}
.fig .heat{stroke:var(--bad);stroke-width:2.5;fill:none;stroke-dasharray:7 4}
.fig .sunc{fill:var(--sun)}
.fig .dashl{stroke-dasharray:8 5}
.fig .band{fill:var(--surface);opacity:.55}
.fig .pm{fill:var(--moss)} .fig .pf{fill:var(--water)}
.fig .lvl{stroke:var(--ink);stroke-width:1.2}
.fig .v1{fill:var(--water-soft)} .fig .v2{fill:var(--moss-soft)} .fig .v3{fill:var(--land)} .fig .v4{fill:var(--sun-soft)}
.fig table{width:auto;min-width:100%;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.fig th{font-size:10px;white-space:nowrap;padding:6px 8px}
.fig td{padding:7px 8px;font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.fig td:first-child{font-family:var(--f-body);font-weight:700;font-size:14px}
.figcap{font-size:13px;color:var(--muted);margin:6px 2px 0}

/* short answer */
.sa{display:grid;gap:6px}
.sa textarea{width:100%;min-height:132px;font:inherit;font-size:17px;line-height:1.45;padding:12px 14px;border-radius:10px;border:2px solid var(--line-2);background:var(--surface);color:var(--ink);resize:vertical}
.sa textarea.right{border-color:var(--good)}
.sa textarea.part{border-color:var(--sun)}
.sa textarea.wrong{border-color:var(--bad)}
.sa textarea:disabled{opacity:1;background:var(--sunk)}
.sa .wc{font-family:var(--f-mono);font-size:12px;color:var(--muted);justify-self:end}

/* AI grading */
.grading{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:15px;padding:4px 2px}
.spin{flex:none;width:20px;height:20px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--moss);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fb .pts{font-family:var(--f-mono);font-size:13px;font-weight:700;letter-spacing:.04em}
.fb ul{margin:0;padding-left:20px;display:grid;gap:2px}
.fb .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.model{background:var(--surface);border:1px dashed var(--line-2);border-radius:8px;padding:10px 12px}
.model b{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;display:block;margin-bottom:2px}
.selfscore{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.keyhint{font-size:13px;color:var(--muted);margin:0}
@media (hover:none){.keyhint{display:none}}

/* Results */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;padding-block:10px 22px;border-bottom:2px solid var(--ink)}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,16vw,112px);line-height:.9;letter-spacing:-.03em}
.score p{margin:4px 0 0;color:var(--muted)}
.score h1{font-size:28px}
@media (max-width:480px){.score{grid-template-columns:1fr;gap:6px}}
.missed{display:grid;gap:10px}
.miss{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:12px 14px;display:grid;gap:4px;min-width:0}
.miss.half{border-left-color:var(--sun)}
.miss .q{font-weight:700}
.miss .yours{color:var(--bad);overflow-wrap:anywhere}
.miss .corr{color:var(--good);font-weight:700}
.miss .why{color:var(--muted);font-size:15px}
.rowbtns{display:flex;flex-wrap:wrap;gap:10px}
.quitbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const fmt = n => Number(n).toLocaleString("en-US", {maximumFractionDigits: 4});
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------- question bank ---------- */
const TOPICS = {
  stages: "Demographic transition",
  pop: "Population over time",
  countries: "Comparing countries",
  footprint: "Footprints & Anthropocene",
  causes: "Human causes of change",
  climate: "Climate change",
  sustain: "Sustainability"
};

/* a[0] is the right answer; options are shuffled when shown, or sorted when fix is set */
const MC = [
  /* demographic transition */
  {id: "s01", t: "stages", fix: 1, q: "In which stage are birth rates and death rates both high, so they roughly cancel each other out?", a: ["Stage 1", "Stage 2", "Stage 3", "Stage 4"], why: "Stage 1 (high stationary): high birth rates and high death rates cancel out, so the population barely grows."},
  {id: "s02", t: "stages", fix: 1, q: "In which stage does the birth rate stay high while the death rate falls?", a: ["Stage 2", "Stage 1", "Stage 3", "Stage 4"], why: "Stage 2 (early expanding): births stay high, deaths fall, so births are much greater than deaths."},
  {id: "s03", t: "stages", fix: 1, q: "In which stage is the death rate already low and the birth rate begins to fall?", a: ["Stage 3", "Stage 1", "Stage 2", "Stage 4"], why: "Stage 3 (late expanding): the death rate stays low while the birth rate starts dropping."},
  {id: "s04", t: "stages", fix: 1, q: "In which stage are birth and death rates both low and the total population stable?", a: ["Stage 4", "Stage 1", "Stage 2", "Stage 3"], why: "Stage 4 (low stationary): both rates are low, so the total population levels off."},
  {id: "s05", t: "stages", fix: 1, q: "In which stage does the death rate become higher than the birth rate?", a: ["Stage 5", "Stage 2", "Stage 3", "Stage 4"], why: "Stage 5 (declining): deaths exceed births, so the population shrinks."},
  {id: "s06", t: "stages", q: "Which list gives the population growth of Stages 1–5 in the right order?", a: ["Slow, rapid, slowing, stable, declining", "Rapid, slow, stable, slowing, declining", "Slow, slowing, rapid, declining, stable", "Declining, slow, rapid, slowing, stable"], why: "Slow (1) → rapid (2) → slowing (3) → stable (4) → declining (5)."},
  {id: "s07", t: "stages", q: "Which phase of population growth matches Stage 2?", a: ["Rapid growth", "Slow growth", "Slowing growth", "Declining population"], why: "With births still high and deaths falling, Stage 2 is the rapid growth phase."},
  {id: "s08", t: "stages", q: "Why does the death rate drop during Stage 2?", a: ["Better health care, sanitation, food supply and clean water", "More people can get birth control", "Women gain more work opportunities", "Labor shortages and higher social security costs"], why: "Improved public health, sanitation, food supply, water supply and hygiene cut deaths, including infant deaths."},
  {id: "s09", t: "stages", q: "What happens to infant mortality as a country moves from Stage 1 to Stage 2?", a: ["It goes down", "It goes up", "It stays the same", "It becomes higher than the birth rate"], why: "Stage 1 has high infant mortality; better health care and sanitation in Stage 2 reduce it."},
  {id: "s10", t: "stages", q: "Which changes in Stage 3 lead to smaller families?", a: ["More access to birth control and better education", "Better food supply and less starvation", "Children working to support the household", "A rising death rate"], why: "Increased access to birth control (contraception) and improved education lead to smaller families."},
  {id: "s11", t: "stages", fix: 1, q: "Family planning is almost nonexistent and children must help support the household. Which stage is this?", a: ["Stage 1", "Stage 2", "Stage 3", "Stage 4"], why: "These are Stage 1 traits of a pre-industrial society."},
  {id: "s12", t: "stages", fix: 1, q: "In which stage do children become expensive, so having a child becomes a choice?", a: ["Stage 4", "Stage 1", "Stage 2", "Stage 3"], why: "In Stage 4, children are high cost and having them is a choice; contraception is widely available."},
  {id: "s13", t: "stages", fix: 1, q: "A population is mostly controlled by its food supply and rises and falls quickly because of natural events. Which stage is it in?", a: ["Stage 1", "Stage 2", "Stage 3", "Stage 4"], why: "In Stage 1 the population is set by the food supply and swings with natural events like drought or disease."},
  {id: "s14", t: "stages", fix: 1, q: "Which stage has an age structure shaped like a triangle, with a large part of the population at the base?", a: ["Stage 2", "Stage 3", "Stage 4", "Stage 5"], why: "Stage 2 has lots of young people (wide base) because births stay high while more children survive."},
  {id: "s15", t: "stages", fix: 1, q: "In which stage does the age structure become less triangular at the base and more columnar?", a: ["Stage 3", "Stage 1", "Stage 2", "Stage 5"], why: "As birth rates fall in Stage 3, the base narrows and the shape becomes more like a column."},
  {id: "s16", t: "stages", q: "A country has fewer young people and more elderly people. Which problem does this cause?", a: ["A greater tax burden and a lack of health care", "High infant mortality", "Rapid population growth", "Starvation from a poor food supply"], why: "Fewer young workers support more elderly people, which means a greater tax burden and a lack of health care."},
  {id: "s17", t: "stages", q: "Which problems come with Stage 5 (a declining population)?", a: ["Labor shortages and higher health care and social security costs", "High birth rates and high infant mortality", "Poor sanitation and short life expectancy", "Rapid growth and crowded schools"], why: "With deaths above births, there aren't enough workers, and costs for health care and social security go up."},
  {id: "s18", t: "stages", fix: 1, q: "Japan, Germany and Italy are examples of which stage?", a: ["Stage 5", "Stage 2", "Stage 3", "Stage 4"], why: "Their death rates exceed their birth rates, so their populations are declining (Stage 5)."},
  {id: "s19", t: "stages", fix: 1, q: "Yemen, Afghanistan and Kenya are examples of which stage?", a: ["Stage 2", "Stage 1", "Stage 3", "Stage 4"], why: "These developing countries still have high birth rates but falling death rates (Stage 2)."},
  {id: "s20", t: "stages", fix: 1, q: "Mexico and India are examples of which stage?", a: ["Stage 3", "Stage 1", "Stage 2", "Stage 5"], why: "Mexico and India have low death rates and falling birth rates (Stage 3)."},
  {id: "s21", t: "stages", fix: 1, q: "Canada, the United Kingdom and the United States are examples of which stage?", a: ["Stage 4", "Stage 2", "Stage 3", "Stage 5"], why: "Low birth and death rates with a fairly stable population put them in Stage 4."},
  {id: "s22", t: "stages", q: "Which is an example of a Stage 1 population?", a: ["Amazon basin tribes", "Japan", "Mexico", "Canada"], why: "Amazon basin tribes (and Angola) are examples of Stage 1."},
  {id: "s23", t: "stages", q: "What is Stage 3 also called?", a: ["Late expanding", "High stationary", "Early expanding", "Low stationary"], why: "Stage 1 high stationary, Stage 2 early expanding, Stage 3 late expanding, Stage 4 low stationary, Stage 5 declining."},
  {id: "s24", t: "stages", q: "What is Stage 4 also called?", a: ["Low stationary", "High stationary", "Early expanding", "Late expanding"], why: "Stage 4 is low stationary: low birth and death rates, steady population."},
  {id: "s25", t: "stages", q: "Population growth changes in a predictable way as a society moves from…", a: ["a primitive economy to industrialization", "industrialization to farming", "cities back to the countryside", "a cold climate to a warm climate"], why: "The demographic transition follows a society as it moves from a primitive economy to industrialization."},
  {id: "s26", t: "stages", fig: "dtm", q: "On this graph, the shaded gap between the birth rate and death rate in Stages 2 and 3 is called…", a: ["Natural increase", "Natural decrease", "Carrying capacity", "Net migration"], why: "When births are higher than deaths, the gap is natural increase. In Stage 5 deaths are higher, which is natural decrease."},
  {id: "s27", t: "stages", fig: "dtm", q: "According to the graph, what happens to the total population during Stages 2 and 3?", a: ["It rises quickly", "It falls quickly", "It stays flat", "It goes up and down wildly"], why: "Deaths have dropped but births are still higher, so the total population climbs fast."},
  {id: "s28", t: "stages", fig: "ages", fix: 1, q: "Which age-structure diagram best fits a country in Stage 2 (high birth rate, falling death rate)?", a: ["B", "A", "C", "D"], why: "B is a straight-sided triangle: lots of young people, with more people now surviving into middle age."},
  {id: "s29", t: "stages", fig: "ages", fix: 1, q: "Which age-structure diagram shows a low birth rate with many older people (Stage 4 or 5)?", a: ["D", "A", "B", "C"], why: "D has a narrow base (few births) and is widest in the middle and older ages."},
  {id: "s30", t: "stages", fig: "ages", fix: 1, q: "Diagram A narrows very quickly from the base up. What does this show?", a: ["A high birth rate and high death rates at every age", "A low birth rate and long life expectancy", "A population that is shrinking", "A stable population with many elderly people"], why: "A is Stage 1: many births, but each age group gets much smaller because of high death rates and short life expectancy."},
  {id: "s31", t: "stages", q: "In Stage 3, more women stay in school and the cost of raising children goes up. What happens to the birth rate?", a: ["It falls", "It rises", "It stays high", "It becomes lower than the death rate right away"], why: "Education, women's expanding status and the higher cost of children all lower the birth rate in Stage 3."},

  /* population over time */
  {id: "p01", t: "pop", fig: "history", q: "For most of human history, what appears to have been the carrying capacity for humans?", a: ["About 500 million", "About 50 million", "About 2 billion", "About 6 billion"], why: "The population stayed around 500 million or less for most of history."},
  {id: "p02", t: "pop", fig: "history", q: "Which two events appear to have increased the human carrying capacity?", a: ["Plowing and irrigation, and the Industrial Revolution", "Agriculture and the bubonic plague", "The bubonic plague and the Industrial Revolution", "Plowing and irrigation, and the bubonic plague"], why: "Plowing and irrigation and the Industrial Revolution let Earth support more people."},
  {id: "p03", t: "pop", fig: "history", q: "Which event on the graph is a density-dependent limiting factor?", a: ["The bubonic plague", "Agriculture begins", "Plowing and irrigation", "The Industrial Revolution"], why: "Disease like the plague spreads faster in crowded populations, so it is density-dependent. It caused the dip."},
  {id: "p04", t: "pop", q: "About how long has the human population been greater than 1 billion?", a: ["Since about 1800", "Since about 10,000 B.C.", "Since about 1000 A.D.", "Only since about 2000"], why: "The population passed 1 billion around 1800 and has been above it ever since."},
  {id: "p05", t: "pop", q: "Which statement about global population today is correct?", a: ["The population is still increasing, but the growth rate is decreasing", "The population and the growth rate are both decreasing", "The population is decreasing, but the growth rate is increasing", "The population and the growth rate have both stopped changing"], why: "There are still more people every year, but the rate of growth is slowing down."},
  {id: "p06", t: "pop", q: "About how many people are expected on Earth in the year 2042?", a: ["About 9 billion", "About 500 million", "About 3 billion", "About 20 billion"], why: "Population estimates put the world at about 9 billion by 2042."},
  {id: "p07", t: "pop", fig: "history", q: "What happened to the human population after the Industrial Revolution began?", a: ["It shot up very quickly", "It dropped sharply", "It stayed about the same", "It slowly leveled off at 500 million"], why: "After the Industrial Revolution, the curve turns almost straight up to about 6 billion by 2000."},
  {id: "p08", t: "pop", q: "Which list contains only factors that affect a country's population growth?", a: ["Birth rate, death rate, fertility, net migration, age structure", "Birth rate, rainfall, ozone, net migration, smog", "Death rate, glaciers, sea level, fertility, wind", "Age structure, monoculture, acid rain, birth rate, clouds"], why: "Birth rate, death rate, fertility, net migration and age structure all change how fast a country grows."},

  /* comparing countries */
  {id: "c01", t: "countries", fig: "countries", q: "Which country has the highest population growth rate?", a: ["Angola", "Kenya", "Canada", "Denmark"], why: "Angola grows 2.72% per year, the highest of the four, because of its very high birth rate (33.6)."},
  {id: "c02", t: "countries", fig: "countries", fix: 1, q: "Kenya has a high birth rate (25.1) and a low death rate (6.8). Which stage is it in?", a: ["Stage 2", "Stage 1", "Stage 3", "Stage 4"], why: "High births with low deaths is Stage 2."},
  {id: "c03", t: "countries", fig: "countries", fix: 1, q: "Canada has a low birth rate (10.3) and a low death rate (8.5). Which stage is it in?", a: ["Stage 4", "Stage 1", "Stage 2", "Stage 3"], why: "Low births and low deaths is Stage 4."},
  {id: "c04", t: "countries", fig: "countries", q: "Denmark's birth rate (10.4) and death rate (10.3) are almost equal. What will most likely happen to its population?", a: ["It will stay about the same", "It will grow very fast", "It will crash quickly", "It will double in a few years"], why: "With births and deaths almost equal, growth is close to zero (0.22%), so the population stabilizes."},
  {id: "c05", t: "countries", q: "A country with a high birth rate is most likely a…", a: ["developing country", "developed country", "Stage 5 country", "country with a declining population"], why: "High birth rates go with developing countries; low birth rates go with developed countries."},
  {id: "c06", t: "countries", fig: "countries", q: "Canada's birth rate is low, but it still grows 0.74% a year. What explains most of that growth?", a: ["Its high immigration rate (5.7 per 1,000)", "Its high birth rate", "Its high death rate", "Its young median age"], why: "Births are only a little higher than deaths, so most of Canada's growth comes from people moving in."},
  {id: "c07", t: "countries", fig: "countries", q: "Angola's median age is 18.2 years and Canada's is 42. What does this tell you?", a: ["Angola has many more young people, so it will keep growing", "Angola's people live longer than Canada's", "Canada will grow faster than Angola", "Both countries have the same age structure"], why: "A young median age means lots of people about to have children, so growth continues."},
  {id: "c08", t: "countries", fig: "countries", q: "Which country has the highest life expectancy?", a: ["Canada", "Angola", "Kenya", "Denmark"], why: "Canada's life expectancy is 81.9 years, higher than Denmark (79.4), Kenya (64) and Angola (56)."},
  {id: "c09", t: "countries", q: "What shape is the age structure of a developing country like Angola or Kenya?", a: ["A triangle with a wide base", "A column with a narrow base", "An upside-down triangle", "A circle"], why: "Developing countries have many young people, so the base is wide. Developed countries look more like a column."},
  {id: "c10", t: "countries", fig: "countries", q: "Based on its data, what will most likely happen to Angola's population?", a: ["It will increase", "It will decrease", "It will stay the same", "It will match Denmark's"], why: "Angola's birth rate (33.6) is much higher than its death rate (11.3), so it will keep growing."},
  {id: "c11", t: "countries", fix: 1, q: "Which stage is the United States most likely in?", a: ["Stage 4", "Stage 1", "Stage 2", "Stage 3"], why: "The U.S. has low birth and death rates, so it is in Stage 4."},
  {id: "c12", t: "countries", fig: "countries", q: "Which country is an example of a developed country with a low birth rate and a low death rate?", a: ["Canada", "Angola", "Kenya", "None of them"], why: "Canada: birth rate 10.3, death rate 8.5. Angola and Kenya have high birth rates."},

  /* footprints & Anthropocene */
  {id: "f01", t: "footprint", q: "What is an ecological footprint?", a: ["The amount of productive land and water needed to supply a population's resources and absorb its wastes", "The area of land a person's house sits on", "The number of species living in an ecosystem", "The path animals take when they migrate"], why: "It measures the healthy land and water ecosystems needed for the resources you use and the wastes you make."},
  {id: "f02", t: "footprint", q: "Which of these counts toward a person's ecological footprint?", a: ["The trash, sewage and greenhouse gases they produce", "How tall they are", "How many species live near their house", "How much sunlight their town gets"], why: "Your footprint includes the resources you use (energy, food, water, shelter) and the wastes you produce."},
  {id: "f03", t: "footprint", q: "What is the average ecological footprint of a person in the United States?", a: ["8.1 gha", "2.0 gha", "4.6 gha", "6.1 gha"], why: "The U.S. average is about 8.1 global hectares, one of the largest."},
  {id: "f04", t: "footprint", q: "Which country has the smallest average ecological footprint?", a: ["Ghana (2.0 gha)", "France (4.6 gha)", "Russia (6.1 gha)", "United States (8.1 gha)"], why: "Ghana is about 2.0 gha and Peru about 2.1 gha, much smaller than the U.S."},
  {id: "f05", t: "footprint", q: "The average American footprint is 8.1 gha and the average in Ghana is 2.0 gha. About how many times larger is the American footprint?", a: ["About 4 times larger", "About 2 times larger", "About 10 times larger", "About the same"], why: "8.1 ÷ 2.0 ≈ 4."},
  {id: "f06", t: "footprint", q: "Why is the average American's ecological footprint so large?", a: ["Americans use more resources and energy and make more waste per person", "The United States has more land than other countries", "Americans have more children than other countries", "The United States has the most forests"], why: "More energy use, more stuff and more waste per person means more land and water are needed."},
  {id: "f07", t: "footprint", q: "Which choice would lower a person's ecological footprint?", a: ["Using greener electricity and traveling less", "Buying more products", "Driving everywhere instead of walking", "Throwing away more trash"], why: "Less energy use and less travel mean fewer resources used and fewer greenhouse gases made."},
  {id: "f08", t: "footprint", q: "Around what year did the Great Acceleration begin?", a: ["1950", "1800", "1000", "2010"], why: "Starting around 1950, human population and resource use shot up together."},
  {id: "f09", t: "footprint", q: "Which trends rose sharply during the Great Acceleration?", a: ["World population, energy use, water use and fertilizer use", "Forest area, glacier size and Arctic sea ice", "Death rates, infant mortality and starvation", "Ozone layer thickness and fish populations"], why: "Population, energy, water and fertilizer use (and coastal nitrogen and fish catch) all rose quickly after 1950."},
  {id: "f10", t: "footprint", q: "What is the Anthropocene?", a: ["The period when human activity has become the major cause of global change", "The time before humans existed", "The study of ancient human bones", "A layer of the atmosphere"], why: "The Anthropocene, the “Age of Humans,” is when human activity became the main driver of global change."},
  {id: "f11", t: "footprint", q: "Which of these is an example of an anthrome?", a: ["Cropland", "An untouched rainforest", "The deep ocean floor", "A wild glacier"], why: "Anthromes are human-altered biomes: cities, villages, croplands and rangelands."},
  {id: "f12", t: "footprint", q: "Which describes an anthrome?", a: ["An ecological region created by long-term interactions between humans and ecosystems", "A biome that humans have never touched", "A type of greenhouse gas", "A layer of the atmosphere that blocks UV rays"], why: "An anthrome is a human-altered biome shaped by long-term human use."},

  /* human causes of global change */
  {id: "h01", t: "causes", q: "Why can extra nitrogen from fossil fuels or fertilizer cause algal blooms?", a: ["Nitrogen is a limiting nutrient for producers like algae", "Nitrogen is poisonous to fish", "Nitrogen makes water colder", "Nitrogen blocks sunlight in the water"], why: "When a limiting nutrient is added, producers like algae can grow out of control."},
  {id: "h02", t: "causes", q: "How does farming add nitrogen to streams, lakes and oceans?", a: ["Nitrogen-rich fertilizer runs off the land into the water", "Crops breathe nitrogen into the water", "Tractors release nitrogen into the water", "Farm animals drink less water"], why: "Fertilizer helps grow food, but nitrogen runoff ends up in streams, lakes and oceans."},
  {id: "h03", t: "causes", q: "How does acid rain form?", a: ["Air pollution combines with water and falls as acidic rain", "Ocean water evaporates and becomes acidic", "Algae release acid into clouds", "Sunlight turns rain into acid"], why: "Pollution in the air mixes with water in clouds and falls as rain that is acidic."},
  {id: "h04", t: "causes", q: "What does acid rain especially damage?", a: ["Forests and lakes", "Deserts and glaciers", "Cities and roads only", "The ozone layer"], why: "Acid rain is especially damaging to forests and lakes."},
  {id: "h05", t: "causes", q: "What causes ocean acidification?", a: ["The ocean absorbs carbon dioxide from the atmosphere, lowering its pH", "Acid rain falling only on the ocean", "Fish releasing acid into the water", "Too much nitrogen raising the ocean's pH"], why: "As the ocean absorbs more CO₂ from the air, its pH keeps decreasing."},
  {id: "h06", t: "causes", fig: "biomag", q: "In this food chain, which organisms have the highest concentration of the pollutant?", a: ["Fish-eating birds", "Producers", "Zooplankton", "Small fish"], why: "Pollutant concentration increases at each higher trophic level, so the top predator has the most."},
  {id: "h07", t: "causes", fig: "biomag", q: "How many times more concentrated is the pollutant in small fish than in zooplankton?", a: ["10 times", "100 times", "1,000 times", "The same"], why: "Zooplankton 10,000 → small fish 100,000, which is 10 times more."},
  {id: "h08", t: "causes", q: "In biological magnification, what happens as you move up a food chain?", a: ["The pollutant concentration increases as the number of organisms at each level decreases", "The pollutant concentration decreases at each level", "The number of organisms increases at each level", "The pollutant disappears after the producers"], why: "Fewer organisms at higher trophic levels each carry more pollutant, so the concentration builds up."},
  {id: "h09", t: "causes", q: "Deforestation can have negative effects on…", a: ["soil, water, carbon storage and animals", "only the trees that are cut down", "the ozone layer only", "nothing, because forests grow back right away"], why: "Losing forests harms soil, water, carbon storage and the animals that live there."},
  {id: "h10", t: "causes", q: "What is monoculture?", a: ["Planting large areas with a single, high-production crop every year", "Planting many different crops together", "Raising only one kind of animal", "Letting a field rest for a year"], why: "Monoculture is planting one highly productive crop over large areas year after year."},
  {id: "h11", t: "causes", q: "What does habitat fragmentation cause?", a: ["Biodiversity loss and ecosystems that are more vulnerable to other disturbances", "More biodiversity and stronger ecosystems", "Cleaner water and air", "Higher sea levels"], why: "Breaking habitats into small pieces reduces biodiversity and makes ecosystems easier to damage."},
  {id: "h12", t: "causes", q: "What is overharvesting?", a: ["Using a natural resource in an unsustainable way", "Planting more crops than needed", "Harvesting crops too early", "Using renewable energy"], why: "Overharvesting means taking a resource faster than it can recover."},
  {id: "h13", t: "causes", q: "What makes a species invasive?", a: ["It is non-native and its introduction causes economic, environmental or health harm", "It is native and has lived in an area for a long time", "It is endangered", "It only eats plants"], why: "Invasive species are introduced to new places by humans and disrupt the ecosystem."},
  {id: "h14", t: "causes", q: "What is a pollutant?", a: ["A harmful material that can enter the biosphere through the land, air or water", "Any natural resource", "A gas that protects Earth from UV rays", "A nutrient that helps crops grow"], why: "A pollutant is harmful material that gets into the biosphere through land, air or water."},
  {id: "h15", t: "causes", q: "What does the ozone layer do?", a: ["Protects life on Earth from harmful ultraviolet rays in sunlight", "Traps heat to warm the Earth", "Causes acid rain", "Makes smog"], why: "The ozone layer has concentrated ozone gas that blocks harmful UV rays."},
  {id: "h16", t: "causes", q: "What is smog?", a: ["A gray-brown haze formed by a mixture of chemicals", "A type of cloud made of pure water", "A layer that blocks UV rays", "Rain that is acidic"], why: "Smog is the gray-brown haze made by a mix of chemicals in the air."},
  {id: "h17", t: "causes", q: "How do humans mainly affect the atmosphere and climate?", a: ["Burning fossil fuels, which releases greenhouse gases and air pollution", "Planting trees in cities", "Using solar panels", "Recycling paper"], why: "Burning fossil fuels releases CO₂ and other pollutants that trap heat and pollute the air."},

  /* climate */
  {id: "k01", t: "climate", q: "Earth's average temperature is determined by…", a: ["the balance of heat that stays in the atmosphere and heat that is lost to space", "how close Earth is to the moon", "the amount of water in the oceans", "the number of plants on land"], why: "If more heat stays in than escapes to space, Earth warms."},
  {id: "k02", t: "climate", q: "Which three gases mostly control the greenhouse effect?", a: ["Carbon dioxide, methane and water vapor", "Oxygen, nitrogen and helium", "Ozone, hydrogen and oxygen", "Carbon monoxide, neon and argon"], why: "CO₂, methane and water vapor trap heat in the atmosphere."},
  {id: "k03", t: "climate", q: "What is the greenhouse effect?", a: ["Certain gases trap sunlight energy in Earth's atmosphere as heat", "The ozone layer blocks UV rays", "Plants grow faster in greenhouses", "The ocean absorbs carbon dioxide"], why: "Greenhouse gases trap heat in the atmosphere, keeping Earth warm."},
  {id: "k04", t: "climate", fig: "greenhouse", q: "In this diagram, what happens to the heat given off by Earth's surface?", a: ["Some is trapped by greenhouse gases and some escapes to space", "All of it escapes to space", "All of it stays trapped forever", "It turns back into sunlight"], why: "Greenhouse gases trap some heat and send it back down; the rest escapes."},
  {id: "k05", t: "climate", q: "The amount of greenhouse gases in the atmosphere changes with biogeochemical cycles and can be affected by…", a: ["both human and nonhuman activities", "only human activities", "only nonhuman activities", "nothing but the sun"], why: "Natural cycles and human activities both change greenhouse gas levels."},
  {id: "k06", t: "climate", q: "Which statement describes weather, not climate change?", a: ["It is rainy and cold today", "Average temperatures have risen over the last 100 years", "Extreme storms have become more frequent over decades", "Average rainfall in a region has dropped over 50 years"], why: "Weather is day-to-day conditions. Climate change is a long-term change in averages."},
  {id: "k07", t: "climate", q: "Climate change is a long-term change in averages of…", a: ["temperature, clouds, winds, precipitation and extreme weather", "only temperature", "birth rates and death rates", "plant and animal populations"], why: "Climate change covers temperature, clouds, winds, precipitation and how often and how bad extreme weather is."},
  {id: "k08", t: "climate", q: "What is global warming?", a: ["An increase in the average temperature on Earth", "A hot day in summer", "A hole in the ozone layer", "The ocean getting more acidic"], why: "Global warming is the rise in Earth's average temperature."},
  {id: "k09", t: "climate", q: "Which observation is evidence that climate change is happening?", a: ["Arctic sea ice, glaciers and snow cover are decreasing", "Sea levels are falling", "Greenhouse gas emissions are decreasing", "Glaciers are growing everywhere"], why: "Shrinking ice and snow, rising seas, rising temperatures and more emissions are all evidence."},
  {id: "k10", t: "climate", q: "What is happening to sea levels?", a: ["They are rising", "They are falling", "They are staying exactly the same", "They change only during storms"], why: "Sea levels are rising as water warms and ice melts."},
  {id: "k11", t: "climate", q: "About how much has sea level risen in the last 55 years?", a: ["About 4 inches", "About 4 feet", "About 40 feet", "It hasn't changed"], why: "Sea level has increased about 4 inches in 55 years, which leads to loss of land."},
  {id: "k12", t: "climate", q: "Droughts and a smaller snowpack affect people mainly through…", a: ["water availability", "loss of land", "ocean acidification", "the ozone layer"], why: "Less snowpack and more droughts mean less water for people."},
  {id: "k13", t: "climate", q: "How does climate change affect crop cycles?", a: ["It has a negative impact on crop yield", "It always makes crops grow bigger", "It has no effect on farming", "It removes the need for water"], why: "Changing temperature and rain patterns lower crop yields."},
  {id: "k14", t: "climate", q: "Which list gives the three main ways humans are impacted by climate change?", a: ["Water availability, crop cycles and loss of land", "Smog, acid rain and the ozone layer", "Birth rate, death rate and migration", "Monoculture, overharvesting and invasive species"], why: "Climate change affects water availability, crop cycles and land (through rising seas)."},
  {id: "k15", t: "climate", q: "How does science help us respond to global environmental change?", a: ["Scientists collect data and study Earth's systems to understand changes and develop solutions", "Scientists stop the weather from changing", "Science proves that humans have no effect on Earth", "Scientists make all the laws about pollution"], why: "Data and models show what is changing and why, which helps people find solutions."},
  {id: "k16", t: "climate", q: "How can more greenhouse gases in the atmosphere affect other Earth systems?", a: ["They trap more heat, which warms oceans, melts ice and changes ecosystems", "They cool the planet and make glaciers grow", "They only affect the air, nothing else", "They raise the pH of the ocean"], why: "Extra trapped heat changes climate, which affects oceans, land and living things."},

  /* sustainability */
  {id: "u01", t: "sustain", q: "What is a renewable resource?", a: ["A resource that can be produced or replaced by healthy ecosystem functions", "A resource that runs out and can't be replaced", "A resource found only underground", "A resource that pollutes the most"], why: "Renewable resources replace themselves or keep existing even while being used."},
  {id: "u02", t: "sustain", q: "What is a nonrenewable resource?", a: ["A resource that cannot be replenished by a natural process within a reasonable amount of time", "A resource that can replace itself quickly", "Any resource that comes from the sun", "A resource that is free to use"], why: "Nonrenewable resources can't be replaced as fast as they are used up."},
  {id: "u03", t: "sustain", q: "Which energy source is renewable?", a: ["Wind", "Coal", "Natural gas", "Nuclear"], why: "Solar, biomass, geothermal, wind and hydropower are renewable."},
  {id: "u04", t: "sustain", q: "Which energy source is NONrenewable?", a: ["Nuclear", "Geothermal", "Biomass", "Hydropower"], why: "Fossil fuels (coal, natural gas) and nuclear are nonrenewable."},
  {id: "u05", t: "sustain", q: "Which list contains only renewable energy sources?", a: ["Solar, biomass, geothermal, wind, hydropower", "Coal, wind, solar, nuclear", "Natural gas, hydropower, coal", "Fossil fuels, biomass, geothermal"], why: "Coal, natural gas, fossil fuels and nuclear are nonrenewable."},

const AH = id => `<defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker></defs>`;
const tagc = (x, y, t) => `<circle class="tagc" cx="${x}" cy="${y}" r="12"/><text class="tagt" x="${x}" y="${y + 4.5}" text-anchor="middle">${t}</text>`;
const box = (x, y, w, h, t, cls = "bx", tcls = "tx b") => `<rect class="${cls}" x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="6"/><text class="${tcls}" x="${x}" y="${y + 4.5}" text-anchor="middle">${t}</text>`;
// smooth curve through key points (Catmull-Rom), returned as sampled [x, y] pairs
function spline(P, steps = 14) {
  const out = [];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    for (let s = 0; s < steps; s++) {
      const t = s / steps, t2 = t * t, t3 = t2 * t;
      const f = k => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3);
      out.push([f(0), f(1)]);
    }
  }
  out.push(P[P.length - 1]);
  return out;
}
const pts = a => a.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
const yAt = (S, x) => { for (let i = 1; i < S.length; i++) if (S[i][0] >= x) { const [x0, y0] = S[i - 1], [x1, y1] = S[i]; return x1 === x0 ? y1 : y0 + (y1 - y0) * (x - x0) / (x1 - x0); } return S[S.length - 1][1]; };

};

</svg>`;

const HERO_MINI =`<svg class="mini" viewBox="0 0 140 112" aria-hidden="true"><line x1="14" y1="96" x2="134" y2="96" stroke="var(--ink)" stroke-width="1.5"/><line x1="14" y1="8" x2="14" y2="96" stroke="var(--ink)" stroke-width="1.5"/><polyline points="${pts(spline([[16, 93], [70, 91], [100, 86], [116, 70], [124, 40], [128, 12]], 10))}" fill="none" stroke="var(--moss)" stroke-width="3" stroke-linecap="round"/><circle cx="128" cy="12" r="4.5" fill="var(--sun)"/><text x="14" y="108">10,000 B.C.</text><text x="134" y="108" text-anchor="end">now</text></svg>`;

/* ---------- engine ---------- */
const K = "hu3.";
const GRADER = window.GRADER_URL || "https://classboardd.vercel.app/api/grade";
const SA_PTS = 3;
const app = document.getElementById("app");

const ITEMS = {};
MC.forEach(q => ITEMS[q.id] = Object.assign({kind: "mc"}, q));
SA.forEach(q => ITEMS[q.id] = Object.assign({kind: "sa"}, q));
GLOSS.forEach(([term, def], i) => ITEMS["g" + (i + 1)] = {kind: "vocab", id: "g" + (i + 1), t: "vocab", term, def});
const topicName = t => t === "vocab" ? "Vocabulary" : TOPICS[t];

let run = store.get(K + "run", null);
if (run && !(run.items || []).every(it => ITEMS[it.id])) run = null;
if (run) for (const [id, a] of Object.entries(run.res)) if (a && a.pending) run.res[id] = {text: a.text, err: "Grading was interrupted."};
const saveRun = () => run ? store.set(K + "run", run) : store.del(K + "run");

/* ---------- building a test ---------- */
function optsFor(q) {
  if (q.kind === "vocab") {
    const others = shuffle(GLOSS.map(g => g[0]).filter(x => x !== q.term)).slice(0, 3);
    return shuffle([q.term, ...others]);
  }
  if (q.kind !== "mc") return null;
  return q.fix ? q.a.slice().sort((x, y) => x.localeCompare(y, "en", {numeric: true})) : shuffle(q.a);
}
const item = id => ({id, opts: optsFor(ITEMS[id])});
const take = (pool, n) => shuffle(pool).slice(0, n);
const mcOf = t => MC.filter(q => q.t === t).map(q => q.id);

function pickSA(n) {
  const pop = take(SA.filter(q => POP_TOPICS.includes(q.t)), 2);
  const seen = new Set(), rest = [];
  for (const q of shuffle(SA.filter(q => !POP_TOPICS.includes(q.t)))) {
    if (seen.has(q.t) && seen.size < 3) continue;
    seen.add(q.t); rest.push(q);
    if (rest.length === n - 2) break;
  }
  return [...pop, ...rest].map(q => q.id);
}

const MODES = {
  full: {title: "Full practice test", build() {
    const mc = shuffle(Object.entries(FULL_MIX).flatMap(([t, n]) => take(mcOf(t), n)));
    return [...mc, ...pickSA(5)];
  }},
  quick: {title: "Quick quiz", build: () => take(MC.map(q => q.id), 12)},
  stages: {title: "Stages drill", build: () => take([...mcOf("stages"), ...mcOf("countries")], 12)},
  sa: {title: "Short answers", build: () => pickSA(5)},
  vocab: {title: "Vocabulary", build: () => shuffle(Object.keys(ITEMS).filter(id => ITEMS[id].kind === "vocab"))},
  missed: {title: "Redo missed", build: () => take(store.get(K + "missed", []).filter(id => ITEMS[id]), 20)},
  topic: {title: "Topic practice", build: t => [...take(mcOf(t), 10), ...take(SA.filter(q => q.t === t).map(q => q.id), 1)]}
};

function start(mode, arg) {
  const ids = MODES[mode].build(arg);
  if (!ids.length) return;
  run = {mode, title: mode === "topic" ? TOPICS[arg] : MODES[mode].title, items: ids.map(item), i: 0, res: {}, t0: Date.now()};
  saveRun(); show();
}

/* ---------- scoring ---------- */
function tally(r) {
  let got = 0, max = 0;
  const by = {};
  for (const it of r.items) {
    const q = ITEMS[it.id], a = r.res[it.id], m = q.kind === "sa" ? SA_PTS : 1;
    const g = !a ? 0 : q.kind === "sa" ? (a.score || 0) : (a.ok ? 1 : 0);
    got += g; max += m;
    const b = by[q.t] = by[q.t] || {got: 0, max: 0};
    b.got += g; b.max += m;
  }
  return {got, max, pct: max ? Math.round(100 * got / max) : 0, by};
}
const answered = id => { const a = run.res[id]; return a && (ITEMS[id].kind !== "sa" || typeof a.score === "number"); };

/* ---------- home ---------- */
function home() {
  const hist = store.get(K + "hist", []);
  const missed = store.get(K + "missed", []).filter(id => ITEMS[id]);
  const resume = run ? `<div class="resume"><p><strong>${esc(run.title)}</strong> in progress, question ${run.i + 1} of ${run.items.length}.</p><div class="rowbtns"><button class="btn" data-go="resume">Keep going</button><button class="btn ghost" data-go="discard">Start over</button></div></div>` : "";
  const histHtml = hist.length ? `<div class="tbl"><table><thead><tr><th>When</th><th>Test</th><th>Score</th></tr></thead><tbody>${hist.slice(-8).reverse().map(h => `<tr><td class="n">${esc(new Date(h.d).toLocaleDateString("en-US", {month: "short", day: "numeric"}))}</td><td>${esc(h.title)}</td><td><span class="pill ${h.pct >= 80 ? "hi" : h.pct >= 60 ? "mid" : "lo"}">${h.pct}%</span></td></tr>`).join("")}</tbody></table></div>
    <div class="hist-head"><span></span><button class="linkbtn" data-go="clearhist">Clear history</button></div>` : `<p class="hist-empty">Your scores will show up here.</p>`;
  app.innerHTML = `
    <header class="hero"><div><p class="eyebrow">Biology · Unit 3</p><h1>Human Impact</h1><p class="lede">Practice test, not the real one. Short answers are graded by AI the way a 9th grade biology teacher would grade them.</p></div>${HERO_MINI}</header>
    ${resume ? `<section class="section">${resume}</section>` : ""}
    <section class="section"><h2>Start</h2><div class="modes">
      <button class="mode primary" data-start="full"><span class="meta">30 multiple choice + 5 short answers</span><h3>Full practice test</h3><p>Covers the whole unit, with extra questions on the demographic transition.</p></button>
      <button class="mode" data-start="quick"><span class="meta">12 multiple choice</span><h3>Quick quiz</h3><p>A short mixed review.</p></button>
      <button class="mode" data-start="sa"><span class="meta">5 short answers · AI graded</span><h3>Short answers</h3><p>Write answers and get a score out of 3 with feedback.</p></button>
      <button class="mode" data-start="stages"><span class="meta">12 multiple choice</span><h3>Stages drill</h3><p>Demographic transition stages and country data.</p></button>
      <button class="mode" data-start="vocab"><span class="meta">${GLOSS.length} terms</span><h3>Vocabulary</h3><p>Match each definition to its glossary term.</p></button>
      ${missed.length ? `<button class="mode wide" data-start="missed"><span class="meta">${Math.min(missed.length, 20)} question${missed.length === 1 ? "" : "s"}</span><h3>Redo missed</h3><p>Questions you got wrong or only partly right.</p></button>` : ""}
    </div></section>
    <section class="section"><h2>Practice one topic</h2><div class="topicbox"><div class="chips">${Object.entries(TOPICS).map(([t, n]) => `<button class="chip" data-topic="${t}">${esc(n)}</button>`).join("")}</div></div></section>
    <section class="section"><h2>Your scores</h2><div class="hist">${histHtml}</div></section>`;
  scrollTo(0, 0);
}

/* ---------- question ---------- */
function letter(i) { return "ABCD"[i]; }

function question() {
  const it = run.items[run.i], q = ITEMS[it.id], a = run.res[it.id];
  const n = run.items.length, done = run.items.filter(x => answered(x.id)).length;
  const fig = q.fig ? `<div class="fig">${FIG[q.fig]()}</div>` : "";
  let body = "";
  if (q.kind === "sa") body = saBody(q, a);
  else {
    const right = q.kind === "vocab" ? q.term : q.a[0];
    body = `<div class="opts" role="group" aria-label="Answer choices">${it.opts.map((o, i) => {
      const cls = a ? (o === right ? "right" : o === a.pick ? "wrong" : "") : "";
      return `<button class="opt ${cls}" data-pick="${i}" ${a ? "disabled" : ""}><span class="k">${letter(i)}</span><span>${esc(o)}</span></button>`;
    }).join("")}</div>`;
    if (a) body += `<div class="fb ${a.ok ? "ok" : "no"}"><h4>${a.ok ? "Correct" : "Not quite"}</h4>${a.ok ? "" : `<p class="ans">Answer: ${esc(right)}</p>`}<p>${esc(q.kind === "vocab" ? `${q.term}: ${q.def}` : q.why)}</p></div>`;
    else body += `<p class="keyhint">Tip: press A–D or 1–4 to answer.</p>`;
  }
  const qtext = q.kind === "vocab" ? `Which term matches this definition?` : q.q;
  const sub = q.kind === "vocab" ? `<p class="qhint" style="margin:0;font-size:18px;color:var(--ink)">“${esc(q.def)}”</p>` : "";
  const last = run.i === n - 1;
  app.innerHTML = `
    <div class="bar-top"><div class="bar-row"><button class="btn ghost small" data-go="home">← Home</button><span class="count">${esc(run.title)} · ${run.i + 1} / ${n}</span></div><div class="prog"><div style="width:${100 * done / n}%"></div></div></div>
    <article class="card">
      <div class="qmeta"><span class="tag">${esc(topicName(q.t))}</span>${q.kind === "sa" ? `<span class="tag sa">Short answer · ${SA_PTS} pts</span>` : ""}</div>
      <h2 class="qtext">${esc(qtext)}</h2>${sub}
      ${fig}${body}
      <div class="actions"><button class="btn ghost small" data-go="prev" ${run.i ? "" : "disabled"}>Back</button><span class="spacer"></span>
        <button class="btn" data-go="next" ${answered(it.id) ? "" : "disabled"}>${last ? "See results" : "Next"}</button></div>
    </article>`;
  const ta = app.querySelector("textarea");
  if (ta && !ta.disabled && matchMedia("(hover: hover)").matches) { ta.focus({preventScroll: true}); ta.setSelectionRange(ta.value.length, ta.value.length); }
  scrollTo(0, 0);
}

function saBody(q, a) {
  const text = a ? a.text || "" : (run.draft && run.draft[q.id]) || "";
  const locked = a && (a.pending || typeof a.score === "number");
  let out = `<div class="sa"><textarea id="sa" maxlength="1500" placeholder="Type your answer in full sentences…" ${locked ? "disabled" : ""}>${esc(text)}</textarea><span class="wc">${words(text)} words</span></div>`;
  if (!a || (!a.pending && typeof a.score !== "number" && !a.err)) return out + `<div class="rowbtns"><button class="btn sun" data-go="grade">Grade my answer</button></div>`;
  if (a.pending) return out + `<div class="grading"><span class="spin"></span>Grading like a 9th grade biology teacher…</div>`;
  if (a.err && typeof a.score !== "number") return out + `<div class="fb part"><h4>The AI grader couldn't be reached</h4><p>${esc(a.err)}</p>
    <div class="model"><b>Example full-credit answer</b>${esc(q.model)}</div>
    <p>Compare your answer and give yourself a score, or try the grader again.</p>
    <div class="selfscore">${[0, 1, 2, 3].map(s => `<button class="btn ghost small" data-self="${s}">${s} / ${SA_PTS}</button>`).join("")}<button class="btn small" data-go="grade">Try again</button></div></div>`;
  return out + saResult(q, a);
}

function saResult(q, a) {
  const cls = a.score === SA_PTS ? "ok" : a.score === 0 ? "no" : "part";
  const head = a.score === SA_PTS ? "Full credit" : a.score === 0 ? "No credit" : "Partial credit";
  const list = (lbl, xs) => xs && xs.length ? `<div><span class="lbl">${lbl}</span><ul>${xs.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
  return `<div class="fb ${cls}"><span class="pts">${a.score} / ${SA_PTS} POINTS${a.self ? " · SELF-SCORED" : ""}</span><h4>${head}</h4>${a.fb ? `<p>${esc(a.fb)}</p>` : ""}
    ${list("You got", a.got)}${list("Missing or wrong", a.miss)}
    <div class="model"><b>Example full-credit answer</b>${esc(q.model)}</div></div>`;
}

const words = s => (String(s).trim().match(/\S+/g) || []).length;

function choose(i) {
  const it = run.items[run.i], q = ITEMS[it.id];
  if (q.kind === "sa" || run.res[it.id]) return;
  const o = it.opts[i];
  if (o == null) return;
  run.res[it.id] = {pick: o, ok: o === (q.kind === "vocab" ? q.term : q.a[0])};
  saveRun(); question();
}

async function grade() {
  const it = run.items[run.i], q = ITEMS[it.id];
  const ta = document.getElementById("sa");
  const text = ta ? ta.value.trim() : (run.res[it.id] && run.res[it.id].text) || "";
  if (!text) { run.res[it.id] = {text: "", score: 0, fb: "No answer was written, so this gets 0 points.", got: [], miss: ["Write an answer to earn points"]}; saveRun(); question(); return; }
  const id = it.id, mine = run;
  run.res[id] = {text, pending: true};
  question();
  let a;
  try {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 60000);
    const r = await fetch(GRADER, {method: "POST", headers: {"Content-Type": "text/plain"}, body: JSON.stringify({q: q.q, key: q.key, model: q.model, answer: text, pts: SA_PTS}), signal: ctl.signal});
    clearTimeout(timer);
    const j = await r.json().catch(() => ({}));
    if (!r.ok || typeof j.score !== "number") throw new Error(j.message || "The grader answered " + r.status + ".");
    a = {text, score: Math.max(0, Math.min(SA_PTS, Math.round(j.score))), fb: String(j.feedback || ""), got: (j.got || []).map(String), miss: (j.missing || []).map(String)};
  } catch (e) {
    a = {text, err: e.name === "AbortError" ? "It took too long to answer." : (e.message || "Network error.")};
  }
  if (run !== mine) return;
  run.res[id] = a; saveRun();
  if (run.items[run.i].id === id) question();
}

function selfScore(s) {
  const it = run.items[run.i], q = ITEMS[it.id], a = run.res[it.id] || {};
  run.res[it.id] = {text: a.text || "", score: s, self: true, fb: "", got: [], miss: []};
  saveRun(); question();
}

/* ---------- results ---------- */
function results() {
  const r = run, sc = tally(r);
  const hist = store.get(K + "hist", []);
  if (!r.saved) {
    hist.push({d: Date.now(), title: r.title, pct: sc.pct});
    store.set(K + "hist", hist.slice(-40));
    const missed = new Set(store.get(K + "missed", []));
    for (const it of r.items) {
      const q = ITEMS[it.id], a = r.res[it.id];
      const bad = !a || (q.kind === "sa" ? (a.score || 0) < 2 : !a.ok);
      bad ? missed.add(it.id) : missed.delete(it.id);
    }
    store.set(K + "missed", [...missed]);
    r.saved = true;
    saveRun();
  }
  const mcN = r.items.filter(it => ITEMS[it.id].kind !== "sa").length, mcOk = r.items.filter(it => ITEMS[it.id].kind !== "sa" && r.res[it.id] && r.res[it.id].ok).length;
  const saItems = r.items.filter(it => ITEMS[it.id].kind === "sa"), saPts = saItems.reduce((s, it) => s + ((r.res[it.id] || {}).score || 0), 0);
  const parts = [mcN ? `${mcOk} / ${mcN} multiple choice` : "", saItems.length ? `${saPts} / ${saItems.length * SA_PTS} short-answer points` : ""].filter(Boolean).join(" · ");
  const bars = Object.entries(sc.by).map(([t, b]) => { const p = Math.round(100 * b.got / b.max); return `<div class="bar"><span>${esc(topicName(t))}</span><div class="track"><div class="fill ${p < 60 ? "lo" : p < 80 ? "mid" : ""}" style="width:${p}%"></div></div><span class="v">${b.got}/${b.max}</span></div>`; }).join("");
  const miss = r.items.filter(it => { const q = ITEMS[it.id], a = r.res[it.id]; return !a || (q.kind === "sa" ? (a.score || 0) < SA_PTS : !a.ok); }).map(it => {
    const q = ITEMS[it.id], a = r.res[it.id] || {};
    if (q.kind === "sa") return `<div class="miss ${(a.score || 0) > 0 ? "half" : ""}"><span class="q">${esc(q.q)}</span><span class="yours">Your answer (${a.score || 0}/${SA_PTS}): ${esc(a.text || "(blank)")}</span>${a.fb ? `<span class="why">${esc(a.fb)}</span>` : ""}<span class="corr">Full-credit answer: ${esc(q.model)}</span></div>`;
    const right = q.kind === "vocab" ? q.term : q.a[0];
    return `<div class="miss"><span class="q">${esc(q.kind === "vocab" ? "“" + q.def + "”" : q.q)}</span><span class="yours">You picked: ${esc(a.pick || "(skipped)")}</span><span class="corr">Answer: ${esc(right)}</span>${q.why ? `<span class="why">${esc(q.why)}</span>` : ""}</div>`;
  }).join("");
  app.innerHTML = `
    <header class="score"><div class="big">${sc.pct}%</div><div><h1>${esc(r.title)}</h1><p>${parts}</p></div></header>
    ${Object.keys(sc.by).length > 1 ? `<section class="section"><h2>By topic</h2><div class="hist"><div class="bars">${bars}</div></div></section>` : ""}
    <section class="section"><h2>${miss ? "Review" : "Nothing to review. Every answer earned full credit."}</h2>${miss ? `<div class="missed">${miss}</div>` : ""}</section>
    <section class="section"><div class="rowbtns">${miss ? `<button class="btn sun" data-start="missed">Redo missed</button>` : ""}<button class="btn" data-start="${r.mode === "topic" ? "quick" : r.mode === "missed" ? "full" : r.mode}">${r.mode === "topic" || r.mode === "missed" ? "Take another test" : "Try again (new questions)"}</button><button class="btn ghost" data-go="done">Home</button></div></section>`;
  scrollTo(0, 0);
}

/* ---------- routing ---------- */
function show() {
  if (!run) return home();
  if (run.i >= run.items.length) return results();
  question();
}

app.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b || b.disabled) return;
  if (b.dataset.start) return start(b.dataset.start);
  if (b.dataset.topic) return start("topic", b.dataset.topic);
  if (b.dataset.pick != null) return choose(+b.dataset.pick);
  if (b.dataset.self != null) return selfScore(+b.dataset.self);
  const go = b.dataset.go;
  if (go === "home") { stash(); home(); }
  else if (go === "resume") show();
  else if (go === "discard") { run = null; saveRun(); home(); }
  else if (go === "done") { run = null; saveRun(); home(); }
  else if (go === "prev") { stash(); run.i = Math.max(0, run.i - 1); saveRun(); question(); }
  else if (go === "next") { stash(); run.i++; saveRun(); show(); }
  else if (go === "grade") grade();
  else if (go === "clearhist") { if (confirm("Clear your score history?")) { store.del(K + "hist"); home(); } }
});

function stash() {
  const ta = document.getElementById("sa");
  if (!ta || ta.disabled || !run) return;
  const id = run.items[run.i].id;
  run.draft = run.draft || {};
  run.draft[id] = ta.value;
  saveRun();
}

app.addEventListener("input", e => {
  if (e.target.id !== "sa") return;
  const wc = app.querySelector(".wc");
  if (wc) wc.textContent = words(e.target.value) + " words";
  clearTimeout(stash.t); stash.t = setTimeout(stash, 400);
});

document.addEventListener("keydown", e => {
  if (!run || run.i >= run.items.length || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === "TEXTAREA" || (e.key === "Enter" && e.target.tagName === "BUTTON")) return;
  const k = e.key.toLowerCase(), m = "abcd".indexOf(k), n = "1234".indexOf(k);
  if (m >= 0 || n >= 0) { choose(Math.max(m, n)); e.preventDefault(); }
  else if (k === "enter") { const nx = app.querySelector('[data-go="next"]'); if (nx && !nx.disabled) { nx.click(); e.preventDefault(); } }
});

show();
})();
</script>
</body></html>
