<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Unit 3 Human Impact Test (THIS IS NOT THE ACTUAL TEST, IT IS A PRACTICE TEST)</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one study column (max 780px). Home = start cards + score history; a test shows one question card at a time under a sticky progress bar. */
:root{
  --paper:#EDF0F3; --surface:#FFFFFF; --sunk:#F5F7F9; --ink:#162029; --muted:#53616E; --line:#D2D9E0; --line-2:#AAB7C4;
  --moss:#1F5C88; --moss-ink:#FFFFFF; --moss-soft:#DAE7F2;
  --sun:#D96A26; --sun-ink:#2A1305; --sun-soft:#FBE5D4;
  --good:#1E7A49; --good-soft:#DCF1E3; --bad:#B53F2E; --bad-soft:#F8E0DA;
  --water:#22827F; --water-soft:#C4E5E2; --land:#D9D3BC; --soil:#A88B6A;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E141A; --surface:#161F28; --sunk:#121A22; --ink:#E2E9F0; --muted:#98A7B5; --line:#26323D; --line-2:#3A4A59;
    --moss:#7DB4E3; --moss-ink:#0A1622; --moss-soft:#1B3146;
    --sun:#F0965A; --sun-ink:#261205; --sun-soft:#3C2716;
    --good:#6CCB94; --good-soft:#16382A; --bad:#F2897A; --bad-soft:#3E211C;
    --water:#5CC3BE; --water-soft:#1A4442; --land:#3A3727; --soil:#5A4A36;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E141A; --surface:#161F28; --sunk:#121A22; --ink:#E2E9F0; --muted:#98A7B5; --line:#26323D; --line-2:#3A4A59;
  --moss:#7DB4E3; --moss-ink:#0A1622; --moss-soft:#1B3146;
  --sun:#F0965A; --sun-ink:#261205; --sun-soft:#3C2716;
  --good:#6CCB94; --good-soft:#16382A; --bad:#F2897A; --bad-soft:#3E211C;
  --water:#5CC3BE; --water-soft:#1A4442; --land:#3A3727; --soil:#5A4A36;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding-block:20px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Home */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding-block:12px 22px;border-bottom:2px solid var(--ink)}
.hero h1{font-size:clamp(40px,8vw,64px);font-weight:800;letter-spacing:-.02em}
.hero .lede{margin:10px 0 0;color:var(--muted);max-width:56ch}
.mini{width:140px;height:auto}
.mini text{font-family:var(--f-mono);font-size:9px;fill:var(--muted)}
@media (max-width:560px){.hero{grid-template-columns:1fr}.mini{display:none}}
.section{margin-top:28px;display:grid;gap:12px}
.section > h2{font-size:24px;font-weight:800}
.resume{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--sun-soft);border:2px solid var(--sun);border-radius:10px;padding:14px 16px}
.resume p{margin:0;min-width:0}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:600px){.modes{grid-template-columns:1fr}}
.mode{display:grid;gap:6px;align-content:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;min-width:0}
.mode:hover{border-color:var(--moss)}
.mode h3{font-size:21px;font-weight:800}
.mode p{margin:0;color:var(--muted);font-size:15px}
.mode .meta{font-family:var(--f-mono);font-size:12px;color:var(--moss);letter-spacing:.04em;text-transform:uppercase}
.mode.primary{grid-column:1/-1;background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}
.mode.primary p,.mode.primary .meta{color:var(--moss-ink);opacity:.9}
.mode.wide{grid-column:1/-1}
.mode[disabled]{opacity:.5;cursor:not-allowed}
.topicbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-2);background:var(--sunk);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}
.setting{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.setting p{margin:0;font-size:15px;color:var(--muted)}
.setting strong{color:var(--ink)}
.switch{flex:none;width:48px;height:28px;border-radius:999px;border:0;background:var(--line-2);position:relative;cursor:pointer;margin-top:2px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--moss)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* History */
.hist{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:16px;min-width:0}
.hist-empty{color:var(--muted);margin:0}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{stroke:var(--moss);stroke-width:2.5;fill:none}
.chart .ar{fill:var(--moss-soft)}
.chart .pt{fill:var(--surface);stroke:var(--moss);stroke-width:2.5}
.chart .pt.last{fill:var(--moss)}
.chart .pass{stroke:var(--sun);stroke-dasharray:4 4;stroke-width:1.5}
.chart .lbl{fill:var(--ink);font-weight:700}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-family:var(--f-mono);font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.hi{background:var(--good-soft);color:var(--good)}
.pill.mid{background:var(--sun-soft);color:var(--ink)}
.pill.lo{background:var(--bad-soft);color:var(--bad)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:10px;align-items:center;font-size:15px}
.bar .track{height:10px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;background:var(--moss)}
.bar .fill.lo{background:var(--bad)}
.bar .fill.mid{background:var(--sun)}
.bar .v{font-family:var(--f-mono);font-size:13px;text-align:right}
@media (max-width:480px){.bar{grid-template-columns:minmax(0,1fr) 80px 44px}}
.hist-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.hist-head h3{font-size:18px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px;padding:0}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}

/* Buttons */
.btn{border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--moss);color:var(--moss-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.small{padding:8px 12px;font-size:14px}

/* Test */
.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.bar-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar-row .count{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.prog{height:8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.prog > div{height:100%;background:var(--moss);transition:width .25s}
.card{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:16px;min-width:0}
@media (max-width:480px){.card{padding:16px}}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--moss-soft);color:var(--ink)}
.tag.src{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.tag.sa{background:var(--sun-soft);color:var(--ink)}
.qtext{font-size:21px;line-height:1.35;font-weight:700;margin:0;text-wrap:pretty}
.qhint{margin:-6px 0 0;color:var(--muted);font-size:15px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--sunk);border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:52px}
.opt:hover:not([disabled]){border-color:var(--moss)}
.opt .k{font-family:var(--f-mono);font-weight:700;font-size:13px;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--surface)}
.opt.sel{border-color:var(--moss);background:var(--moss-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.actions .spacer{flex:1}
.fb{border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.fb.ok{background:var(--good-soft);border:1px solid var(--good)}
.fb.no{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.part{background:var(--sun-soft);border:1px solid var(--sun)}
.fb h4{margin:0;font-family:var(--f-display);font-size:19px}
.fb p{margin:0}
.fb .ans{font-weight:700}
.fig{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto}
.fig svg{display:block;width:100%;min-width:300px;height:auto;margin:0 auto}
.fig .bx{fill:var(--surface);stroke:var(--line-2);stroke-width:1.5}
.fig .bx2{fill:var(--moss-soft);stroke:var(--moss);stroke-width:1.5}
.fig .bx3{fill:var(--sun-soft);stroke:var(--sun);stroke-width:1.5}
.fig .tx{fill:var(--ink);font-family:var(--f-body);font-size:13px}
.fig .tx.b{font-weight:700}
.fig .tx.s{font-size:11px;fill:var(--muted)}
.fig .tx.m{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.fig .ar{stroke:var(--muted);stroke-width:1.6;fill:none}
.fig .ah{fill:var(--muted)}
.fig .ax{stroke:var(--ink);stroke-width:1.5;fill:none}
.fig .gr{stroke:var(--line-2);stroke-width:1;stroke-dasharray:4 4}
.fig .tagc{fill:var(--sun);stroke:var(--sun-ink);stroke-width:1}
.fig .tagt{fill:var(--sun-ink);font-family:var(--f-mono);font-size:13px;font-weight:700}
.fig .l1{stroke:var(--water);stroke-width:3;fill:none}
.fig .l2{stroke:var(--sun);stroke-width:3;fill:none}
.fig .l3{stroke:var(--moss);stroke-width:3;fill:none}
.fig .l4{stroke:var(--muted);stroke-width:2.5;fill:none}
.fig .gap{fill:var(--sun-soft)}
.fig .gap2{fill:var(--bad-soft)}
.fig .dashl{stroke-dasharray:8 5}
.fig .band{fill:var(--surface);opacity:.55}
.fig .pm{fill:var(--moss)} .fig .pf{fill:var(--water)}
.fig .lvl{stroke:var(--ink);stroke-width:1.2}
.fig .v1{fill:var(--water-soft)} .fig .v2{fill:var(--moss-soft)} .fig .v3{fill:var(--land)} .fig .v4{fill:var(--sun-soft)}
.fig table{width:auto;min-width:100%;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.fig th{font-size:10px;white-space:nowrap;padding:6px 8px}
.fig td{padding:7px 8px;font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.fig td:first-child{font-family:var(--f-body);font-weight:700;font-size:14px}
.figcap{font-size:13px;color:var(--muted);margin:6px 2px 0}

/* match */
.mterms{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);padding-block:10px;margin-block:-10px;border-bottom:1px solid var(--line)}
.mterms:empty{display:none}
.mterm{border:2px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
.mterm.sel{border-color:var(--sun);background:var(--sun-soft)}
.mterm.used{opacity:.35}
.mdefs{display:grid;gap:10px}
.mdef{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;text-align:left;background:var(--sunk);border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.mdef:hover:not([disabled]){border-color:var(--moss)}
.mdef .slot{justify-self:start;font-weight:700;font-size:14px;border-radius:6px;padding:3px 10px;border:1px dashed var(--line-2);color:var(--muted)}
.mdef .slot.filled{border:1px solid var(--moss);background:var(--moss-soft);color:var(--ink)}
.mdef.right{border-color:var(--good);background:var(--good-soft)}
.mdef.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mdef .fix{font-size:14px;color:var(--bad);font-weight:700}
.mdef[disabled]{cursor:default}

/* short answer */
.sa{display:grid;gap:6px}
.sa textarea{width:100%;min-height:132px;font:inherit;font-size:17px;line-height:1.45;padding:12px 14px;border-radius:10px;border:2px solid var(--line-2);background:var(--surface);color:var(--ink);resize:vertical}
.sa textarea.right{border-color:var(--good)}
.sa textarea.part{border-color:var(--sun)}
.sa textarea.wrong{border-color:var(--bad)}
.sa textarea:disabled{opacity:1;background:var(--sunk)}
.sa .wc{font-family:var(--f-mono);font-size:12px;color:var(--muted);justify-self:end}
.ideas{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.idea{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:start}
.idea .mk{font-family:var(--f-mono);font-weight:700;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;margin-top:1px}
.idea.hit .mk{background:var(--good);color:var(--surface)}
.idea.nohit .mk{background:var(--bad);color:var(--surface)}
.idea.skip{color:var(--muted)}
.idea.skip .mk{background:var(--line);color:var(--muted)}
.idea.claimed .mk{background:var(--sun);color:var(--sun-ink)}
.claim{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:13px;cursor:pointer;white-space:nowrap}
.model{background:var(--surface);border:1px dashed var(--line-2);border-radius:8px;padding:10px 12px}
.model b{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;display:block;margin-bottom:2px}

/* Results */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;padding-block:10px 22px;border-bottom:2px solid var(--ink)}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,16vw,112px);line-height:.9;letter-spacing:-.03em}
.score p{margin:4px 0 0;color:var(--muted)}
.score h1{font-size:28px}
@media (max-width:480px){.score{grid-template-columns:1fr;gap:6px}}
.missed{display:grid;gap:10px}
.miss{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:12px 14px;display:grid;gap:4px;min-width:0}
.miss.half{border-left-color:var(--sun)}
.miss .q{font-weight:700}
.miss .yours{color:var(--bad);overflow-wrap:anywhere}
.miss .corr{color:var(--good);font-weight:700}
.miss .why{color:var(--muted);font-size:15px}
.rowbtns{display:flex;flex-wrap:wrap;gap:10px}
.quitbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>

<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const fmt = n => Number(n).toLocaleString("en-US", {maximumFractionDigits: 4});
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

const TOPICS = {
  history: "Human population history",
  growth: "Population growth factors & country data",
  dtm: "Demographic transition stages",
  age: "Age-structure diagrams",
  footprint: "Ecological footprints",
  anthro: "Great Acceleration & the Anthropocene",
  nitrogen: "Nitrogen, acid rain & ocean acidification",
  biomag: "Biological magnification",
  habitat: "Deforestation, monoculture & other threats"
};

/* ---------- vocabulary (every term) ---------- */
// [term, definition, topic]
const VOCAB = [
  ["Demographic transition", "The predictable shift in birth rates, death rates, and population growth as a society moves from a primitive economy to industrialization", "dtm"],
  ["Birth rate", "The number of live births per 1,000 people in a year", "growth"],
  ["Death rate", "The number of deaths per 1,000 people in a year (also called the mortality rate)", "growth"],
  ["Infant mortality", "How often babies die before their first birthday", "dtm"],
  ["Life expectancy", "The average number of years a person in a population can expect to live", "dtm"],
  ["Fertility rate", "The average number of children a woman has during her lifetime", "growth"],
  ["Replacement-level fertility", "The number of children per woman (about 2.1) at which each generation exactly replaces the one before it", "growth"],
  ["Immigration", "Movement of people INTO a country or area", "growth"],
  ["Emigration", "Movement of people OUT of a country or area", "growth"],
  ["Net migration", "People moving in minus people moving out; the overall gain or loss from moving", "growth"],
  ["Growth rate", "How fast a population is getting bigger each year, usually written as a percent", "growth"],
  ["Median age", "The middle age of a population: half the people are older and half are younger", "growth"],
  ["Age structure", "How many people are in each age group of a population, shown as a population pyramid", "age"],
  ["Dependency ratio", "The number of children and elderly people compared to the number of working-age adults", "age"],
  ["Carrying capacity", "The largest population an environment can support over time", "history"],
  ["Density-dependent limiting factor", "Something, like disease, that holds a population back more strongly the more crowded it gets", "history"],
  ["Industrialization", "A society's shift to factories, machines, and fossil-fuel energy", "history"],
  ["Ecological footprint", "The total area of healthy land and water ecosystems needed to provide the resources you use and absorb the wastes you produce", "footprint"],
  ["Global hectare (gha)", "The unit footprints are measured in: one hectare of land or water with world-average productivity", "footprint"],
  ["Great Acceleration", "The sharp jump in population, resource use, and environmental change that began around 1950", "anthro"],
  ["Anthropocene", "The \"Age of Humans\": the period during which human activity has become the major cause of global change", "anthro"],
  ["Anthrome", "A human-altered biome, such as a city, village, cropland, or rangeland", "anthro"],
  ["Limiting nutrient", "A nutrient in short supply that keeps producers from growing more; adding it causes a burst of growth", "nitrogen"],
  ["Algal bloom", "A sudden overgrowth of algae in water, triggered by extra nutrients like nitrogen", "nitrogen"],
  ["Runoff", "Water flowing over land into streams, lakes, and oceans, carrying fertilizer and other pollutants with it", "nitrogen"],
  ["Acid rain", "Precipitation made acidic when air pollution combines with water; especially damaging to forests and lakes", "nitrogen"],
  ["Ocean acidification", "The continued drop in seawater pH caused by absorbing carbon dioxide from the atmosphere", "nitrogen"],
  ["Biological magnification", "The increase in a pollutant's concentration at each higher trophic level of a food chain", "biomag"],
  ["Deforestation", "The loss of forests, with negative effects on soil, water, carbon storage, and animals", "habitat"],
  ["Monoculture", "Planting large areas with a single, high-production crop every year", "habitat"],
  ["Habitat fragmentation", "Breaking up the area where organisms live into smaller, separated pieces, causing biodiversity loss", "habitat"],
  ["Overharvesting", "Using a natural resource in an unsustainable way, faster than it can be replaced", "habitat"],
  ["Invasive species", "An organism introduced to a new place by humans that spreads and disrupts the ecosystem", "habitat"],
  ["Sustainable", "Using resources in a way that meets our needs without using them up for the future", "habitat"]
];
const CONFLICTS = [];

/* ---------- question bank ---------- */
const B = [];
const MC = (id, topic, q, a, w, why, x = {}) => B.push(Object.assign({id, t: "mc", topic, q, a, w, why}, x));
const TF = (id, topic, q, a, why, x = {}) => B.push(Object.assign({id, t: "tf", topic, q, a, why}, x));
// Short answer: ideas = [[label, cue, cue, ...], ...]; an idea counts when any cue is found. need = points (default: every idea).
const SA = (id, topic, q, model, ideas, why, x = {}) => B.push(Object.assign({id, t: "sa", topic, q, model, ideas, why}, x));
const GEN = (id, topic, fn, x = {}) => B.push(Object.assign({id, t: "gen", topic, fn}, x));
const STAGES = ["Stage 1", "Stage 2", "Stage 3", "Stage 4", "Stage 5"];
const STG = (id, topic, q, n, why, x = {}) => MC(id, topic, q, "Stage " + n, STAGES.filter(s => s !== "Stage " + n), why, Object.assign({order: STAGES}, x));
const N53 = {src: "5.3 guided notes"}, CH = {src: "Stage chart"}, PW = {src: "Population practice work"}, WU = {src: "Warm-up"},
  N71 = {src: "7.1 guided notes"}, N72 = {src: "7.2 guided notes"}, EX = {src: "A step past the notes"};
const F = (fig, base) => Object.assign({fig}, base);

/* Human population history */
MC("h1", "history", "For most of human history, the population stayed below about how many people (its carrying capacity at the time)?", "About half a billion (500 million)", ["About 3 billion", "About 7 billion", "About 50,000"], "On the 10,000 B.C.–2000 A.D. graph the line hugs the bottom, under about 0.5 billion, until the last few hundred years.", F("history", PW));
MC("h2", "history", "Which 4 events are labeled on the graph of human population history?", "Agriculture begins, plowing and irrigation, the bubonic plague, the Industrial Revolution", ["Agriculture begins, the printing press, the bubonic plague, the moon landing", "Fire is discovered, plowing and irrigation, the Great Depression, the Industrial Revolution", "The Ice Age, agriculture begins, World War II, the internet"], "The graph marks agriculture beginning, plowing and irrigation, the bubonic plague, and the start of the Industrial Revolution.", PW);
MC("h3", "history", "Which TWO events appear to have INCREASED the human carrying capacity on Earth?", "Plowing and irrigation, and the Industrial Revolution", ["The bubonic plague and the Industrial Revolution", "The bubonic plague and plowing and irrigation", "Agriculture beginning and the bubonic plague"], "After each one, the population climbs to a new, higher level. The plague did the opposite and caused a dip.", F("history", WU));
MC("h4", "history", "Which density-dependent limiting factor is shown on the human population graph?", "The bubonic plague", ["The Industrial Revolution", "Plowing and irrigation", "Agriculture beginning"], "Disease is density-dependent: it spreads faster when people are crowded together. The plague shows up as a dip in the 1300s.", PW);
MC("h5", "history", "Why is a disease like the bubonic plague called DENSITY-DEPENDENT?", "It spreads faster and kills more when people are crowded together", ["It affects a population the same way no matter how crowded it is", "It only affects small, spread-out populations", "It raises the carrying capacity of an area"], "The more crowded (dense) a population is, the stronger the effect. A density-independent factor, like a flood, hits the same no matter how crowded.");
MC("h6", "history", "About how long has Earth's human population been greater than 1 billion?", "Since about 1800", ["Since about 10,000 B.C.", "Since about 1 A.D.", "Only since about 2000"], "The world passed 1 billion people around 1800, as the Industrial Revolution took off. It passed 8 billion in 2022.", PW);
MC("h7", "history", "Which statement about the world's population today is TRUE?", "The population is still increasing, but the RATE of growth is decreasing", ["The population is decreasing, and so is its growth rate", "The population and its growth rate are both increasing faster than ever", "The population has stopped changing"], "From the notes: the size of the global human population is still increasing, but the rate of global population growth is decreasing.", N53);
MC("h8", "history", "According to the 1950–2050 projection graph, about how many people will be on Earth in 2042?", "About 9 billion", ["About 5 billion", "About 7 billion", "About 12 billion"], "The projection reaches about 9 billion people in the early 2040s.", PW);
MC("h9", "history", "What shape does the graph of human population over the last 10,000 years make?", "A J-shape: flat for a long time, then shooting almost straight up", ["An S-shape that has leveled off at carrying capacity", "A straight diagonal line", "A bell curve that rises and then falls"], "Very slow growth for thousands of years, then explosive growth after the Industrial Revolution, gives a J-curve (exponential growth).", F("history", {}));
MC("h10", "history", "Why did the human population grow so slowly for most of history?", "Birth rates were high, but death rates were also high from disease, famine, and poor sanitation", ["Birth rates were very low", "People had access to birth control", "There was always plenty of food"], "That's Stage 1: high birth rates and high death rates cancel each other out.");
MC("h11", "history", "The Industrial Revolution let the population explode mainly because…", "Machines, more food, medicine, and sanitation lowered death rates", ["Birth rates suddenly tripled", "Diseases like the plague became more common", "People moved out of cities and back onto farms"], "Death rates fell while birth rates stayed high for a while, so the population shot up.");
MC("h12", "history", "Plowing and irrigation raised Earth's carrying capacity for humans because they…", "let farmers grow much more food on the same land", ["stopped diseases from spreading", "lowered birth rates", "moved people into crowded cities"], "More food from the same land means the environment can support more people.");

/* Population growth factors & country data */
MC("g1", "growth", "Which 4 factors affect how a population grows?", "Birth rate, death rate, immigration, and emigration", ["Birth rate, death rate, carrying capacity, and biomass", "Immigration, emigration, life expectancy, and median age", "Food, water, shelter, and space"], "Births and immigration add people; deaths and emigration take people away.", PW);
MC("g2", "growth", "Which list has the 5 factors that affect a COUNTRY's population growth?", "Birth rate, death rate, fertility rate, net migration, and age structure", ["Birth rate, death rate, climate, land area, and religion", "Fertility rate, life expectancy, median age, latitude, and area", "Immigration, emigration, food, water, and space"], "From the practice work: birth rate, death rate, fertility rate, net migration, and age structure.", PW);
MC("g3", "growth", "Angola's birth rate is 33.6. What does that number mean?", "33.6 live births per 1,000 people each year", ["33.6% of people had a baby this year", "33.6 births per 100 people each year", "Each woman has 33.6 children"], "Birth and death rates are given per 1,000 people per year.", F("countries", PW));
MC("g4", "growth", "Net migration is…", "immigration minus emigration", ["births minus deaths", "immigration plus emigration", "deaths minus immigration"], "People moving in minus people moving out. A negative number means more people leave than arrive.");
MC("g5", "growth", "Which country in the data table has the FASTEST growth rate?", "Angola", ["Kenya", "Canada", "Denmark"], "Angola grows 2.72% per year, the highest of the four.", F("countries", Object.assign({order: ["Angola", "Kenya", "Canada", "Denmark"]}, PW)));
MC("g6", "growth", "Which country in the table has the LOWEST death rate, and why?", "Kenya, because its population is very young and young people rarely die", ["Canada, because it has the best hospitals", "Denmark, because it has the oldest population", "Angola, because it has the most births"], "Kenya's death rate is 6.8. Its median age is only 19.5, so most people are young. Canada (8.5) and Denmark (10.3) have more elderly people, so more deaths per 1,000, even with long life expectancy.", F("countries", PW));
MC("g7", "growth", "Denmark's birth rate (10.4) and death rate (10.3) are almost equal. What does that tell you?", "Births barely outnumber deaths, so most of its small growth comes from immigration", ["The population is growing rapidly", "The population is crashing", "Denmark is in Stage 2"], "10.4 − 10.3 = 0.1 per 1,000. Its 0.22% growth comes mostly from immigration (2.1 per 1,000).", F("countries", PW));
MC("g8", "growth", "In the class table, which country has a HIGH birth rate and a LOW death rate?", "Kenya", ["Angola", "Canada", "Denmark"], "High birth + high death = Angola. High birth + low death = Kenya. Low birth + high death = Denmark. Low birth + low death = Canada.", F("countries", Object.assign({order: ["Angola", "Kenya", "Canada", "Denmark"]}, PW)));
MC("g9", "growth", "In the class table, which country has a LOW birth rate and a HIGH death rate?", "Denmark", ["Angola", "Kenya", "Canada"], "Denmark: birth rate 10.4, death rate 10.3 (the higher of the two developed countries).", F("countries", Object.assign({order: ["Angola", "Kenya", "Canada", "Denmark"]}, PW)));
MC("g10", "growth", "Angola's median age is 18.2. Canada's is 42. What does that tell you about Angola?", "About half its people are under 18, so it has lots of children and will keep growing", ["Most of its people are elderly", "Its population is shrinking", "Its people live longer than Canadians"], "A low median age means a young population, the wide base of a Stage 2-style pyramid.", F("countries", PW));
MC("g11", "growth", "Which two countries in the table are DEVELOPED countries?", "Canada and Denmark", ["Angola and Kenya", "Kenya and Canada", "Angola and Denmark"], "Low birth rates, life expectancy around 80, and a median age of 42 are signs of a developed country.", F("countries", PW));
MC("g12", "growth", "Life expectancy is 56 years in Angola but 81.9 years in Canada. What best explains the difference?", "Better health care, sanitation, clean water, and food supply in Canada", ["Canada has a higher birth rate", "Angola has more immigration", "Canada has a younger population"], "The same improvements that lower death rates in Stage 2 raise life expectancy.", F("countries", {}));
MC("g13", "growth", "Replacement-level fertility is about…", "2.1 children per woman", ["1 child per woman", "4 children per woman", "10 children per woman"], "Two children replace the two parents; the extra 0.1 makes up for children who don't survive to adulthood. The stage chart says Stage 4 countries are at, or slightly above, replacement.", EX);
MC("g14", "growth", "If a country's birth rate EQUALS its death rate and nobody moves in or out, its population will…", "stay about the same size", ["grow quickly", "shrink quickly", "double"], "Births and deaths cancel out, so growth is about zero.");

/* Demographic transition stages */
MC("d1", "dtm", "Fill in the blanks: \"As a society moves from a ____ to ____, population growth predictably shifts.\"", "primitive economy … industrialization", ["industrialization … a primitive economy", "city … farm", "developed country … developing country"], "That shift is the demographic transition.", N53);
MC("d2", "dtm", "What does population growth do across the 5 stages, in order?", "Slow → rapid → slowing → stable → declining", ["Rapid → slow → stable → slowing → declining", "Slow → slowing → rapid → declining → stable", "Declining → slow → rapid → stable → slowing"], "1 slow, 2 rapid, 3 slowing, 4 stable, 5 declining.", N53);
MC("d3", "dtm", "In Stage 1, what happens to birth rates and death rates?", "Both are high and cancel each other out", ["Both are low and cancel each other out", "Birth rates are high and death rates are low", "Birth rates are low and death rates are high"], "Birth rates = death rates, both high, so growth is slow.", N53);
MC("d4", "dtm", "Which describes Stage 1?", "Short life expectancy, high infant mortality, and poor health care and sanitation", ["Long life expectancy and low infant mortality", "Low birth rates from widely available birth control", "High affluence and economic development"], "From the notes: short life expectancy, high infant mortality, poor health care and sanitation.", N53);
MC("d5", "dtm", "Why are there no good examples of true Stage 1 societies today?", "Almost every country now has at least some modern medicine, food, and sanitation, so death rates have dropped", ["Stage 1 countries are too small to count", "Every country has already reached Stage 5", "Stage 1 only happened before agriculture began"], "Once death rates start falling, a society has moved into Stage 2.", N53);
STG("d6", "dtm", "In which stage does the birth rate stay HIGH but the death rate DROPS?", 2, "Stage 2: births stay high while better health care and sanitation cut deaths, so births far outnumber deaths.", WU);
MC("d7", "dtm", "What are some reasons the death rate drops in Stage 2?", "Better sanitation, hygiene, health care, and food supply", ["More access to birth control", "Women gaining independence and work opportunities", "The high cost of raising children"], "Those changes cut deaths from disease and starvation. The other choices lower BIRTH rates (Stages 3–4).", WU);
MC("d8", "dtm", "According to the stage chart, what do improvements in food supply do in Stage 2?", "Reduce deaths due to starvation", ["Raise the birth rate", "Make the population shrink", "Increase infant mortality"], "The chart also says better transportation reduces deaths from lack of water.", CH);
STG("d9", "dtm", "Births > deaths, reduced infant mortality, and better health care and sanitation. Which stage is this?", 2, "Stage 2: rapid population growth.", N53);
STG("d10", "dtm", "In which stage does the population get more access to education and birth control?", 3, "Stage 3: increased access to birth control leads to smaller families, and education improves.", WU);
MC("d11", "dtm", "In Stage 3, increased access to birth control leads to…", "smaller families", ["larger families", "higher death rates", "more infant mortality"], "Birth rates begin to fall, so growth slows.", N53);
MC("d12", "dtm", "Which change is listed for Stage 3 on the stage chart?", "The cost of children increases with the introduction of higher education", ["Children must contribute to the economy of the household", "Family planning and contraception are virtually nonexistent", "Population is essentially determined by the food supply"], "The other three describe Stage 1.", CH);
STG("d13", "dtm", "In which stage do children become high-cost, so having a child becomes a CHOICE?", 4, "Stage 4: children are high cost and are a choice; women gain more independence and work opportunities.", WU);
MC("d14", "dtm", "Which describes Stage 4?", "Low, stable birth rate, a death rate that climbs slightly, and high affluence", ["High birth rate and a falling death rate", "Death rate higher than the birth rate, with labor shortages", "Short life expectancy and high infant mortality"], "Stage 4: little to no growth, a stable population, high affluence and economic development.", N53);
STG("d15", "dtm", "In which stage does the death rate EXCEED the birth rate, so the population declines?", 5, "Stage 5: no growth, a declining population (Japan, Germany, Italy).", N53);
MC("d16", "dtm", "Which countries are the notes' examples of Stage 5 (declining population)?", "Japan, Germany, and Italy", ["Yemen, Afghanistan, and Kenya", "Mexico, India, and Brazil", "Canada, the UK, and the U.S."], "Those three have more deaths than births.", N53);
STG("d17", "dtm", "Mexico and India are examples of which stage?", 3, "Both the notes and the stage chart put Mexico and India in Stage 3: births falling, deaths low.", N53);
STG("d18", "dtm", "Yemen and Afghanistan are examples of which stage?", 2, "Stage 2: high birth rates and falling death rates.", N53);
MC("d19", "dtm", "Which of these describes a Stage 1 society on the stage chart?", "Children must contribute to the economy of the household", ["Children, which are high cost, are a choice", "An expansion in women's status and education", "Fertility rate at or slightly above replacement"], "In Stage 1, kids work for the family, and there are no education or entertainment costs.", CH);
STG("d20", "dtm", "On the stage chart, \"an expansion in women's status and education\" first appears in which stage?", 3, "Stage 3: women are valued beyond childbearing and motherhood. In Stage 4 they gain even more independence and work opportunities.", CH);
MC("d21", "dtm", "On the overview chart, which name goes with Stage 4?", "Low stationary", ["High stationary", "Early expanding", "Late expanding"], "1 high stationary, 2 early expanding, 3 late expanding, 4 low stationary, 5 declining.", {src: "Overview chart"});
MC("d22", "dtm", "On the overview chart, Stage 1 is \"high stationary\" and Stage 4 is \"low stationary.\" What's the difference?", "Both barely grow, but Stage 1 has high birth and death rates while Stage 4 has low ones", ["Stage 1 grows fast and Stage 4 shrinks", "Stage 1 has more people than Stage 4", "There is no difference"], "\"Stationary\" means the population isn't growing much. \"High\" and \"low\" describe the birth and death rates.", {src: "Overview chart"});
STG("d23", "dtm", "Look at the graph. In which stage is the population growing FASTEST?", 2, "Stage 2: the death rate has dropped but the birth rate is still high, so the gap between them (natural increase) is widest.", F("dtm", {}));
STG("d24", "dtm", "On the graph, in which stage are birth and death rates both LOW and the total population leveled off at its highest?", 4, "Stage 4: low stationary.", F("dtm", {}));
MC("d25", "dtm", "On the graph, what does the shaded area between the birth rate and death rate lines show?", "Natural increase: how much faster people are being born than dying", ["The total population", "The number of immigrants", "The carrying capacity"], "When the birth rate is above the death rate, the population grows naturally. In Stage 5 the lines flip, giving natural decrease.", F("dtm", {}));
MC("d26", "dtm", "Why is the population still growing in Stage 3 even though birth rates are falling?", "Births are still higher than deaths, and the many young people from Stage 2 are now having children", ["Death rates are rising quickly", "Immigration always doubles in Stage 3", "Birth rates are higher than ever"], "Births ≥ deaths (births a bit higher), so growth slows but doesn't stop yet.", EX);
STG("d27", "dtm", "A country has falling birth rates, low death rates, growing cities, and more girls finishing school. Which stage is it most likely in?", 3, "Falling births + low deaths + increasing urbanization + women's education = Stage 3.", CH);
STG("d28", "dtm", "A country has a high birth rate, a dropping death rate, and is building new water pipes and sewers. Which stage is it most likely in?", 2, "Improvements in water supply and sewerage reduce death rates in Stage 2.", CH);
MC("d29", "dtm", "In Stage 5, what happens to the death rate?", "It stays steady or slowly increases as the population gets older", ["It drops to zero", "It falls steeply", "It becomes much lower than the birth rate"], "From the notes: a stable or slowly increasing death rate, with labor shortages and rising health care and social security costs.", N53);
STG("d30", "dtm", "Which stage do you think the U.S. is in, based on the notes and the stage chart?", 4, "The U.S. is listed as a Stage 4 example: low birth and death rates, little growth.", PW);
STG("d31", "dtm", "Which stage has high affluence, economic development, fewer young people, and more elderly people?", 4, "Stage 4 (little to no growth). Examples: United States, Australia, Argentina.", N53);

/* Age-structure diagrams */
const AB = ["A", "B", "C", "D"];
MC("a1", "age", "Which diagram shows high birth rates with a rapid drop in each older age group because death rates are high (short life expectancy)?", "A", ["B", "C", "D"], "A: a very wide base that pinches in fast. Lots of babies, but few people survive to old age (Stage 1).", F("ages", Object.assign({order: AB}, N53)));
MC("a2", "age", "Which diagram shows a high birth rate but a falling death rate, so more people live into middle age?", "B", ["A", "C", "D"], "B: still a wide base, but straight sides, because more people survive each age group (Stage 2).", F("ages", Object.assign({order: AB}, N53)));
MC("a3", "age", "Which diagram shows a declining birth rate, a low death rate, and more people living to old age?", "C", ["A", "B", "D"], "C: about the same number of people in each age group until old age (Stage 3–4, stationary).", F("ages", Object.assign({order: AB}, N53)));
MC("a4", "age", "Which diagram shows a DECLINING population (Stage 5)?", "D", ["A", "B", "C"], "D: a narrow base and more adults and elderly than children. Fewer births than deaths ahead.", F("ages", Object.assign({order: AB}, N53)));
MC("a5", "age", "What does a very wide BASE on an age-structure diagram tell you?", "There are many young children, so birth rates are high", ["Most people live past 80", "The population is shrinking", "The death rate is lower than in developed countries"], "The bottom bars are ages 0–4, 5–9, and so on. A wide base means lots of births.");
MC("a6", "age", "A narrow base and a wider top on an age-structure diagram means…", "few births and many older people, so the population will likely shrink", ["many births, so the population will grow fast", "a high death rate among children", "the population is in Stage 2"], "Fewer young people means fewer future parents, so the population declines.");
MC("a7", "age", "Stage 4 diagrams have a \"higher dependency ratio.\" What does that mean?", "More elderly dependents compared to working-age adults", ["More babies than adults", "More immigrants than citizens", "More men than women"], "Dependents are the people too young or too old to work. The notes link this to a greater tax burden and strain on health care.", N53);
MC("a8", "age", "Compared to 2002, the world's age structure in 2050 is expected to be…", "more column-shaped, with many more older people", ["more triangle-shaped, with more children than ever", "exactly the same", "top-heavy with almost no children"], "In the 2050 bars, the base stays about the same while the middle and top fill in.", {src: "Future population growth"});
MC("a9", "age", "Why does a country with a wide-based age structure keep growing even if families start having fewer children?", "Its many young people are about to reach the age to have children of their own", ["Its death rate is about to rise sharply", "Older people move away", "Wide-based populations can't change"], "Even 2 kids per family adds up when there are so many young future parents. This is why Stage 3 still grows.", EX);
MC("a10", "age", "An age-structure diagram with straight, nearly vertical sides shows a population that is…", "stable, with about the same number of people in each age group", ["growing rapidly", "declining rapidly", "mostly elderly"], "Column shape = stationary (little growth).");

/* Ecological footprints */
MC("f1", "footprint", "Which is the best definition of an ecological footprint?", "The total area of healthy land and water ecosystems needed to provide the resources you use", ["The amount of land your house sits on", "The amount of CO₂ one car releases in a year", "The number of species living in an ecosystem"], "From the notes: the total area of healthy land and water ecosystems needed to provide the resources you use (and absorb your wastes).", N71);
MC("f2", "footprint", "An ecological footprint includes your USE of resources such as…", "energy, food, water, and shelter", ["sewage, trash, and greenhouse gases", "birth rate and death rate", "rocks, minerals, and soil only"], "Use of resources = energy, food, water, and shelter. Sewage, trash, and greenhouse gases are the wastes.", N71);
MC("f3", "footprint", "An ecological footprint also includes the WASTES you produce, such as…", "sewage, trash, and greenhouse gases", ["energy, food, water, and shelter", "oxygen and water vapor", "seeds and fruit"], "Land and water are needed to absorb wastes too.", N71);
MC("f4", "footprint", "Which country from the notes has the LARGEST average ecological footprint?", "United States (8.1 gha)", ["Russia (6.1 gha)", "France (4.6 gha)", "Peru (2.1 gha)"], "U.S. 8.1, Russia 6.1, France 4.6, Peru 2.1, Ghana 2.0.", N71);
MC("f5", "footprint", "Which country from the notes has the SMALLEST average ecological footprint?", "Ghana (2.0 gha)", ["Peru (2.1 gha)", "France (4.6 gha)", "Russia (6.1 gha)"], "U.S. 8.1, Russia 6.1, France 4.6, Peru 2.1, Ghana 2.0.", N71);
MC("f6", "footprint", "What does \"gha\" stand for in ecological footprint numbers?", "Global hectares", ["Greenhouse gas amount", "Grams of human activity", "Gallons per hour average"], "A global hectare is a hectare of land or water with world-average productivity.", N71);
MC("f7", "footprint", "The average American's footprint (8.1 gha) is about how many times the average Ghanaian's (2.0 gha)?", "About 4 times", ["About 2 times", "About 8 times", "About 16 times"], "8.1 ÷ 2.0 ≈ 4.", Object.assign({order: ["About 2 times", "About 4 times", "About 8 times", "About 16 times"]}, N71));
MC("f8", "footprint", "Which choice would SHRINK your ecological footprint the most?", "Switching to greener electricity and traveling less", ["Driving alone instead of taking the bus", "Buying a new phone every year", "Leaving lights on so the bulbs last longer"], "Less energy from fossil fuels and less travel = fewer resources used and less greenhouse gas.", N71);
MC("f9", "footprint", "Why do developed countries like the U.S. usually have much larger ecological footprints PER PERSON than developing countries?", "Each person uses far more energy and resources and makes more waste", ["They have more people", "Their land is less healthy", "They have higher birth rates"], "A footprint is per person here. Bigger homes, more driving and flying, more meat, and more stuff all add land and water.");

/* Great Acceleration & Anthropocene */
MC("n1", "anthro", "The Great Acceleration began around…", "1950", ["1800", "1900", "2000"], "The graphs run 1950–2010; almost every line turns sharply upward around 1950.", Object.assign({order: ["1800", "1900", "1950", "2000"]}, N71));
MC("n2", "anthro", "Which of these INCREASED sharply in the Great Acceleration graphs?", "Fertilizer use, energy use, water use, and world population", ["Forest area, wild fish numbers, and glacier size", "Only world population", "Only the number of farms"], "The graphs track fertilizer consumption, primary energy use, water use, world population, coastal nitrogen, and marine fish capture.", N71);
MC("n3", "anthro", "The Great Acceleration graphs show socio-economic trends and Earth system trends. Which is an EARTH SYSTEM trend?", "Coastal nitrogen and marine fish capture", ["Fertilizer consumption", "Primary energy use", "World population"], "Socio-economic = what people do (fertilizer, energy, water, population). Earth system = the effects on the planet (coastal nitrogen, fish capture).", N71);
MC("n4", "anthro", "The Anthropocene, or \"Age of Humans,\" is…", "the period during which human activity has become the major cause of global change", ["the time before humans existed", "the age when humans first started farming", "a biome made of cities"], "From the notes: human activity has become the major cause of global change.", N71);

/* Randomized math (new numbers every attempt; still multiple choice) */
const signed = n => (n > 0 ? "+" : n < 0 ? "−" : "") + fmt(Math.abs(n));
const uniq = (a, w) => new Set([a, ...w]).size === w.length + 1;
GEN("x1", "growth", () => {
  let b, d, i, e, ch, w;
  do {
    b = rand(120, 480) * 100; d = rand(60, 400) * 100; i = rand(5, 90) * 100; e = rand(5, 90) * 100; ch = b + i - d - e;
    w = [b - d, b + e - d - i, b + i - d + e].map(n => `${signed(n)} people`);
  } while (!uniq(`${signed(ch)} people`, w) || i === e);
  return {t: "mc", q: `In one year, a country has ${fmt(b)} births, ${fmt(d)} deaths, ${fmt(i)} immigrants, and ${fmt(e)} emigrants. How much does its population change?`, a: `${signed(ch)} people`, w, why: `(births + immigration) − (deaths + emigration) = (${fmt(b)} + ${fmt(i)}) − (${fmt(d)} + ${fmt(e)}) = ${signed(ch)} people.`};
});
GEN("x2", "growth", () => {
  let br, dr, nm, r, w;
  const p = n => `${(Math.round(n * 100) / 100).toFixed(2).replace("-", "−")}% per year`, sn = n => n < 0 ? "−" + Math.abs(n) : String(n);
  do {
    br = rand(80, 450) / 10; dr = rand(50, 150) / 10; nm = rand(-30, 60) / 10; r = (br - dr + nm) / 10;
    w = [p((br - dr) / 10), p(br - dr + nm), p((br + dr + nm) / 10)];
  } while (Math.abs(nm) < 0.5 || !uniq(p(r), w));
  return {t: "mc", q: `A country has a birth rate of ${br} per 1,000, a death rate of ${dr} per 1,000, and a net migration rate of ${sn(nm)} per 1,000. What is its growth rate?`, a: p(r), w, why: `Growth rate (%) = (birth rate − death rate + net migration) ÷ 10, because the rates are per 1,000 and a percent is per 100. (${br} − ${dr} ${nm < 0 ? "−" : "+"} ${Math.abs(nm)}) ÷ 10 = ${p(r)}. Check it on the class data: Kenya (25.1 − 6.8 − 0.2) ÷ 10 = 1.81%.`};
});
GEN("x3", "growth", () => {

GEN("x4", "biomag", () => {

function spline(P, steps = 14) {
  const out = [];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];

const BYID = Object.fromEntries(B.map(q => [q.id, q]));
const VBY = Object.fromEntries(VOCAB.map(v => [v[0], v]));
const conflict = (a, b) => CONFLICTS.some(c => (c[0] === a && c.includes(b)) || (c[0] === b && c.includes(a)));
const isSA = q => q.t === "sa";

function instance(q) {
  const base = {id: q.id, t: q.t, topic: q.topic, src: q.src || "", fig: q.fig || null, why: q.why || ""};
  if (q.t === "gen") { const g = q.fn(); return instance(Object.assign({}, g, {id: q.id, topic: q.topic, src: "New numbers each time", fig: g.fig || null})); }
  if (q.t === "mc") { const opts = q.order ? q.order.slice() : shuffle([q.a, ...q.w]); return Object.assign(base, {q: q.q, opts, ans: opts.indexOf(q.a), pts: 1}); }
  if (q.t === "tf") return Object.assign(base, {t: "mc", q: q.q, opts: ["True", "False"], ans: q.a ? 0 : 1, pts: 1});
  if (q.t === "sa") return Object.assign(base, {q: q.q, model: q.model, ideas: q.ideas, need: q.need || 0, pts: q.need || q.ideas.length});
  return base;
}
function matchItems(terms) {
  const list = shuffle(terms), n = Math.max(1, Math.ceil(list.length / 6)), rounds = Array.from({length: n}, () => []);
  const cap = Math.ceil(list.length / n);
  for (const term of list) {
    const ok = rounds.filter(rd => rd.length < cap && !rd.some(x => conflict(x, term)));
    const pool = ok.length ? ok : rounds;
    pool.reduce((m, rd) => rd.length < m.length ? rd : m, pool[0]).push(term);
  }
  return rounds.filter(r => r.length).map(r => ({id: "match", t: "match", topic: "vocab", src: "Every vocab word", q: "Match each term to its definition.", terms: shuffle(r), defs: shuffle(r), pts: r.length}));
}
function vocabMC(term) {
  const v = VBY[term];
  const near = shuffle(VOCAB.filter(x => x[0] !== term && x[2] === v[2])), far = shuffle(VOCAB.filter(x => x[0] !== term && x[2] !== v[2]));
  const opts = shuffle([term, ...[...near, ...far].slice(0, 3).map(x => x[0])]);
  return {id: "vq:" + term, t: "mc", topic: "vocab", src: "Vocab", fig: null, q: v[1], opts, ans: opts.indexOf(term), pts: 1, why: `${term}: ${v[1]}.`, vterm: term};
}
const vocabFor = terms => terms.length >= 4 ? matchItems(terms) : terms.map(vocabMC);
// multiple choice spread evenly over every topic
function spread(pool, n) {
  const byTopic = {}; for (const q of shuffle(pool)) (byTopic[q.topic] = byTopic[q.topic] || []).push(q);
  const keys = shuffle(Object.keys(byTopic)), out = [];
  while (out.length < n && keys.some(k => byTopic[k].length)) for (const k of keys) if (byTopic[k].length && out.length < n) out.push(byTopic[k].pop());
  return out;
}
function buildRun(mode, opts = {}) {
  let items = [], label = "";
  const mcs = B.filter(q => q.t === "mc" || q.t === "tf"), gens = B.filter(q => q.t === "gen"), sas = B.filter(isSA);
  if (mode === "full") {
    label = "Full test";
    items = B.map(instance);
  } else if (mode === "practice" || mode === "quick") {

/* ---------- short-answer grading ----------
   Each idea is a list of cues; the idea counts when any cue is found in the answer.
   "a|b|c"  any of these (each word matches by its start, so "decreas" matches decrease/decreasing; "ph=" must match exactly)

function grade(it, r) {

  const last = run.i === run.items.length - 1;
  if (res) actions.innerHTML = `<span class="spacer"></span><button class="btn" data-act="next" id="nextBtn">${last ? "See my score" : "Next"}</button>`;
  else if (it.t === "mc" && run.study) actions.innerHTML = `<span class="eyebrow" style="text-transform:none;letter-spacing:0">Tip: press 1–${it.opts.length} to answer</span>`;
  else actions.innerHTML = `${it.t === "sa" ? `<span class="eyebrow" style="text-transform:none;letter-spacing:0">Ctrl+Enter to ${run.study ? "check" : "go on"}</span>` : ""}<span class="spacer"></span><button class="btn" data-act="${run.study ? "check" : "submit"}" ${complete(it) ? "" : "disabled"}>${run.study ? "Check answer" : last ? "Finish" : "Next"}</button>`;
}
function submit() {
  const run = S.run, it = run.items[run.i];
  if (run.res[run.i] || !complete(it)) return;
  run.elapsed += Math.min(Date.now() - qStart, 300000);
  run.resp[run.i] = it.t === "match" ? {sel: null, map: cur.map.slice()} : cur;
  run.res[run.i] = grade(it, it.t === "match" ? cur.map : cur);
  saveRun();
  if (!run.study) { next(); return; }
  paint();
  const nb = document.getElementById("nextBtn"); if (nb) nb.focus({preventScroll: true});
}
function next() {
  const run = S.run;
  if (run.i < run.items.length - 1) { run.i++; saveRun(); renderTest(); window.scrollTo({top: 0}); }
  else finish();
}
function claim(k, on) {
  const run = S.run, it = run.items[run.i], res = run.res[run.i]; if (!res || it.t !== "sa") return;
  const cl = new Set(res.claimed || []); if (on) cl.add(k); else cl.delete(k);
  run.res[run.i] = gradeSA(it, run.resp[run.i], [...cl]);
  saveRun();
  const y = window.scrollY; renderTest(); window.scrollTo({top: y});
}

/* ---------- results ---------- */
function finish() {
  const run = S.run;
  const earned = run.res.reduce((a, r) => a + (r ? r.earned : 0), 0), possible = run.items.reduce((a, it) => a + it.pts, 0);
  const topics = {}, missed = [];
  run.items.forEach((it, k) => {
    const r = run.res[k]; const tp = it.topic;
    topics[tp] = topics[tp] || [0, 0]; topics[tp][0] += r ? r.earned : 0; topics[tp][1] += it.pts;
    if (!r || !r.ok) { if (it.t === "match") (r ? r.missedTerms : it.defs).forEach(t => missed.push("v:" + t)); else if (it.vterm) missed.push("v:" + it.vterm); else missed.push(it.id); }
  });
  const entry = {id: run.id, at: Date.now(), mode: run.label, study: run.study, earned, possible, pct: possible ? Math.round(100 * earned / possible) : 0, secs: Math.round(run.elapsed / 1000), topics, missed: [...new Set(missed)]};
  if (!S.history.some(h => h.id === entry.id)) S.history.push(entry);
  persistHistory();
  S.last = run; S.run = null; S.paused = null; saveRun();
  renderResults(run, entry);
}
function renderResults(run, entry) {
  S.view = "results";
  const letter = entry.pct >= 90 ? "A" : entry.pct >= 80 ? "B" : entry.pct >= 70 ? "C" : entry.pct >= 60 ? "D" : "F";
  const tb = Object.entries(entry.topics).map(([k, v]) => [k, v, Math.round(100 * v[0] / v[1])]).sort((a, b) => a[2] - b[2]);
  const misses = run.items.map((it, k) => [it, run.res[k]]).filter(([it, r]) => r && !r.ok);
  const missHtml = misses.map(([it, r]) => {
    if (it.t === "sa") return `<div class="miss${r.earned > 0 ? " half" : ""}"><span class="q">${esc(it.q)}</span><span class="yours">You (${r.earned}/${r.possible}): ${esc(r.given || "(blank)")}</span><span class="corr">Missing: ${esc(r.missing.join("; "))}</span><span class="why">Model answer: ${esc(it.model)}</span></div>`;
    const q = it.t === "match" ? "Vocab matching round" : it.vterm ? `Definition: ${it.q}` : it.q;
    return `<div class="miss"><span class="q">${esc(q)}</span><span class="yours">You: ${esc(r.given || "(blank)")}</span><span class="corr">${it.t === "match" ? "Fix: " : "Answer: "}${esc(r.correct)}</span>${it.why && it.t !== "match" ? `<span class="why">${esc(it.why)}</span>` : ""}</div>`;
  }).join("");
  const prev = S.history.filter(h => h.id !== entry.id && h.mode === entry.mode).pop();
  app.innerHTML = `
  <section class="score">
    <div class="big num">${entry.pct}%</div>
    <div><p class="eyebrow">${esc(entry.mode)} · grade ${letter}</p><h1>${entry.pct >= 90 ? "You're ready." : entry.pct >= 80 ? "Strong. Clean up the misses below." : entry.pct >= 70 ? "Passing, but review the weak topics." : "Keep studying. Start with the weakest topic."}</h1>
    <p class="num">${fmt(entry.earned)} of ${fmt(entry.possible)} points · ${Math.max(1, Math.round(entry.secs / 60))} min${prev ? ` · last time ${prev.pct}% (${entry.pct - prev.pct >= 0 ? "+" : ""}${entry.pct - prev.pct})` : ""}</p></div>
  </section>
  <section class="section"><h2>By topic</h2><div class="hist"><div class="bars">${tb.map(([k, v, p]) => `<div class="bar"><span>${esc(TOPICS[k] || "Vocab")}</span><span class="track"><span class="fill ${pctCls(p) === "hi" ? "" : pctCls(p)}" style="display:block;width:${p}%"></span></span><span class="v">${p}%</span></div>`).join("")}</div></div></section>
  <div class="rowbtns" style="margin-top:20px">${entry.missed.length ? `<button class="btn sun" data-act="redo">Redo what I missed</button>` : ""}<button class="btn" data-act="home">Back to start</button></div>
  <section class="section"><h2>${misses.length ? `What you missed (${misses.length})` : "You missed nothing."}</h2><div class="missed">${missHtml}</div></section>`;
  window.scrollTo({top: 0});
}

/* ---------- history persistence (browser + your account when available) ---------- */
function trimHistory(H) { H = H.slice().sort((a, b) => a.at - b.at).slice(-200); return H.map((h, i) => i < H.length - 10 ? Object.assign({}, h, {missed: []}) : h); }
let cloudBusy = Promise.resolve();
function persistHistory() {
  S.history = trimHistory(S.history);
  store.set("hi3.history", S.history);
  if (S.cloud) { const data = {attempts: S.history}; cloudBusy = cloudBusy.then(() => S.cloud.set(data)).catch(() => {}); }
}
async function initCloud() {
  try {
    const c = window.claude; if (!c || !c.use) return;
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc("data/users/" + id + "/history");
    const snap = await ref.get();
    const remote = snap.exists ? (snap.data().attempts || []) : [];
    const byId = new Map(); for (const h of [...remote, ...S.history]) byId.set(h.id, h);
    const merged = trimHistory([...byId.values()]);
    const changed = merged.length !== remote.length;
    S.cloud = ref; S.history = merged; store.set("hi3.history", merged);
    if (changed) await ref.set({attempts: merged});
    if (S.view === "home") renderHome();
  } catch (e) { S.cloud = null; }
}

/* ---------- events ---------- */
function startRun(run) { S.run = run; S.paused = null; S.confirmQuit = false; if (!S.run.items.length) { S.run = null; return; } saveRun(); renderTest(); window.scrollTo({top: 0}); }
app.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t || t.disabled) return;
  if (t.dataset.start) {
    const mode = t.dataset.start, opts = {};
    if (mode === "missed") { const lm = [...S.history].reverse().find(h => h.missed && h.missed.length); if (!lm) return; opts.missed = lm.missed; }
    if (mode === "topics") opts.topics = S.topics.slice();
    startRun(buildRun(mode, opts)); return;
  }
  if (t.dataset.topic) { const k = t.dataset.topic; S.topics = S.topics.includes(k) ? S.topics.filter(x => x !== k) : [...S.topics, k]; store.set("hi3.topics", S.topics); renderHome(); return; }
  if (t.id === "studySwitch") { S.study = !S.study; store.set("hi3.study", S.study); renderHome(); document.getElementById("studySwitch").focus(); return; }
  const act = t.dataset.act;
  if (act === "resume") { S.run = store.get("hi3.run", null) || S.paused; S.paused = null; if (S.run) { renderTest(); window.scrollTo({top: 0}); } return; }
  if (act === "discard") { S.run = null; S.paused = null; saveRun(); renderHome(); return; }
  if (act === "clear") { S.confirmClear = true; renderHome(); return; }
  if (act === "clear-no") { S.confirmClear = false; renderHome(); return; }
  if (act === "clear-yes") { S.confirmClear = false; S.history = []; persistHistory(); renderHome(); return; }
  if (act === "home") { renderHome(); window.scrollTo({top: 0}); return; }
  if (act === "redo") { const lm = S.history[S.history.length - 1]; startRun(buildRun("missed", {missed: lm.missed})); return; }
  if (act === "quit") { S.confirmQuit = true; renderTestKeep(); return; }
  if (act === "quit-no") { S.confirmQuit = false; renderTestKeep(); return; }
  if (act === "quit-yes") { S.confirmQuit = false; saveRun(); S.paused = S.run; S.run = null; renderHome(); window.scrollTo({top: 0}); return; }
  if (act === "check" || act === "submit") { submit(); return; }
  if (act === "next") { next(); return; }
  if (!S.run || S.view !== "test") return;
  if (t.dataset.claim !== undefined) { claim(+t.dataset.claim, true); return; }
  if (t.dataset.unclaim !== undefined) { claim(+t.dataset.unclaim, false); return; }
  const it = S.run.items[S.run.i]; if (S.run.res[S.run.i]) return;
  if (t.classList.contains("opt")) { cur = +t.dataset.k; if (S.run.study) submit(); else paint(); return; }
  if (t.dataset.mt !== undefined) {
    const term = t.dataset.mt; const at = cur.map.indexOf(term);
    if (at >= 0) { cur.map[at] = null; cur.sel = term; }
    else cur.sel = cur.sel === term ? null : term;
    paint(); return;
  }
  if (t.dataset.md !== undefined) {
    const k = +t.dataset.md;
    if (cur.sel) { const prevAt = cur.map.indexOf(cur.sel); if (prevAt >= 0) cur.map[prevAt] = null; cur.map[k] = cur.sel; cur.sel = null; }
    else if (cur.map[k]) cur.map[k] = null;
    paint(); return;
  }
});
function renderTestKeep() { const keep = cur; const wasRevealed = !!S.run.res[S.run.i]; renderTest(); if (!wasRevealed) { cur = keep; paint(); } }
app.addEventListener("input", e => {
  if (!S.run || S.view !== "test") return;
  if (e.target.id === "saIn") {
    cur = e.target.value;
    const b = document.querySelector('[data-act="check"],[data-act="submit"]'); if (b) b.disabled = !complete(S.run.items[S.run.i]);
    const wc = document.getElementById("wc"); if (wc) { const n = wordCount(cur); wc.textContent = n ? `${n} word${n === 1 ? "" : "s"}` : ""; }
  }
});
document.addEventListener("keydown", e => {
  if (S.view !== "test" || !S.run || e.altKey) return;
  const it = S.run.items[S.run.i], res = S.run.res[S.run.i], mod = e.ctrlKey || e.metaKey, inText = e.target.tagName === "TEXTAREA";
  if (e.key === "Enter") {
    if (inText && !mod) return;
    if (mod && !inText) return;
    if (e.target.tagName === "BUTTON" && !e.target.matches('[data-act="next"],[data-act="check"],[data-act="submit"]')) return;
    e.preventDefault();
    if (res) next(); else submit();
    return;
  }
  if (mod) return;
  if (!res && it.t === "mc" && /^[1-9]$/.test(e.key) && !inText && e.target.tagName !== "INPUT") { const k = +e.key - 1; if (k < it.opts.length) { cur = k; if (S.run.study) submit(); else paint(); } }
});

/* ---------- boot ---------- */
function boot(data) {
  if (data && data.run) S.run = data.run;
  if (data && data.view === "test" && S.run) renderTest(); else renderHome();
  initCloud();
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({run: S.run, view: S.view}));
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
</body></html>
