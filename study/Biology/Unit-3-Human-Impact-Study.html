<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Unit 3 Human Impact Practice Test</title>

<style>
/* One study column (max 780px). Home = start cards + score history; a test shows one question card at a time under a sticky progress bar. */
:root{
  --paper:#EDF0F3; --surface:#FFFFFF; --sunk:#F5F7F9; --ink:#162029; --muted:#53616E; --line:#D2D9E0; --line-2:#AAB7C4;
  --moss:#1F5C88; --moss-ink:#FFFFFF; --moss-soft:#DAE7F2;
  --sun:#D96A26; --sun-ink:#2A1305; --sun-soft:#FBE5D4;
  --good:#1E7A49; --good-soft:#DCF1E3; --bad:#B53F2E; --bad-soft:#F8E0DA;
  --water:#22827F; --water-soft:#C4E5E2; --land:#D9D3BC; --soil:#A88B6A;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E141A; --surface:#161F28; --sunk:#121A22; --ink:#E2E9F0; --muted:#98A7B5; --line:#26323D; --line-2:#3A4A59;
    --moss:#7DB4E3; --moss-ink:#0A1622; --moss-soft:#1B3146;
    --sun:#F0965A; --sun-ink:#261205; --sun-soft:#3C2716;
    --good:#6CCB94; --good-soft:#16382A; --bad:#F2897A; --bad-soft:#3E211C;
    --water:#5CC3BE; --water-soft:#1A4442; --land:#3A3727; --soil:#5A4A36;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E141A; --surface:#161F28; --sunk:#121A22; --ink:#E2E9F0; --muted:#98A7B5; --line:#26323D; --line-2:#3A4A59;
  --moss:#7DB4E3; --moss-ink:#0A1622; --moss-soft:#1B3146;
  --sun:#F0965A; --sun-ink:#261205; --sun-soft:#3C2716;
  --good:#6CCB94; --good-soft:#16382A; --bad:#F2897A; --bad-soft:#3E211C;
  --water:#5CC3BE; --water-soft:#1A4442; --land:#3A3727; --soil:#5A4A36;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding-block:20px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Home */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding-block:12px 22px;border-bottom:2px solid var(--ink)}
.hero h1{font-size:clamp(40px,8vw,64px);font-weight:800;letter-spacing:-.02em}
.hero .lede{margin:10px 0 0;color:var(--muted);max-width:56ch}
.mini{width:140px;height:auto}
.mini text{font-family:var(--f-mono);font-size:9px;fill:var(--muted)}
@media (max-width:560px){.hero{grid-template-columns:1fr}.mini{display:none}}
.section{margin-top:28px;display:grid;gap:12px}
.section > h2{font-size:24px;font-weight:800}
.resume{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--sun-soft);border:2px solid var(--sun);border-radius:10px;padding:14px 16px}
.resume p{margin:0;min-width:0}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:600px){.modes{grid-template-columns:1fr}}
.mode{display:grid;gap:6px;align-content:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;min-width:0}
.mode:hover{border-color:var(--moss)}
.mode h3{font-size:21px;font-weight:800}
.mode p{margin:0;color:var(--muted);font-size:15px}
.mode .meta{font-family:var(--f-mono);font-size:12px;color:var(--moss);letter-spacing:.04em;text-transform:uppercase}
.mode.primary{grid-column:1/-1;background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}
.mode.primary p,.mode.primary .meta{color:var(--moss-ink);opacity:.9}
.mode.wide{grid-column:1/-1}
.mode[disabled]{opacity:.5;cursor:not-allowed}
.topicbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-2);background:var(--sunk);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}
.setting{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.setting p{margin:0;font-size:15px;color:var(--muted)}
.setting strong{color:var(--ink)}
.switch{flex:none;width:48px;height:28px;border-radius:999px;border:0;background:var(--line-2);position:relative;cursor:pointer;margin-top:2px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--moss)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* History */
.hist{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:16px;min-width:0}
.hist-empty{color:var(--muted);margin:0}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{stroke:var(--moss);stroke-width:2.5;fill:none}
.chart .ar{fill:var(--moss-soft)}
.chart .pt{fill:var(--surface);stroke:var(--moss);stroke-width:2.5}
.chart .pt.last{fill:var(--moss)}
.chart .pass{stroke:var(--sun);stroke-dasharray:4 4;stroke-width:1.5}
.chart .lbl{fill:var(--ink);font-weight:700}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-family:var(--f-mono);font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.hi{background:var(--good-soft);color:var(--good)}
.pill.mid{background:var(--sun-soft);color:var(--ink)}
.pill.lo{background:var(--bad-soft);color:var(--bad)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:10px;align-items:center;font-size:15px}
.bar .track{height:10px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;background:var(--moss)}
.bar .fill.lo{background:var(--bad)}
.bar .fill.mid{background:var(--sun)}
.bar .v{font-family:var(--f-mono);font-size:13px;text-align:right}
@media (max-width:480px){.bar{grid-template-columns:minmax(0,1fr) 80px 44px}}
.hist-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.hist-head h3{font-size:18px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px;padding:0}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}

/* Buttons */
.btn{border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--moss);color:var(--moss-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.small{padding:8px 12px;font-size:14px}

/* Test */
.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.bar-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar-row .count{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.prog{height:8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.prog > div{height:100%;background:var(--moss);transition:width .25s}
.card{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:16px;min-width:0}
@media (max-width:480px){.card{padding:16px}}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--moss-soft);color:var(--ink)}
.tag.src{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.tag.sa{background:var(--sun-soft);color:var(--ink)}
.qtext{font-size:21px;line-height:1.35;font-weight:700;margin:0;text-wrap:pretty}
.qhint{margin:-6px 0 0;color:var(--muted);font-size:15px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--sunk);border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:52px}
.opt:hover:not([disabled]){border-color:var(--moss)}
.opt .k{font-family:var(--f-mono);font-weight:700;font-size:13px;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--surface)}
.opt.sel{border-color:var(--moss);background:var(--moss-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.actions .spacer{flex:1}
.fb{border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.fb.ok{background:var(--good-soft);border:1px solid var(--good)}
.fb.no{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.part{background:var(--sun-soft);border:1px solid var(--sun)}
.fb h4{margin:0;font-family:var(--f-display);font-size:19px}
.fb p{margin:0}
.fb .ans{font-weight:700}
.fig{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto}
.fig svg{display:block;width:100%;min-width:300px;height:auto;margin:0 auto}
.fig .bx{fill:var(--surface);stroke:var(--line-2);stroke-width:1.5}
.fig .bx2{fill:var(--moss-soft);stroke:var(--moss);stroke-width:1.5}
.fig .bx3{fill:var(--sun-soft);stroke:var(--sun);stroke-width:1.5}
.fig .tx{fill:var(--ink);font-family:var(--f-body);font-size:13px}
.fig .tx.b{font-weight:700}
.fig .tx.s{font-size:11px;fill:var(--muted)}
.fig .tx.m{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.fig .ar{stroke:var(--muted);stroke-width:1.6;fill:none}
.fig .ah{fill:var(--muted)}
.fig .ax{stroke:var(--ink);stroke-width:1.5;fill:none}
.fig .gr{stroke:var(--line-2);stroke-width:1;stroke-dasharray:4 4}
.fig .tagc{fill:var(--sun);stroke:var(--sun-ink);stroke-width:1}
.fig .tagt{fill:var(--sun-ink);font-family:var(--f-mono);font-size:13px;font-weight:700}
.fig .l1{stroke:var(--water);stroke-width:3;fill:none}
.fig .l2{stroke:var(--sun);stroke-width:3;fill:none}
.fig .l3{stroke:var(--moss);stroke-width:3;fill:none}
.fig .l4{stroke:var(--muted);stroke-width:2.5;fill:none}
.fig .gap{fill:var(--sun-soft)}
.fig .gap2{fill:var(--bad-soft)}
.fig .heat{stroke:var(--bad);stroke-width:2.5;fill:none;stroke-dasharray:7 4}
.fig .sunc{fill:var(--sun)}
.fig .dashl{stroke-dasharray:8 5}
.fig .band{fill:var(--surface);opacity:.55}
.fig .pm{fill:var(--moss)} .fig .pf{fill:var(--water)}
.fig .lvl{stroke:var(--ink);stroke-width:1.2}
.fig .v1{fill:var(--water-soft)} .fig .v2{fill:var(--moss-soft)} .fig .v3{fill:var(--land)} .fig .v4{fill:var(--sun-soft)}
.fig table{width:auto;min-width:100%;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.fig th{font-size:10px;white-space:nowrap;padding:6px 8px}
.fig td{padding:7px 8px;font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.fig td:first-child{font-family:var(--f-body);font-weight:700;font-size:14px}
.figcap{font-size:13px;color:var(--muted);margin:6px 2px 0}

/* short answer */
.sa{display:grid;gap:6px}
.sa textarea{width:100%;min-height:132px;font:inherit;font-size:17px;line-height:1.45;padding:12px 14px;border-radius:10px;border:2px solid var(--line-2);background:var(--surface);color:var(--ink);resize:vertical}
.sa textarea.right{border-color:var(--good)}
.sa textarea.part{border-color:var(--sun)}
.sa textarea.wrong{border-color:var(--bad)}
.sa textarea:disabled{opacity:1;background:var(--sunk)}
.sa .wc{font-family:var(--f-mono);font-size:12px;color:var(--muted);justify-self:end}

/* AI grading prompt */
.prompt{gap:12px}
.prompt textarea{width:100%;min-height:200px;font-family:var(--f-mono);font-size:13px;line-height:1.5;padding:12px;border-radius:10px;border:1px solid var(--line-2);background:var(--sunk);color:var(--ink);resize:vertical}
.steps{margin:0;padding-left:22px;display:grid;gap:4px}
.keyhint{font-size:13px;color:var(--muted);margin:0}
.ailabel{font-weight:700;margin-top:6px}
.aientry{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.aientry textarea{flex:1 1 200px;min-width:0;min-height:48px;font-family:var(--f-mono);font-size:20px;letter-spacing:.06em;line-height:1.3;padding:10px 14px;border-radius:10px;border:2px solid var(--line-2);background:var(--surface);color:var(--ink);resize:vertical}
.aimsg{margin:0;font-size:14px;color:var(--muted)}
.aimsg.bad{color:var(--bad);font-weight:700}
.aimsg.ok{color:var(--good);font-weight:700}
.miss .aiscore{font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--sun-ink);background:var(--sun-soft);border-radius:6px;padding:2px 8px;justify-self:start}
.miss.full{border-left-color:var(--good)}
.miss.full .aiscore{color:var(--good);background:var(--good-soft)}
.miss.zero{border-left-color:var(--bad)}
.miss.zero .aiscore{color:var(--bad);background:var(--bad-soft)}
@media (hover:none){.keyhint{display:none}}

/* Results */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;padding-block:10px 22px;border-bottom:2px solid var(--ink)}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,16vw,112px);line-height:.9;letter-spacing:-.03em}
.score p{margin:4px 0 0;color:var(--muted)}
.score h1{font-size:28px}
@media (max-width:480px){.score{grid-template-columns:1fr;gap:6px}}
.missed{display:grid;gap:10px}
.miss{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:12px 14px;display:grid;gap:4px;min-width:0}
.miss.half{border-left-color:var(--sun)}
.miss .q{font-weight:700}
.miss .cpt{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.cpt-sum{margin:0}
.cpt-list{margin:8px 0 0;padding-left:20px;columns:2 220px;column-gap:24px}
.cpt-list li{break-inside:avoid;margin-bottom:4px}
.chip .cn{font-family:var(--f-mono);font-size:11px;opacity:.7;margin-left:4px}
.miss .yours{color:var(--bad);overflow-wrap:anywhere}
.miss .corr{color:var(--good);font-weight:700}
.miss .why{color:var(--muted);font-size:15px}
.rowbtns{display:flex;flex-wrap:wrap;gap:10px}
.quitbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const fmt = n => Number(n).toLocaleString("en-US", {maximumFractionDigits: 4});
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------- question bank ---------- */
const TOPICS = {
  stages: "Demographic transition",
  pop: "Population over time",
  countries: "Comparing countries",
  footprint: "Footprints & Anthropocene",
  causes: "Human causes of change",
  climate: "Climate change",
  sustain: "Sustainability"
};

/* a[0] is the right answer; options are shuffled when shown, or sorted when fix is set */
const MC = [
  /* demographic transition */
  {id: "s01", t: "stages", fix: 1, q: "In which stage are birth rates and death rates both high, so they roughly cancel each other out?", a: ["Stage 1", "Stage 2", "Stage 3", "Stage 4"], why: "Stage 1 (high stationary): high birth rates and high death rates cancel out, so the population barely grows."},
  {id: "s02", t: "stages", fix: 1, q: "In which stage does the birth rate stay high while the death rate falls?", a: ["Stage 2", "Stage 1", "Stage 3", "Stage 4"], why: "Stage 2 (early expanding): births stay high, deaths fall, so births are much greater than deaths."},
  {id: "s03", t: "stages", fix: 1, q: "In which stage is the death rate already low and the birth rate begins to fall?", a: ["Stage 3", "Stage 1", "Stage 2", "Stage 4"], why: "Stage 3 (late expanding): the death rate stays low while the birth rate starts dropping."},
  {id: "s04", t: "stages", fix: 1, q: "In which stage are birth and death rates both low and the total population stable?", a: ["Stage 4", "Stage 1", "Stage 2", "Stage 3"], why: "Stage 4 (low stationary): both rates are low, so the total population levels off."},
  {id: "s05", t: "stages", fix: 1, q: "In which stage does the death rate become higher than the birth rate?", a: ["Stage 5", "Stage 2", "Stage 3", "Stage 4"], why: "Stage 5 (declining): deaths exceed births, so the population shrinks."},
  {id: "s06", t: "stages", q: "Which list gives the population growth of Stages 1–5 in the right order?", a: ["Slow, rapid, slowing, stable, declining", "Slow, slowing, rapid, stable, declining", "Rapid, slow, slowing, stable, declining", "Slow, rapid, stable, slowing, declining"], why: "Slow (1) → rapid (2) → slowing (3) → stable (4) → declining (5)."},
  {id: "s07", t: "stages", q: "Which phase of population growth matches Stage 2?", a: ["Rapid growth", "Slowing growth", "Slow growth", "Stable population"], why: "With births still high and deaths falling, Stage 2 is the rapid growth phase."},
  {id: "s08", t: "stages", q: "Why does the death rate drop during Stage 2?", a: ["Better health care, sanitation and clean water", "Wider access to birth control and family planning", "More women going to school and getting jobs", "Families choosing to have fewer children"], why: "Improved public health, sanitation, food supply, water supply and hygiene cut deaths, including infant deaths. Birth control and women's education are Stage 3 changes that lower the BIRTH rate."},
  {id: "s09", t: "stages", q: "What happens to infant mortality as a country moves from Stage 1 to Stage 2?", a: ["It decreases", "It increases", "It stays about the same", "It rises at first, then levels off"], why: "Stage 1 has high infant mortality; better health care and sanitation in Stage 2 reduce it."},
  {id: "s10", t: "stages", q: "Which changes in Stage 3 lead to smaller families?", a: ["More access to birth control and education", "Better sanitation and a safer water supply", "A bigger food supply and fewer famines", "Children working to help support the family"], why: "Birth control (contraception) and improved education lead to smaller families. Sanitation, water and food lower the DEATH rate in Stage 2."},
  {id: "s11", t: "stages", fix: 1, q: "Family planning is almost nonexistent and children must help support the household. Which stage is this?", a: ["Stage 1", "Stage 2", "Stage 3", "Stage 4"], why: "These are Stage 1 traits of a pre-industrial society."},
  {id: "s12", t: "stages", fix: 1, q: "In which stage do children become expensive, so having a child becomes a choice?", a: ["Stage 4", "Stage 1", "Stage 2", "Stage 3"], why: "In Stage 4, children are high cost and having them is a choice; contraception is widely available."},
  {id: "s13", t: "stages", fix: 1, q: "A population is mostly controlled by its food supply and rises and falls quickly because of natural events. Which stage is it in?", a: ["Stage 1", "Stage 2", "Stage 3", "Stage 4"], why: "In Stage 1 the population is set by the food supply and swings with natural events like drought or disease."},
  {id: "s14", t: "stages", fix: 1, q: "Which stage has an age structure shaped like a triangle, with a large part of the population at the base?", a: ["Stage 2", "Stage 3", "Stage 4", "Stage 5"], why: "Stage 2 has lots of young people (wide base) because births stay high while more children survive."},
  {id: "s15", t: "stages", fix: 1, q: "In which stage does the age structure become less triangular at the base and more columnar?", a: ["Stage 3", "Stage 1", "Stage 2", "Stage 5"], why: "As birth rates fall in Stage 3, the base narrows and the shape becomes more like a column."},
  {id: "s16", t: "stages", q: "A country has fewer young people and more elderly people. Which problem does this cause?", a: ["A greater tax burden and a lack of health care", "Crowded schools and not enough jobs for young adults", "High infant mortality and short life expectancy", "Food shortages from rapid population growth"], why: "Fewer young workers support more elderly people, which means a greater tax burden and a lack of health care."},
  {id: "s17", t: "stages", q: "Which problems come with Stage 5 (a declining population)?", a: ["Labor shortages and higher social security costs", "Too many workers competing for too few jobs", "High infant mortality and poor sanitation", "Not enough schools for a fast-growing number of children"], why: "With deaths above births, there aren't enough workers, and costs for health care and social security go up."},
  {id: "s18", t: "stages", fix: 1, q: "Japan (2023): birth rate 6.0 per 1,000, death rate 13.0 per 1,000. Which stage is Japan in?", a: ["Stage 5", "Stage 2", "Stage 3", "Stage 4"], why: "Japan's death rate (13.0) is higher than its birth rate (6.0), so its population is shrinking: Stage 5."},
  {id: "s19", t: "stages", fix: 1, q: "Yemen (2023): birth rate 35.2 per 1,000, death rate 4.8 per 1,000. Which stage is Yemen in?", a: ["Stage 2", "Stage 1", "Stage 3", "Stage 4"], why: "Yemen's birth rate is still very high (35) but its death rate has dropped (under 5), so births far outnumber deaths and the population grows rapidly: Stage 2."},
  {id: "s20", t: "stages", fix: 1, q: "Mexico's birth rate fell from 29 per 1,000 in 1990 to 16 per 1,000 in 2023, while its death rate stayed low (about 6 per 1,000). Which stage is Mexico in?", a: ["Stage 3", "Stage 2", "Stage 4", "Stage 5"], why: "The death rate is already low and the birth rate is falling, but births are still well above deaths, so growth is slowing: Stage 3."},
  {id: "s21", t: "stages", fix: 1, q: "United Kingdom (2023): birth rate 10.0 per 1,000, death rate 9.5 per 1,000. Which stage is the UK in?", a: ["Stage 4", "Stage 2", "Stage 3", "Stage 5"], why: "Both rates are low and almost equal, so the population is fairly stable: Stage 4. It isn't Stage 5 because births are still a little higher than deaths."},
  {id: "s22", t: "stages", q: "Which data (per 1,000 people) fits a Stage 1 population, like an isolated Amazon basin tribe?", a: ["Birth rate 40, death rate 38", "Birth rate 40, death rate 10", "Birth rate 18, death rate 7", "Birth rate 9, death rate 12"], why: "Stage 1 has high birth AND high death rates that nearly cancel out. 40 and 10 is Stage 2, 18 and 7 is Stage 3, and 9 and 12 is Stage 5."},
  {id: "s23", t: "stages", q: "What is Stage 3 also called?", a: ["Late expanding", "Early expanding", "High stationary", "Low stationary"], why: "Stage 1 high stationary, Stage 2 early expanding, Stage 3 late expanding, Stage 4 low stationary, Stage 5 declining."},
  {id: "s24", t: "stages", q: "What is Stage 4 also called?", a: ["Low stationary", "High stationary", "Late expanding", "Declining"], why: "Stage 4 is low stationary: low birth and death rates, steady population."},
  {id: "s25", t: "stages", q: "Population growth changes in a predictable way as a society moves from…", a: ["a primitive economy to industrialization", "an industrial economy to a farming economy", "living in cities to living on farms", "a large population to a small population"], why: "The demographic transition follows a society as it moves from a primitive economy to industrialization."},
  {id: "s26", t: "stages", fig: "dtm", q: "On this graph, the shaded gap between the birth rate and death rate in Stages 2 and 3 is called…", a: ["Natural increase", "Natural decrease", "Carrying capacity", "Net migration"], why: "When births are higher than deaths, the gap is natural increase. In Stage 5 deaths are higher, which is natural decrease."},
  {id: "s27", t: "stages", fig: "dtm", q: "According to the graph, what happens to the total population during Stages 2 and 3?", a: ["It rises quickly", "It levels off", "It falls slowly", "It rises, then crashes"], why: "Deaths have dropped but births are still higher, so the total population climbs fast."},
  {id: "s28", t: "stages", fig: "ages", fix: 1, q: "Which age-structure diagram best fits a country in Stage 2 (high birth rate, falling death rate)?", a: ["B", "A", "C", "D"], why: "B is a straight-sided triangle: lots of young people, with more people now surviving into middle age."},
  {id: "s29", t: "stages", fig: "ages", fix: 1, q: "Which age-structure diagram shows a low birth rate with many older people (Stage 4 or 5)?", a: ["D", "A", "B", "C"], why: "D has a narrow base (few births) and is widest in the middle and older ages."},
  {id: "s30", t: "stages", fig: "ages", q: "Diagram A narrows very quickly from the base up. What does this show?", a: ["A high birth rate, and many people die young", "A low birth rate, and most people live long lives", "A shrinking population with many elderly people", "A stable population with the same number at each age"], why: "A is Stage 1: many births, but each age group gets much smaller because of high death rates and short life expectancy."},
  {id: "s31", t: "stages", q: "In Stage 3, more women stay in school and the cost of raising children goes up. What happens to the birth rate?", a: ["It falls", "It rises", "It stays high", "It drops below the death rate"], why: "Education, women's expanding status and the higher cost of children lower the birth rate in Stage 3. It doesn't drop below the death rate until Stage 5."},
  {id: "s32", t: "stages", q: "Italy (2023): birth rate 6.4 per 1,000, death rate 11.4 per 1,000. What is happening to Italy's population?", a: ["It is shrinking because deaths outnumber births", "It is growing slowly because births outnumber deaths", "It is stable because births and deaths are equal", "It is growing fast because its death rate is low"], why: "11.4 deaths vs 6.4 births per 1,000 means about 5 more deaths than births per 1,000 people each year, so the population declines (Stage 5)."},
  {id: "s33", t: "stages", q: "Which data (per 1,000 people) fits a country in Stage 3?", a: ["Birth rate 18, death rate 7", "Birth rate 38, death rate 36", "Birth rate 42, death rate 12", "Birth rate 10, death rate 10"], why: "In Stage 3 the death rate is already low and the birth rate has started to fall, but births are still above deaths. 38/36 is Stage 1, 42/12 is Stage 2, 10/10 is Stage 4."},
  {id: "s34", t: "stages", fix: 1, q: "Germany (2023): birth rate 8.3 per 1,000, death rate 12.3 per 1,000. Which stage is Germany in?", a: ["Stage 5", "Stage 1", "Stage 3", "Stage 4"], why: "Germany's death rate (12.3) is higher than its birth rate (8.3), so its population is declining: Stage 5."},
  {id: "s35", t: "stages", fix: 1, q: "Afghanistan (2023): birth rate 35.4 per 1,000, death rate 5.8 per 1,000, life expectancy 66 years. Which stage is it in?", a: ["Stage 2", "Stage 1", "Stage 3", "Stage 4"], why: "The birth rate is still very high while the death rate has dropped, so births far outnumber deaths: Stage 2."},

  /* population over time */
  {id: "p01", t: "pop", fig: "history", q: "For most of human history, what appears to have been the carrying capacity for humans?", a: ["About 500 million", "About 50 million", "About 1 billion", "About 6 billion"], why: "The population stayed around 500 million or less for most of history."},
  {id: "p02", t: "pop", fig: "history", q: "Which two events appear to have increased the human carrying capacity?", a: ["Plowing and irrigation, and the Industrial Revolution", "Agriculture beginning, and the bubonic plague", "The bubonic plague, and the Industrial Revolution", "Plowing and irrigation, and the bubonic plague"], why: "Plowing and irrigation and the Industrial Revolution let Earth support more people. The plague made the population drop."},
  {id: "p03", t: "pop", fig: "history", q: "Which event on the graph is a density-dependent limiting factor?", a: ["The bubonic plague", "Agriculture begins", "Plowing and irrigation", "The Industrial Revolution"], why: "Disease like the plague spreads faster in crowded populations, so it is density-dependent. It caused the dip."},
  {id: "p04", t: "pop", fig: "history", q: "According to the graph, about how long has the human population been greater than 1 billion?", a: ["Since about 1800", "Since about 1000 A.D.", "Since about 1950", "Since about 0 A.D."], why: "The line crosses 1 billion around 1800 and stays above it."},
  {id: "p05", t: "pop", q: "Which statement about global population today is correct?", a: ["The population is still increasing, but the growth rate is decreasing", "The population and the growth rate are both decreasing", "The population is decreasing, but the growth rate is increasing", "The population and the growth rate are both increasing faster than ever"], why: "There are still more people every year, but the rate of growth is slowing down."},
  {id: "p06", t: "pop", q: "About how many people are expected on Earth in the year 2042?", a: ["About 9 billion", "About 7 billion", "About 12 billion", "About 15 billion"], why: "Population estimates put the world at about 9 billion by 2042."},
  {id: "p07", t: "pop", fig: "history", q: "What happened to the human population after the Industrial Revolution began?", a: ["It shot up very quickly", "It dropped because of disease", "It kept growing at the same slow rate", "It leveled off at about 500 million"], why: "After the Industrial Revolution, the curve turns almost straight up to about 6 billion by 2000."},
  {id: "p08", t: "pop", q: "Which list contains only factors that affect a country's population growth?", a: ["Birth rate, death rate, net migration, age structure", "Birth rate, death rate, net migration, ozone levels", "Death rate, fertility, sea level, age structure", "Birth rate, smog, net migration, fertility"], why: "Birth rate, death rate, fertility, net migration and age structure all change how fast a country grows."},

  /* comparing countries */
  {id: "c01", t: "countries", fig: "countries", q: "Which country has the highest population growth rate?", a: ["Angola", "Kenya", "Canada", "Denmark"], why: "Angola grows 2.72% per year, the highest of the four, because of its very high birth rate (33.6)."},
  {id: "c02", t: "countries", fig: "countries", fix: 1, q: "Kenya has a high birth rate (25.1) and a low death rate (6.8). Which stage is it in?", a: ["Stage 2", "Stage 1", "Stage 3", "Stage 4"], why: "High births with low deaths is Stage 2."},
  {id: "c03", t: "countries", fig: "countries", fix: 1, q: "Canada has a low birth rate (10.3) and a low death rate (8.5). Which stage is it in?", a: ["Stage 4", "Stage 1", "Stage 2", "Stage 3"], why: "Low births and low deaths is Stage 4."},
  {id: "c04", t: "countries", fig: "countries", q: "Denmark's birth rate (10.4) and death rate (10.3) are almost equal. What will most likely happen to its population?", a: ["It will stay about the same", "It will grow quickly", "It will shrink quickly", "It will double within 20 years"], why: "With births and deaths almost equal, growth is close to zero (0.22%), so the population stabilizes."},
  {id: "c05", t: "countries", q: "A country with a high birth rate is most likely a…", a: ["developing country", "developed country", "Stage 4 country", "Stage 5 country"], why: "High birth rates go with developing countries; low birth rates go with developed countries."},
  {id: "c06", t: "countries", fig: "countries", q: "Canada's birth rate is low, but it still grows 0.74% a year. What explains most of that growth?", a: ["Its immigration rate (5.7 per 1,000)", "Its birth rate (10.3 per 1,000)", "Its life expectancy (81.9 years)", "Its median age (42 years)"], why: "Births are only 1.8 per 1,000 higher than deaths, but 5.7 per 1,000 move in, so most of Canada's growth comes from immigration."},
  {id: "c07", t: "countries", fig: "countries", q: "Angola's median age is 18.2 years and Canada's is 42. What does this tell you?", a: ["Angola has more young people, so it will keep growing", "Angola's people live longer, so it will keep growing", "Canada has more young people, so it will grow faster", "Angola has more old people, so it will shrink soon"], why: "A young median age means lots of people about to have children, so growth continues."},
  {id: "c08", t: "countries", fig: "countries", q: "Which country has the highest life expectancy?", a: ["Canada", "Denmark", "Kenya", "Angola"], why: "Canada's life expectancy is 81.9 years, higher than Denmark (79.4), Kenya (64) and Angola (56)."},
  {id: "c09", t: "countries", q: "What shape is the age structure of a developing country like Angola or Kenya?", a: ["A triangle with a wide base", "A column with straight sides", "A narrow base that widens upward", "Widest in the middle ages"], why: "Developing countries have many young people, so the base is wide. Developed countries look more like a column."},
  {id: "c10", t: "countries", fig: "countries", q: "Based on its data, what will most likely happen to Angola's population?", a: ["It will increase", "It will decrease", "It will level off soon", "It will stay the same"], why: "Angola's birth rate (33.6) is much higher than its death rate (11.3), so it will keep growing."},
  {id: "c11", t: "countries", fix: 1, q: "United States (2023): birth rate 10.7 per 1,000, death rate 9.2 per 1,000, life expectancy 78 years. Which stage is it in?", a: ["Stage 4", "Stage 2", "Stage 3", "Stage 5"], why: "Both rates are low and close together, with births still slightly higher, so the U.S. is in Stage 4."},
  {id: "c12", t: "countries", fig: "countries", q: "Which two countries have both a low birth rate and a low death rate?", a: ["Canada and Denmark", "Angola and Kenya", "Kenya and Canada", "Angola and Denmark"], why: "Canada (10.3, 8.5) and Denmark (10.4, 10.3). Angola and Kenya have high birth rates."},
  {id: "c13", t: "countries", fig: "countries", q: "Not counting migration, about how many people per 1,000 does Kenya add each year (birth rate minus death rate)?", a: ["About 18", "About 32", "About 25", "About 7"], why: "25.1 births − 6.8 deaths ≈ 18 more people per 1,000 each year. That gap is natural increase."},

  /* footprints & Anthropocene */
  {id: "f01", t: "footprint", q: "What is an ecological footprint?", a: ["The land and water needed to supply a population's resources and absorb its wastes", "The area of land covered by a population's homes, roads and other buildings", "The total amount of carbon dioxide one person releases in a year", "The number of people an area's land and water can support over time"], why: "It measures the healthy land and water needed for the resources you use and the wastes you make. Carbon dioxide is only one part, and the number of people an area can support is carrying capacity."},
  {id: "f02", t: "footprint", q: "Which pair BOTH count toward a person's ecological footprint?", a: ["The food they eat and the trash they make", "The food they eat and how tall they are", "Their age and the trash they make", "The species near them and the water they use"], why: "Your footprint includes the resources you use (energy, food, water, shelter) and the wastes you produce."},
  {id: "f03", t: "footprint", fig: "footprint", q: "According to the chart, about how many more global hectares does the average American use than the average person in France?", a: ["About 3.5 gha more", "About 1.8 gha more", "About 6.1 gha more", "About 12.7 gha more"], why: "8.1 − 4.6 = 3.5 gha."},
  {id: "f04", t: "footprint", fig: "footprint", q: "According to the chart, which country has the smallest average ecological footprint?", a: ["Ghana", "Peru", "France", "Russia"], why: "Ghana is 2.0 gha, just under Peru at 2.1 gha."},
  {id: "f05", t: "footprint", fig: "footprint", q: "Using the chart, about how many times larger is the average American's footprint than the average footprint in Ghana?", a: ["About 4 times larger", "About 6 times larger", "About 2 times larger", "About 8 times larger"], why: "8.1 ÷ 2.0 ≈ 4. (6.1 is the difference, not how many times larger.)"},
  {id: "f06", t: "footprint", q: "Why is the average American's ecological footprint so large?", a: ["Americans use more energy and resources and make more waste per person", "The United States has more land area than most other countries", "The United States has a larger population than any other country", "Americans have more children per family than people in Ghana"], why: "Footprint is per person: more energy use, more stuff and more waste per person means more land and water are needed. Land area and total population don't set the per-person footprint."},
  {id: "f07", t: "footprint", q: "Which change would lower a person's ecological footprint?", a: ["Using greener electricity and traveling less", "Moving to a bigger country with more open land", "Switching from tap water to bottled water", "Replacing old phones as soon as new ones come out"], why: "Less energy use and less travel mean fewer resources used and fewer greenhouse gases made. Bottled water and new phones use more resources."},
  {id: "f08", t: "footprint", q: "Around what year did the Great Acceleration begin?", a: ["1950", "1800", "1900", "2000"], why: "Starting around 1950, human population and resource use shot up together. 1800 is the Industrial Revolution."},
  {id: "f09", t: "footprint", q: "Which trends rose sharply during the Great Acceleration?", a: ["Population, energy use, water use and fertilizer use", "Population, forest area, water use and fish catch", "Energy use, glacier size, water use and fertilizer use", "Population, energy use, Arctic sea ice and water use"], why: "Population, energy, water and fertilizer use (and coastal nitrogen and fish catch) all rose quickly after 1950. Forests, glaciers and sea ice went DOWN."},
  {id: "f10", t: "footprint", q: "What is the Anthropocene?", a: ["The period when human activity is the major cause of global change", "The part of Earth's history before humans appeared on the planet", "The time when people first began farming, about 10,000 years ago", "The study of how human cultures and languages have changed over time"], why: "The Anthropocene, the “Age of Humans,” is when human activity became the main driver of global change."},
  {id: "f11", t: "footprint", q: "Which of these is an example of an anthrome?", a: ["Cropland", "Tundra", "Taiga", "Savanna"], why: "Anthromes are human-altered biomes: cities, villages, croplands and rangelands. Tundra, taiga and savanna are natural biomes."},
  {id: "f12", t: "footprint", q: "Which describes an anthrome?", a: ["A biome shaped by long-term interactions between humans and ecosystems", "A natural biome found only in places where humans have never lived", "A layer of the atmosphere whose gases have been changed by human pollution", "A group of non-native species that humans carried to a new area"], why: "An anthrome is a human-altered biome shaped by long-term human use."},

  /* human causes of global change */
  {id: "h01", t: "causes", q: "Why can extra nitrogen from fossil fuels or fertilizer cause algal blooms?", a: ["Nitrogen is a limiting nutrient for algae", "Nitrogen warms the water so algae grow faster", "Nitrogen kills the fish and insects that eat algae", "Nitrogen lowers the water's pH, which algae need"], why: "When a limiting nutrient is added, producers like algae can grow out of control."},
  {id: "h02", t: "causes", q: "How does farming add nitrogen to streams, lakes and oceans?", a: ["Fertilizer runs off fields into the water", "Crops release nitrogen gas as they grow", "Plowing frees nitrogen trapped in rocks", "Irrigation pumps nitrogen up from deep soil"], why: "Fertilizer helps grow food, but nitrogen runoff ends up in streams, lakes and oceans."},
  {id: "h03", t: "causes", q: "How does acid rain form?", a: ["Air pollution mixes with water in clouds and falls as rain", "The ocean absorbs carbon dioxide and then evaporates", "Holes in the ozone layer let acidic UV rays reach clouds", "Fertilizer runoff evaporates from lakes into the clouds"], why: "Pollution in the air mixes with water in clouds and falls as rain that is acidic. The ocean absorbing CO₂ is ocean acidification, a different process."},
  {id: "h04", t: "causes", q: "What does acid rain especially damage?", a: ["Forests and lakes", "Coral reefs", "Deserts and grasslands", "The ozone layer"], why: "Acid rain is especially damaging to forests and lakes. Coral reefs are hurt by ocean acidification, which comes from the ocean absorbing CO₂."},
  {id: "h05", t: "causes", q: "What causes ocean acidification?", a: ["The ocean absorbs carbon dioxide from the air", "Acid rain falls into the ocean", "Nitrogen runoff causes algal blooms", "Melting glaciers add fresh water to the ocean"], why: "As the ocean absorbs more CO₂ from the air, its pH keeps decreasing. Acid rain is a much smaller effect."},
  {id: "h06", t: "causes", fig: "biomag", q: "In this food chain, which organisms have the highest concentration of the pollutant?", a: ["Fish-eating birds", "Algae and other producers", "Zooplankton", "Large fish"], why: "Pollutant concentration increases at each higher trophic level, so the top predator has the most."},
  {id: "h07", t: "causes", fig: "biomag", q: "How many times more concentrated is the pollutant in small fish than in zooplankton?", a: ["10 times", "100 times", "1,000 times", "90,000 times"], why: "Zooplankton 10,000 → small fish 100,000, and 100,000 ÷ 10,000 = 10. (90,000 is the difference, not how many times.)"},
  {id: "h08", t: "causes", q: "In biological magnification, what happens as you move up a food chain?", a: ["The pollutant concentration goes up at each level", "The pollutant concentration goes down at each level", "The pollutant is broken down by each consumer", "The number of organisms goes up at each level"], why: "Fewer organisms at higher trophic levels each carry more pollutant, so the concentration builds up."},
  {id: "h09", t: "causes", q: "Which is a negative effect of deforestation?", a: ["Less carbon is stored in trees and soil", "Soil holds more water and nutrients", "The ozone layer over the area thins out", "Rain in the area becomes more acidic"], why: "Losing forests harms soil, water, carbon storage and the animals that live there. Without trees, soil loses water and nutrients."},
  {id: "h10", t: "causes", q: "What is monoculture?", a: ["Planting one high-production crop over large areas every year", "Rotating different crops on the same field from one year to the next", "Planting many crop species together in the same field", "Raising one kind of animal on a large ranch"], why: "Monoculture is planting one highly productive crop over large areas year after year. Rotating crops is the opposite."},
  {id: "h11", t: "causes", q: "What does habitat fragmentation cause?", a: ["Biodiversity loss and weaker ecosystems", "More edge habitat, so biodiversity goes up", "Cleaner water because fewer animals live there", "Faster regrowth of the remaining forest"], why: "Breaking habitats into small pieces reduces biodiversity and makes ecosystems more vulnerable to other disturbances."},
  {id: "h12", t: "causes", q: "What is overharvesting?", a: ["Using a resource faster than it can recover", "Planting more crops than a farm can sell", "Picking crops before they are fully ripe", "Using a resource that can be replaced"], why: "Overharvesting means using a natural resource in an unsustainable way: taking it faster than it can recover."},
  {id: "h13", t: "causes", q: "What makes a species invasive?", a: ["It is non-native and causes harm in its new area", "It is native and its population is growing fast", "It was brought to a new area by humans", "It is close to going extinct in its new area"], why: "Invasive species are non-native AND cause economic, environmental or health harm. Being brought by humans alone doesn't make a species invasive."},
  {id: "h14", t: "causes", q: "What is a pollutant?", a: ["A harmful material that enters the land, air or water", "Any gas that is released into the atmosphere by cars or factories", "A natural resource that cannot be replaced", "A nutrient that helps algae and crops grow"], why: "A pollutant is harmful material that gets into the biosphere through land, air or water."},
  {id: "h15", t: "causes", q: "What does the ozone layer do?", a: ["It blocks harmful ultraviolet rays from the sun", "It traps heat in the atmosphere and keeps Earth warm", "It absorbs carbon dioxide from the air", "It turns air pollution into acid rain"], why: "The ozone layer has concentrated ozone gas that blocks harmful UV rays. Trapping heat is the greenhouse effect, which is different."},
  {id: "h16", t: "causes", q: "What is smog?", a: ["A gray-brown haze formed by a mixture of chemicals", "Rain that has become acidic from air pollution", "A thick fog made of tiny drops of pure water", "A layer of ozone gas high in the atmosphere"], why: "Smog is the gray-brown haze made by a mix of chemicals in the air. Acidic rain is acid rain."},
  {id: "h17", t: "causes", q: "How do humans mainly affect the atmosphere and climate?", a: ["Burning fossil fuels for energy", "Spraying aerosol cans", "Building hydroelectric dams", "Running nuclear power plants"], why: "Burning fossil fuels releases CO₂ and other pollutants that trap heat and pollute the air."},

  /* climate */
  {id: "k01", t: "climate", q: "Earth's average temperature is determined by…", a: ["the balance between heat kept in and heat lost to space", "how close Earth is to the sun at different times of year", "the thickness of the ozone layer", "how much water the oceans hold"], why: "If more heat stays in than escapes to space, Earth warms."},
  {id: "k02", t: "climate", q: "Which three gases mostly control the greenhouse effect?", a: ["Carbon dioxide, methane and water vapor", "Carbon dioxide, oxygen and water vapor", "Methane, ozone and nitrogen", "Carbon dioxide, methane and oxygen"], why: "CO₂, methane and water vapor trap heat in the atmosphere. Oxygen and nitrogen don't."},
  {id: "k03", t: "climate", q: "What is the greenhouse effect?", a: ["Gases trap the sun's energy in the atmosphere as heat", "The ozone layer blocks the sun's UV rays from reaching Earth", "Plants take in carbon dioxide and give off oxygen", "The ocean absorbs carbon dioxide from the atmosphere"], why: "Greenhouse gases trap heat in the atmosphere, keeping Earth warm. Blocking UV is the ozone layer's job."},
  {id: "k04", t: "climate", fig: "greenhouse", q: "In this diagram, what happens to the heat given off by Earth's surface?", a: ["Some is trapped and some escapes to space", "All of it escapes back into space", "All of it is trapped in the atmosphere", "It is blocked by the ozone layer"], why: "Greenhouse gases trap some heat and send it back down; the rest escapes."},
  {id: "k05", t: "climate", q: "The amount of greenhouse gases in the atmosphere changes with biogeochemical cycles and can be affected by…", a: ["both human and natural activities", "human activities, but not natural ones", "natural cycles, but not human activity", "changes in the sun, not cycles or people"], why: "Natural cycles and human activities both change greenhouse gas levels."},
  {id: "k06", t: "climate", q: "Which statement describes weather, not climate change?", a: ["It is rainy and cold today", "Summers in the region have gotten hotter since 1970", "Heavy storms have become more common over 40 years", "Average yearly rainfall has dropped over 50 years"], why: "Weather is day-to-day conditions. Climate change is a long-term change in averages."},
  {id: "k07", t: "climate", q: "Which best describes climate change?", a: ["A long-term change in average temperature, rain and storms", "A change in the weather from one day to the next", "A short-term change in temperature during one season", "A hole in the ozone layer that lets in more sunlight"], why: "Climate change covers long-term changes in average temperature, clouds, winds, precipitation and how often extreme weather happens."},
  {id: "k08", t: "climate", q: "What is global warming?", a: ["An increase in Earth's average temperature", "A thinning of the ozone layer over the poles", "A very hot summer in one part of the world", "The ocean becoming more acidic over time"], why: "Global warming is the rise in Earth's average temperature. One hot summer is weather."},
  {id: "k09", t: "climate", q: "Which observation is evidence that climate change is happening?", a: ["Arctic sea ice, glaciers and snow cover are shrinking", "Sea levels are falling as the oceans cool down", "Glaciers are growing larger in most mountains", "Greenhouse gas emissions have dropped since 1950"], why: "Shrinking ice and snow, rising seas, rising temperatures and more emissions are all evidence."},
  {id: "k10", t: "climate", q: "What is happening to sea levels?", a: ["They are rising", "They are falling", "They are staying the same", "They rise in summer and fall back in winter, with no overall change"], why: "Sea levels are rising as water warms and ice melts."},
  {id: "k11", t: "climate", q: "About how much has sea level risen in the last 55 years?", a: ["About 4 inches", "About 4 feet", "About 1 inch", "About 12 inches"], why: "Sea level has increased about 4 inches in 55 years, which leads to loss of land."},
  {id: "k12", t: "climate", q: "Droughts and a smaller snowpack affect people mainly through…", a: ["water availability", "loss of land", "air pollution", "a thinning ozone layer"], why: "Less snowpack and more droughts mean less water for people."},
  {id: "k13", t: "climate", q: "How does climate change affect crop cycles?", a: ["It lowers crop yields", "It raises crop yields because CO₂ helps plants grow", "It has little effect because farmers can water crops", "It mainly affects fish, not crops"], why: "Changing temperature and rain patterns have a negative impact on crop yield."},
  {id: "k14", t: "climate", q: "Which list gives the three main ways humans are impacted by climate change?", a: ["Water availability, crop cycles and loss of land", "Water availability, acid rain and loss of land", "Smog, crop cycles and loss of land", "Water availability, crop cycles and the ozone layer"], why: "Climate change affects water availability, crop cycles and land (through rising seas)."},
  {id: "k15", t: "climate", q: "How does science help us respond to global environmental change?", a: ["Scientists collect data to understand changes and find solutions", "Scientists control the weather to stop climate change", "Scientists prove that humans have no effect on Earth", "Scientists decide which environmental laws every country has to pass"], why: "Data and models show what is changing and why, which helps people find solutions."},
  {id: "k16", t: "climate", q: "How can more greenhouse gases in the atmosphere affect other Earth systems?", a: ["More heat is trapped, which warms oceans and melts ice", "More UV light gets in, which thins the ozone layer", "The air cools down, which makes glaciers grow", "More oxygen is made, which speeds up plant growth"], why: "Extra trapped heat changes climate, which affects oceans, ice, land and living things."},

  /* sustainability */
  {id: "u01", t: "sustain", q: "What is a renewable resource?", a: ["A resource that healthy ecosystems can replace", "A resource that can be recycled into new products", "A resource that is cheap and easy to find", "A resource that does not cause any pollution"], why: "Renewable resources are produced or replaced by healthy ecosystem functions. Being recyclable or clean doesn't make something renewable."},
  {id: "u02", t: "sustain", q: "What is a nonrenewable resource?", a: ["A resource nature can't replace in a reasonable amount of time", "A resource that cannot be recycled or reused after it has been used once", "A resource that always causes pollution when used", "A resource that only comes from plants and animals"], why: "Nonrenewable resources can't be replenished by a natural process as fast as they are used up."},
  {id: "u03", t: "sustain", q: "Which energy source is renewable?", a: ["Wind", "Coal", "Natural gas", "Nuclear"], why: "Solar, biomass, geothermal, wind and hydropower are renewable."},
  {id: "u04", t: "sustain", q: "Which energy source is NONrenewable?", a: ["Nuclear", "Geothermal", "Biomass", "Hydropower"], why: "Fossil fuels (coal, natural gas) and nuclear are nonrenewable. Nuclear makes little air pollution, but its fuel (uranium) runs out."},
  {id: "u05", t: "sustain", q: "Which list contains only renewable energy sources?", a: ["Solar, biomass, geothermal, wind", "Solar, wind, nuclear, hydropower", "Wind, biomass, natural gas, solar", "Geothermal, coal, hydropower, wind"], why: "Coal, natural gas and nuclear are nonrenewable."},
  {id: "u06", t: "sustain", q: "What is sustainable development?", a: ["Meeting people's needs without using up resources or causing long-term harm", "Growing the economy as fast as possible using all available resources", "Stopping all use of natural resources to protect the environment", "Building new cities only in places where no wildlife lives"], why: "Sustainable development uses resources without depleting them and without long-term environmental harm."},
  {id: "u07", t: "sustain", q: "In the nested model of sustainability, which one contains the other two?", a: ["The environment", "The economy", "Society", "None; all three overlap equally"], why: "The environment is the outer circle, society is inside it, and the economy is inside society."},
  {id: "u08", t: "sustain", q: "Food, fresh water and wood from nature are which type of ecosystem service?", a: ["Provisioning", "Regulating", "Cultural", "Supporting"], why: "Provisioning services are products we get from ecosystems."},
  {id: "u09", t: "sustain", q: "Recreation, education and inspiration from nature are which type of ecosystem service?", a: ["Cultural", "Provisioning", "Regulating", "Supporting"], why: "Cultural services are non-material benefits from ecosystems."},
  {id: "u10", t: "sustain", q: "Climate regulation and flood control by wetlands and forests are which type of ecosystem service?", a: ["Regulating", "Provisioning", "Cultural", "Supporting"], why: "Regulating services are benefits from ecosystems controlling natural processes."},
  {id: "u11", t: "sustain", q: "Nutrient cycling and soil formation are which type of ecosystem service?", a: ["Supporting", "Provisioning", "Cultural", "Regulating"], why: "Supporting services are needed to produce all the other ecosystem services."},
  {id: "u12", t: "sustain", q: "Which factors are used to evaluate whether a development is sustainable?", a: ["Its environmental, social and economic impacts", "Its cost, its size and how fast it can be built", "Its environmental impact, and nothing else", "How much money it makes for the builders"], why: "Sustainability looks at the links between the environment, society and the economy over the long term."},
  {id: "u13", t: "sustain", q: "What is resilience?", a: ["The ability to recover after a disturbance", "The ability to keep any change from happening", "The number of species living in an area", "The largest population an area can support"], why: "Resilience is the ability to recover after a disturbance. The number of species is biodiversity, and the largest population is carrying capacity."},
  {id: "u14", t: "sustain", q: "Why are innovation and resilience important for environmental challenges?", a: ["Innovation finds new solutions; resilience helps systems recover", "Innovation stops pollution; resilience stops population growth", "Innovation uses up resources; resilience replaces them", "Innovation matters for businesses; resilience matters for wildlife"], why: "New ideas give solutions; resilience helps people and ecosystems bounce back and adapt."},
  /* added 11-19 so every concept in the unit has a question */
  {id: "s36", t: "stages", q: "What is Stage 1 also called?", a: ["High stationary", "Low stationary", "Early expanding", "Late expanding"], why: "Stage 1 is high stationary: birth and death rates are both HIGH, so the population stays about the same (stationary)."},
  {id: "s37", t: "stages", q: "What is Stage 2 also called?", a: ["Early expanding", "Late expanding", "High stationary", "Declining"], why: "Stage 2 is early expanding: the death rate drops while births stay high, so the population starts to expand quickly."},
  {id: "s38", t: "stages", q: "Which describes life in a Stage 1 society?", a: ["Short life expectancy and high infant mortality", "Long life expectancy and low infant mortality", "Short life expectancy but low infant mortality", "Long life expectancy but high infant mortality"], why: "Stage 1 has poor health care and sanitation, so many babies die (high infant mortality) and people don't live long (short life expectancy)."},
  {id: "s40", t: "stages", q: "In Stage 2, how does better transportation help lower the death rate?", a: ["Water and food reach more people", "More people can move to other countries", "Birth control becomes easier to get", "Children no longer have to work"], why: "Better transportation reduces deaths from a lack of water (and food). Birth control is a Stage 3 change, and moving away is migration, not a lower death rate."},
  {id: "s41", t: "stages", q: "Which Stage 2 change reduces deaths from starvation?", a: ["A better food supply", "More access to contraception", "Higher costs of raising children", "More women joining the workforce"], why: "Improvements in the food supply reduce death due to starvation. The other choices lower the BIRTH rate in later stages."},
  {id: "s42", t: "stages", q: "Besides birth control and education, which change in Stage 3 helps lower the birth rate?", a: ["Increasing urbanization", "Rising infant mortality", "Less access to schools", "More children working on farms"], why: "In Stage 3 more people move to cities (urbanization), where children cost more and help less with work, so families get smaller."},
  {id: "s43", t: "stages", q: "In Stage 3, how does the number of births compare to the number of deaths?", a: ["Births are a bit higher than deaths", "Births are much higher than deaths", "Births are lower than deaths", "Both are high and about equal"], why: "In Stage 3 births are only a BIT higher than deaths (births ≥ deaths), so growth is slowing. Much higher is Stage 2, lower is Stage 5, high and equal is Stage 1."},
  {id: "s44", t: "stages", q: "In Stage 4, the fertility rate is…", a: ["at or slightly above replacement level", "far above replacement level, like in Stage 2", "well below replacement level", "rising quickly every year"], why: "Replacement level means couples have about enough children to replace themselves, so the population stays stable, which is Stage 4."},
  {id: "s45", t: "stages", q: "Which pair of conditions describes Stage 4?", a: ["Low disease rates and high food production", "High disease rates and low food production", "Low disease rates but frequent famines", "High disease rates but high food production"], why: "Stage 4 has low rates of disease and high production of food, which is why the death rate is low."},
  {id: "s46", t: "stages", fix: 1, q: "Women gaining more independence and work opportunities, and children being a high cost, are features of which stage?", a: ["Stage 4", "Stage 1", "Stage 2", "Stage 5"], why: "In Stage 4 women gain more independence and work opportunities, and children are a high cost, so having them is a choice."},
  {id: "s47", t: "stages", q: "What is true about the death rate in Stage 5?", a: ["It is stable or slowly rising, and above the birth rate", "It is falling quickly, and below the birth rate", "It rises fast because of famine and disease", "It is equal to the birth rate, so growth is zero"], why: "In Stage 5 the death rate is stable or slowly increasing (an older population) and it exceeds the birth rate, so the population declines."},
  {id: "s48", t: "stages", q: "Which description matches a Stage 4 age structure?", a: ["Low birth rate, low death rate, longer life expectancy", "High birth rate, and each age group much smaller than the one below", "High birth rate, falling death rate, more people reaching middle age", "Very high birth rate with almost no elderly people"], why: "Stage 4: low birth and death rates, a higher dependency ratio (more older people) and longer life expectancy. The others describe Stages 1 and 2."},

  {id: "p09", t: "pop", q: "How is the age structure of the world's population expected to change from 2002 to 2050?", a: ["More older people, so it looks more like a column", "More young people, so it looks more like a triangle", "Fewer people in every age group", "It will keep exactly the same shape"], why: "As birth rates fall and people live longer, the world's age structure gets more older people and the sides straighten into a column."},

  {id: "c14", t: "countries", q: "Developing countries usually have…", a: ["high birth rates and young populations", "low birth rates and old populations", "high death rates and old populations", "low birth rates and young populations"], why: "Developing countries like Angola and Kenya have high birth rates, so most people are young (median ages 18–20)."},
  {id: "c15", t: "countries", q: "How does the age structure of a developed country like Canada differ from a developing country like Kenya?", a: ["Its sides are straighter, like a column", "Its base is wider, like a triangle", "It has fewer old people at the top", "It is widest at the very bottom"], why: "Developed countries have low birth rates and long lives, so each age group is about the same size: a column. Developing countries are triangles with wide bases."},

  {id: "f13", t: "footprint", q: "During the Great Acceleration, what happened to world population and resource use?", a: ["Both shot up together", "Population rose but resource use fell", "Resource use rose but population fell", "Both stayed level until 2000"], why: "After 1950 more people, more medicine, more houses, more cars and more energy use all rose sharply at the same time."},
  {id: "f14", t: "footprint", q: "Which list goes from LEAST to MOST changed by humans?", a: ["Wildlands, seminatural, rangeland, cropland, dense settlements", "Dense settlements, cropland, rangeland, seminatural, wildlands", "Wildlands, cropland, dense settlements, seminatural, rangeland", "Seminatural, wildlands, rangeland, dense settlements, cropland"], why: "Wildlands are untouched, seminatural lands are lightly used, and the used anthromes go rangeland → cropland → villages → dense settlements (cities)."},
  {id: "f15", t: "footprint", q: "An ecological footprint counts the healthy land and water needed for…", a: ["the resources you use and the wastes you make", "the resources you use, but not your wastes", "the wastes you make, but not the resources you use", "the land that your home and school sit on"], why: "It includes your USE of resources (energy, food, water, shelter) AND the WASTES you produce (sewage, trash and greenhouse gases)."},

  {id: "h18", t: "causes", q: "Why is ocean acidification a problem for animals like clams and corals?", a: ["Fewer carbonate ions are left to build their shells", "The warmer water makes their shells grow too fast", "Algae grow on top of them and block all their sunlight", "Extra oxygen dissolved in the water poisons them"], why: "CO₂ dissolving in seawater lowers its pH and uses up carbonate ions, so shell-building animals have less material to build and keep their shells."},
  {id: "h19", t: "causes", q: "How can nitrogen from burning fossil fuels in a city end up in a faraway lake?", a: ["It travels through the air", "It is carried by migrating fish", "It soaks down into deep rock layers", "It is pumped there by irrigation"], why: "Nitrogen released from burning fossil fuels can travel through the air and fall far away, where it can cause algal blooms."},
  {id: "h21", t: "causes", q: "A highway and new housing are built through a large forest, splitting it into small separate patches. This is…", a: ["Habitat fragmentation", "Monoculture", "Overharvesting", "Biological magnification"], why: "Breaking one habitat into small, separated pieces is habitat fragmentation. It causes biodiversity loss and makes ecosystems more vulnerable."},
  {id: "h22", t: "causes", q: "Fishers catch cod faster than the cod can reproduce, and the population crashes. This is…", a: ["Overharvesting", "Monoculture", "Habitat fragmentation", "An invasive species"], why: "Using a natural resource faster than it can recover is overharvesting."},
  {id: "h23", t: "causes", q: "Zebra mussels arrive in a new lake on boats and crowd out the native species. The zebra mussels are…", a: ["An invasive species", "A native species", "An endangered species", "A pollutant"], why: "They are non-native, were introduced by humans, and harm the ecosystem, so they are invasive."},
  {id: "h24", t: "causes", q: "A farm plants only corn on the same 5,000 acres every single year. This is…", a: ["Monoculture", "Crop rotation", "Deforestation", "Overharvesting"], why: "Planting one highly productive crop over large areas year after year is monoculture. Crop rotation is the opposite: changing crops each year."},

  {id: "k17", t: "climate", q: "Light energy enters a greenhouse through the glass. Why does it stay warm inside?", a: ["Much of the energy gets trapped inside as heat", "The glass turns sunlight into extra light energy", "The plants inside release heat as they grow", "No energy at all can pass back out through it"], why: "Light gets in, but only a smaller amount of energy passes back out through the walls; much of it is trapped as heat. Greenhouse gases do the same for Earth."},
  {id: "k18", t: "climate", q: "Climate change involves long-term changes in all of these EXCEPT…", a: ["the ozone layer", "cloud cover", "wind patterns", "how often extreme storms happen"], why: "Climate change involves temperature, clouds, winds, precipitation and the frequency and severity of extreme weather. The ozone layer is a separate topic (it blocks UV rays)."},

  {id: "u15", t: "sustain", q: "Bees pollinating crops is which type of ecosystem service?", a: ["Regulating", "Provisioning", "Cultural", "Supporting"], why: "Pollination is a regulating service: a benefit we get from ecosystems controlling natural processes. The crops themselves would be provisioning."},
  {id: "u16", t: "sustain", q: "Wetlands filtering pollutants out of water is which type of ecosystem service?", a: ["Regulating", "Provisioning", "Supporting", "Cultural"], why: "Water purification is a regulating service. The fresh water you drink from the wetland would be provisioning."},
  {id: "u17", t: "sustain", q: "Medicines that come from rainforest plants are which type of ecosystem service?", a: ["Provisioning", "Regulating", "Supporting", "Cultural"], why: "Provisioning services are products we get from ecosystems, like food, fresh water, wood and medicines."},
  {id: "u18", t: "sustain", q: "Which resource is renewable if it is managed well?", a: ["Forests", "Coal", "Oil", "Natural gas"], why: "Healthy ecosystems can regrow forests. Coal, oil and natural gas are fossil fuels that take millions of years to form."},
  {id: "u19", t: "sustain", q: "Which plan is the best example of sustainable development?", a: ["A town builds a wind farm and protects its wetland", "A town clears its forest to build more houses", "A town pumps groundwater faster than rain refills it", "A town stops using any natural resources at all"], why: "Sustainable development meets people's needs while preserving ecosystem services. Stopping all resource use doesn't meet people's needs."},
  {id: "u20", t: "sustain", q: "In the nested model of sustainability, why is the economy drawn inside society?", a: ["The economy depends on people and society to exist", "The economy is larger than society", "Society only exists because of the economy", "The economy doesn't depend on the environment"], why: "The economy is made by people, so it sits inside society, and society depends on the environment, so both sit inside the environment."}
];
