<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Unit 3 Human Impact Test (THIS IS NOT THE ACTUAL TEST, IT IS A PRACTICE TEST)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one study column (max 780px). Home = start cards + score history; a test shows one question card at a time under a sticky progress bar. */
:root{
  --paper:#EDF0F3; --surface:#FFFFFF; --sunk:#F5F7F9; --ink:#162029; --muted:#53616E; --line:#D2D9E0; --line-2:#AAB7C4;
  --moss:#1F5C88; --moss-ink:#FFFFFF; --moss-soft:#DAE7F2;
  --sun:#D96A26; --sun-ink:#2A1305; --sun-soft:#FBE5D4;
  --good:#1E7A49; --good-soft:#DCF1E3; --bad:#B53F2E; --bad-soft:#F8E0DA;
  --water:#22827F; --water-soft:#C4E5E2; --land:#D9D3BC; --soil:#A88B6A;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E141A; --surface:#161F28; --sunk:#121A22; --ink:#E2E9F0; --muted:#98A7B5; --line:#26323D; --line-2:#3A4A59;
    --moss:#7DB4E3; --moss-ink:#0A1622; --moss-soft:#1B3146;
    --sun:#F0965A; --sun-ink:#261205; --sun-soft:#3C2716;
    --good:#6CCB94; --good-soft:#16382A; --bad:#F2897A; --bad-soft:#3E211C;
    --water:#5CC3BE; --water-soft:#1A4442; --land:#3A3727; --soil:#5A4A36;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E141A; --surface:#161F28; --sunk:#121A22; --ink:#E2E9F0; --muted:#98A7B5; --line:#26323D; --line-2:#3A4A59;
  --moss:#7DB4E3; --moss-ink:#0A1622; --moss-soft:#1B3146;
  --sun:#F0965A; --sun-ink:#261205; --sun-soft:#3C2716;
  --good:#6CCB94; --good-soft:#16382A; --bad:#F2897A; --bad-soft:#3E211C;
  --water:#5CC3BE; --water-soft:#1A4442; --land:#3A3727; --soil:#5A4A36;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding-block:20px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Home */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding-block:12px 22px;border-bottom:2px solid var(--ink)}
.hero h1{font-size:clamp(40px,8vw,64px);font-weight:800;letter-spacing:-.02em}
.hero .lede{margin:10px 0 0;color:var(--muted);max-width:56ch}
.mini{width:140px;height:auto}
.mini text{font-family:var(--f-mono);font-size:9px;fill:var(--muted)}
@media (max-width:560px){.hero{grid-template-columns:1fr}.mini{display:none}}
.section{margin-top:28px;display:grid;gap:12px}
.section > h2{font-size:24px;font-weight:800}
.resume{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--sun-soft);border:2px solid var(--sun);border-radius:10px;padding:14px 16px}
.resume p{margin:0;min-width:0}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:600px){.modes{grid-template-columns:1fr}}
.mode{display:grid;gap:6px;align-content:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;min-width:0}
.mode:hover{border-color:var(--moss)}
.mode h3{font-size:21px;font-weight:800}
.mode p{margin:0;color:var(--muted);font-size:15px}
.mode .meta{font-family:var(--f-mono);font-size:12px;color:var(--moss);letter-spacing:.04em;text-transform:uppercase}
.mode.primary{grid-column:1/-1;background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}
.mode.primary p,.mode.primary .meta{color:var(--moss-ink);opacity:.9}
.mode.wide{grid-column:1/-1}
.mode[disabled]{opacity:.5;cursor:not-allowed}
.topicbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-2);background:var(--sunk);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}
.setting{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.setting p{margin:0;font-size:15px;color:var(--muted)}
.setting strong{color:var(--ink)}
.switch{flex:none;width:48px;height:28px;border-radius:999px;border:0;background:var(--line-2);position:relative;cursor:pointer;margin-top:2px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--moss)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* History */
.hist{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:16px;min-width:0}
.hist-empty{color:var(--muted);margin:0}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{stroke:var(--moss);stroke-width:2.5;fill:none}
.chart .ar{fill:var(--moss-soft)}
.chart .pt{fill:var(--surface);stroke:var(--moss);stroke-width:2.5}
.chart .pt.last{fill:var(--moss)}
.chart .pass{stroke:var(--sun);stroke-dasharray:4 4;stroke-width:1.5}
.chart .lbl{fill:var(--ink);font-weight:700}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-family:var(--f-mono);font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.hi{background:var(--good-soft);color:var(--good)}
.pill.mid{background:var(--sun-soft);color:var(--ink)}
.pill.lo{background:var(--bad-soft);color:var(--bad)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:10px;align-items:center;font-size:15px}
.bar .track{height:10px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;background:var(--moss)}
.bar .fill.lo{background:var(--bad)}
.bar .fill.mid{background:var(--sun)}
.bar .v{font-family:var(--f-mono);font-size:13px;text-align:right}
@media (max-width:480px){.bar{grid-template-columns:minmax(0,1fr) 80px 44px}}
.hist-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.hist-head h3{font-size:18px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px;padding:0}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}

/* Buttons */
.btn{border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--moss);color:var(--moss-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.small{padding:8px 12px;font-size:14px}

/* Test */
.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.bar-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar-row .count{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.prog{height:8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.prog > div{height:100%;background:var(--moss);transition:width .25s}
.card{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:16px;min-width:0}
@media (max-width:480px){.card{padding:16px}}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--moss-soft);color:var(--ink)}
.tag.src{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.tag.sa{background:var(--sun-soft);color:var(--ink)}
.qtext{font-size:21px;line-height:1.35;font-weight:700;margin:0;text-wrap:pretty}
.qhint{margin:-6px 0 0;color:var(--muted);font-size:15px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--sunk);border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:52px}
.opt:hover:not([disabled]){border-color:var(--moss)}
.opt .k{font-family:var(--f-mono);font-weight:700;font-size:13px;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--surface)}
.opt.sel{border-color:var(--moss);background:var(--moss-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.actions .spacer{flex:1}
.fb{border-radius:10px;padding:14px 16px;display:grid;gap:8px}
.fb.ok{background:var(--good-soft);border:1px solid var(--good)}
.fb.no{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.part{background:var(--sun-soft);border:1px solid var(--sun)}
.fb h4{margin:0;font-family:var(--f-display);font-size:19px}
.fb p{margin:0}
.fb .ans{font-weight:700}
.fig{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto}
.fig svg{display:block;width:100%;min-width:300px;height:auto;margin:0 auto}
.fig .bx{fill:var(--surface);stroke:var(--line-2);stroke-width:1.5}
.fig .bx2{fill:var(--moss-soft);stroke:var(--moss);stroke-width:1.5}
.fig .bx3{fill:var(--sun-soft);stroke:var(--sun);stroke-width:1.5}
.fig .tx{fill:var(--ink);font-family:var(--f-body);font-size:13px}
.fig .tx.b{font-weight:700}
.fig .tx.s{font-size:11px;fill:var(--muted)}
.fig .tx.m{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.fig .ar{stroke:var(--muted);stroke-width:1.6;fill:none}
.fig .ah{fill:var(--muted)}
.fig .ax{stroke:var(--ink);stroke-width:1.5;fill:none}
.fig .gr{stroke:var(--line-2);stroke-width:1;stroke-dasharray:4 4}
.fig .tagc{fill:var(--sun);stroke:var(--sun-ink);stroke-width:1}
.fig .tagt{fill:var(--sun-ink);font-family:var(--f-mono);font-size:13px;font-weight:700}
.fig .l1{stroke:var(--water);stroke-width:3;fill:none}
.fig .l2{stroke:var(--sun);stroke-width:3;fill:none}
.fig .l3{stroke:var(--moss);stroke-width:3;fill:none}
.fig .l4{stroke:var(--muted);stroke-width:2.5;fill:none}
.fig .gap{fill:var(--sun-soft)}
.fig .gap2{fill:var(--bad-soft)}
.fig .heat{stroke:var(--bad);stroke-width:2.5;fill:none;stroke-dasharray:7 4}
.fig .sunc{fill:var(--sun)}
.fig .dashl{stroke-dasharray:8 5}
.fig .band{fill:var(--surface);opacity:.55}
.fig .pm{fill:var(--moss)} .fig .pf{fill:var(--water)}
.fig .lvl{stroke:var(--ink);stroke-width:1.2}
.fig .v1{fill:var(--water-soft)} .fig .v2{fill:var(--moss-soft)} .fig .v3{fill:var(--land)} .fig .v4{fill:var(--sun-soft)}
.fig table{width:auto;min-width:100%;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.fig th{font-size:10px;white-space:nowrap;padding:6px 8px}
.fig td{padding:7px 8px;font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.fig td:first-child{font-family:var(--f-body);font-weight:700;font-size:14px}
.figcap{font-size:13px;color:var(--muted);margin:6px 2px 0}

/* match */
.mterms{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);padding-block:10px;margin-block:-10px;border-bottom:1px solid var(--line)}
.mterms:empty{display:none}
.mterm{border:2px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
.mterm.sel{border-color:var(--sun);background:var(--sun-soft)}
.mterm.used{opacity:.35}
.mdefs{display:grid;gap:10px}
.mdef{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;text-align:left;background:var(--sunk);border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.mdef:hover:not([disabled]){border-color:var(--moss)}
.mdef .slot{justify-self:start;font-weight:700;font-size:14px;border-radius:6px;padding:3px 10px;border:1px dashed var(--line-2);color:var(--muted)}
.mdef .slot.filled{border:1px solid var(--moss);background:var(--moss-soft);color:var(--ink)}
.mdef.right{border-color:var(--good);background:var(--good-soft)}
.mdef.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mdef .fix{font-size:14px;color:var(--bad);font-weight:700}
.mdef[disabled]{cursor:default}

/* short answer */
.sa{display:grid;gap:6px}
.sa textarea{width:100%;min-height:132px;font:inherit;font-size:17px;line-height:1.45;padding:12px 14px;border-radius:10px;border:2px solid var(--line-2);background:var(--surface);color:var(--ink);resize:vertical}
.sa textarea.right{border-color:var(--good)}
.sa textarea.part{border-color:var(--sun)}
.sa textarea.wrong{border-color:var(--bad)}
.sa textarea:disabled{opacity:1;background:var(--sunk)}
.sa .wc{font-family:var(--f-mono);font-size:12px;color:var(--muted);justify-self:end}
.ideas{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.idea{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:start}
.idea .mk{font-family:var(--f-mono);font-weight:700;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;margin-top:1px}
.idea.hit .mk{background:var(--good);color:var(--surface)}
.idea.nohit .mk{background:var(--bad);color:var(--surface)}
.idea.skip{color:var(--muted)}
.idea.skip .mk{background:var(--line);color:var(--muted)}
.idea.claimed .mk{background:var(--sun);color:var(--sun-ink)}
.claim{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:13px;cursor:pointer;white-space:nowrap}
.model{background:var(--surface);border:1px dashed var(--line-2);border-radius:8px;padding:10px 12px}
.model b{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;display:block;margin-bottom:2px}

/* Study sheet */
.mode.stagecard{border-color:var(--sun);background:linear-gradient(135deg,var(--sun-soft),var(--surface) 70%)}
.mode.stagecard .meta{color:var(--ink)}
.sheethead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sheettabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.sheettabs button{border:0;background:none;border-radius:7px;padding:8px 14px;font-weight:700;font-size:15px;cursor:pointer;color:var(--muted)}
.sheettabs button[aria-selected="true"]{background:var(--moss);color:var(--moss-ink)}
.sheettitle{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.01em}
.lede2{margin:0;color:var(--muted)}
.sheetlist{display:grid;gap:12px;margin-top:16px}
.iccard,.gcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px;min-width:0}
.iccard h3{font-size:20px;font-weight:800}
.iccard .mine{border-left:3px solid var(--line-2);padding:2px 0 2px 12px;color:var(--muted);font-style:italic}
.iccard .full{background:var(--moss-soft);border-radius:8px;padding:10px 12px}
.iccard b,.gsent b{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;font-style:normal;display:block;margin-bottom:2px;color:var(--muted)}
.gcard .ghead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.gcard h3{font-size:19px;font-weight:800}
.gdef{margin:0;font-size:17px}
.gsent{margin:0;color:var(--muted);font-size:15px}
.gsent b{display:inline;margin-right:4px}

/* Results */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;padding-block:10px 22px;border-bottom:2px solid var(--ink)}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,16vw,112px);line-height:.9;letter-spacing:-.03em}
.score p{margin:4px 0 0;color:var(--muted)}
.score h1{font-size:28px}
@media (max-width:480px){.score{grid-template-columns:1fr;gap:6px}}
.missed{display:grid;gap:10px}
.miss{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:12px 14px;display:grid;gap:4px;min-width:0}
.miss.half{border-left-color:var(--sun)}
.miss .q{font-weight:700}
.miss .yours{color:var(--bad);overflow-wrap:anywhere}
.miss .corr{color:var(--good);font-weight:700}
.miss .why{color:var(--muted);font-size:15px}
.rowbtns{display:flex;flex-wrap:wrap;gap:10px}
.quitbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head><body>

<div class="wrap" id="app"></div>

<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

/* Randomized math (new numbers every attempt; still multiple choice) */
const signed = n => (n > 0 ? "+" : n < 0 ? "−" : "") + fmt(Math.abs(n));
const uniq = (a, w) => new Set([a, ...w]).size === w.length + 1;
GEN("x1", "ic13", () => {
  let b, d, i, e, ch, w;
  do {
    b = rand(120, 480) * 100; d = rand(60, 400) * 100; i = rand(5, 90) * 100; e = rand(5, 90) * 100; ch = b + i - d - e;
    w = [b - d, b + e - d - i, b + i - d + e].map(n => `${signed(n)} people`);
  } while (!uniq(`${signed(ch)} people`, w) || i === e);
  return {t: "mc", q: `In one year, a country has ${fmt(b)} births, ${fmt(d)} deaths, ${fmt(i)} immigrants, and ${fmt(e)} emigrants. How much does its population change?`, a: `${signed(ch)} people`, w, why: `(births + immigration) − (deaths + emigration) = (${fmt(b)} + ${fmt(i)}) − (${fmt(d)} + ${fmt(e)}) = ${signed(ch)} people.`};
});
GEN("x4", "ic6", () => {
  const L = ["zooplankton", "small fish", "large fish", "fish-eating birds"];
  let s, t, c, ans, w;
  const r = n => Math.round(n * 1e6) / 1e6, u = n => `${fmt(r(n))} ppm`;
  do {
    s = rand(0, 2); t = rand(s + 1, 3); c = pick([0.002, 0.003, 0.004, 0.005, 0.01, 0.02]); const k = t - s; ans = c * Math.pow(10, k);
    w = [u(c * Math.pow(10, k - 1)), u(c * Math.pow(10, k + 1)), u(c * Math.pow(10, k + 2))];
  } while (!uniq(u(ans), w));
  return {t: "mc", q: `Mercury is found at ${fmt(c)} ppm in ${L[s]}. If its concentration increases about 10 times at each trophic level, about what will it be in ${L[t]}?`, a: u(ans), w, why: `${L.slice(s, t + 1).join(" → ")} is ${t - s} step${t - s > 1 ? "s" : ""} up: ${fmt(c)} × ${fmt(Math.pow(10, t - s))} = ${u(ans)}.`};
});

// smooth curve through key points (Catmull-Rom), returned as sampled [x, y] pairs
function spline(P, steps = 14) {
  const out = [];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(P.length - 1, i + 2)];
    for (let s = 0; s < steps; s++) {
      const t = s / steps, t2 = t * t, t3 = t2 * t;
      const f = k => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3);
      out.push([f(0), f(1)]);
    }
  }
  out.push(P[P.length - 1]);
  return out;
}
const pts = a => a.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");

/* ---------- building a test ---------- */
const BYID = Object.fromEntries(B.map(q => [q.id, q]));
const VBY = Object.fromEntries(VOCAB.map(v => [v[0], v]));
const conflict = (a, b) => CONFLICTS.some(c => (c[0] === a && c.includes(b)) || (c[0] === b && c.includes(a)));
const isSA = q => q.t === "sa";

function instance(q) {
  const base = {id: q.id, t: q.t, topic: q.topic, src: q.src || "", fig: q.fig || null, why: q.why || ""};
  if (q.t === "gen") { const g = q.fn(); return instance(Object.assign({}, g, {id: q.id, topic: q.topic, src: "New numbers each time", fig: g.fig || null})); }
  if (q.t === "mc") { const opts = q.order ? q.order.slice() : shuffle([q.a, ...q.w]); return Object.assign(base, {q: q.q, opts, ans: opts.indexOf(q.a), pts: 1}); }
  if (q.t === "tf") return Object.assign(base, {t: "mc", q: q.q, opts: ["True", "False"], ans: q.a ? 0 : 1, pts: 1});
  if (q.t === "sa") return Object.assign(base, {q: q.q, model: q.model, ideas: q.ideas, need: q.need || 0, pts: q.need || q.ideas.length});
  return base;
}
function matchItems(terms) {
  const list = shuffle(terms), n = Math.max(1, Math.ceil(list.length / 6)), rounds = Array.from({length: n}, () => []);
  const cap = Math.ceil(list.length / n);
  for (const term of list) {
    const ok = rounds.filter(rd => rd.length < cap && !rd.some(x => conflict(x, term)));
    const pool = ok.length ? ok : rounds;
    pool.reduce((m, rd) => rd.length < m.length ? rd : m, pool[0]).push(term);
  }
  return rounds.filter(r => r.length).map(r => ({id: "match", t: "match", topic: "vocab", src: "Every vocab word", q: "Match each term to its definition.", terms: shuffle(r), defs: shuffle(r), pts: r.length}));
}
function vocabMC(term) {
  const v = VBY[term];
  const near = shuffle(VOCAB.filter(x => x[0] !== term && x[2] === v[2])), far = shuffle(VOCAB.filter(x => x[0] !== term && x[2] !== v[2]));
  const opts = shuffle([term, ...[...near, ...far].slice(0, 3).map(x => x[0])]);
  return {id: "vq:" + term, t: "mc", topic: "vocab", src: "Vocab", fig: null, q: v[1], opts, ans: opts.indexOf(term), pts: 1, why: `${term}: ${v[1]}.`, vterm: term};
}
const vocabFor = terms => terms.length >= 4 ? matchItems(terms) : terms.map(vocabMC);
// multiple choice spread evenly over every topic
function spread(pool, n) {
  const byTopic = {}; for (const q of shuffle(pool)) (byTopic[q.topic] = byTopic[q.topic] || []).push(q);
  const keys = shuffle(Object.keys(byTopic)), out = [];
  while (out.length < n && keys.some(k => byTopic[k].length)) for (const k of keys) if (byTopic[k].length && out.length < n) out.push(byTopic[k].pop());
  return out;
}
function buildRun(mode, opts = {}) {
  let items = [], label = "";
  const mcs = B.filter(q => q.t === "mc" || q.t === "tf"), gens = B.filter(q => q.t === "gen"), sas = B.filter(isSA);
  const stageMC = mcs.filter(q => q.stage), otherMC = mcs.filter(q => !q.stage);
  const terms = VOCAB.map(v => v[0]);
  if (mode === "full") {
    label = "Full test";
    items = B.map(instance).concat(terms.map(vocabMC));
  } else if (mode === "practice" || mode === "quick") {
    const big = mode === "practice";
    label = big ? "Practice test" : "Quick quiz";
    // the stages of the demographic transition are a big part of the real test, so about a third of the multiple choice is stages
    const nStage = big ? 12 : 5, nMC = big ? 22 : 7, nGen = big ? 2 : 1, nSA = big ? 3 : 1, nVocab = big ? 3 : 1;
    items = [...shuffle(gens).slice(0, nGen), ...shuffle(stageMC).slice(0, nStage), ...spread(otherMC, nMC), ...spread(sas, nSA)].map(instance)
      .concat(shuffle(terms).slice(0, nVocab).map(vocabMC));
  } else if (mode === "stages") {
    label = "Stages drill";
    items = [...shuffle(stageMC).slice(0, 30), ...shuffle(sas.filter(q => q.stage)).slice(0, 1)].map(instance);
  } else if (mode === "sa") {
    label = "Short answers";
    items = sas.map(instance);
  } else if (mode === "vocab") {
    label = "Vocab match";
    items = matchItems(terms);
  } else if (mode === "topics") {
    const ts = opts.topics;
    label = ts.length === 1 ? TOPICS[ts[0]] : `I Can statements (${ts.length})`;
    items = B.filter(q => ts.includes(q.topic)).map(instance).concat(vocabFor(VOCAB.filter(v => ts.includes(v[2])).map(v => v[0])));
  } else if (mode === "missed") {
    label = "Missed questions";
    const ids = opts.missed || [];
    const missedTerms = [...new Set(ids.filter(id => id.startsWith("v:")).map(id => id.slice(2)).filter(t => VBY[t]))];
    items = ids.filter(id => BYID[id]).map(id => instance(BYID[id])).concat(vocabFor(missedTerms));
  }
  // short answers go last, like the written section of a real test
  if (mode !== "vocab") items = [...shuffle(items.filter(it => !isSA(it))), ...shuffle(items.filter(isSA))];
  return {id: uid(), mode, label, study: S.study, items, resp: [], res: [], i: 0, started: Date.now(), elapsed: 0};
}

/* ---------- short-answer grading ----------
   Each idea is a list of cues; the idea counts when any cue is found in the answer.
   "a|b|c"  any of these (each word matches by its start, so "decreas" matches decrease/decreasing; "ph=" must match exactly)
   "x ~ y"  x and y in the same part of a sentence: y within 6 words after x ("death rates fall"), or right before it ("falling death rates")
   "x & y"  both somewhere in the answer */
const NEG = new Set(["not", "no", "never", "isnt", "arent", "dont", "doesnt", "didnt", "wont", "cant", "cannot", "without", "hardly"]);
const CONJ = new Set([",", "and", "or", "but", "while", "whereas", "however", "although", "though", "so", "because", "since", "then", "yet"]);
const RATE_NOUN = /^(birth|births|death|deaths|fertility|mortality)$/;
const saNorm = s => String(s).toLowerCase().replace(/[’‘`]/g, "'").replace(/'/g, "").replace(/₂/g, "2").replace(/₃/g, "3").replace(/\bh\s*[+⁺]/g, " hion ").replace(/,/g, " , ").replace(/[^a-z0-9, ]+/g, " ").replace(/\s+/g, " ").trim();
const toks = s => saNorm(s).split(" ").filter(Boolean);
const cueCache = new Map();
function parseSide(side) {
  return side.split("|").map(alt => alt.trim().split(/\s+/).flatMap(raw => { const ex = raw.endsWith("="); return toks(raw.replace(/=$/, "")).filter(t => t !== ",").map(t => ({t, ex: ex || /^\d+$/.test(t)})); })).filter(a => a.length);
}
function parseCue(c) {
  if (!cueCache.has(c)) cueCache.set(c, c.split(" & ").map(part => part.split(" ~ ").map(parseSide)));
  return cueCache.get(c);
}
const altLen = (T, i, alt) => { for (let k = 0; k < alt.length; k++) { const w = T[i + k]; if (w === undefined || (alt[k].ex ? w !== alt[k].t : !w.startsWith(alt[k].t))) return 0; } return alt.length; };
const sideAt = (T, i, side) => { for (const alt of side) { const l = altLen(T, i, alt); if (l) return l; } return 0; };
const negated = (T, k) => [T[k - 1], T[k - 2]].some(w => w && NEG.has(w)) && !CONJ.has(T[k - 1]);
function pairIn(T, A, Bs) {
  for (let a = 0; a < T.length; a++) {
    const la = sideAt(T, a, A); if (!la) continue;
    let j = a + la;
    if ((T[j] === "and" || T[j] === "or") && RATE_NOUN.test(T[j + 1] || "")) j += 2;
    for (let k = j; k < Math.min(T.length, j + 7); k++) { if ((T[k] === "and" || T[k] === "or") && RATE_NOUN.test(T[k + 1] || "")) { k++; continue; } if (CONJ.has(T[k])) break; if (sideAt(T, k, Bs) && !negated(T, k)) return true; }
    let i = a - 1;
    if (i >= 1 && (T[i] === "and" || T[i] === "or") && RATE_NOUN.test(T[i - 1])) i -= 2;
    for (let c = 0; c < 2 && i >= 0; c++, i--) { if (CONJ.has(T[i])) break; if (sideAt(T, i, Bs) && !negated(T, i)) return true; }
  }
  return false;
}
function cueHit(cue, text) {
  const all = toks(text), clauses = String(text).split(/[;!?\n]+|\.(?!\d)/).map(toks).filter(t => t.length);
  return parseCue(cue).every(part => part.length === 1
    ? all.some((w, i) => sideAt(all, i, part[0]))
    : clauses.some(T => pairIn(T, part[0], part[1])));
}
function gradeSA(it, text, claimed = []) {
  const words = toks(text).filter(w => w !== ",");
  const parts = it.ideas.map(idea => words.length >= 3 && idea.slice(1).some(c => cueHit(c, text)));
  const n = parts.filter((p, k) => p || claimed.includes(k)).length, earned = Math.min(it.pts, n);
  const missing = it.ideas.filter((idea, k) => !parts[k] && !claimed.includes(k)).map(idea => idea[0]);
  return {earned, possible: it.pts, ok: earned === it.pts, parts, claimed: claimed.slice(), given: String(text).trim(), correct: it.model, missing: earned === it.pts ? [] : missing};
}

/* ---------- grading ---------- */
function grade(it, r) {
  switch (it.t) {
    case "mc": { const ok = r === it.ans; return {earned: ok ? 1 : 0, possible: 1, ok, given: it.opts[r], correct: it.opts[it.ans], missedTerms: !ok && it.vterm ? [it.vterm] : []}; }
    case "sa": return gradeSA(it, r);

function hintFor(it) {

}
function initResp(it) {

}
function bodyFor(it) {

  if (it.t === "sa") return `<div class="sa"><textarea id="saIn" rows="5" autocomplete="off" aria-label="Your answer" placeholder="Type your answer…"></textarea><span class="wc" id="wc"></span></div>`;

}

}
function saFeedback(it, res, run) {

    const hit = res.parts[k], cl = (res.claimed || []).includes(k), cls = hit ? "hit" : cl ? "claimed" : res.ok ? "skip" : "nohit";
    const btn = !hit && cl ? `<button class="claim" data-unclaim="${k}">Undo</button>` : !hit && canClaim ? `<button class="claim" data-claim="${k}">I said this</button>` : "";
    return `<li class="idea ${cls}"><span class="mk" aria-hidden="true">${hit || cl ? "✓" : res.ok ? "·" : "✗"}</span><span>${esc(idea[0])}${hit ? "" : cl ? " <span style=\"color:var(--muted)\">(you marked this)</span>" : ""}</span>${btn}</li>`;
  }).join("");
  return `<p>${it.need ? `Any ${it.need} of these earn full credit:` : "Key ideas the grader looked for:"}</p><ul class="ideas">${list}</ul>
    <div class="model"><b>Model answer</b>${esc(it.model)}</div>${it.why ? `<p>${esc(it.why)}</p>` : ""}
    ${it.ideas.some((x, k) => !res.parts[k]) && run.study ? `<p style="font-size:14px;color:var(--muted)">The grader looks for key words. If it missed an idea you really explained, tap “I said this.”</p>` : ""}`;

function paint() {

function submit() {

/* ---------- results ---------- */
function finish() {
  const run = S.run;
  const earned = run.res.reduce((a, r) => a + (r ? r.earned : 0), 0), possible = run.items.reduce((a, it) => a + it.pts, 0);
  const topics = {}, missed = [];
  run.items.forEach((it, k) => {
    const r = run.res[k]; const tp = it.topic;
    topics[tp] = topics[tp] || [0, 0]; topics[tp][0] += r ? r.earned : 0; topics[tp][1] += it.pts;
    if (!r || !r.ok) { if (it.t === "match") (r ? r.missedTerms : it.defs).forEach(t => missed.push("v:" + t)); else if (it.vterm) missed.push("v:" + it.vterm); else missed.push(it.id); }
  });
  const entry = {id: run.id, at: Date.now(), mode: run.label, study: run.study, earned, possible, pct: possible ? Math.round(100 * earned / possible) : 0, secs: Math.round(run.elapsed / 1000), topics, missed: [...new Set(missed)]};
  if (!S.history.some(h => h.id === entry.id)) S.history.push(entry);
  persistHistory();
  S.last = run; S.run = null; S.paused = null; saveRun();
  renderResults(run, entry);
}
function renderResults(run, entry) {
  S.view = "results";
  const letter = entry.pct >= 90 ? "A" : entry.pct >= 80 ? "B" : entry.pct >= 70 ? "C" : entry.pct >= 60 ? "D" : "F";
  const tb = Object.entries(entry.topics).map(([k, v]) => [k, v, Math.round(100 * v[0] / v[1])]).sort((a, b) => a[2] - b[2]);
  const misses = run.items.map((it, k) => [it, run.res[k]]).filter(([it, r]) => r && !r.ok);
  const missHtml = misses.map(([it, r]) => {
    if (it.t === "sa") return `<div class="miss${r.earned > 0 ? " half" : ""}"><span class="q">${esc(it.q)}</span><span class="yours">You (${r.earned}/${r.possible}): ${esc(r.given || "(blank)")}</span><span class="corr">Missing: ${esc(r.missing.join("; "))}</span><span class="why">Model answer: ${esc(it.model)}</span></div>`;
    const q = it.t === "match" ? "Vocab matching round" : it.vterm ? `Definition: ${it.q}` : it.q;
    return `<div class="miss"><span class="q">${esc(q)}</span><span class="yours">You: ${esc(r.given || "(blank)")}</span><span class="corr">${it.t === "match" ? "Fix: " : "Answer: "}${esc(r.correct)}</span>${it.why && it.t !== "match" ? `<span class="why">${esc(it.why)}</span>` : ""}</div>`;
  }).join("");
  const prev = S.history.filter(h => h.id !== entry.id && h.mode === entry.mode).pop();
  app.innerHTML = `
  <section class="score">
    <div class="big num">${entry.pct}%</div>
    <div><p class="eyebrow">${esc(entry.mode)} · grade ${letter}</p><h1>${entry.pct >= 90 ? "You're ready." : entry.pct >= 80 ? "Strong. Clean up the misses below." : entry.pct >= 70 ? "Passing, but review the weak topics." : "Keep studying. Start with the weakest topic."}</h1>
    <p class="num">${fmt(entry.earned)} of ${fmt(entry.possible)} points · ${Math.max(1, Math.round(entry.secs / 60))} min${prev ? ` · last time ${prev.pct}% (${entry.pct - prev.pct >= 0 ? "+" : ""}${entry.pct - prev.pct})` : ""}</p></div>
  </section>
  <section class="section"><h2>By topic</h2><div class="hist"><div class="bars">${tb.map(([k, v, p]) => `<div class="bar"><span>${esc(TOPICS[k] || "Glossary vocab")}</span><span class="track"><span class="fill ${pctCls(p) === "hi" ? "" : pctCls(p)}" style="display:block;width:${p}%"></span></span><span class="v">${p}%</span></div>`).join("")}</div></div></section>
  <div class="rowbtns" style="margin-top:20px">${entry.missed.length ? `<button class="btn sun" data-act="redo">Redo what I missed</button>` : ""}<button class="btn" data-act="home">Back to start</button></div>
  <section class="section"><h2>${misses.length ? `What you missed (${misses.length})` : "You missed nothing."}</h2><div class="missed">${missHtml}</div></section>`;
  window.scrollTo({top: 0});
}

/* ---------- history persistence (browser + your account when available) ---------- */
function trimHistory(H) { H = H.slice().sort((a, b) => a.at - b.at).slice(-200); return H.map((h, i) => i < H.length - 10 ? Object.assign({}, h, {missed: []}) : h); }
let cloudBusy = Promise.resolve();
function persistHistory() {
  S.history = trimHistory(S.history);
  store.set("hi3.history", S.history);
  if (S.cloud) { const data = {attempts: S.history}; cloudBusy = cloudBusy.then(() => S.cloud.set(data)).catch(() => {}); }
}
async function initCloud() {
  try {
    const c = window.claude; if (!c || !c.use) return;
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc("data/users/" + id + "/history");
    const snap = await ref.get();
    const remote = snap.exists ? (snap.data().attempts || []) : [];
    const byId = new Map(); for (const h of [...remote, ...S.history]) byId.set(h.id, h);
    const merged = trimHistory([...byId.values()]);
    const changed = merged.length !== remote.length;
    S.cloud = ref; S.history = merged; store.set("hi3.history", merged);
    if (changed) await ref.set({attempts: merged});
    if (S.view === "home") renderHome();
  } catch (e) { S.cloud = null; }
}

/* ---------- events ---------- */
function startRun(run) { S.run = run; S.paused = null; S.confirmQuit = false; if (!S.run.items.length) { S.run = null; return; } saveRun(); renderTest(); window.scrollTo({top: 0}); }
app.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t || t.disabled) return;
  if (t.dataset.start) {
    const mode = t.dataset.start, opts = {};
    if (mode === "missed") { const lm = [...S.history].reverse().find(h => h.missed && h.missed.length); if (!lm) return; opts.missed = lm.missed; }
    if (mode === "topics") opts.topics = S.topics.slice();
    startRun(buildRun(mode, opts)); return;
  }
  if (t.dataset.topic) { const k = t.dataset.topic; S.topics = S.topics.includes(k) ? S.topics.filter(x => x !== k) : [...S.topics, k]; store.set("hi3.topics", S.topics); renderHome(); return; }
  if (t.id === "studySwitch") { S.study = !S.study; store.set("hi3.study", S.study); renderHome(); document.getElementById("studySwitch").focus(); return; }
  const act = t.dataset.act;
  if (act === "sheet") { S.sheetTab = S.sheetTab || "ican"; renderSheet(); window.scrollTo({top: 0}); return; }
  if (t.dataset.sheettab) { S.sheetTab = t.dataset.sheettab; renderSheet(); return; }
  if (t.dataset.icpractice) { startRun(buildRun("topics", {topics: [t.dataset.icpractice]})); return; }
  if (act === "resume") { S.run = store.get("hi3.run", null) || S.paused; S.paused = null; if (S.run) { renderTest(); window.scrollTo({top: 0}); } return; }
  if (act === "discard") { S.run = null; S.paused = null; saveRun(); renderHome(); return; }
  if (act === "clear") { S.confirmClear = true; renderHome(); return; }
  if (act === "clear-no") { S.confirmClear = false; renderHome(); return; }
  if (act === "clear-yes") { S.confirmClear = false; S.history = []; persistHistory(); renderHome(); return; }
  if (act === "home") { renderHome(); window.scrollTo({top: 0}); return; }
  if (act === "redo") { const lm = S.history[S.history.length - 1]; startRun(buildRun("missed", {missed: lm.missed})); return; }
  if (act === "quit") { S.confirmQuit = true; renderTestKeep(); return; }
  if (act === "quit-no") { S.confirmQuit = false; renderTestKeep(); return; }
  if (act === "quit-yes") { S.confirmQuit = false; saveRun(); S.paused = S.run; S.run = null; renderHome(); window.scrollTo({top: 0}); return; }
  if (act === "check" || act === "submit") { submit(); return; }
  if (act === "next") { next(); return; }
  if (!S.run || S.view !== "test") return;
  if (t.dataset.claim !== undefined) { claim(+t.dataset.claim, true); return; }
  if (t.dataset.unclaim !== undefined) { claim(+t.dataset.unclaim, false); return; }
  const it = S.run.items[S.run.i]; if (S.run.res[S.run.i]) return;
  if (t.classList.contains("opt")) { cur = +t.dataset.k; if (S.run.study) submit(); else paint(); return; }
  if (t.dataset.mt !== undefined) {
    const term = t.dataset.mt; const at = cur.map.indexOf(term);
    if (at >= 0) { cur.map[at] = null; cur.sel = term; }
    else cur.sel = cur.sel === term ? null : term;
    paint(); return;
  }
  if (t.dataset.md !== undefined) {
    const k = +t.dataset.md;
    if (cur.sel) { const prevAt = cur.map.indexOf(cur.sel); if (prevAt >= 0) cur.map[prevAt] = null; cur.map[k] = cur.sel; cur.sel = null; }
    else if (cur.map[k]) cur.map[k] = null;
    paint(); return;
  }
});
function renderTestKeep() { const keep = cur; const wasRevealed = !!S.run.res[S.run.i]; renderTest(); if (!wasRevealed) { cur = keep; paint(); } }
app.addEventListener("input", e => {
  if (!S.run || S.view !== "test") return;
  if (e.target.id === "saIn") {
    cur = e.target.value;
    const b = document.querySelector('[data-act="check"],[data-act="submit"]'); if (b) b.disabled = !complete(S.run.items[S.run.i]);
    const wc = document.getElementById("wc"); if (wc) { const n = wordCount(cur); wc.textContent = n ? `${n} word${n === 1 ? "" : "s"}` : ""; }
  }
});
document.addEventListener("keydown", e => {
  if (S.view !== "test" || !S.run || e.altKey) return;
  const it = S.run.items[S.run.i], res = S.run.res[S.run.i], mod = e.ctrlKey || e.metaKey, inText = e.target.tagName === "TEXTAREA";
  if (e.key === "Enter") {
    if (inText && !mod) return;
    if (mod && !inText) return;
    if (e.target.tagName === "BUTTON" && !e.target.matches('[data-act="next"],[data-act="check"],[data-act="submit"]')) return;
    e.preventDefault();
    if (res) next(); else submit();
    return;
  }
  if (mod) return;
  if (!res && it.t === "mc" && /^[1-9]$/.test(e.key) && !inText && e.target.tagName !== "INPUT") { const k = +e.key - 1; if (k < it.opts.length) { cur = k; if (S.run.study) submit(); else paint(); } }
});

/* ---------- boot ---------- */
function boot(data) {
  if (data && data.run) S.run = data.run;
  if (data && data.view === "test" && S.run) renderTest(); else renderHome();
  initCloud();
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({run: S.run, view: S.view}));
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
</body></html>
