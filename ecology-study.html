<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Unit 2 Ecology Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one study column (max 780px). Home = start cards + score history; a test shows one question card at a time under a sticky progress bar. */
:root{
  --paper:#EEF3EC; --surface:#FFFFFF; --sunk:#F6F9F4; --ink:#16241C; --muted:#53655A; --line:#D3DDD5; --line-2:#AFC0B4;
  --moss:#2D6A4B; --moss-ink:#FFFFFF; --moss-soft:#DCEDE2;
  --sun:#E2A428; --sun-ink:#2A1E05; --sun-soft:#FBEFD2;
  --good:#1E7A49; --good-soft:#DCF1E3; --bad:#B53F2E; --bad-soft:#F8E0DA;
  --sky:#E6F1F7; --water:#2F72A6; --water-soft:#BFDCEF; --land:#CFDDB8; --soil:#B79A73; --cloud:#FFFFFF;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1813; --surface:#17231C; --sunk:#132019; --ink:#E2ECE5; --muted:#9BB0A3; --line:#2A3A30; --line-2:#3F5547;
    --moss:#74C69B; --moss-ink:#0C1A12; --moss-soft:#1E3529;
    --sun:#EDB64B; --sun-ink:#231803; --sun-soft:#3A2E14;
    --good:#6CCB94; --good-soft:#16382A; --bad:#F2897A; --bad-soft:#3E211C;
    --sky:#14232C; --water:#7CB8E4; --water-soft:#1F4560; --land:#2B3B26; --soil:#4A3C2A; --cloud:#3A4A55;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1813; --surface:#17231C; --sunk:#132019; --ink:#E2ECE5; --muted:#9BB0A3; --line:#2A3A30; --line-2:#3F5547;
  --moss:#74C69B; --moss-ink:#0C1A12; --moss-soft:#1E3529;
  --sun:#EDB64B; --sun-ink:#231803; --sun-soft:#3A2E14;
  --good:#6CCB94; --good-soft:#16382A; --bad:#F2897A; --bad-soft:#3E211C;
  --sky:#14232C; --water:#7CB8E4; --water-soft:#1F4560; --land:#2B3B26; --soil:#4A3C2A; --cloud:#3A4A55;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding-block:20px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Home */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding-block:12px 22px;border-bottom:2px solid var(--ink)}
.hero h1{font-size:clamp(40px,8vw,64px);font-weight:800;letter-spacing:-.02em}
.hero .lede{margin:10px 0 0;color:var(--muted);max-width:56ch}
.pyr{width:132px;height:auto}
.pyr text{font-family:var(--f-mono);font-size:10px;fill:var(--ink)}
@media (max-width:560px){.hero{grid-template-columns:1fr}.pyr{display:none}}
.section{margin-top:28px;display:grid;gap:12px}
.section > h2{font-size:24px;font-weight:800}
.resume{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--sun-soft);border:2px solid var(--sun);border-radius:10px;padding:14px 16px}
.resume p{margin:0;min-width:0}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:600px){.modes{grid-template-columns:1fr}}
.mode{display:grid;gap:6px;align-content:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer;min-width:0}
.mode:hover{border-color:var(--moss)}
.mode h3{font-size:21px;font-weight:800}
.mode p{margin:0;color:var(--muted);font-size:15px}
.mode .meta{font-family:var(--f-mono);font-size:12px;color:var(--moss);letter-spacing:.04em;text-transform:uppercase}
.mode.primary{grid-column:1/-1;background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}
.mode.primary p,.mode.primary .meta{color:var(--moss-ink);opacity:.9}
.mode[disabled]{opacity:.5;cursor:not-allowed}
.topicbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-2);background:var(--sunk);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}
.setting{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.setting p{margin:0;font-size:15px;color:var(--muted)}
.setting strong{color:var(--ink)}
.switch{flex:none;width:48px;height:28px;border-radius:999px;border:0;background:var(--line-2);position:relative;cursor:pointer;margin-top:2px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--moss)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* History */
.hist{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:16px;min-width:0}
.hist-empty{color:var(--muted);margin:0}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{stroke:var(--moss);stroke-width:2.5;fill:none}
.chart .ar{fill:var(--moss-soft)}
.chart .pt{fill:var(--surface);stroke:var(--moss);stroke-width:2.5}
.chart .pt.last{fill:var(--moss)}
.chart .pass{stroke:var(--sun);stroke-dasharray:4 4;stroke-width:1.5}
.chart .lbl{fill:var(--ink);font-weight:700}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-family:var(--f-mono);font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.hi{background:var(--good-soft);color:var(--good)}
.pill.mid{background:var(--sun-soft);color:var(--ink)}
.pill.lo{background:var(--bad-soft);color:var(--bad)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px;gap:10px;align-items:center;font-size:15px}
.bar .track{height:10px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;background:var(--moss)}
.bar .fill.lo{background:var(--bad)}
.bar .fill.mid{background:var(--sun)}
.bar .v{font-family:var(--f-mono);font-size:13px;text-align:right}
@media (max-width:480px){.bar{grid-template-columns:minmax(0,1fr) 80px 44px}}
.hist-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.hist-head h3{font-size:18px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:14px;padding:0}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}

/* Buttons */
.btn{border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--moss);color:var(--moss-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.small{padding:8px 12px;font-size:14px}

/* Test */
.bar-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.bar-row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar-row .count{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.prog{height:8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.prog > div{height:100%;background:var(--moss);transition:width .25s}
.card{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:16px;min-width:0}
@media (max-width:480px){.card{padding:16px}}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--moss-soft);color:var(--ink)}
.tag.src{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.qtext{font-size:21px;line-height:1.35;font-weight:700;margin:0;text-wrap:pretty}
.qhint{margin:-6px 0 0;color:var(--muted);font-size:15px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:center;text-align:left;background:var(--sunk);border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:52px}
.opt:hover:not([disabled]){border-color:var(--moss)}
.opt .k{font-family:var(--f-mono);font-weight:700;font-size:13px;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--surface)}
.opt.sel{border-color:var(--moss);background:var(--moss-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.actions .spacer{flex:1}
.fb{border-radius:10px;padding:14px 16px;display:grid;gap:6px}
.fb.ok{background:var(--good-soft);border:1px solid var(--good)}
.fb.no{background:var(--bad-soft);border:1px solid var(--bad)}
.fb.part{background:var(--sun-soft);border:1px solid var(--sun)}
.fb h4{margin:0;font-family:var(--f-display);font-size:19px}
.fb p{margin:0}
.fb .ans{font-weight:700}
.fig{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto}
.fig svg{display:block;width:100%;min-width:300px;height:auto;margin:0 auto}
.fig .bx{fill:var(--surface);stroke:var(--line-2);stroke-width:1.5}
.fig .bx2{fill:var(--moss-soft);stroke:var(--moss);stroke-width:1.5}
.fig .tx{fill:var(--ink);font-family:var(--f-body);font-size:13px}
.fig .tx.b{font-weight:700}
.fig .tx.s{font-size:11px;fill:var(--muted)}
.fig .ar{stroke:var(--muted);stroke-width:1.6;fill:none}
.fig .ah{fill:var(--muted)}
.fig .ax{stroke:var(--ink);stroke-width:1.5;fill:none}
.fig .gr{stroke:var(--line);stroke-width:1}
.fig .tagc{fill:var(--sun);stroke:var(--sun-ink);stroke-width:1}
.fig .tagt{fill:var(--sun-ink);font-family:var(--f-mono);font-size:13px;font-weight:700}
.fig .dot{fill:var(--moss)}
.fig .l1{stroke:var(--water);stroke-width:2.5;fill:none}
.fig .l2{stroke:var(--sun);stroke-width:2.5;fill:none}
.fig .l3{stroke:var(--moss);stroke-width:2.5;fill:none}
.fig .dash{stroke:var(--bad);stroke-width:2;stroke-dasharray:6 5}
.fig .sky{fill:var(--sky)} .fig .wat{fill:var(--water-soft)} .fig .land{fill:var(--land)} .fig .soil{fill:var(--soil)} .fig .cld{fill:var(--cloud)} .fig .sunc{fill:var(--sun)}
.fig .tree{fill:var(--moss)} .fig .trunk{fill:var(--soil)}
.fig .rain{stroke:var(--water);stroke-width:2;stroke-dasharray:3 6}
.fig .band{stroke:var(--ink);stroke-width:1.5}
.fig .b1{fill:var(--moss-soft)} .fig .b2{fill:var(--land)} .fig .b3{fill:var(--sun-soft)} .fig .b4{fill:var(--water-soft)}
.figcap{font-size:13px;color:var(--muted);margin:6px 2px 0}

/* sort */
.sortlist{display:grid;gap:10px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--sunk);border:2px solid var(--line);border-radius:10px;padding:10px 12px}
.srow.right{border-color:var(--good);background:var(--good-soft)}
.srow.wrong{border-color:var(--bad);background:var(--bad-soft)}
.srow .it{min-width:0}
.srow .fix{display:block;font-size:13px;color:var(--bad);font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.seg button{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--moss);color:var(--moss-ink);border-color:var(--moss)}
.seg button[disabled]{cursor:default}
@media (max-width:560px){.srow{grid-template-columns:1fr}.seg{justify-content:flex-start}}

/* match */
.mterms{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);padding-block:10px;margin-block:-10px;border-bottom:1px solid var(--line)}
.mterms:empty{display:none}
.mterm{border:2px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
.mterm.sel{border-color:var(--sun);background:var(--sun-soft)}
.mterm.used{opacity:.35}
.mdefs{display:grid;gap:10px}
.mdef{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;text-align:left;background:var(--sunk);border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.mdef:hover:not([disabled]){border-color:var(--moss)}
.mdef.sel{border-color:var(--sun)}
.mdef .slot{justify-self:start;font-weight:700;font-size:14px;border-radius:6px;padding:3px 10px;border:1px dashed var(--line-2);color:var(--muted)}
.mdef .slot.filled{border:1px solid var(--moss);background:var(--moss-soft);color:var(--ink)}
.mdef.right{border-color:var(--good);background:var(--good-soft)}
.mdef.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mdef .fix{font-size:14px;color:var(--bad);font-weight:700}
.mdef[disabled]{cursor:default}

/* order */
.oseq{display:grid;gap:8px;min-height:52px;background:var(--sunk);border:2px dashed var(--line-2);border-radius:10px;padding:10px}
.oseq .ph{color:var(--muted);font-size:15px;margin:auto 0}
.oitem{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer}
.oitem .k{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--muted)}
.oitem.right{border-color:var(--good);background:var(--good-soft)}
.oitem.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opool{display:grid;gap:8px}

/* label */
.lrows{display:grid;gap:10px}
.lrow{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center}
.lrow .k{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--sun);color:var(--sun-ink);font-family:var(--f-mono);font-weight:700}
.lrow select{width:100%;font:inherit;padding:10px;border-radius:8px;border:2px solid var(--line-2);background:var(--surface);color:var(--ink)}
.lrow select.right{border-color:var(--good);background:var(--good-soft)}
.lrow select.wrong{border-color:var(--bad);background:var(--bad-soft)}
.lrow .fix{grid-column:2;font-size:14px;color:var(--bad);font-weight:700;margin-top:-4px}

/* typed */
.inrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.inrow input{font:inherit;font-size:20px;padding:10px 12px;border-radius:8px;border:2px solid var(--line-2);background:var(--surface);color:var(--ink);width:min(100%,320px)}
.inrow input.right{border-color:var(--good);background:var(--good-soft)}
.inrow input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.inrow .unit{color:var(--muted)}

/* Results */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;padding-block:10px 22px;border-bottom:2px solid var(--ink)}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,16vw,112px);line-height:.9;letter-spacing:-.03em}
.score p{margin:4px 0 0;color:var(--muted)}
.score h1{font-size:28px}
@media (max-width:480px){.score{grid-template-columns:1fr;gap:6px}}
.missed{display:grid;gap:10px}
.miss{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:12px 14px;display:grid;gap:4px;min-width:0}
.miss .q{font-weight:700}
.miss .yours{color:var(--bad)}
.miss .corr{color:var(--good);font-weight:700}
.miss .why{color:var(--muted);font-size:15px}
.rowbtns{display:flex;flex-wrap:wrap;gap:10px}
.quitbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const fmt = n => Number(n).toLocaleString("en-US", {maximumFractionDigits: 4});
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

const TOPICS = {
  levels: "Levels of organization & Earth systems",
  factors: "Biotic & abiotic factors",
  cycles: "Biogeochemical cycles",
  energy: "Energy flow & food webs",
  pyramids: "Ecological pyramids & the 10% rule",
  interactions: "Species interactions",
  populations: "Population density, distribution & growth",
  limits: "Carrying capacity & limiting factors",
  keystone: "Keystone species & biodiversity"
};

/* ---------- vocabulary (every term) ---------- */
// [term, definition, topic, extra accepted spellings for typing]
const VOCAB = [
  ["Autotroph", "An organism that captures energy from sunlight or chemicals and uses it to make its own food from inorganic compounds", "energy", ["autotrophs", "producer", "producers"]],
  ["Herbivore", "An animal that feeds mainly or only on plants, algae, and other photosynthetic organisms", "energy", ["herbivores"]],

MC("e1", "energy", "\"Photosynthesis\" literally means…", "To make with light", ["To eat with chemicals", "Self-nourishment", "To break down debris"], "Photo = light, synthesis = to make.", R);
MC("e2", "energy", "Bacteria at deep-sea hydrothermal vents make sugar using energy from chemicals like hydrogen sulfide. This process is…", "Chemosynthesis", ["Photosynthesis", "Cellular respiration", "Decomposition"], "Chemo = chemicals, synthesis = to make. No sunlight reaches the deep sea floor.", R);
MC("e3", "energy", "Break down the word \"autotroph.\"", "Auto = self, troph = nourishment: an organism that makes its own food", ["Auto = different, troph = eat: an organism that eats others", "Auto = light, troph = make: an organism that uses light", "Auto = debris, troph = eat: an organism that eats dead matter"], "Autotrophs are producers.", R);
MC("e4", "energy", "Break down the word \"heterotroph.\"", "Hetero = different, troph = nourishment: gets food by eating other organisms", ["Hetero = self, troph = nourishment: makes its own food", "Hetero = chemical, troph = make: uses chemical energy", "Hetero = debris, troph = eat: eats dead matter"], "Heterotrophs are consumers, like a bear.", R);
MC("e5", "energy", "Which of these organisms is an autotroph?", "Algae", ["A mushroom", "A bear", "A millipede"], "Algae do photosynthesis. Mushrooms are decomposers; bears and millipedes are consumers.", R);
MC("e6", "energy", "What is the difference between a DECOMPOSER and a SCAVENGER?", "Decomposers break down dead organic matter; scavengers eat dead organic matter", ["Decomposers eat living plants; scavengers eat living animals", "They are the same thing", "Scavengers make their own food; decomposers do not"], "Decomposers (fungi, bacteria) BREAK DOWN dead matter. Scavengers (vultures) EAT dead matter.", R);
MC("e7", "energy", "A millipede eating dead leaves and other debris is a…", "Detritivore", ["Producer", "Carnivore", "Herbivore"], "Detriti = debris, vore = to eat. A detritivore eats bits of dead organic matter like leaf litter.", R);
MC("e8", "energy", "Vultures feeding on a zebra that was already dead are…", "Scavengers", ["Decomposers", "Producers", "Carnivores"], "Scavengers EAT the bodies of animals that are already dead. They didn't hunt it, so it isn't predation.", R);
MC("e9", "energy", "Mushrooms and bacteria slowly breaking down a fallen log are…", "Decomposers", ["Scavengers", "Producers", "Omnivores"], "Decomposers break down dead organic matter and return nutrients to the soil.", R);
MC("e10", "energy", "Where does the energy in most ecosystems ORIGINALLY come from?", "The sun", ["Decomposers", "Water", "The soil"], "Energy usually starts with the sun, is captured by autotrophs, then consumed by heterotrophs.", R);
MC("e11", "energy", "Energy flows INTO an ecosystem as ____ and OUT of it as ____.", "Sunlight / heat", ["Heat / sunlight", "Food / oxygen", "Water / carbon dioxide"], "Energy flows in as sunlight and out as heat.", R);
MC("e12", "energy", "In a food chain or food web, which way do the arrows point?", "From the organism being eaten to the organism that eats it", ["From the predator to its prey", "From the consumer to the producer", "From the sun to the decomposer only"], "Arrows show the direction ENERGY flows: grass → rabbit means the rabbit gets energy from the grass.", R);
MC("e13", "energy", "How is a food web different from a food chain?", "A food web shows every feeding interaction; a food chain shows one path", ["A food chain shows more organisms", "A food web has no producers", "A food chain shows energy moving in both directions"], "Food chains show energy flow in one direction on one path; food webs show all the connections.", R);
MC("e14", "energy", "Grass → grasshopper → mouse → snake → hawk. What is the MOUSE?", "Secondary consumer", ["Primary consumer", "Tertiary consumer", "Producer"], "Grass = producer, grasshopper = primary, mouse = secondary, snake = tertiary.", R);
MC("e15", "energy", "Grass → grasshopper → mouse → snake → hawk. Which organism is the TERTIARY consumer?", "Snake", ["Hawk", "Mouse", "Grasshopper"], "Tertiary = third consumer level.", R);
MC("e16", "energy", "Grass → grasshopper → mouse → snake → hawk. Which organism is a HERBIVORE?", "Grasshopper", ["Mouse", "Snake", "Hawk"], "It eats a producer (grass), so it's a herbivore / primary consumer.", R);
MC("e17", "energy", "An animal that eats both plants and animals, like a bear, is a(n)…", "Omnivore", ["Herbivore", "Carnivore", "Detritivore"], "Omni = all.", R);
MC("e18", "energy", "Which trophic level has the MOST energy available?", "Producers", ["Primary consumers", "Secondary consumers", "Tertiary consumers"], "Producers are the base of the pyramid with 100% of the captured energy.", R);
MC("e19", "energy", "Why are there usually far fewer top predators than herbivores in an ecosystem?", "Less energy is available at higher trophic levels, so fewer organisms can be supported", ["Top predators reproduce faster", "Herbivores don't need energy", "Top predators get energy from the sun"], "Each step up keeps only about 10% of the energy.", R);
MC("e20", "energy", "What do photosynthesis and chemosynthesis have in common?", "Both are ways producers make sugar (food)", ["Both use sunlight", "Both happen only in the deep ocean", "Both are done by consumers"], "Photosynthesis uses light; chemosynthesis uses chemicals. Both make sugar.", R);
MC("e21", "energy", "During photosynthesis, plants take in ____ and give off ____.", "Carbon dioxide / oxygen", ["Oxygen / carbon dioxide", "Sugar / water", "Nitrogen / oxygen"], "Light energy + CO₂ + water → sugar + oxygen.", R);

MC("e23", "energy", "In this food web, what would most likely happen to the toads if the snakes disappeared?", "The toad population would increase", ["The toad population would decrease", "Nothing would change", "Toads would start eating plants"], "Snakes eat toads, so with no snakes fewer toads get eaten.", {fig: "foodweb", src: "Kahoot food web"});

MC("e25", "energy", "In this food web, if spiders disappeared, which organism would lose one of its food sources?", "Insectivorous birds", ["Rabbits", "Foxes", "Plants"], "The arrow from spiders points to insectivorous birds.", {fig: "foodweb", src: "Kahoot food web"});

/* Pyramids & 10% */
MC("p1", "pyramids", "Which pyramid shows the RELATIVE NUMBER of individual organisms at each trophic level?", "Pyramid of numbers", ["Pyramid of energy", "Pyramid of biomass", "Food web"], "A pyramid of numbers shows the relative number of individual organisms at each trophic level.", R);
MC("p2", "pyramids", "Which pyramid shows the relative amount of LIVING ORGANIC MATTER at each trophic level?", "Pyramid of biomass", ["Pyramid of numbers", "Pyramid of energy", "Food chain"], "Biomass = living organic matter (for example 1,000 kg → 100 kg → 10 kg → 1 kg).", R);
MC("p3", "pyramids", "Primary producers have 100% of the energy. About what percent reaches third-level (tertiary) consumers?", "0.1%", ["10%", "1%", "0.01%"], "100% → 10% → 1% → 0.1%.", Object.assign({order: ["10%", "1%", "0.1%", "0.01%"]}, R));
MC("p4", "pyramids", "About what percent of the producers' energy reaches SECOND-level (secondary) consumers?", "1%", ["10%", "0.1%", "90%"], "Producers 100% → primary 10% → secondary 1%.", Object.assign({order: ["90%", "10%", "1%", "0.1%"]}, R));
MC("p5", "pyramids", "A pyramid of biomass has 1,000 kg of producers. About how much herbivore biomass can it support?", "100 kg", ["1,000 kg", "10 kg", "1 kg"], "Each level is about 10% of the one below it.", Object.assign({order: ["1,000 kg", "100 kg", "10 kg", "1 kg"]}, R));
MC("p6", "pyramids", "About 10% of energy passes to the next trophic level. Where does the rest go?", "It is lost as heat and waste", ["It is stored forever in the producers", "It turns into matter", "It goes back to the sun"], "The rest is lost as heat and waste.", R);
MC("p7", "pyramids", "In this pyramid, which level contains the PRODUCERS?", "D", ["A", "B", "C"], "Producers are always the base (bottom) of the pyramid.", {fig: "pyrABCD", order: ["A", "B", "C", "D"], src: "Kahoot pyramid"});
MC("p8", "pyramids", "If this were an energy pyramid, which level would have the LEAST energy available?", "A", ["B", "C", "D"], "The top level is farthest from the producers, so it has the least energy (about 0.1%).", {fig: "pyrABCD", order: ["A", "B", "C", "D"], src: "Kahoot pyramid"});
MC("p9", "pyramids", "Treat this as an energy pyramid. Level D has 50,000 kcal of energy. About how much energy is at level B?", "500 kcal", ["5,000 kcal", "50 kcal", "25,000 kcal"], "D 50,000 → C 5,000 → B 500.", {fig: "pyrABCD", order: ["25,000 kcal", "5,000 kcal", "500 kcal", "50 kcal"], src: "Kahoot pyramid"});
MC("p10", "pyramids", "Why is an energy pyramid always wider at the bottom?", "Producers have the most energy, and energy decreases at each level up", ["There are more top predators than producers", "Energy increases as you go up", "Decomposers are at the bottom"], "About 90% is lost at each step, so each level is smaller.", R);
TF("p11", "pyramids", "If a trophic level has 1,000 kcal, the next level up will have about 100 kcal.", true, "10% of 1,000 = 100.", R);

/* Species interactions */
MC("i1", "interactions", "A bear catches and eats a salmon. This interaction is…", "Predation", ["Commensalism", "Mutualism", "Intraspecific competition"], "One organism hunts and kills another.", R);
MC("i2", "interactions", "Lions and hyenas fight over the same zebra carcass. This is…", "Interspecific competition", ["Intraspecific competition", "Mutualism", "Parasitism"], "Two DIFFERENT species competing for the same resource.", R);
MC("i3", "interactions", "Two bighorn rams butt heads over territory and mates. This is…", "Intraspecific competition", ["Interspecific competition", "Predation", "Commensalism"], "Same species competing = intraspecific (intra = within).", R);
MC("i4", "interactions", "Two goldfinches of the same species eat seeds from the same plant. What TYPE of competition is it?", "Intraspecific", ["Interspecific", "Mutualistic", "Parasitic"], "Same species → intraspecific.", R);
MC("i5", "interactions", "A plover bird picks food from between a crocodile's teeth. The bird gets food and the crocodile gets clean teeth. This is…", "Mutualism", ["Commensalism", "Parasitism", "Predation"], "Both benefit: +/+.", R);
MC("i6", "interactions", "Barnacles attach to a whale. The barnacles get a ride to food; the whale is not affected. This is…", "Commensalism", ["Mutualism", "Parasitism", "Competition"], "One benefits, one is unaffected: +/0.", R);
MC("i7", "interactions", "A tongue-eating louse replaces a fish's tongue and feeds off the fish. This is…", "Parasitism", ["Mutualism", "Commensalism", "Predation"], "The louse benefits and the fish is harmed: +/−.", R);
MC("i8", "interactions", "A spider builds its web between an antelope's horns. The spider gets a place to catch food; the antelope is unaffected. This is…", "Commensalism", ["Mutualism", "Parasitism", "Predation"], "+/0.", R);
MC("i9", "interactions", "Which symbols represent COMMENSALISM?", "+/0", ["+/+", "+/−", "−/−"], "One benefits (+), the other is unaffected (0). It can also be written 0/+.", Object.assign({order: ["+/+", "+/0", "+/−", "−/−"]}, R));
MC("i10", "interactions", "Which symbols represent PARASITISM?", "+/−", ["+/+", "+/0", "0/0"], "The parasite benefits (+), the host is harmed (−). It can also be written −/+.", Object.assign({order: ["+/+", "+/0", "+/−", "0/0"]}, R));
MC("i11", "interactions", "Which symbols represent MUTUALISM?", "+/+", ["+/0", "+/−", "−/−"], "Both organisms benefit.", Object.assign({order: ["+/+", "+/0", "+/−", "−/−"]}, R));
MC("i12", "interactions", "INTERspecific competition happens between…", "Members of different species competing for the same resource", ["Members of the same species", "A predator and its prey", "A parasite and its host"], "Inter = between (different species). Intra = within (same species).", R);
MC("i13", "interactions", "How is parasitism different from predation?", "A parasite usually feeds on its host without killing it right away; a predator kills its prey", ["A parasite always kills its host immediately", "Predators help their prey", "There is no difference"], "Predation: hunts and kills. Parasitism: one is harmed while the other benefits.", R);
MC("i14", "interactions", "Why are predator-prey relationships important in shaping communities?", "Predators keep prey populations in check, which affects other species like the plants the prey eat", ["Predators make prey populations grow without limit", "They only affect the predator", "They have no effect on plants"], "Example: wolves in Yellowstone controlled elk, so willows and aspens could regrow.", R);
MC("i15", "interactions", "Why are herbivore-plant relationships important in shaping communities?", "Herbivores control plant populations, which changes habitat and food for other species", ["Plants control herbivores by eating them", "Herbivores never affect plants", "They only matter in the ocean"], "Example: too many elk overgrazed willows along Yellowstone's rivers.", R);
SORT("s10", "interactions", "Mutualism, commensalism, or parasitism?", ["Mutualism (+/+)", "Commensalism (+/0)", "Parasitism (+/−)"],

MC("q1", "populations", "Population density measures…", "How closely packed organisms are: number of individuals per one unit of area", ["How a population is spaced out in its habitat", "How fast a population grows", "The total mass of a population"], "Density = # of individuals ÷ ONE unit of area.", R);

MC("q8", "populations", "Which TWO factors INCREASE a population's size?", "Births and immigration", ["Deaths and emigration", "Births and emigration", "Deaths and immigration"], "Births and immigration add individuals; deaths and emigration remove them.", R);

    pool.previousElementSibling.hidden = !left.length;
  }
  if (it.t === "label") card.querySelectorAll("select").forEach(sel => { const k = +sel.dataset.lk; sel.value = cur[k]; sel.disabled = !!res; sel.className = res && run.study ? (res.parts[k] ? "right" : "wrong") : ""; const row = sel.parentElement; let fx = row.querySelector(".fix"); if (res && run.study && !res.parts[k]) { if (!fx) { fx = document.createElement("span"); fx.className = "fix"; row.appendChild(fx); } fx.textContent = "Answer: " + it.blanks[k][1]; } });
  if (it.t === "match") {
    const used = new Set(cur.map.filter(Boolean));
    document.getElementById("mterms").innerHTML = res ? "" : it.terms.map(t => `<button class="mterm${cur.sel === t ? " sel" : ""}${used.has(t) ? " used" : ""}" data-mt="${esc(t)}">${esc(t)}</button>`).join("");
    document.getElementById("mdefs").innerHTML = it.defs.map((d, k) => `<button class="mdef${res && run.study ? (res.parts[k] ? " right" : " wrong") : ""}" data-md="${k}" ${res ? "disabled" : ""}><span>${esc(VBY[d][1])}</span><span class="slot${cur.map[k] ? " filled" : ""}">${cur.map[k] ? esc(cur.map[k]) : "tap to place a term"}</span>${res && run.study && !res.parts[k] ? `<span class="fix">Answer: ${esc(d)}</span>` : ""}</button>`).join("");
  }
  const fb = document.getElementById("fb");
  if (res && run.study) {
    const cls = res.ok ? "ok" : res.earned > 0 ? "part" : "no";
    const head = res.ok ? pick(["Correct", "Yes", "Got it", "Right"]) : res.earned > 0 ? `${res.earned} of ${res.possible}` : "Not quite";
    const showCorrect = !res.ok && ["mc", "num", "type", "order"].includes(it.t);
    fb.innerHTML = `<div class="fb ${cls}" role="status"><h4>${head}</h4>${showCorrect ? `<p>Answer: <span class="ans">${esc(res.correct)}</span></p>` : ""}${it.why ? `<p>${esc(it.why)}</p>` : ""}</div>`;
  } else fb.innerHTML = "";
  const actions = document.getElementById("actions");
  const last = run.i === run.items.length - 1;
  if (res) actions.innerHTML = `<span class="spacer"></span><button class="btn" data-act="next" id="nextBtn">${last ? "See my score" : "Next"}</button>`;
  else if (it.t === "mc" && run.study) actions.innerHTML = `<span class="eyebrow" style="text-transform:none;letter-spacing:0">Tip: press 1–${it.opts.length} to answer</span>`;
  else actions.innerHTML = `<span class="spacer"></span><button class="btn" data-act="${run.study ? "check" : "submit"}" ${complete(it) ? "" : "disabled"}>${run.study ? "Check answer" : last ? "Finish" : "Next"}</button>`;
}
function submit() {
  const run = S.run, it = run.items[run.i];
  if (run.res[run.i] || !complete(it)) return;
  run.elapsed += Math.min(Date.now() - qStart, 300000);
  run.resp[run.i] = it.t === "match" ? {sel: null, map: cur.map.slice()} : Array.isArray(cur) ? cur.slice() : cur;
  const r = grade(it, it.t === "match" ? cur.map : cur);
  run.res[run.i] = r;
  saveRun();
  if (!run.study) { next(); return; }
  paint();
  const nb = document.getElementById("nextBtn"); if (nb) nb.focus({preventScroll: true});
}
function next() {
  const run = S.run;
  if (run.i < run.items.length - 1) { run.i++; saveRun(); renderTest(); window.scrollTo({top: 0}); }
  else finish();
}

/* ---------- results ---------- */
function finish() {
  const run = S.run;
  const earned = run.res.reduce((a, r) => a + (r ? r.earned : 0), 0), possible = run.items.reduce((a, it) => a + it.pts, 0);
  const topics = {}, missed = [];
  run.items.forEach((it, k) => {
    const r = run.res[k]; const tp = it.topic;
    topics[tp] = topics[tp] || [0, 0]; topics[tp][0] += r ? r.earned : 0; topics[tp][1] += it.pts;
    if (!r || !r.ok) { if (it.t === "match" || it.t === "type") (r ? r.missedTerms : (it.defs || [it.term])).forEach(t => missed.push("v:" + t)); else missed.push(it.id); }
  });
  const entry = {id: run.id, at: Date.now(), mode: run.label, study: run.study, earned, possible, pct: possible ? Math.round(100 * earned / possible) : 0, secs: Math.round(run.elapsed / 1000), topics, missed: [...new Set(missed)]};
  if (!S.history.some(h => h.id === entry.id)) S.history.push(entry);
  persistHistory();
  S.last = run; S.run = null; saveRun();
  renderResults(run, entry);
}
function renderResults(run, entry) {
  S.view = "results";
  const grade = entry.pct >= 90 ? "A" : entry.pct >= 80 ? "B" : entry.pct >= 70 ? "C" : entry.pct >= 60 ? "D" : "F";
  const tb = Object.entries(entry.topics).map(([k, v]) => [k, v, Math.round(100 * v[0] / v[1])]).sort((a, b) => a[2] - b[2]);
  const misses = run.items.map((it, k) => [it, run.res[k]]).filter(([it, r]) => r && !r.ok);
  const missHtml = misses.map(([it, r]) => {
    let q = it.t === "type" ? `Definition: ${it.q}` : it.t === "match" ? "Vocab matching round" : it.q;
    return `<div class="miss"><span class="q">${esc(q)}</span><span class="yours">You: ${esc(r.given || "(blank)")}</span><span class="corr">${it.t === "match" || it.t === "sort" || it.t === "label" ? "Fix: " : "Answer: "}${esc(r.correct)}</span>${it.why && it.t !== "match" ? `<span class="why">${esc(it.why)}</span>` : ""}</div>`;
  }).join("");
  const prev = S.history.filter(h => h.id !== entry.id && h.mode === entry.mode).pop();
  app.innerHTML = `
  <section class="score">
    <div class="big num">${entry.pct}%</div>
    <div><p class="eyebrow">${esc(entry.mode)} · grade ${grade}</p><h1>${entry.pct >= 90 ? "You're ready." : entry.pct >= 80 ? "Strong. Clean up the misses below." : entry.pct >= 70 ? "Passing, but review the weak topics." : "Keep studying. Start with the weakest topic."}</h1>
    <p class="num">${fmt(entry.earned)} of ${fmt(entry.possible)} points · ${Math.max(1, Math.round(entry.secs / 60))} min${prev ? ` · last time ${prev.pct}% (${entry.pct - prev.pct >= 0 ? "+" : ""}${entry.pct - prev.pct})` : ""}</p></div>
  </section>
  <section class="section"><h2>By topic</h2><div class="hist"><div class="bars">${tb.map(([k, v, p]) => `<div class="bar"><span>${esc(TOPICS[k] || "Vocab matching & typing")}</span><span class="track"><span class="fill ${pctCls(p) === "hi" ? "" : pctCls(p)}" style="display:block;width:${p}%"></span></span><span class="v">${p}%</span></div>`).join("")}</div></div></section>
  <div class="rowbtns" style="margin-top:20px">${entry.missed.length ? `<button class="btn sun" data-act="redo">Redo what I missed</button>` : ""}<button class="btn" data-act="home">Back to start</button></div>
  <section class="section"><h2>${misses.length ? `What you missed (${misses.length})` : "You missed nothing."}</h2><div class="missed">${missHtml}</div></section>`;
  window.scrollTo({top: 0});
}

/* ---------- history persistence (browser + your account when available) ---------- */
function trimHistory(H) { H = H.slice().sort((a, b) => a.at - b.at).slice(-200); return H.map((h, i) => i < H.length - 10 ? Object.assign({}, h, {missed: []}) : h); }
let cloudBusy = Promise.resolve();
function persistHistory() {
  S.history = trimHistory(S.history);
  store.set("eco2.history", S.history);
  if (S.cloud) { const data = {attempts: S.history}; cloudBusy = cloudBusy.then(() => S.cloud.set(data)).catch(() => {}); }
}
async function initCloud() {
  try {
    const c = window.claude; if (!c || !c.use) return;
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc("data/users/" + id + "/history");
    const snap = await ref.get();
    const remote = snap.exists ? (snap.data().attempts || []) : [];
    const byId = new Map(); for (const h of [...remote, ...S.history]) byId.set(h.id, h);
    const merged = trimHistory([...byId.values()]);
    const changed = merged.length !== remote.length;
    S.cloud = ref; S.history = merged; store.set("eco2.history", merged);
    if (changed) await ref.set({attempts: merged});
    if (S.view === "home") renderHome();
  } catch (e) { S.cloud = null; }
}

/* ---------- events ---------- */
app.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t || t.disabled) return;
  if (t.dataset.start) {
    const mode = t.dataset.start;
    let opts = {};
    if (mode === "missed") { const lm = [...S.history].reverse().find(h => h.missed && h.missed.length); if (!lm) return; opts.missed = lm.missed; }
    if (mode === "topics") opts.topics = S.topics.slice();
    S.run = buildRun(mode, opts); S.confirmQuit = false;
    if (!S.run.items.length) { S.run = null; return; }
    saveRun(); renderTest(); window.scrollTo({top: 0}); return;
  }
  if (t.dataset.topic) { const k = t.dataset.topic; S.topics = S.topics.includes(k) ? S.topics.filter(x => x !== k) : [...S.topics, k]; store.set("eco2.topics", S.topics); renderHome(); return; }
  if (t.id === "studySwitch") { S.study = !S.study; store.set("eco2.study", S.study); renderHome(); document.getElementById("studySwitch").focus(); return; }
  const act = t.dataset.act;
  if (act === "resume") { S.run = store.get("eco2.run", null); if (S.run) { renderTest(); window.scrollTo({top: 0}); } return; }
  if (act === "discard") { S.run = null; saveRun(); renderHome(); return; }
  if (act === "clear") { S.confirmClear = true; renderHome(); return; }
  if (act === "clear-no") { S.confirmClear = false; renderHome(); return; }
  if (act === "clear-yes") { S.confirmClear = false; S.history = []; persistHistory(); renderHome(); return; }
  if (act === "home") { renderHome(); window.scrollTo({top: 0}); return; }
  if (act === "redo") { const lm = S.history[S.history.length - 1]; S.run = buildRun("missed", {missed: lm.missed}); if (!S.run.items.length) { S.run = null; return; } saveRun(); renderTest(); window.scrollTo({top: 0}); return; }
  if (act === "quit") { S.confirmQuit = true; renderTestKeep(); return; }
  if (act === "quit-no") { S.confirmQuit = false; renderTestKeep(); return; }
  if (act === "quit-yes") { S.confirmQuit = false; saveRun(); S.run = null; renderHome(); window.scrollTo({top: 0}); return; }
  if (act === "check" || act === "submit") { submit(); return; }
  if (act === "next") { next(); return; }
  if (!S.run || S.view !== "test") return;
  const it = S.run.items[S.run.i]; if (S.run.res[S.run.i]) return;
  if (t.classList.contains("opt")) { cur = +t.dataset.k; if (S.run.study) submit(); else paint(); return; }
  if (t.dataset.sk !== undefined) { cur[+t.dataset.sk] = +t.dataset.sj; paint(); return; }
  if (t.dataset.oa !== undefined) { cur.push(it.deck.find(x => x === t.dataset.oa) || t.dataset.oa); paint(); return; }
  if (t.dataset.ou !== undefined) { cur.splice(+t.dataset.ou, 1); paint(); return; }
  if (t.dataset.mt !== undefined) {
    const term = t.dataset.mt; const at = cur.map.indexOf(term);
    if (at >= 0) { cur.map[at] = null; cur.sel = term; }
    else cur.sel = cur.sel === term ? null : term;
    paint(); return;
  }
  if (t.dataset.md !== undefined) {
    const k = +t.dataset.md;
    if (cur.sel) { const prevAt = cur.map.indexOf(cur.sel); if (prevAt >= 0) cur.map[prevAt] = null; cur.map[k] = cur.sel; cur.sel = null; }
    else if (cur.map[k]) cur.map[k] = null;
    paint(); return;
  }
});
function renderTestKeep() { const keep = cur; const wasRevealed = !!S.run.res[S.run.i]; renderTest(); if (!wasRevealed) { cur = keep; restoreInputs(); paint(); } }
function restoreInputs() { const inp = document.querySelector("#card input"); if (inp && typeof cur === "string") inp.value = cur; }
app.addEventListener("input", e => {
  if (!S.run || S.view !== "test") return;
  if (e.target.id === "numIn" || e.target.id === "typeIn") { cur = e.target.value; const b = document.querySelector('[data-act="check"],[data-act="submit"]'); if (b) b.disabled = !complete(S.run.items[S.run.i]); }
});
app.addEventListener("change", e => {
  if (!S.run || S.view !== "test") return;
  if (e.target.dataset.lk !== undefined) { cur[+e.target.dataset.lk] = e.target.value; paint(); }
});
document.addEventListener("keydown", e => {
  if (S.view !== "test" || !S.run || e.metaKey || e.ctrlKey || e.altKey) return;
  const it = S.run.items[S.run.i], res = S.run.res[S.run.i];
  if (e.key === "Enter") {
    if (e.target.tagName === "BUTTON" && !e.target.matches('[data-act="next"],[data-act="check"],[data-act="submit"]')) return;
    e.preventDefault();
    if (res) next(); else submit();
    return;
  }
  if (!res && it.t === "mc" && /^[1-9]$/.test(e.key) && e.target.tagName !== "INPUT") { const k = +e.key - 1; if (k < it.opts.length) { cur = k; if (S.run.study) submit(); else paint(); } }
});

/* ---------- boot ---------- */
function boot(data) {
  if (data && data.run) S.run = data.run;
  if (data && data.view === "test" && S.run) renderTest(); else renderHome();
  initCloud();
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(() => ({run: S.run, view: S.view}));
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>

</body></html>
