<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class Games</title>
<style>
  :root { --bg:#0f1218; --p1:#161a22; --p2:#1d222c; --p3:#272d3a; --ln:#262c39; --tx:#e9ecf2; --mu:#8c93a5; --ac:#7c9cff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--tx); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:1100px; margin:0 auto; padding:28px 20px 60px; }
  header { display:flex; align-items:center; gap:14px; margin-bottom:22px; flex-wrap:wrap; }
  .logo { width:42px; height:42px; border-radius:12px; background:var(--ac); display:grid; place-items:center; color:#0f1218; }
  h1 { font-size:24px; letter-spacing:-.02em; }
  .sub { color:var(--mu); font-size:13px; }
  .search { margin-left:auto; flex:1; min-width:180px; max-width:320px; }
  .search input { width:100%; padding:10px 14px; border-radius:10px; border:1px solid var(--ln); background:var(--p1); color:var(--tx); font:inherit; }
  .search input::placeholder { color:var(--mu); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
  .card { background:var(--p1); border:1px solid var(--ln); border-radius:16px; padding:16px; cursor:pointer; text-align:left; color:inherit; font:inherit;
          transition:transform .12s, border-color .12s; display:flex; flex-direction:column; }
  .card:hover { transform:translateY(-3px); border-color:var(--ac); }
  .ico { width:50px; height:50px; border-radius:14px; display:grid; place-items:center; font-size:27px; }
  .nm { font-weight:700; font-size:16px; margin-top:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ds { font-size:12px; color:var(--mu); margin:3px 0 10px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip { font-size:11px; font-weight:650; padding:3px 10px; border-radius:20px; background:var(--p3); color:var(--mu); align-self:flex-start; }
  footer { margin-top:34px; color:var(--mu); font-size:12px; line-height:1.7; }
  footer a, .msg a { color:var(--ac); }
  .msg { color:var(--mu); padding:40px 6px; text-align:center; }
  .spin { width:28px; height:28px; border:3px solid var(--p3); border-top-color:var(--ac); border-radius:50%; animation:sp .8s linear infinite; margin:48px auto 14px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .btn { border:1px solid var(--ln); background:var(--p2); color:var(--tx); font:600 13px system-ui,sans-serif; padding:8px 14px; border-radius:9px; cursor:pointer; white-space:nowrap; }
  .btn:hover { background:var(--p3); }
  .btn.pri { background:var(--ac); color:#0f1218; border-color:var(--ac); }
  .stage { position:fixed; inset:0; z-index:50; background:var(--bg); display:none; flex-direction:column; }
  .stage.on { display:flex; }
  .bar { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--ln); }
  .bar .t { font-weight:650; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar .by { color:var(--mu); font-weight:400; font-size:13px; }
  .frame { flex:1; position:relative; background:#fff; }
  .frame iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .frame pre { position:absolute; inset:0; margin:0; padding:22px; overflow:auto; background:var(--p1); color:var(--mu); font:12px/1.6 ui-monospace,monospace; white-space:pre-wrap; }
  @media (max-width:600px){ .wrap{padding:18px 14px 50px;} .search{margin-left:0;max-width:none;} h1{font-size:21px;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M15 12h.01M18 14h.01"/></svg></div>
    <div><h1>Class Games</h1><div class="sub" id="count">Loading…</div></div>
    <div class="search"><input id="q" type="search" placeholder="Search games…" autocomplete="off"></div>
  </header>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg"><div class="spin"></div>Loading games from the repo…</div>
  <footer>
    <div>This list is pulled live from the <a id="repolink" href="#" target="_blank" rel="noopener">GitHub repo</a>. Add an <b>.html</b> game to the repo and it shows up here on its own — remove one and it disappears.</div>
    <div style="margin-top:8px">Want the Canvas grades dashboard too? <a href="get-dashboard.html">Get the bookmark →</a></div>
  </footer>
</div>

<div class="stage" id="stage">
  <div class="bar">
    <button class="btn" id="back">← All games</button>
    <span class="t" id="title"></span>
    <button class="btn" id="lic">License</button>
    <button class="btn" id="full">Full screen</button>
    <button class="btn pri" id="reload">Restart</button>
  </div>
  <div class="frame" id="frame"></div>
</div>

<script>
  // ---- Point this at your repo. Games are read straight from it. ----
  var REPO = 'hsoirghfohdj/yee-new';
  var BRANCH = 'main';

  // Files that are part of the site itself, not games.
  var SKIP_FILES = { 'index.html':1, 'get-dashboard.html':1, 'single-file.html':1, 'file-input.html':1, 'file-input-minified.html':1 };
  var SKIP_DIRS = ['inline-tools/', 'methods/', 'other/', '.github/'];
  // Nicer details for games we know; everything else gets a sensible default.
  var KNOWN = {
    'adarkroom': { name:'A Dark Room', icon:'🔥', desc:'Slow-burn idle game.', license:'MPL-2.0' },
    '2048': { name:'2048', icon:'🔢', desc:'Merge tiles to 2048.', license:'MIT' },
    'hextris': { name:'Hextris', icon:'⬢', desc:'Rotate to stack blocks.', license:'GPL-3.0' },
    'trex': { name:'T-Rex Runner', icon:'🦖', desc:'Jump the cacti.', license:'BSD-3' },
    'tetris': { name:'Tetris', icon:'🧩', desc:'Fill rows to clear them.', license:'MIT' },
    'clumsy': { name:'Clumsy Bird', icon:'🐤', desc:'Flap through the pipes.', license:'GPL-3.0' }
  };

  var EMOJI = ['🎮','🕹️','👾','🎯','🏎️','⚽','🧩','🐍','🚀','🎲','🏀','🗡️','🧱','🎰','🪂','🧗','🏹','💣','🐙','🔥','🍄','⭐','🎻','🛹','🏓','🎳','🪃','🧨'];
  var BGS = ['rgba(124,156,255,.16)','rgba(62,207,142,.16)','rgba(245,181,70,.16)','rgba(242,99,122,.16)','rgba(76,201,240,.16)','rgba(180,140,255,.16)','rgba(255,143,90,.16)','rgba(228,111,208,.16)'];
  function hash(s){ var h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }

  var grid = document.getElementById('grid'), stage = document.getElementById('stage'), frame = document.getElementById('frame'), msg = document.getElementById('msg');
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c]; }); };
  document.getElementById('repolink').href = 'https://github.com/' + REPO;

  function pretty(path) {
    var base = path.split('/').pop().replace(/\.html?$/i, '');
    return base.replace(/[-_]+/g, ' ').replace(/\s+/g, ' ').trim()
      .replace(/\b([a-z])/g, function (m, c) { return c.toUpperCase(); })
      .replace(/\bVs\b/g, 'vs').replace(/\b3d\b/gi, '3D').replace(/\bIo\b/g, 'io').replace(/\bTd\b/g, 'TD');
  }

  function toGame(path) {
    var base = path.split('/').pop().replace(/\.html?$/i, '');
    var k = KNOWN[base];
    return {
      id: path,
      base: base,
      name: k ? k.name : pretty(path),
      icon: k ? k.icon : EMOJI[hash(base) % EMOJI.length],
      bg: BGS[hash(base + 'x') % BGS.length],
      desc: k ? k.desc : (path.indexOf('/') >= 0 ? path.slice(0, path.lastIndexOf('/')) : ''),
      license: k ? k.license : ''
    };
  }

  var GAMES = [];

  function cards(list) {
    grid.innerHTML = list.map(function (g) {
      return '<button class="card" data-id="' + esc(g.id) + '"><div class="ico" style="background:' + g.bg + '">' + g.icon + '</div>' +
        '<div class="nm">' + esc(g.name) + '</div><div class="ds">' + esc(g.desc || ' ') + '</div>' +
        '<span class="chip">' + esc(g.license || 'play') + '</span></button>';
    }).join('') || '<p class="msg">No games match that search.</p>';
  }

  function show(list) {
    GAMES = list;
    msg.style.display = 'none';
    document.getElementById('count').textContent = list.length + (list.length === 1 ? ' game' : ' games') + ' · live from your repo';
    cards(list);
  }

  function load() {
    var cacheKey = 'classgames_' + REPO + '_' + BRANCH;
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(cacheKey) || 'null'); } catch (e) {}
    if (cached && cached.games) show(cached.games.map(function (p) { return toGame(p); }));

    fetch('https://api.github.com/repos/' + REPO + '/git/trees/' + BRANCH + '?recursive=1')
      .then(function (r) { if (!r.ok) throw new Error(r.status === 403 ? 'rate' : 'http'); return r.json(); })
      .then(function (d) {
        if (!d.tree) throw new Error('empty');
        var paths = d.tree.filter(function (t) {
          if (t.type !== 'blob' || !/\.html?$/i.test(t.path)) return false;
          if (SKIP_FILES[t.path]) return false;
          for (var i = 0; i < SKIP_DIRS.length; i++) if (t.path.indexOf(SKIP_DIRS[i]) === 0) return false;
          return true;
        }).map(function (t) { return t.path; });
        paths.sort(function (a, b) { return pretty(a).toLowerCase().localeCompare(pretty(b).toLowerCase()); });
        try { localStorage.setItem(cacheKey, JSON.stringify({ at: Date.now(), games: paths })); } catch (e) {}
        show(paths.map(function (p) { return toGame(p); }));
        route();
      })
      .catch(function (e) {
        if (GAMES.length) return; // keep showing cache
        msg.innerHTML = e.message === 'rate'
          ? 'GitHub is rate-limiting this device for a few minutes. Refresh shortly — the list will load then.'
          : 'Couldn\'t reach the repo. Check you\'re online, then refresh. (<a href="https://github.com/' + REPO + '" target="_blank" rel="noopener">open the repo</a>)';
      });
  }

  var cur = null;
  function open(id) {
    cur = GAMES.filter(function (g) { return g.id === id; })[0];
    if (!cur) return;
    document.getElementById('title').innerHTML = esc(cur.name) + (cur.license ? ' <span class="by">' + esc(cur.license) + '</span>' : '');
    document.getElementById('lic').style.display = cur.license ? '' : 'none';
    play();
    stage.classList.add('on');
    location.hash = encodeURIComponent(cur.id);
  }
  function play() {
    frame.innerHTML = '';
    var f = document.createElement('iframe');
    f.setAttribute('allow', 'fullscreen; autoplay; gamepad');
    f.src = cur.id;
    frame.appendChild(f);
    f.addEventListener('load', function () { try { f.contentWindow.focus(); } catch (e) {} });
  }
  function close() { stage.classList.remove('on'); frame.innerHTML = ''; cur = null; if (location.hash) history.replaceState(null, '', location.pathname); }
  function route() { var h = location.hash ? decodeURIComponent(location.hash.slice(1)) : ''; if (h && GAMES.some(function (g) { return g.id === h; })) open(h); }

  grid.addEventListener('click', function (e) { var c = e.target.closest('[data-id]'); if (c) open(c.dataset.id); });
  document.getElementById('back').onclick = close;
  document.getElementById('reload').onclick = function () { if (cur) play(); };
  document.getElementById('full').onclick = function () { var f = frame.querySelector('iframe'); if (f && f.requestFullscreen) f.requestFullscreen(); };
  document.getElementById('lic').onclick = function () {
    if (!cur) return;
    var open2 = frame.querySelector('pre');
    if (open2) { open2.remove(); return; }
    fetch(cur.base + '.LICENSE.txt').then(function (r) { if (!r.ok) throw 0; return r.text(); }).then(function (t) {
      var pre = document.createElement('pre'); pre.textContent = t; frame.appendChild(pre);
    }).catch(function () {
      var pre = document.createElement('pre'); pre.textContent = 'No license file is included in the repo for this game.'; frame.appendChild(pre);
    });
  };
  document.getElementById('q').addEventListener('input', function (e) {
    var q = e.target.value.toLowerCase();
    cards(GAMES.filter(function (g) { return (g.name + ' ' + g.id).toLowerCase().indexOf(q) >= 0; }));
  });
  window.addEventListener('keydown', function (e) { if (e.key === 'Escape' && stage.classList.contains('on') && !document.fullscreenElement) close(); });
  window.addEventListener('hashchange', function () { if (!stage.classList.contains('on')) route(); });

  load();
</script>
</body>
</html>
