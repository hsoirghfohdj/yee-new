<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Dash</title>
<style>
  :root { --bg:#0f1218; --p1:#161a22; --p2:#1d222c; --p3:#272d3a; --ln:#262c39; --tx:#e9ecf2; --mu:#8c93a5; --ac:#7c9cff; --gd:#3ecf8e; --bad:#f2637a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--tx); font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; }
  .bio { display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; padding:12px 16px; background:linear-gradient(90deg,#123528,#16402f); border-bottom:1px solid #1f5a41; text-align:center; }
  .bio .ic { width:30px; height:30px; border-radius:9px; background:var(--gd); color:#0c2a1e; display:grid; place-items:center; flex:none; }
  .bio p { font-size:15px; }
  .bio b { color:#7ef0bb; }
  .bio a { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:10px; background:var(--gd); color:#0c2a1e; font-weight:700; font-size:14px; text-decoration:none; white-space:nowrap; }
  .bio a:hover { filter:brightness(1.08); }
  .wrap { max-width:640px; margin:0 auto; padding:72px 16px 60px; }
  .hero { text-align:center; margin-bottom:56px; }
  .logo { width:56px; height:56px; border-radius:16px; background:var(--ac); display:grid; place-items:center; color:var(--bg); margin:0 auto 18px; }
  h1 { font-size:30px; letter-spacing:-.02em; }
  .sub { color:var(--mu); margin:6px 0 26px; }
  .go { display:inline-flex; align-items:center; gap:10px; padding:13px 26px; border-radius:12px; background:var(--ac); color:var(--bg); font-weight:700; font-size:16px; text-decoration:none; box-shadow:0 8px 24px rgba(124,156,255,.25); }
  .go:hover { filter:brightness(1.06); }

  .card { background:var(--p1); border:1px solid var(--ln); border-radius:16px; padding:22px; }
  .card h2 { font-size:18px; letter-spacing:-.01em; }
  .note { color:var(--mu); font-size:13px; margin:2px 0 18px; }
  .seg { display:grid; grid-template-columns:1fr 1fr; gap:4px; background:var(--p2); border:1px solid var(--ln); border-radius:12px; padding:4px; margin-bottom:16px; }
  .seg button { border:0; background:none; color:var(--mu); font:600 14px system-ui,sans-serif; padding:9px 8px; border-radius:9px; cursor:pointer; }
  .seg button[aria-pressed="true"] { background:var(--p3); color:var(--tx); }
  label { display:block; font-size:13px; font-weight:600; color:var(--mu); margin:0 0 6px; }
  .f { margin-bottom:14px; }
  input, select, textarea { width:100%; background:var(--p2); color:var(--tx); border:1px solid var(--ln); border-radius:10px; padding:10px 12px; font:15px system-ui,sans-serif; }
  textarea { resize:vertical; min-height:76px; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--ac); }
  .opt { font-weight:400; }
  .hp { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  .send { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .send button { border:0; background:var(--ac); color:var(--bg); font:700 15px system-ui,sans-serif; padding:11px 22px; border-radius:10px; cursor:pointer; }
  .send button:disabled { opacity:.55; cursor:default; }
  .msg { font-size:13px; color:var(--mu); }
  .msg.ok { color:var(--gd); }
  .msg.err { color:var(--bad); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="bio">
  <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></span>
  <p><b>Taking Bio?</b> Get study resources and practice tests for the ecology unit.</p>
  <a href="ecology-study.html">Start studying →</a>
</div>
<div class="wrap">
  <div class="hero">
    <span class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg></span>
    <h1>Class Dash</h1>
    <p class="sub">Your Canvas classes, grades, to-dos and games in one place.</p>
    <a class="go" href="install.html">Install Class Dash</a>
  </div>

  <form class="card" id="fb" novalidate>
    <h2>Request something</h2>
    <p class="note">Want a game added, or study help for a class? Tell us. It's anonymous: no name or email.</p>

    <div class="seg" role="group" aria-label="Request type">
      <button type="button" data-type="Game" aria-pressed="true">🎮 A game</button>
      <button type="button" data-type="Study resource" aria-pressed="false">📚 Study resource</button>
    </div>

    <div class="f" data-for="Game">
      <label for="game">What game?</label>
      <input id="game" maxlength="80" placeholder="e.g. Retro Bowl, Slope, 2048">
    </div>

    <div data-for="Study resource" hidden>
      <div class="f">
        <label for="cls">What class?</label>
        <select id="cls">
          <option value="">Pick a class…</option>
          <option>Biology</option>
          <option>Chemistry</option>
          <option>Physics</option>
          <option>Earth / Environmental Science</option>
          <option>Algebra 1</option>
          <option>Geometry</option>
          <option>Algebra 2</option>
          <option>Pre-Calculus</option>
          <option>Calculus</option>
          <option>Statistics</option>
          <option>English</option>
          <option>World History</option>
          <option>US History</option>
          <option>Government / Economics</option>
          <option>Spanish</option>
          <option>French</option>
          <option>Computer Science</option>
          <option value="Other">Other…</option>
        </select>
      </div>
      <div class="f" id="otherWrap" hidden>
        <label for="other">Which class?</label>
        <input id="other" maxlength="60" placeholder="Type the class name">
      </div>
      <div class="f">
        <label for="topic">What unit or topic? <span class="opt">(optional)</span></label>
        <input id="topic" maxlength="100" placeholder="e.g. Cell division, Unit 4 test">
      </div>
    </div>

    <div class="f">
      <label for="details">Anything else? <span class="opt">(optional)</span></label>
      <textarea id="details" maxlength="500" placeholder="Links, what kind of practice you want, etc."></textarea>
    </div>

    <div class="hp" aria-hidden="true"><label for="website">Leave this empty</label><input id="website" tabindex="-1" autocomplete="off"></div>

    <div class="send">
      <button type="submit" id="sendBtn">Send request</button>
      <span class="msg" id="fbMsg" role="status"></span>
    </div>
  </form>
</div>

<script>
  if (location.hash) location.replace('install.html' + location.hash);

  // Requests are emailed to you. If WEB3FORMS_KEY has a key in it, they go through web3forms.com.
  // If it's empty, they go through formsubmit.co to the address in SEND_TO.
  var WEB3FORMS_KEY = '45efbf44-2e20-4802-8882-7b3ba4b1b3cf';
  var SEND_TO = 'classdashboard3@gmail.com';

  function sendRequest(fields, subject) {
    var url, payload = {};
    if (WEB3FORMS_KEY) {
      url = 'https://api.web3forms.com/submit';
      payload = { access_key: WEB3FORMS_KEY, subject: subject, from_name: 'Class Dash' };
    } else {
      url = 'https://formsubmit.co/ajax/' + SEND_TO;
      payload = { _subject: subject, _template: 'table', _captcha: 'false' };
    }
    for (var k in fields) payload[k] = fields[k];
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) {
      return r.json().catch(function () { throw new Error(r.status >= 500 ? 'down' : 'HTTP ' + r.status); });
    }).then(function (res) {
      if (String(res.success) !== 'true') throw new Error(res.message || 'failed');
    });
  }

  (function () {
    var form = document.getElementById('fb'), msg = document.getElementById('fbMsg'), btn = document.getElementById('sendBtn');
    var $ = function (id) { return document.getElementById(id); };
    var type = 'Game';

    function say(text, kind) { msg.textContent = text; msg.className = 'msg' + (kind ? ' ' + kind : ''); }

    document.querySelectorAll('[data-type]').forEach(function (b) {
      b.onclick = function () {
        type = b.dataset.type;
        document.querySelectorAll('[data-type]').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
        document.querySelectorAll('[data-for]').forEach(function (s) { s.hidden = s.dataset.for !== type; });
        say('');
      };
    });
    $('cls').onchange = function () { $('otherWrap').hidden = this.value !== 'Other'; };

    form.onsubmit = function (e) {
      e.preventDefault();
      var cls = '', what, details = $('details').value.trim();
      if (type === 'Game') {
        what = $('game').value.trim();
        if (!what) { say('Type the name of the game.', 'err'); $('game').focus(); return; }
      } else {
        cls = $('cls').value === 'Other' ? $('other').value.trim() : $('cls').value;
        if (!cls) { say('Pick which class it\'s for.', 'err'); ($('cls').value === 'Other' ? $('other') : $('cls')).focus(); return; }
        what = $('topic').value.trim();
      }
      if ($('website').value) return done();
      var last = 0;
      try { last = +localStorage.getItem('classdash_fb') || 0; } catch (err) {}
      if (Date.now() - last < 30000) { say('Thanks! Give it a few seconds before sending another.', 'err'); return; }
      var data = type === 'Game'
        ? { Request: 'Game', Game: what, Details: details || '-' }
        : { Request: 'Study resource', Class: cls, Topic: what || '-', Details: details || '-' };
      btn.disabled = true; say('Sending…');
      sendRequest(data, 'Class Dash request: ' + (type === 'Game' ? what : cls))
        .then(function () {
          try { localStorage.setItem('classdash_fb', Date.now()); } catch (err) {}
          done();
        })
        .catch(function (err) {
          var m = err && err.message || '';
          if (/activat/i.test(m)) say('Requests aren\'t switched on yet. Check back soon.', 'err');
          else if (err instanceof TypeError || m === 'down') say('The request service isn\'t responding right now. Try again in a little while.', 'err');
          else say('Couldn\'t send: ' + m, 'err');
        })
        .then(function () { btn.disabled = false; });
    };

    function done() {
      ['game', 'other', 'topic', 'details'].forEach(function (id) { $(id).value = ''; });
      $('cls').value = ''; $('otherWrap').hidden = true;
      say('Sent! Thanks for the request.', 'ok');
    }
  })();
</script>
</body>
</html>
