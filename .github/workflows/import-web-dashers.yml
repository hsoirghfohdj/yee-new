name: Import Web Dashers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-web-dashers.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import-game:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache || true
          sudo docker image prune --all --force > /dev/null || true

      - name: Checkout game repository without its giant existing assets
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            offline/web-dashers
          sparse-checkout-cone: true
          persist-credentials: true

      - name: Download original Web Dashers project
        run: |
          curl --fail --location --retry 3 -o /tmp/web-dashers.zip https://codeload.github.com/web-dashers/web-dashers.github.io/zip/refs/heads/main
          unzip -q /tmp/web-dashers.zip -d /tmp
          mkdir -p offline/web-dashers
          rsync -a --delete --exclude '.git' --exclude '.DS_Store' --exclude '__MACOSX' /tmp/web-dashers.github.io-main/ offline/web-dashers/
          printf '\n' > offline/web-dashers/.nojekyll
          test -s offline/web-dashers/index.html
          test -s offline/web-dashers/assets/scripts/libs/phaser.min.js
          du -sh offline/web-dashers

      - name: Commit game in offline/ without altering other games
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- offline/web-dashers
          if git diff --cached --quiet; then
            echo "Web Dashers already imported"
          else
            git commit -m "Add Web Dashers full game under offline/web-dashers"
            git push origin HEAD:main
          fi

      - name: Refresh bookmarklet library and GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run library.yml --repo "${{ github.repository }}" --ref main
          gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
