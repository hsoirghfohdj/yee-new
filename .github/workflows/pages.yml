# Deploys the site to GitHub Pages using less disk space than GitHub's default setup.
# The site comes out the same; it just cleans up as it goes so the build server
# doesn't run out of room with the big games in offline/.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer upload replaces a deploy that's still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Make room on the build server
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache || true
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - name: Get the files
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Remove git history (the site doesn't need it)
        run: rm -rf .git && df -h /

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Build the site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Remove the original files (the built copy is in _site)
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name _site -exec rm -rf {} +
          df -h /

      - name: Package the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
